<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
<title>p5.js编辑器</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/theme/material-darker.min.css" />
<style>
:root {
  --bg: #f8fafc; --panel: #ffffff;
  --border: #e2e8f0; --border-hover: #cbd5e1;
  --text: #0f172a; --text-dim: #64748b; --text-muted: #94a3b8;
  --accent: #2563eb; --accent-hover: #1d4ed8;
  --hover: #f1f5f9; --active: #e2e8f0;
  --splitter-bg: #f1f5f9; --grip: #cbd5e1; --grip-hover: #94a3b8;
  --shadow-sm: 0 2px 8px rgba(15,23,42,.08);
  --ed-bg: #0f172a;
}
*,*::before,*::after { box-sizing: border-box; }

html { height: 100%; touch-action: pan-x pan-y; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; height: 100%;
  font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text);
  font-size: 13px; overflow: hidden;
  -webkit-font-smoothing: antialiased;
  touch-action: pan-x pan-y;
}

.app { display: flex; flex-direction: column; width: 100%; height: 100vh; height: 100dvh; position: relative; }

.preview-wrap {
  flex: 80 1 0; min-height: 80px;
  position: relative; overflow: hidden;
  background: #f1f5f9;
  touch-action: pan-x pan-y;
  user-select: none; -webkit-user-select: none;
  transition: background-color .2s;
}
.preview-wrap.bg-checker {
  background-color: #f8fafc;
  background-image:
    linear-gradient(45deg, #e2e8f0 25%, transparent 25%),
    linear-gradient(-45deg, #e2e8f0 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #e2e8f0 75%),
    linear-gradient(-45deg, transparent 75%, #e2e8f0 75%);
  background-size: 16px 16px;
  background-position: 0 0, 0 8px, 8px -8px, -8px 0;
}
.preview-wrap.bg-white { background: #ffffff; }
.preview-wrap.bg-dark { background: #0f172a; }

.preview-stage { position: absolute; inset: 0; transform-origin: center center; will-change: transform; }
.preview-stage iframe { display: block; width: 100%; height: 100%; border: 0; background: transparent; pointer-events: auto; }

.preview-menu-wrap {
  position: absolute;
  top: 14px; right: 14px;
  z-index: 10;
  display: flex; align-items: center; gap: 6px;
}
.preview-menu-btn, .fullscreen-exit {
  width: 32px; height: 32px;
  display: grid; place-items: center;
  font-family: inherit; font-size: 18px; font-weight: 700;
  letter-spacing: 0;
  line-height: 1;
  padding: 0;
  color: var(--text-dim);
  background: rgba(255,255,255,.94);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: var(--shadow-sm);
  backdrop-filter: blur(8px);
  cursor: pointer; touch-action: manipulation;
  transition: background .14s, color .14s;
}
.preview-menu-btn:hover, .fullscreen-exit:hover { background: var(--hover); color: var(--text); }
.fullscreen-exit[hidden] { display: none; }
.preview-menu-wrap .menu { top: calc(100% + 6px); left: auto; right: 0; }

.menu__item.is-recording { color: #dc2626; }
.menu__item.is-ready { color: var(--accent); font-weight: 600; }
.menu__item .wrap-check { color: #16a34a; font-weight: 700; margin-left: 2px; }

.menu__sep { height: 1px; background: var(--border); margin: 4px 2px; }

.record-row { display: flex; align-items: center; gap: 4px; }
.record-row .menu__item { flex: 1 1 auto; width: auto; min-width: 0; }
.record-discard {
  flex: 0 0 auto;
  width: 20px; height: 20px;
  display: grid; place-items: center;
  padding: 0;
  font-family: inherit;
  font-size: 14px;
  line-height: 1;
  color: var(--text-dim);
  background: transparent;
  border: 0;
  border-radius: 4px;
  cursor: pointer;
  touch-action: manipulation;
}
.record-discard:hover { background: #fee2e2; color: #dc2626; }
.record-discard[hidden] { display: none; }

.img-list {
  display: flex; flex-direction: column;
  gap: 1px;
  max-height: 220px;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 2px 0;
  border-top: 1px solid var(--border);
  margin-top: 2px;
}
.img-list[hidden] { display: none; }
.img-list__header {
  padding: 6px 8px 2px;
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 600;
}
.img-item {
  display: flex; align-items: center;
  gap: 6px;
  padding: 6px 8px;
  border-radius: 5px;
  font-size: 12px;
  color: var(--text);
  cursor: pointer;
  user-select: none; -webkit-user-select: none;
  touch-action: manipulation;
  transition: background .14s;
}
.img-item:hover { background: var(--hover); }
.img-item__check {
  flex: 0 0 auto;
  width: 16px;
  text-align: center;
  font-weight: 700;
  font-size: 13px;
  color: #cbd5e1;
}
.img-item.is-selected .img-item__check { color: #16a34a; }
.img-item__name {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11.5px;
}
.img-item__del {
  flex: 0 0 auto;
  width: 20px; height: 20px;
  display: grid; place-items: center;
  font-size: 14px; line-height: 1;
  color: var(--text-dim);
  background: transparent; border: 0; border-radius: 4px;
  cursor: pointer;
  touch-action: manipulation;
}
.img-item__del:hover { background: #fee2e2; color: #dc2626; }

.menu__item.is-loading { pointer-events: none; opacity: 0.7; }
.menu__item.is-loading::after {
  content: '';
  display: inline-block;
  width: 10px; height: 10px;
  margin-left: 8px;
  border: 1.5px solid currentColor;
  border-top-color: transparent;
  border-radius: 50%;
  animation: spin .7s linear infinite;
  vertical-align: -1px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.view-controls {
  position: absolute; left: 14px; bottom: 12px; z-index: 8;
  display: flex; align-items: center; gap: 8px;
  padding: 6px 10px;
  background: rgba(255,255,255,.94);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: var(--shadow-sm);
  backdrop-filter: blur(8px);
}
.bg-switcher { display: flex; gap: 4px; }
.bg-btn {
  width: 20px; height: 20px; padding: 0;
  border: 1px solid var(--border-hover);
  border-radius: 4px; cursor: pointer;
  touch-action: manipulation;
  transition: box-shadow .14s, border-color .14s;
}
.bg-btn[data-bg="checker"] {
  background-image:
    linear-gradient(45deg, #cbd5e1 25%, transparent 25%),
    linear-gradient(-45deg, #cbd5e1 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #cbd5e1 75%),
    linear-gradient(-45deg, transparent 75%, #cbd5e1 75%);
  background-size: 8px 8px;
  background-position: 0 0, 0 4px, 4px -4px, -4px 0;
  background-color: #f8fafc;
}
.bg-btn[data-bg="white"] { background: #fff; }
.bg-btn[data-bg="dark"] { background: #1e293b; border-color: #334155; }
.bg-btn.is-active { box-shadow: 0 0 0 2px var(--accent); border-color: var(--accent); }
.view-controls__sep { width: 1px; height: 18px; background: var(--border); margin: 0 2px; }

.zoom-btn {
  min-width: 26px; height: 26px; padding: 0 6px;
  display: grid; place-items: center;
  font-family: inherit; font-size: 14px; font-weight: 600;
  color: var(--text-dim);
  background: transparent; border: 0; border-radius: 5px;
  cursor: pointer; touch-action: manipulation;
  transition: background .14s, color .14s;
}
.zoom-btn:hover { background: var(--hover); color: var(--text); }
.zoom-btn:disabled { opacity: .4; cursor: not-allowed; }
.zoom-label {
  min-width: 48px; height: 26px; padding: 0 4px;
  font-family: inherit; font-size: 11.5px; font-weight: 600;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
  background: transparent; border: 0; border-radius: 5px;
  cursor: pointer; touch-action: manipulation;
}
.zoom-label:hover { background: var(--hover); color: var(--text); }

.splitter {
  flex: 0 0 34px;
  display: flex; align-items: center;
  padding: 0 8px;
  background: var(--splitter-bg);
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  user-select: none; -webkit-user-select: none;
  position: relative; z-index: 20;
  touch-action: none;
}
.splitter[hidden] { display: none; }
.tool-group { flex: 0 0 auto; display: flex; align-items: center; gap: 2px; }
.tool-group--left, .tool-group--right { position: relative; }
.tool-center { flex: 1 1 auto; min-width: 60px; display: flex; align-items: center; justify-content: center; position: relative; }
.tool-btn {
  flex: 0 0 auto;
  min-width: 28px; height: 24px;
  display: grid; place-items: center;
  padding: 0 8px;
  font-family: inherit; font-size: 12px; font-weight: 500;
  color: var(--text-dim);
  background: transparent; border: 1px solid transparent; border-radius: 5px;
  cursor: pointer; touch-action: manipulation;
  transition: background .14s, color .14s, border-color .14s;
}
.tool-btn:hover { color: var(--text); background: var(--active); }
.tool-btn:active:not(:disabled) { transform: scale(.94); }

.tool-btn.ai-btn {
  color: var(--accent);
  font-size: 16px;
  font-weight: 700;
  line-height: 1;
}
.tool-btn.ai-btn:hover { background: var(--active); color: var(--accent); }
.tool-btn.ai-btn.is-active { background: var(--active); color: var(--accent); }

.tool-btn.anim-btn {
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  z-index: 2; margin: 0;
  color: var(--accent);
  background: var(--splitter-bg);
}
.tool-btn.anim-btn:hover { background: var(--active); color: var(--accent); }
.tool-btn.anim-btn:active:not(:disabled) { transform: translate(-50%, -50%) scale(.94); }
.tool-btn.anim-btn.spinning svg { animation: runSpin .5s ease; }
@keyframes runSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

.menu-btn { font-size: 18px; font-weight: 700; letter-spacing: 0; line-height: 1; padding: 0 4px; }
.menu {
  position: absolute; top: calc(100% + 6px); left: 0;
  min-width: 130px;
  max-height: calc(100vh - 120px);
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 4px;
  display: flex; flex-direction: column; gap: 2px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: 0 8px 24px rgba(15,23,42,.18);
  z-index: 30;
}
.tool-group--right .menu { left: auto; right: 0; }
.menu[hidden] { display: none; }
.menu__item {
  width: 100%;
  padding: 8px 12px;
  text-align: left;
  font-family: inherit; font-size: 12.5px; color: var(--text);
  background: transparent; border: 0; border-radius: 5px;
  cursor: pointer; touch-action: manipulation;
  transition: background .14s;
}
.menu__item:hover { background: var(--hover); }
.menu__item:active { background: var(--active); }
.menu__item[disabled] { opacity: .5; cursor: not-allowed; }
.menu__item.danger { color: #dc2626; }
.menu__item.danger:hover { background: #fef2f2; }

.splitter-grip { flex: 1 1 auto; min-width: 20px; height: 100%; cursor: ns-resize; touch-action: none; position: relative; }

.editor-wrap { flex: 20 1 0; min-height: 100px; position: relative; overflow: hidden; background: var(--ed-bg); }
.editor-wrap[hidden] { display: none !important; }
.CodeMirror { height: 100% !important; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; line-height: 1.55; touch-action: pan-x pan-y; }
.CodeMirror-scroll, .CodeMirror-lines, .CodeMirror textarea { touch-action: pan-x pan-y; }

/* ===== AI 面板 ===== */
.ai-pane {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  background: var(--ed-bg);
  color: #e2e8f0;
}
.ai-pane[hidden] { display: none; }

.ai-header {
  flex: 0 0 auto;
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px;
  border-bottom: 1px solid rgba(148,163,184,.18);
}
.ai-title { font-size: 13px; font-weight: 600; color: var(--accent); }
.ai-current {
  flex: 1 1 auto;
  font-size: 12px; color: #94a3b8;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.ai-current.is-ok { color: #22c55e; font-weight: 600; }
.ai-back {
  flex: 0 0 auto;
  padding: 4px 10px;
  font-family: inherit; font-size: 12px;
  color: #cbd5e1;
  background: transparent;
  border: 1px solid rgba(148,163,184,.3);
  border-radius: 5px;
  cursor: pointer; touch-action: manipulation;
}
.ai-back:hover { background: rgba(148,163,184,.12); color: #f1f5f9; }

.ai-messages {
  flex: 1 1 auto;
  overflow-y: auto;
  padding: 12px;
  font-size: 12.5px; line-height: 1.6;
}
.ai-empty {
  text-align: center; color: #64748b;
  padding: 24px 12px; font-size: 12.5px;
}

.ai-msg { margin-bottom: 12px; }
.ai-msg--user { color: #93c5fd; padding-left: 12px; border-left: 2px solid rgba(147,197,253,.4); }
.ai-msg--ai { color: #e2e8f0; }
.ai-msg--error { color: #fca5a5; }
.ai-msg--loading { color: #94a3b8; font-style: italic; }

.ai-result {
  margin-top: 8px;
  background: #0b1220;
  border: 1px solid rgba(148,163,184,.25);
  border-radius: 8px;
  overflow: hidden;
}
.ai-result__code {
  margin: 0;
  padding: 10px 12px;
  max-height: 260px;
  overflow: auto;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11.5px; line-height: 1.5;
  color: #e2e8f0;
  white-space: pre;
  background: transparent;
}
.ai-result__actions {
  display: flex; gap: 6px; justify-content: flex-end;
  padding: 8px 10px;
  border-top: 1px solid rgba(148,163,184,.18);
  background: rgba(15,23,42,.4);
}
.ai-result__btn {
  padding: 5px 12px;
  font-family: inherit; font-size: 12px;
  color: #cbd5e1;
  background: transparent;
  border: 1px solid rgba(148,163,184,.3);
  border-radius: 5px;
  cursor: pointer; touch-action: manipulation;
}
.ai-result__btn:hover { background: rgba(148,163,184,.12); color: #f1f5f9; }
.ai-result__btn--primary {
  color: #fff;
  background: var(--accent);
  border-color: var(--accent);
}
.ai-result__btn--primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.ai-result__btn--primary[disabled] { opacity: .5; cursor: default; }

.ai-input-row {
  flex: 0 0 auto;
  display: flex; align-items: center; gap: 6px;
  padding: 8px 10px;
  border-top: 1px solid rgba(148,163,184,.18);
  background: #0b1220;
  position: relative;
}
.ai-plus-wrap { position: relative; flex: 0 0 auto; }
.ai-plus {
  width: 30px; height: 30px;
  display: grid; place-items: center;
  font-family: inherit; font-size: 18px; font-weight: 600; line-height: 1;
  color: #94a3b8;
  background: transparent;
  border: 1px solid rgba(148,163,184,.3);
  border-radius: 6px;
  cursor: pointer; touch-action: manipulation;
}
.ai-plus:hover { background: rgba(148,163,184,.12); color: #e2e8f0; }

.ai-input {
  flex: 1 1 auto;
  min-width: 0;
  height: 30px;
  padding: 0 10px;
  font-family: inherit; font-size: 12.5px;
  color: #e2e8f0;
  background: #0f172a;
  border: 1px solid rgba(148,163,184,.3);
  border-radius: 6px;
  outline: none;
}
.ai-input:focus { border-color: var(--accent); }
.ai-input::placeholder { color: #64748b; }

.ai-send {
  flex: 0 0 auto;
  height: 30px; padding: 0 14px;
  font-family: inherit; font-size: 12.5px; font-weight: 600;
  color: #fff;
  background: var(--accent);
  border: 0; border-radius: 6px;
  cursor: pointer; touch-action: manipulation;
}
.ai-send:hover:not(:disabled) { background: var(--accent-hover); }
.ai-send:disabled { opacity: .5; cursor: not-allowed; }

/* 模型选择弹窗 */
.ai-model-popup {
  position: absolute;
  bottom: calc(100% + 6px);
  left: 0;
  min-width: 190px;
  padding: 4px;
  background: #1e293b;
  border: 1px solid rgba(148,163,184,.25);
  border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0,0,0,.4);
  z-index: 40;
}
.ai-model-popup[hidden] { display: none; }
.ai-model-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px;
  font-size: 12.5px; color: #e2e8f0;
  border-radius: 5px;
  cursor: pointer;
  transition: background .14s;
}
.ai-model-item:hover { background: rgba(148,163,184,.12); }
.ai-model-item.is-current { background: rgba(37,99,235,.18); }
.ai-model-name { flex: 1 1 auto; }
.ai-model-status { font-size: 11.5px; }
.ai-model-status.is-ok { color: #22c55e; font-weight: 700; }
.ai-model-status.is-none { color: #64748b; }
.ai-model-edit {
  width: 20px; height: 20px;
  display: grid; place-items: center;
  font-size: 11px;
  color: #64748b;
  background: transparent; border: 0; border-radius: 4px;
  cursor: pointer;
}
.ai-model-edit:hover { background: rgba(148,163,184,.2); color: #e2e8f0; }

/* 模型配置弹窗 */
.ai-modal {
  position: fixed; inset: 0;
  z-index: 1000;
  display: grid; place-items: center;
  background: rgba(15,23,42,.6);
  backdrop-filter: blur(3px);
}
.ai-modal[hidden] { display: none; }
.ai-modal__dialog {
  width: min(420px, calc(100vw - 32px));
  padding: 18px;
  background: var(--panel);
  color: var(--text);
  border-radius: 10px;
  box-shadow: 0 16px 48px rgba(15,23,42,.3);
}
.ai-modal__title { font-size: 14px; font-weight: 600; margin-bottom: 12px; }
.ai-modal__field { display: block; margin-bottom: 10px; font-size: 12px; color: var(--text-dim); }
.ai-modal__field > span { display: block; margin-bottom: 4px; }
.ai-modal__field > input {
  width: 100%;
  height: 32px; padding: 0 10px;
  font-family: inherit; font-size: 12.5px;
  color: var(--text);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  outline: none;
}
.ai-modal__field > input:focus { border-color: var(--accent); }
.ai-modal__hint {
  font-size: 11px; color: var(--text-muted);
  margin-top: 2px;
}
.ai-modal__actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.ai-modal__btn {
  height: 32px; padding: 0 14px;
  font-family: inherit; font-size: 12.5px; font-weight: 500;
  color: var(--text-dim);
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 6px;
  cursor: pointer; touch-action: manipulation;
}
.ai-modal__btn:hover { background: var(--hover); color: var(--text); }
.ai-modal__btn--primary { color: #fff; background: var(--accent); border-color: var(--accent); }
.ai-modal__btn--primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

.toast {
  position: fixed; left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  transform: translate(-50%, 14px);
  padding: 10px 18px; border-radius: 999px;
  background: rgba(15,23,42,.94); color: #f8fafc;
  font-size: 13px; text-align: center;
  opacity: 0; pointer-events: none;
  transition: opacity .22s, transform .22s;
  z-index: 999;
}
.toast.is-show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 720px) {
  .splitter { flex-basis: 32px; padding: 0 4px; }
  .tool-btn { min-width: 26px; height: 22px; font-size: 11.5px; padding: 0 6px; }
  .tool-btn.ai-btn { font-size: 14px; }
  .menu-btn { font-size: 16px; }
  .menu { min-width: 120px; }
  .CodeMirror { font-size: 14px; }
  .view-controls { left: 8px; bottom: 8px; gap: 4px; padding: 4px 6px; }
  .zoom-label { min-width: 54px; height: 26px; font-size: 11.5px; }
  .zoom-btn { min-width: 26px; height: 26px; font-size: 13px; }
  .bg-btn { width: 18px; height: 18px; }
  .preview-menu-wrap { top: 8px; right: 8px; }
  .preview-menu-btn, .fullscreen-exit { width: 28px; height: 28px; font-size: 16px; }
  .ai-plus { width: 28px; height: 28px; font-size: 16px; }
  .ai-input { height: 28px; font-size: 12px; }
  .ai-send { height: 28px; padding: 0 12px; font-size: 12px; }
  .ai-modal__dialog { padding: 14px; }
}
</style>
</head>
<body>

<div class="app" id="app">
  <section class="preview-wrap bg-checker" id="previewWrap">
    <div class="preview-stage" id="previewStage">
      <iframe id="preview" sandbox="allow-scripts allow-same-origin allow-downloads" title="p5.js 预览"></iframe>
    </div>

    <div class="preview-menu-wrap">

function sanitizeImageName(originalName, existingNames) {
  const dotIdx = originalName.lastIndexOf('.');
  const rawExt = dotIdx >= 0 ? originalName.slice(dotIdx).toLowerCase() : '';
  const allowedExt = ['.png', '.jpg', '.jpeg', '.gif', '.webp', '.bmp'];
  const ext = allowedExt.includes(rawExt) ? rawExt : '.png';
  const base = originalName.slice(0, dotIdx >= 0 ? dotIdx : originalName.length);

  if (/^[A-Za-z0-9_-]+$/.test(base)) {
    let name = base + ext;
    let i = 1;
    while (existingNames.has(name)) {
      name = base + '(' + i + ')' + ext;
      i++;
    }
    return name;
  }

  let candidate;
  do {
    imgSeq++;
    candidate = 'img_' + imgSeq + ext;
  } while (existingNames.has(candidate));
  return candidate;
}

function compressImage(file) {
  return new Promise((resolve, reject) => {
    if (!file.type || !file.type.startsWith('image/')) { reject(new Error('不是图片文件')); return; }
    if (file.size > 20 * 1024 * 1024) { reject(new Error('超过 20MB')); return; }
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('读取失败'));
    reader.onload = () => {
      const originalDataURL = reader.result;
      const imgEl = new Image();
      imgEl.onerror = () => reject(new Error('图片解码失败'));
      imgEl.onload = () => {
        try {
          const MAX = 2048;
          const iw = imgEl.naturalWidth;
          const ih = imgEl.naturalHeight;
          const maxSide = Math.max(iw, ih);
          if (file.type === 'image/gif' || maxSide <= MAX) {
            resolve({ dataURL: originalDataURL, type: file.type });
            return;
          }
          const scale = MAX / maxSide;
          const w = Math.round(iw * scale);
          const h = Math.round(ih * scale);
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(imgEl, 0, 0, w, h);
          let dataURL, type;
          if (file.type === 'image/png') {
            type = 'image/png';
            dataURL = canvas.toDataURL('image/png');
          } else {
            type = 'image/jpeg';
            dataURL = canvas.toDataURL('image/jpeg', 0.85);
          }
          resolve({ dataURL, type });
        } catch (e) { reject(e); }
      };
      imgEl.src = originalDataURL;
    };
    reader.readAsDataURL(file);
  });
}

let dbPromise = null;
function openImageDB() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    if (!window.indexedDB) { reject(new Error('无 IndexedDB')); return; }
    const req = indexedDB.open(IMG_DB_NAME, IMG_DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(IMG_DB_STORE)) {
        db.createObjectStore(IMG_DB_STORE, { keyPath: 'name' });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}
async function loadImagesFromDB() {
  try {
    const db = await openImageDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IMG_DB_STORE, 'readonly');
      const req = tx.objectStore(IMG_DB_STORE).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  } catch (_) { return []; }
}
async function saveImagesToDB() {
  try {
    const db = await openImageDB();
    return new Promise((resolve) => {
      const tx = db.transaction(IMG_DB_STORE, 'readwrite');
      const store = tx.objectStore(IMG_DB_STORE);
      store.clear();
      uploadedImages.forEach(img => {
        store.put({
          name: img.name,
          dataURL: img.dataURL,
          selected: img.selected,
          type: img.type
        });
      });
      tx.oncomplete = () => resolve();
      tx.onerror = () => resolve();
    });
  } catch (_) {}
}

function getImageDataJSON() {
  const keyParts = [];
  uploadedImages.forEach(img => {
    if (img.selected && img.dataURL) {
      const head = img.dataURL.slice(22, 54);
      const tail = img.dataURL.slice(-32);
      keyParts.push(img.name + '#' + img.dataURL.length + ':' + head + ':' + tail);
    }
  });
  const key = keyParts.join('|');
  if (key === _imageJSONCache.key) return _imageJSONCache.json;

  const obj = {};
  uploadedImages.forEach(img => {
    if (img.selected) obj[img.name] = img.dataURL;
  });
  const json = JSON.stringify(obj);
  _imageJSONCache = { key, json };
  return json;
}

  const map = {
    html: 'text/html', htm: 'text/html',
    mp4: 'video/mp4', webm: 'video/webm',
    png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg'

    ? blob.type : guessMime(filename, blob.type);

      .then(() => { onDone && onDone('shared'); })
      .catch(err => {
        if (err && err.name === 'AbortError') { onDone && onDone('cancelled'); return; }
        try { legacyDownload(blob, filename); onDone && onDone('downloaded'); }
        catch (_) { onDone && onDone('failed', err); }

    return;

  legacyDownload(blob, filename);

function applySplit() {
  if (isFullscreen) return;
  const EPS = 0.0001;
  const dragging = splitDragging;
  const previewHidden = !dragging && splitRatio <= EPS;
  const editorHidden = !dragging && splitRatio >= 1 - EPS;

  if (previewHidden) {
    previewWrap.style.flex = '0 0 0px';

    editorWrap.style.minHeight = '100px';

    previewWrap.style.flex = '1 1 0';
    previewWrap.style.minHeight = '80px';
    editorWrap.style.flex = '0 0 0px';
    editorWrap.style.minHeight = '0';
    editorWrap.style.overflow = 'hidden';
  } else {
    const minP = dragging ? 0 : 80;
    const minE = dragging ? 0 : 100;
    previewWrap.style.flex = (splitRatio * 100) + ' 1 0';
    previewWrap.style.minHeight = minP + 'px';
    editorWrap.style.flex = ((1 - splitRatio) * 100) + ' 1 0';
    editorWrap.style.minHeight = minE + 'px';
    editorWrap.style.overflow = '';
  }

  const visible = !editorHidden;
  if (editor && visible !== lastEditorVisible) {
    lastEditorVisible = visible;
    if (visible) requestAnimationFrame(() => { try { editor.refresh(); } catch (_) {} });
  }

  if (!dragging) {
    try { localStorage.setItem(SPLIT_KEY, String(splitRatio)); } catch (_) {}
  }
}

let splitDragging = false, splitMoved = false;

const DBLCLICK_MS = 350, DBLCLICK_DIST = 10;

function onSplitDown(e) {
  if (e.target.closest('.tool-btn, .menu, .menu__item')) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const now = Date.now();
  if (now - lastDownTime < DBLCLICK_MS && Math.abs(e.clientY - lastDownY) < DBLCLICK_DIST) {
    lastDownTime = 0; lastDownY = 0; splitDragging = false;
    splitRatio = 0.8;
    applySplit();
    refreshEditorSoon();
    return;
  }
  lastDownTime = now; lastDownY = e.clientY;
  splitDragging = true; splitMoved = false;
  splitStartY = e.clientY;
  splitStartH = previewWrap.getBoundingClientRect().height;
  try { splitterEl.setPointerCapture(e.pointerId); } catch (_) {}

  document.body.style.userSelect = 'none';

function onSplitMove(e) {
  if (!splitDragging) return;

  splitMoved = true;
  const appRect = appEl.getBoundingClientRect();
  const splitterH = splitterEl.getBoundingClientRect().height;
  const totalH = appRect.height - splitterH;
  splitRatio = clamp((splitStartH + dy) / totalH, 0, 1);
  applySplit();
}

function onSplitUp(e) {
  if (!splitDragging) return;
  splitDragging = false;
  try { splitterEl.releasePointerCapture(e.pointerId); } catch (_) {}
  document.body.style.cursor = '';
  document.body.style.userSelect = '';
  if (splitMoved) {
    lastDownTime = 0; lastDownY = 0; splitMoved = false;
    if (splitRatio <= 0.10) { splitRatio = 0; }
    else if (splitRatio >= 0.90) { splitRatio = 1; }
  }

    const raw = localStorage.getItem(AI_STORE_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (!d || !d.configs) return;
    Object.keys(AI_PRESETS).forEach(id => {
      const c = d.configs[id];
      if (c && c.apiKey) aiConfig.configs[id] = c;
    });
    if (d.current && aiConfig.configs[d.current]) aiConfig.current = d.current;
  } catch (_) {}
}
function saveAIConfig() {
  try { localStorage.setItem(AI_STORE_KEY, JSON.stringify(aiConfig)); } catch (_) {}
}
function isAIConfigured(id) {
  const c = aiConfig.configs[id];
  return !!(c && c.apiKey);
}

function openAIPanel() {
  aiPane.hidden = false;
  if (cmWrapper) cmWrapper.style.display = 'none';
  btnAI.classList.add('is-active');
  updateAICurrentLabel();
  setTimeout(() => aiInput.focus(), 60);
}
function closeAIPanel() {
  aiPane.hidden = true;
  if (cmWrapper) cmWrapper.style.display = '';
  btnAI.classList.remove('is-active');
  if (editor) requestAnimationFrame(() => { try { editor.refresh(); } catch (_) {} });
}

function updateAICurrentLabel() {
  const id = aiConfig.current;
  if (id && isAIConfigured(id)) {
    aiCurrentLabel.textContent = AI_PRESETS[id].label;
    aiCurrentLabel.classList.add('is-ok');
    btnAISend.disabled = aiSending ? true : false;
  } else {
    aiCurrentLabel.textContent = '未选择模型';
    aiCurrentLabel.classList.remove('is-ok');
    btnAISend.disabled = true;
  }
}

function renderAIModelList() {
  aiModelPopup.innerHTML = '';
  Object.entries(AI_PRESETS).forEach(([id, preset]) => {
    const configured = isAIConfigured(id);
    const isCurrent = aiConfig.current === id;

    const item = document.createElement('div');
    item.className = 'ai-model-item' + (isCurrent ? ' is-current' : '');

    const nameSpan = document.createElement('span');
    nameSpan.className = 'ai-model-name';
    nameSpan.textContent = preset.label;
    item.appendChild(nameSpan);

    const statusSpan = document.createElement('span');
    statusSpan.className = 'ai-model-status ' + (configured ? 'is-ok' : 'is-none');
    statusSpan.textContent = configured ? (isCurrent ? '✓ 当前' : '✓') : '未配置';
    item.appendChild(statusSpan);

    const editBtn = document.createElement('button');
    editBtn.type = 'button';
    editBtn.className = 'ai-model-edit';
    editBtn.textContent = '⚙';
    editBtn.title = '编辑配置';
    editBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      aiModelPopup.hidden = true;
      openAISettings(id);
    });
    item.appendChild(editBtn);

    item.addEventListener('click', () => {
      aiModelPopup.hidden = true;
      if (configured) {
        aiConfig.current = id;
        saveAIConfig();
        updateAICurrentLabel();
      } else {
        openAISettings(id);
      }
    });

    aiModelPopup.appendChild(item);
  });
}

function openAISettings(id) {
  const preset = AI_PRESETS[id];
  const conf = aiConfig.configs[id];
  editingAIModelId = id;
  aiModalTitle.textContent = '配置 ' + preset.label;
  aiModalBaseUrl.value = (conf && conf.baseUrl) || preset.baseUrl || '';
  aiModalModel.value = (conf && conf.model) || preset.model || '';
  aiModalApiKey.value = (conf && conf.apiKey) || '';
  aiModal.hidden = false;
  setTimeout(() => aiModalApiKey.focus(), 40);
}
function closeAISettings() {
  aiModal.hidden = true;
  editingAIModelId = null;
}
aiModalCancel.addEventListener('click', closeAISettings);
aiModalSave.addEventListener('click', () => {
  const id = editingAIModelId;
  if (!id) return;
  const baseUrl = aiModalBaseUrl.value.trim();
  const model = aiModalModel.value.trim();
  const apiKey = aiModalApiKey.value.trim();
  if (!baseUrl) { showToast('请填写 Base URL'); return; }
  if (!apiKey) { showToast('请填写 API Key'); return; }
  aiConfig.configs[id] = { baseUrl, model, apiKey };
  aiConfig.current = id;
  saveAIConfig();
  closeAISettings();
  updateAICurrentLabel();
});

/* ===== 消息渲染 ===== */
function appendAIMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'ai-msg ai-msg--' + role;
  div.textContent = text;
  aiMessagesEl.appendChild(div);
  aiMessagesEl.scrollTop = aiMessagesEl.scrollHeight;
  return div;
}
function appendAIResult(code, explanation) {
  const wrap = document.createElement('div');
  wrap.className = 'ai-msg ai-msg--ai';

  if (explanation) {
    const desc = document.createElement('div');
    desc.textContent = explanation;
    desc.style.marginBottom = '6px';
    wrap.appendChild(desc);
  }

  const box = document.createElement('div');
  box.className = 'ai-result';

  const pre = document.createElement('pre');
  pre.className = 'ai-result__code';
  pre.textContent = code;
  box.appendChild(pre);

  const actions = document.createElement('div');
  actions.className = 'ai-result__actions';

  const applyBtn = document.createElement('button');
  applyBtn.type = 'button';
  applyBtn.className = 'ai-result__btn ai-result__btn--primary';
  applyBtn.textContent = '应用到编辑器';
  applyBtn.addEventListener('click', () => {
    if (!editor) return;
    editor.setValue(code);
    saveDraft();
    closeAIPanel();
    updatePreview();
    showToast('已应用到编辑器');
  });
  actions.appendChild(applyBtn);

  const copyBtn = document.createElement('button');
  copyBtn.type = 'button';
  copyBtn.className = 'ai-result__btn';
  copyBtn.textContent = '复制';
  copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(code);
      showToast('已复制');
    } catch (_) {
      showToast('复制失败');
    }
  });
  actions.appendChild(copyBtn);

  box.appendChild(actions);
  wrap.appendChild(box);
  aiMessagesEl.appendChild(wrap);
  aiMessagesEl.scrollTop = aiMessagesEl.scrollHeight;
}

function clearAIEmptyHint() {
  const empty = aiMessagesEl.querySelector('.ai-empty');
  if (empty) empty.remove();
}

/* ===== AI 发送 ===== */
function safeParseJSON(s) {
  try { return JSON.parse(s); } catch (_) { return {}; }
}
function extractCodeFromText(text) {
  if (!text) return '';
  const fence = text.match(/```(?:js|javascript)?\s*([\s\S]*?)```/i);
  if (fence) return fence[1].trim();
  return '';
}
async function callChatAPI(conf, messages, withTools) {
  const url = conf.baseUrl.replace(/\/+$/, '') + '/chat/completions';
  const body = { model: conf.model, messages, temperature: 0.7 };
  if (withTools) {
    body.tools = AI_TOOLS;
    body.tool_choice = 'auto';
  }
  const res = await fetch(url, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + conf.apiKey
    },
    body: JSON.stringify(body)
  });
  if (!res.ok) {
    const errText = await res.text().catch(() => '');
    throw new Error('HTTP ' + res.status + (errText ? '：' + errText.slice(0, 200) : ''));
  }
  return res.json();
}

async function sendAIMessage() {
  if (aiSending) return;
  const prompt = aiInput.value.trim();
  if (!prompt) return;

  const id = aiConfig.current;
  if (!id || !isAIConfigured(id)) { showToast('请先选择并配置模型'); return; }
  const conf = aiConfig.configs[id];
  const preset = AI_PRESETS[id];

  aiSending = true;
  btnAISend.disabled = true;
  aiInput.value = '';
  clearAIEmptyHint();
  appendAIMsg('user', prompt);
  const loadingEl = appendAIMsg('loading', '正在生成…');

  const userMsg = { role: 'user', content: prompt };
  aiHistory.push(userMsg);

  try {
    const apiMessages = [{ role: 'system', content: AI_SYSTEM_PROMPT }].concat(aiHistory);

    // 视觉输入：取最新 user 消息，附加选中图片
    if (preset.vision) {
      const selected = uploadedImages.filter(i => i.selected);
      if (selected.length > 0) {
        const last = apiMessages[apiMessages.length - 1];
        if (last.role === 'user') {
          const content = [{ type: 'text', text: typeof last.content === 'string' ? last.content : '' }];
          selected.slice(0, 3).forEach(img => {
            content.push({ type: 'image_url', image_url: { url: img.dataURL, detail: 'low' } });
          });
          // 仅替换 apiMessages 中的副本，不改 aiHistory
          apiMessages[apiMessages.length - 1] = { role: 'user', content };
        }
      }
    }

    let finalCode = null;
    let finalExplain = '';
    const withTools = true;
    const MAX_ROUNDS = 6;

    for (let round = 0; round < MAX_ROUNDS; round++) {
      const data = await callChatAPI(conf, apiMessages, withTools);
      const msg = data.choices && data.choices[0] && data.choices[0].message;
      if (!msg) throw new Error('响应格式异常');

      if (!msg.tool_calls || msg.tool_calls.length === 0) {
        const code = extractCodeFromText(msg.content || '');
        if (code) { finalCode = code; finalExplain = ''; }
        if (msg.content) {
          aiHistory.push({ role: 'assistant', content: msg.content });
          apiMessages.push({ role: 'assistant', content: msg.content });
        }
        break;
      }

      // 记录 assistant 的 tool_calls 到历史
      aiHistory.push({
        role: 'assistant',
        content: msg.content || '',
        tool_calls: msg.tool_calls
      });
      apiMessages.push({
        role: 'assistant',
        content: msg.content || '',
        tool_calls: msg.tool_calls
      });

      for (const tc of msg.tool_calls) {
        const fn = tc.function || {};
        const args = safeParseJSON(fn.arguments || '{}');
        let toolResult = { ok: false };

        if (fn.name === 'write_p5_code' && args.code) {
          finalCode = args.code;
          finalExplain = args.explanation || '';
          toolResult = { ok: true, message: '代码已接收' };
        }

        const toolMsg = {
          role: 'tool',
          tool_call_id: tc.id,
          content: JSON.stringify(toolResult)
        };
        aiHistory.push(toolMsg);
        apiMessages.push(toolMsg);
      }

      if (finalCode) break;
    }

    loadingEl.remove();

    if (finalCode) {
      appendAIResult(finalCode, finalExplain);

      // 空或模板 → 直接写入
      const current = editor.getValue().trim();
      const isTemplate = current === buildTemplate().trim() || current === '';
      if (isTemplate) {
        editor.setValue(finalCode);
        saveDraft();
        updatePreview();
      }
    } else {
      appendAIMsg('error', '未生成代码，请重试或换个描述');
    }
  } catch (err) {
    loadingEl.remove();
    appendAIMsg('error', '请求失败：' + (err && err.message || '未知错误'));
  } finally {
    aiSending = false;
    btnAISend.disabled = !isAIConfigured(aiConfig.current);
  }
}

/* ===== 事件绑定 ===== */
btnAIBack.addEventListener('click', () => closeAIPanel());

btnAI.addEventListener('click', () => {
  if (aiPane.hidden) openAIPanel();
  else closeAIPanel();
});

btnAIModelPlus.addEventListener('click', (e) => {
  e.stopPropagation();
  aiModelPopup.hidden = !aiModelPopup.hidden;
  if (!aiModelPopup.hidden) renderAIModelList();
});

btnAISend.addEventListener('click', sendAIMessage);
aiInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendAIMessage();
  }
});

btnFullscreen.addEventListener('click', () => toggleFullscreen(true));
btnFullscreenExit.addEventListener('click', () => toggleFullscreen(false));

btnSave.addEventListener('click', () => { closeAllMenus(); saveHTML(); });
btnReset.addEventListener('click', () => {
  closeAllMenus();
  if (isRecording) { showToast('录制中，无法重置'); return; }
  if (!confirm('恢复默认将丢失当前代码，确定？')) return;
  editor.setValue(buildTemplate());
  updatePreview();
  saveDraft();
});
btnFormat.addEventListener('click', () => { closeAllMenus(); formatCode(); });
btnWrapToggle.addEventListener('click', () => { setWrap(!wrapEnabled); closeAllMenus(); });
btnAutoPreviewToggle.addEventListener('click', () => { setAutoPreview(!autoPreviewEnabled); closeAllMenus(); });
btnClearCode.addEventListener('click', () => { closeAllMenus(); clearCode(); });

btnSavePNG.addEventListener('click', () => { closeAllMenus(); capturePNG(); });
btnRecordMP4.addEventListener('click', () => { closeAllMenus(); handleRecordClick(); });
btnDiscardRecord.addEventListener('click', (e) => {
  e.stopPropagation();
  if (!pendingRecord) return;
  pendingRecord = null;
  updateRecordButton();
  closeAllMenus();
});

bgBtns.forEach(btn => {
  btn.addEventListener('click', () => setPreviewBg(btn.dataset.bg));
});

zoomInBtn.addEventListener('click', () => zoomByButton(1.25));
zoomOutBtn.addEventListener('click', () => zoomByButton(1 / 1.25));
zoomResetBtn.addEventListener('click', () => { stageScale = 1; applyStageTransform(); });

btnRun.addEventListener('click', runCode);

document.addEventListener('keydown', (e) => {
  const mod = e.ctrlKey || e.metaKey;
  if (mod && !e.shiftKey && (e.key === 's' || e.key === 'S')) {
    e.preventDefault();
    saveHTML();
  } else if (mod && (e.key === 'Enter')) {
    e.preventDefault();
    runCode();
  } else if (mod && e.shiftKey && (e.key === 'f' || e.key === 'F')) {
    e.preventDefault();
    formatCode();
  } else if (e.key === 'Escape') {
    closeAllMenus();
    if (isFullscreen) toggleFullscreen(false);
  }
});

window.addEventListener('message', e => {
  const d = e.data;
  if (!d) return;
  if (e.source !== previewEl.contentWindow) return;

  if (d.type === 'outside-click') { closeAllMenus(); blurActiveElement(); return; }
  if (d.type === 'p5-error') { showToast(d.message || 'p5.js 加载失败'); return; }
  if (d.type === 'code-error') {
    const loc = d.lineno ? '（第 ' + d.lineno + ' 行）' : '';
    showToast('代码错误：' + (d.message || '未知') + loc);
    return;
  }

  if (d.type === 'record-started') {
    isRecording = true;
    setEditorReadOnly(true);
    updateRecordButton();
    showToast('开始录制…');
  } else if (d.type === 'record-done') {
    isRecording = false;
    setEditorReadOnly(false);
    if (!(d.buffer instanceof ArrayBuffer)) return;
    const isMP4 = !!d.isMP4;
    const blob = new Blob([d.buffer], { type: isMP4 ? 'video/mp4' : 'video/webm' });
    const filename = timestampFilename('sketch', isMP4 ? 'mp4' : 'webm');
    shareOrDownload(blob, filename, (result) => {
      if (result === 'shared' || result === 'downloaded') {
        pendingRecord = null; updateRecordButton();
      } else {
        pendingRecord = { blob, isMP4, filename }; updateRecordButton();
        if (result === 'failed') showToast('请点击「' + (isMP4 ? '下载 MP4' : '下载 WebM') + '」保存');
      }
    });
  } else if (d.type === 'record-error') {
    isRecording = false;
    setEditorReadOnly(false);
    updateRecordButton();
    showToast('录制失败：' + (d.message || '未知错误'));
  }
});

window.addEventListener('resize', () => { closeAllMenus(); });

async function initImages() {
  const saved = await loadImagesFromDB();
  if (saved && saved.length) {
    uploadedImages = saved.map(img => {
      const dataURL = img.dataURL || (img.versions && img.versions.url) || '';
      return {
        name: img.name,
        dataURL: dataURL,
        selected: !!img.selected,
        type: img.type
      };
    }).filter(img => img.name && img.dataURL);

    imgSeq = uploadedImages.reduce((max, img) => {
      const m = img.name.match(/^img_(\d+)/);
      return m ? Math.max(max, parseInt(m[1], 10)) : max;
    }, 0);
    renderImageList();
    updatePreview();
  }
}

function init() {
  editor = CodeMirror.fromTextArea($('code'), {
    mode: 'javascript',
    theme: 'material-darker',
    lineNumbers: true,
    indentUnit: 2,
    tabSize: 2,
    lineWrapping: false,
    autofocus: false
  });
  editor.setSize('100%', '100%');
  cmWrapper = editor.getWrapperElement();

  ['gesturestart', 'gesturechange', 'gestureend'].forEach(evt => {
    cmWrapper.addEventListener(evt, e => e.preventDefault(), { passive: false });
  });
  cmWrapper.addEventListener('touchmove', e => {
    if (e.touches.length > 1) e.preventDefault();
  }, { passive: false });

  try { if (localStorage.getItem(WRAP_KEY) === '1') wrapEnabled = true; } catch (_) {}
  editor.setOption('lineWrapping', wrapEnabled);
  updateWrapLabel();

  try {
    const v = localStorage.getItem(AUTO_PREVIEW_KEY);
    autoPreviewEnabled = (v !== '0');
  } catch (_) {}
  updateAutoPreviewLabel();

  const savedCode = loadDraft();
  editor.setValue(savedCode != null ? savedCode : buildTemplate());

  editor.on('change', () => {
    clearTimeout(inputTimer);
    inputTimer = setTimeout(() => {
      saveDraft();
      schedulePreview();
    }, 500);
  });

  try {
    const v = parseFloat(localStorage.getItem(SPLIT_KEY));
    if (isFinite(v) && v > 0.1 && v < 0.9) splitRatio = v;
  } catch (_) {}

  try {
    const bg = localStorage.getItem(BG_KEY);
    if (bg === 'checker' || bg === 'white' || bg === 'dark') previewBg = bg;
  } catch (_) {}

  loadAIConfig();
  updateAICurrentLabel();

  applySplit();
  setPreviewBg(previewBg);
  updateRecordButton();
  updatePreview();
  blurEditor();

  initImages();
}

init();

})();
</script>
