<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
<title>p5.js编辑器</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/theme/material-darker.min.css" />
<style>
:root {
  --bg: #f8fafc; --panel: #ffffff;
  --border: #e2e8f0; --border-hover: #cbd5e1;
  --text: #0f172a; --text-dim: #64748b; --text-muted: #94a3b8;
  --accent: #2563eb; --accent-hover: #1d4ed8;
  --hover: #f1f5f9; --active: #e2e8f0;
  --splitter-bg: #f1f5f9; --grip: #cbd5e1; --grip-hover: #94a3b8;
  --shadow-sm: 0 2px 8px rgba(15,23,42,.08);
  --ed-bg: #0f172a;
}
*,*::before,*::after { box-sizing: border-box; }

html {
  height: 100%;
  touch-action: pan-x pan-y;
  -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
}
body {
  margin: 0; height: 100%;
  font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text);
  font-size: 13px; overflow: hidden;
  -webkit-font-smoothing: antialiased;
  touch-action: pan-x pan-y;
}

.app {
  display: flex; flex-direction: column;
  width: 100%; height: 100vh; height: 100dvh;
  position: relative;
}

.preview-wrap {
  flex: 80 1 0; min-height: 80px;
  position: relative; overflow: hidden;
  background: #f1f5f9;
  touch-action: auto;
  user-select: none; -webkit-user-select: none;
  transition: background-color .2s;
}
.preview-wrap.bg-checker {
  background-color: #f8fafc;
  background-image:
    linear-gradient(45deg, #e2e8f0 25%, transparent 25%),
    linear-gradient(-45deg, #e2e8f0 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #e2e8f0 75%),
    linear-gradient(-45deg, transparent 75%, #e2e8f0 75%);
  background-size: 16px 16px;
  background-position: 0 0, 0 8px, 8px -8px, -8px 0;
}
.preview-wrap.bg-white { background: #ffffff; }
.preview-wrap.bg-dark { background: #0f172a; }

.preview-stage {
  position: absolute; inset: 0;
  transform-origin: center center;
  will-change: transform;
}
.preview-stage iframe {
  display: block; width: 100%; height: 100%;
  border: 0; background: transparent;
  pointer-events: auto;
}

.preview-badge {
  position: absolute; right: 14px; bottom: 12px;
  padding: 4px 9px; border-radius: 6px;
  background: rgba(15,23,42,.72); color: #e2e8f0;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px; pointer-events: none;
  backdrop-filter: blur(4px);
  font-variant-numeric: tabular-nums;
  z-index: 2;
}

.view-controls {
  position: absolute; left: 14px; bottom: 12px; z-index: 8;
  display: flex; align-items: center; gap: 8px;
  padding: 6px 10px;
  background: rgba(255,255,255,.94);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: var(--shadow-sm);
  backdrop-filter: blur(8px);
}
.bg-switcher { display: flex; gap: 4px; }
.bg-btn {
  width: 20px; height: 20px; padding: 0;
  border: 1px solid var(--border-hover);
  border-radius: 4px; cursor: pointer;
  touch-action: manipulation;
  transition: box-shadow .14s, border-color .14s;
}
.bg-btn[data-bg="checker"] {
  background-image:
    linear-gradient(45deg, #cbd5e1 25%, transparent 25%),
    linear-gradient(-45deg, #cbd5e1 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #cbd5e1 75%),
    linear-gradient(-45deg, transparent 75%, #cbd5e1 75%);
  background-size: 8px 8px;
  background-position: 0 0, 0 4px, 4px -4px, -4px 0;
  background-color: #f8fafc;
}
.bg-btn[data-bg="white"] { background: #fff; }
.bg-btn[data-bg="dark"] { background: #1e293b; border-color: #334155; }
.bg-btn.is-active {
  box-shadow: 0 0 0 2px var(--accent);
  border-color: var(--accent);
}
.view-controls__sep {
  width: 1px; height: 18px;
  background: var(--border);
  margin: 0 2px;
}

.zoom-btn {
  min-width: 26px; height: 26px; padding: 0 6px;
  display: grid; place-items: center;
  font-family: inherit; font-size: 14px; font-weight: 600;
  color: var(--text-dim);
  background: transparent; border: 0; border-radius: 5px;
  cursor: pointer; touch-action: manipulation;
  transition: background .14s, color .14s;
}
.zoom-btn:hover { background: var(--hover); color: var(--text); }
.zoom-btn:disabled { opacity: .4; cursor: not-allowed; }
.zoom-label {
  min-width: 48px; height: 26px; padding: 0 4px;
  font-family: inherit; font-size: 11.5px; font-weight: 600;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
  background: transparent; border: 0; border-radius: 5px;
  cursor: pointer; touch-action: manipulation;
}
.zoom-label:hover { background: var(--hover); color: var(--text); }

.splitter {
  flex: 0 0 34px;
  display: flex; align-items: center;
  padding: 0 8px;
  background: var(--splitter-bg);
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  user-select: none; -webkit-user-select: none;
  position: relative; z-index: 20;
  touch-action: none;
}
.tool-group { flex: 0 0 auto; display: flex; align-items: center; gap: 2px; }
.tool-group--left, .tool-group--right { position: relative; }

.tool-center {
  flex: 1 1 auto; min-width: 60px;
  display: flex; align-items: center; justify-content: center;
  position: relative;
}
.tool-btn {
  flex: 0 0 auto;
  min-width: 28px; height: 24px;
  display: grid; place-items: center;
  padding: 0 8px;
  font-family: inherit; font-size: 12px; font-weight: 500;
  color: var(--text-dim);
  background: transparent; border: 1px solid transparent; border-radius: 5px;
  cursor: pointer; touch-action: manipulation;
  transition: background .14s, color .14s, border-color .14s;
}
.tool-btn:hover { color: var(--text); background: var(--active); }
.tool-btn:active:not(:disabled) { transform: scale(.94); }
.tool-btn.primary { color: #fff; background: var(--accent); border-color: var(--accent); }
.tool-btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

/* 播放按钮：绝对居中 */
.tool-btn.anim-btn {
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  z-index: 2;
  margin: 0;
  color: var(--accent);
  background: var(--splitter-bg);
}
.tool-btn.anim-btn:hover { background: var(--active); color: var(--accent); }
.tool-btn.anim-btn:active:not(:disabled) { transform: translate(-50%, -50%) scale(.94); }
.tool-btn.anim-btn.is-playing { color: #dc2626; }

/* 菜单按钮与下拉菜单 */
.menu-btn {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 2px;
  line-height: 1;
  padding: 0 4px;
}
.menu {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  min-width: 110px;
  padding: 4px;
  display: flex; flex-direction: column; gap: 2px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: 0 8px 24px rgba(15,23,42,.18);
  z-index: 30;
}
.tool-group--right .menu { left: auto; right: 0; }
.menu[hidden] { display: none; }
.menu__item {
  width: 100%;
  padding: 8px 12px;
  text-align: left;
  font-family: inherit; font-size: 12.5px; color: var(--text);
  background: transparent; border: 0; border-radius: 5px;
  cursor: pointer; touch-action: manipulation;
  transition: background .14s;
}
.menu__item:hover { background: var(--hover); }
.menu__item:active { background: var(--active); }

/* grip 双条（中央留给播放按钮） */
.splitter-grip {
  flex: 1 1 auto; min-width: 20px; height: 100%;
  cursor: ns-resize; touch-action: none; position: relative;
}
.splitter-grip::before,
.splitter-grip::after {
  content: ''; position: absolute; top: 50%; transform: translateY(-50%);
  width: 40px; height: 4px;
  background: var(--grip); border-radius: 2px;
  transition: background .14s, width .14s;
}
.splitter-grip::before { right: calc(50% + 22px); }
.splitter-grip::after  { left:  calc(50% + 22px); }
.splitter-grip:hover::before,
.splitter-grip:hover::after { background: var(--grip-hover); width: 52px; }
.splitter-grip.is-snap-code::before,
.splitter-grip.is-snap-code::after { background: var(--accent); width: 52px; }

.editor-wrap {
  flex: 20 1 0; min-height: 100px;
  position: relative; overflow: hidden;
  background: var(--ed-bg);
}
.CodeMirror {
  height: 100% !important;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 13px; line-height: 1.55;
  touch-action: pan-x pan-y;
}
.editor-wrap[hidden] { display: none !important; }

.toast {
  position: fixed; left: 50%; bottom: 24px;
  transform: translate(-50%, 14px);
  padding: 10px 18px; border-radius: 999px;
  background: rgba(15,23,42,.94); color: #f8fafc;
  font-size: 13px; text-align: center;
  opacity: 0; pointer-events: none;
  transition: opacity .22s, transform .22s;
  z-index: 999;
}
.toast.is-show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 720px) {
  .splitter { flex-basis: 32px; padding: 0 4px; }
  .tool-btn { min-width: 26px; height: 22px; font-size: 11.5px; padding: 0 6px; }
  .menu-btn { font-size: 16px; }
  .menu { min-width: 100px; }

  .splitter-grip::before,
  .splitter-grip::after { width: 28px; height: 3px; }
  .splitter-grip::before { right: calc(50% + 18px); }
  .splitter-grip::after  { left:  calc(50% + 18px); }
  .splitter-grip:hover::before,
  .splitter-grip:hover::after { width: 38px; }
  .splitter-grip.is-snap-code::before,
  .splitter-grip.is-snap-code::after { width: 44px; }

  .CodeMirror { font-size: 14px; }

  .view-controls { left: 8px; bottom: 8px; gap: 4px; padding: 4px 6px; }
  .zoom-label { min-width: 42px; font-size: 11px; }
  .zoom-btn { min-width: 22px; height: 22px; font-size: 12px; }
  .bg-btn { width: 16px; height: 16px; }
}
</style>
</head>
<body>

<div class="app" id="app">
  <section class="preview-wrap bg-checker" id="previewWrap">
    <div class="preview-stage" id="previewStage">
      <iframe id="preview" sandbox="allow-scripts allow-same-origin" title="p5.js 预览"></iframe>
    </div>
    <div class="preview-badge" id="previewBadge">—</div>
    <div class="view-controls">
      <div class="bg-switcher" role="group" aria-label="预览背景">
        <button class="bg-btn is-active" data-bg="checker" type="button" title="棋盘格背景" aria-label="棋盘格背景"></button>
        <button class="bg-btn" data-bg="white" type="button" title="白色背景" aria-label="白色背景"></button>
        <button class="bg-btn" data-bg="dark" type="button" title="深色背景" aria-label="深色背景"></button>
      </div>
      <span class="view-controls__sep"></span>
      <button class="zoom-btn" id="zoomOut" type="button" title="缩小" aria-label="缩小">−</button>
      <button class="zoom-label" id="zoomReset" type="button" title="重置为 100%">100%</button>
      <button class="zoom-btn" id="zoomIn" type="button" title="放大" aria-label="放大">+</button>
    </div>
  </section>

  <div class="splitter" id="splitter">
    <div class="tool-group tool-group--left">
      <button class="tool-btn menu-btn" id="btnMenuLeft" type="button" title="菜单" aria-label="菜单" aria-haspopup="true" aria-expanded="false">⋯</button>
      <div class="menu" id="menuLeft" hidden>
        <button class="menu__item" id="btnSave" type="button">保存</button>
      </div>
    </div>
    <div class="tool-center">
      <div class="splitter-grip" id="splitterGrip" title="拖动调整布局 · 双击恢复默认"></div>
      <button class="tool-btn anim-btn is-playing" id="btnAnimCycle" type="button" title="停止" aria-label="停止">
        <svg id="animIcon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor" stroke="none"/>
        </svg>
      </button>
    </div>
    <div class="tool-group tool-group--right">
      <button class="tool-btn menu-btn" id="btnMenuRight" type="button" title="菜单" aria-label="菜单" aria-haspopup="true" aria-expanded="false">⋯</button>
      <div class="menu" id="menuRight" hidden>
        <button class="menu__item" id="btnReset" type="button">重置</button>
      </div>
    </div>
  </div>

  <section class="editor-wrap" id="editorWrap">
    <textarea id="code"></textarea>
  </section>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/javascript/javascript.min.js"></script>
<script>
(function () {
'use strict';

const P5_CDN = 'https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js';
const DRAFT_KEY = 'p5-editor.draft.v2';
const SPLIT_KEY = 'p5-editor.split.v1';
const BG_KEY = 'p5-editor.bg.v1';

const $ = id => document.getElementById(id);
const appEl = $('app');
const previewWrap = $('previewWrap');
const previewStage = $('previewStage');
const previewEl = $('preview');
const previewBadge = $('previewBadge');
const splitterEl = $('splitter');
const splitterGrip = $('splitterGrip');
const editorWrap = $('editorWrap');
const toastEl = $('toast');
const btnSave = $('btnSave');
const btnReset = $('btnReset');
const btnMenuLeft = $('btnMenuLeft');
const btnMenuRight = $('btnMenuRight');
const menuLeft = $('menuLeft');
const menuRight = $('menuRight');
const zoomInBtn = $('zoomIn');
const zoomOutBtn = $('zoomOut');
const zoomResetBtn = $('zoomReset');
const btnAnimCycle = $('btnAnimCycle');
const animIcon = $('animIcon');
const bgBtns = Array.from(document.querySelectorAll('.bg-btn'));

let editor = null;
let renderTimer = null;
let toastTimer = null;

let stageScale = 1, stagePanX = 0, stagePanY = 0;

let splitRatio = 0.8;
let splitState = 'default';

let animState = 'playing';
let previewBg = 'checker';

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('is-show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('is-show'), 2200);
}
function isMobileViewport() { return window.innerWidth <= 720; }
const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

function blurEditor() {
  if (!editor) return;
  try {
    const input = editor.getInputField();
    if (input && document.activeElement === input) input.blur();
  } catch (_) {}
}

/* 默认透明空白模板（最小 p5 骨架） */
function buildTemplate() {
  return `function setup() {
  createCanvas(windowWidth, windowHeight);
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
}

function draw() {
  clear();
}
`;
}

function buildRuntimeHTML(userCode) {
  return `<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>p5.js Sketch</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:transparent; touch-action:none; }
  canvas { display:block; touch-action:none; }
</style>
<script src="${P5_CDN}"><\/script>
</head>
<body>
<script>
${userCode}

window.addEventListener('message', function (e) {
  var cmd = e.data && e.data.type;
  try {
    if (cmd === 'play') {
      if (typeof loop === 'function') loop();
    } else if (cmd === 'stop') {
      if (typeof noLoop === 'function') noLoop();
    }
  } catch (_) {}
});

['gesturestart', 'gesturechange', 'gestureend'].forEach(function (evt) {
  document.addEventListener(evt, function (e) { e.preventDefault(); }, { passive: false });
});
document.addEventListener('touchmove', function (e) {
  if (e.touches.length > 1) e.preventDefault();
}, { passive: false });
document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
<\/script>
</body>
</html>`;
}

function updatePreview() {
  const code = editor ? editor.getValue() : buildTemplate();
  previewEl.srcdoc = buildRuntimeHTML(code);
  if (stageScale === 1 && stagePanX === 0 && stagePanY === 0) {
    previewBadge.textContent = '加载中…';
  }
}

function schedulePreview() {
  clearTimeout(renderTimer);
  renderTimer = setTimeout(updatePreview, 300);
}

function applyStageTransform() {
  previewStage.style.transform =
    `translate(${stagePanX}px, ${stagePanY}px) scale(${stageScale})`;
  zoomResetBtn.textContent = Math.round(stageScale * 100) + '%';
}

function zoomAt(factor, localX, localY) {
  const rect = previewWrap.getBoundingClientRect();
  const newScale = clamp(stageScale * factor, 0.25, 8);
  if (newScale === stageScale) return;
  const ratio = newScale / stageScale;
  const relX = localX - rect.width / 2 - stagePanX;
  const relY = localY - rect.height / 2 - stagePanY;
  stagePanX = localX - rect.width / 2 - relX * ratio;
  stagePanY = localY - rect.height / 2 - relY * ratio;
  stageScale = newScale;
  applyStageTransform();
}

function zoomByButton(factor) {
  const rect = previewWrap.getBoundingClientRect();
  zoomAt(factor, rect.width / 2, rect.height / 2);
}

function setPreviewBg(bg) {
  previewBg = bg;
  previewWrap.className = 'preview-wrap bg-' + bg;
  bgBtns.forEach(b => b.classList.toggle('is-active', b.dataset.bg === bg));
  try { localStorage.setItem(BG_KEY, bg); } catch (_) {}
}

function postToIframe(type) {
  try {
    if (previewEl.contentWindow) {
      previewEl.contentWindow.postMessage({ type }, '*');
    }
  } catch (_) {}
}

function updateAnimIcon() {
  if (animState === 'playing') {
    animIcon.innerHTML = '<rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor" stroke="none"/>';
    btnAnimCycle.title = '停止';
    btnAnimCycle.setAttribute('aria-label', '停止');
    btnAnimCycle.classList.add('is-playing');
  } else {
    animIcon.innerHTML = '<polygon points="7,5 19,12 7,19" fill="currentColor" stroke="none"/>';
    btnAnimCycle.title = '播放';
    btnAnimCycle.setAttribute('aria-label', '播放');
    btnAnimCycle.classList.remove('is-playing');
  }
}

function applyAnimState() {
  if (animState === 'playing') postToIframe('play');
  else postToIframe('stop');
  updateAnimIcon();
}

function toggleAnimState() {
  animState = (animState === 'playing') ? 'stopped' : 'playing';
  applyAnimState();
  showToast(animState === 'playing' ? '播放' : '已停止');
}

function applySplit() {
  if (splitState === 'code-max') {
    previewWrap.style.flex = '0 0 80px';
    editorWrap.style.flex = '1 1 0';
  } else {
    previewWrap.style.flex = (splitRatio * 100) + ' 1 0';
    editorWrap.style.flex = ((1 - splitRatio) * 100) + ' 1 0';
  }
  previewWrap.style.minHeight = '80px';
  editorWrap.style.minHeight = '100px';
}

let splitDragging = false, splitMoved = false;
let splitStartY = 0, splitStartH = 0;
let lastDownTime = 0, lastDownY = 0;
const DBLCLICK_MS = 350, DBLCLICK_DIST = 10;

function onSplitDown(e) {
  if (e.target.closest('.tool-btn, .menu, .menu__item')) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const now = Date.now();
  if (now - lastDownTime < DBLCLICK_MS && Math.abs(e.clientY - lastDownY) < DBLCLICK_DIST) {
    lastDownTime = 0; lastDownY = 0; splitDragging = false;
    splitState = 'default'; splitRatio = 0.8;
    applySplit();
    showToast('已恢复 80/20 布局');
    return;
  }
  lastDownTime = now; lastDownY = e.clientY;
  splitDragging = true; splitMoved = false;
  splitStartY = e.clientY;
  splitStartH = previewWrap.getBoundingClientRect().height;
  try { splitterEl.setPointerCapture(e.pointerId); } catch (_) {}
  document.body.style.cursor = 'ns-resize';
  document.body.style.userSelect = 'none';
}

function onSplitMove(e) {
  if (!splitDragging) return;
  const dy = e.clientY - splitStartY;
  if (!splitMoved && Math.abs(dy) < 3) return;
  splitMoved = true;
  const appRect = appEl.getBoundingClientRect();
  const splitterH = splitterEl.getBoundingClientRect().height;
  const totalH = appRect.height - splitterH;
  const ratio = clamp((splitStartH + dy) / totalH, 0.05, 0.95);
  splitRatio = ratio; splitState = 'default';
  splitterGrip.classList.toggle('is-snap-code', ratio >= 0.90);
  applySplit();
}

function onSplitUp(e) {
  if (!splitDragging) return;
  splitDragging = false;
  try { splitterEl.releasePointerCapture(e.pointerId); } catch (_) {}
  document.body.style.cursor = '';
  document.body.style.userSelect = '';
  splitterGrip.classList.remove('is-snap-code');
  if (splitMoved) {
    lastDownTime = 0; lastDownY = 0; splitMoved = false;
    if (splitRatio >= 0.90) {
      splitState = 'code-max';
      applySplit();
      showToast('代码已最大化');
    }
  }
}
splitterEl.addEventListener('pointerdown', onSplitDown);
splitterEl.addEventListener('pointermove', onSplitMove);
splitterEl.addEventListener('pointerup', onSplitUp);
splitterEl.addEventListener('pointercancel', onSplitUp);

/* 禁止 Safari 双指缩放（macOS gesture 事件） */
['gesturestart', 'gesturechange', 'gestureend'].forEach(evt => {
  document.addEventListener(evt, e => e.preventDefault(), { passive: false });
});

/* 禁止 iOS Safari 双指缩放（兜底） */
document.addEventListener('touchmove', e => {
  if (e.touches.length > 1) e.preventDefault();
}, { passive: false });

/* ===== 下拉菜单 ===== */
function closeAllMenus() {
  menuLeft.hidden = true;
  menuRight.hidden = true;
  btnMenuLeft.setAttribute('aria-expanded', 'false');
  btnMenuRight.setAttribute('aria-expanded', 'false');
}

function openMenu(menu, btn) {
  closeAllMenus();
  menu.hidden = false;
  btn.setAttribute('aria-expanded', 'true');
  /* 自动判断向上/向下：底部空间不足时向上弹出 */
  const btnRect = btn.getBoundingClientRect();
  const menuH = menu.offsetHeight;
  const spaceBelow = window.innerHeight - btnRect.bottom;
  if (spaceBelow < menuH + 12) {
    menu.style.top = 'auto';
    menu.style.bottom = 'calc(100% + 6px)';
  } else {
    menu.style.top = 'calc(100% + 6px)';
    menu.style.bottom = 'auto';
  }
}

btnMenuLeft.addEventListener('click', e => {
  e.stopPropagation();
  if (menuLeft.hidden) openMenu(menuLeft, btnMenuLeft);
  else closeAllMenus();
});
btnMenuRight.addEventListener('click', e => {
  e.stopPropagation();
  if (menuRight.hidden) openMenu(menuRight, btnMenuRight);
  else closeAllMenus();
});

/* 点击外部关闭菜单 */
document.addEventListener('pointerdown', e => {
  if (e.target.closest('.menu')) return;
  if (e.target.closest('#btnMenuLeft') || e.target.closest('#btnMenuRight')) return;
  closeAllMenus();
});

/* ===== 草稿存取（仅代码） ===== */
function saveDraft() {
  try {
    localStorage.setItem(DRAFT_KEY, JSON.stringify({
      code: editor ? editor.getValue() : ''
    }));
  } catch (_) {}
}
function loadDraft() {
  try {
    const s = localStorage.getItem(DRAFT_KEY);
    if (!s) return null;
    const d = JSON.parse(s);
    if (d && typeof d.code === 'string') return d.code;
  } catch (_) {}
  return null;
}

function saveHTML() {
  const code = editor.getValue();
  const html = buildRuntimeHTML(code);
  const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'sketch.html';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  showToast('已保存 sketch.html');
}

/* ===== 菜单项事件 ===== */
btnSave.addEventListener('click', () => {
  closeAllMenus();
  saveHTML();
});
btnReset.addEventListener('click', () => {
  closeAllMenus();
  if (!confirm('恢复默认将丢失当前代码，确定？')) return;
  editor.setValue(buildTemplate());
  updatePreview();
  saveDraft();
  showToast('已重置');
});

bgBtns.forEach(btn => {
  btn.addEventListener('click', () => setPreviewBg(btn.dataset.bg));
});

zoomInBtn.addEventListener('click', () => zoomByButton(1.25));
zoomOutBtn.addEventListener('click', () => zoomByButton(1 / 1.25));
zoomResetBtn.addEventListener('click', () => {
  stageScale = 1; stagePanX = 0; stagePanY = 0;
  applyStageTransform();
});

btnAnimCycle.addEventListener('click', toggleAnimState);

window.addEventListener('message', e => {
  if (e.data && e.data.type === 'size') {
    previewBadge.textContent = `${Math.round(e.data.width)} × ${Math.round(e.data.height)}`;
  }
});

previewEl.addEventListener('load', () => {
  setTimeout(applyAnimState, 200);
});

if (window.visualViewport) {
  window.visualViewport.addEventListener('scroll', () => {
    if (window.visualViewport.offsetTop === 0 && Math.abs(window.scrollY) > 1) {
      window.scrollTo(0, 0);
    }
  });
}

/* 窗口尺寸变化时关闭菜单，避免错位 */
window.addEventListener('resize', () => {
  closeAllMenus();
});

function init() {
  editor = CodeMirror.fromTextArea($('code'), {
    mode: 'javascript',
    theme: 'material-darker',
    lineNumbers: true,
    indentUnit: 2,
    tabSize: 2,
    lineWrapping: false,
    autofocus: false
  });
  editor.setSize('100%', '100%');

  const savedCode = loadDraft();
  editor.setValue(savedCode != null ? savedCode : buildTemplate());

  let inputTimer = 0;
  editor.on('change', () => {
    clearTimeout(inputTimer);
    inputTimer = setTimeout(() => {
      saveDraft();
      schedulePreview();
    }, 500);
  });

  try {
    const v = parseFloat(localStorage.getItem(SPLIT_KEY));
    if (isFinite(v) && v > 0.1 && v < 0.9) splitRatio = v;
  } catch (_) {}

  try {
    const bg = localStorage.getItem(BG_KEY);
    if (bg === 'checker' || bg === 'white' || bg === 'dark') previewBg = bg;
  } catch (_) {}

  applySplit();
  setPreviewBg(previewBg);
  updateAnimIcon();
  updatePreview();

  blurEditor();
}

init();

})();
</script>
</body>
</html>
