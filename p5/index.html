<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
<title>p5.js编辑器</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/theme/material-darker.min.css" />
<style>
:root {
  --bg: #f8fafc; --panel: #ffffff;
  --border: #e2e8f0; --border-hover: #cbd5e1;
  --text: #0f172a; --text-dim: #64748b; --text-muted: #94a3b8;
  --accent: #2563eb; --accent-hover: #1d4ed8;
  --hover: #f1f5f9; --active: #e2e8f0;
  --splitter-bg: #f1f5f9; --grip: #cbd5e1; --grip-hover: #94a3b8;
  --shadow-sm: 0 2px 8px rgba(15,23,42,.08);
  --ed-bg: #0f172a;
}
*,*::before,*::after { box-sizing: border-box; }

html {
  height: 100%;
  touch-action: pan-x pan-y;
  -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
}
body {
  margin: 0; height: 100%;
  font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text);
  font-size: 13px; overflow: hidden;
  -webkit-font-smoothing: antialiased;
  touch-action: pan-x pan-y;
}

.app {
  display: flex; flex-direction: column;
  width: 100%; height: 100vh; height: 100dvh;
  position: relative;
}

.preview-wrap {
  flex: 80 1 0; min-height: 80px;
  position: relative; overflow: hidden;
  background: #f1f5f9;
  touch-action: pan-x pan-y;
  user-select: none; -webkit-user-select: none;
  transition: background-color .2s;
}
.preview-wrap.bg-checker {
  background-color: #f8fafc;
  background-image:
    linear-gradient(45deg, #e2e8f0 25%, transparent 25%),
    linear-gradient(-45deg, #e2e8f0 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #e2e8f0 75%),
    linear-gradient(-45deg, transparent 75%, #e2e8f0 75%);
  background-size: 16px 16px;
  background-position: 0 0, 0 8px, 8px -8px, -8px 0;
}
.preview-wrap.bg-white { background: #ffffff; }
.preview-wrap.bg-dark { background: #0f172a; }

.preview-stage {
  position: absolute; inset: 0;
  transform-origin: center center;
  will-change: transform;
}
.preview-stage iframe {
  display: block; width: 100%; height: 100%;
  border: 0; background: transparent;
  pointer-events: auto;
}

.preview-menu-wrap {
  position: absolute;
  top: 14px; right: 14px;
  z-index: 10;
}
.preview-menu-btn {
  width: 32px; height: 32px;
  display: grid; place-items: center;
  font-family: inherit; font-size: 18px; font-weight: 700;
  letter-spacing: 2px; line-height: 1;
  color: var(--text-dim);
  background: rgba(255,255,255,.94);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: var(--shadow-sm);
  backdrop-filter: blur(8px);
  cursor: pointer; touch-action: manipulation;
  transition: background .14s, color .14s;
}
.preview-menu-btn:hover { background: var(--hover); color: var(--text); }
.preview-menu-wrap .menu {
  top: calc(100% + 6px);
  left: auto; right: 0;
}

/* 预览过期角标 */
.stale-badge {
  position: absolute;
  top: 14px; left: 14px;
  z-index: 9;
  padding: 5px 11px;
  font-size: 11.5px; font-weight: 600;
  color: #92400e;
  background: rgba(254, 243, 199, .94);
  border: 1px solid #fcd34d;
  border-radius: 999px;
  cursor: pointer;
  backdrop-filter: blur(8px);
  box-shadow: var(--shadow-sm);
  touch-action: manipulation;
  user-select: none; -webkit-user-select: none;
}
.stale-badge:hover { background: #fef3c7; }
.stale-badge[hidden] { display: none; }

.menu__item.is-recording { color: #dc2626; }
.menu__item.is-ready { color: var(--accent); font-weight: 600; }

.menu__item .wrap-check {
  color: #16a34a;
  font-weight: 700;
  margin-left: 2px;
}

.menu__item.ai-item { color: var(--accent); font-weight: 600; }

.menu__sep {
  height: 1px;
  background: var(--border);
  margin: 4px 2px;
}

.view-controls {
  position: absolute; left: 14px; bottom: 12px; z-index: 8;
  display: flex; align-items: center; gap: 8px;
  padding: 6px 10px;
  background: rgba(255,255,255,.94);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: var(--shadow-sm);
  backdrop-filter: blur(8px);
}
.bg-switcher { display: flex; gap: 4px; }
.bg-btn {
  width: 20px; height: 20px; padding: 0;
  border: 1px solid var(--border-hover);
  border-radius: 4px; cursor: pointer;
  touch-action: manipulation;
  transition: box-shadow .14s, border-color .14s;
}
.bg-btn[data-bg="checker"] {
  background-image:
    linear-gradient(45deg, #cbd5e1 25%, transparent 25%),
    linear-gradient(-45deg, #cbd5e1 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #cbd5e1 75%),
    linear-gradient(-45deg, transparent 75%, #cbd5e1 75%);
  background-size: 8px 8px;
  background-position: 0 0, 0 4px, 4px -4px, -4px 0;
  background-color: #f8fafc;
}
.bg-btn[data-bg="white"] { background: #fff; }
.bg-btn[data-bg="dark"] { background: #1e293b; border-color: #334155; }
.bg-btn.is-active {
  box-shadow: 0 0 0 2px var(--accent);
  border-color: var(--accent);
}
.view-controls__sep {
  width: 1px; height: 18px;
  background: var(--border);
  margin: 0 2px;
}

.zoom-btn {
  min-width: 26px; height: 26px; padding: 0 6px;
  display: grid; place-items: center;
  font-family: inherit; font-size: 14px; font-weight: 600;
  color: var(--text-dim);
  background: transparent; border: 0; border-radius: 5px;
  cursor: pointer; touch-action: manipulation;
  transition: background .14s, color .14s;
}
.zoom-btn:hover { background: var(--hover); color: var(--text); }
.zoom-btn:disabled { opacity: .4; cursor: not-allowed; }
.zoom-label {
  min-width: 48px; height: 26px; padding: 0 4px;
  font-family: inherit; font-size: 11.5px; font-weight: 600;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
  background: transparent; border: 0; border-radius: 5px;
  cursor: pointer; touch-action: manipulation;
}
.zoom-label:hover { background: var(--hover); color: var(--text); }

.splitter {
  flex: 0 0 34px;
  display: flex; align-items: center;
  padding: 0 8px;
  background: var(--splitter-bg);
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  user-select: none; -webkit-user-select: none;
  position: relative; z-index: 20;
  touch-action: none;
}
.tool-group { flex: 0 0 auto; display: flex; align-items: center; gap: 2px; }
.tool-group--left, .tool-group--right { position: relative; }

.tool-center {
  flex: 1 1 auto; min-width: 60px;
  display: flex; align-items: center; justify-content: center;
  position: relative;
}
.tool-btn {
  flex: 0 0 auto;
  min-width: 28px; height: 24px;
  display: grid; place-items: center;
  padding: 0 8px;
  font-family: inherit; font-size: 12px; font-weight: 500;
  color: var(--text-dim);
  background: transparent; border: 1px solid transparent; border-radius: 5px;
  cursor: pointer; touch-action: manipulation;
  transition: background .14s, color .14s, border-color .14s;
}
.tool-btn:hover { color: var(--text); background: var(--active); }
.tool-btn:active:not(:disabled) { transform: scale(.94); }
.tool-btn.primary { color: #fff; background: var(--accent); border-color: var(--accent); }
.tool-btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

/* 中央运行按钮 */
.tool-btn.anim-btn {
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  z-index: 2;
  margin: 0;
  color: var(--accent);
  background: var(--splitter-bg);
}
.tool-btn.anim-btn:hover { background: var(--active); color: var(--accent); }
.tool-btn.anim-btn:active:not(:disabled) { transform: translate(-50%, -50%) scale(.94); }
.tool-btn.anim-btn.spinning svg {
  animation: runSpin .5s ease;
}
@keyframes runSpin {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}

.menu-btn {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 2px;
  line-height: 1;
  padding: 0 4px;
}
/* 菜单限制高度防止溢出视口 */
.menu {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  min-width: 130px;
  max-height: calc(100vh - 120px);
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 4px;
  display: flex; flex-direction: column; gap: 2px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: 0 8px 24px rgba(15,23,42,.18);
  z-index: 30;
}
.tool-group--right .menu { left: auto; right: 0; }
.menu[hidden] { display: none; }
.menu__item {
  width: 100%;
  padding: 8px 12px;
  text-align: left;
  font-family: inherit; font-size: 12.5px; color: var(--text);
  background: transparent; border: 0; border-radius: 5px;
  cursor: pointer; touch-action: manipulation;
  transition: background .14s;
}
.menu__item:hover { background: var(--hover); }
.menu__item:active { background: var(--active); }
.menu__item[disabled] { opacity: .5; cursor: not-allowed; }
.menu__item.danger { color: #dc2626; }
.menu__item.danger:hover { background: #fef2f2; }

.splitter-grip {
  flex: 1 1 auto; min-width: 20px; height: 100%;
  cursor: ns-resize; touch-action: none; position: relative;
}

.editor-wrap {
  flex: 20 1 0; min-height: 100px;
  position: relative; overflow: hidden;
  background: var(--ed-bg);
}
.CodeMirror {
  height: 100% !important;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 13px; line-height: 1.55;
  touch-action: pan-x pan-y;
}
.CodeMirror-scroll,
.CodeMirror-lines,
.CodeMirror textarea {
  touch-action: pan-x pan-y;
}
.editor-wrap[hidden] { display: none !important; }

/* toast 避开 iPhone 底部安全区 */
.toast {
  position: fixed; left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  transform: translate(-50%, 14px);
  padding: 10px 18px; border-radius: 999px;
  background: rgba(15,23,42,.94); color: #f8fafc;
  font-size: 13px; text-align: center;
  opacity: 0; pointer-events: none;
  transition: opacity .22s, transform .22s;
  z-index: 999;
}
.toast.is-show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 720px) {
  .splitter { flex-basis: 32px; padding: 0 4px; }
  .tool-btn { min-width: 26px; height: 22px; font-size: 11.5px; padding: 0 6px; }
  .menu-btn { font-size: 16px; }
  .menu { min-width: 120px; }

  .CodeMirror { font-size: 14px; }

  .view-controls { left: 8px; bottom: 8px; gap: 4px; padding: 4px 6px; }
  .zoom-label { min-width: 54px; height: 26px; font-size: 11.5px; }
  .zoom-btn { min-width: 26px; height: 26px; font-size: 13px; }
  .bg-btn { width: 18px; height: 18px; }
  .preview-menu-wrap { top: 8px; right: 8px; }
  .preview-menu-btn { width: 28px; height: 28px; font-size: 16px; }
  .stale-badge { top: 8px; left: 8px; font-size: 11px; padding: 4px 9px; }
}
</style>
</head>
<body>

<div class="app" id="app">
  <section class="preview-wrap bg-checker" id="previewWrap">
    <div class="preview-stage" id="previewStage">
      <iframe id="preview" sandbox="allow-scripts allow-same-origin" title="p5.js 预览"></iframe>
    </div>

    <!-- 自动预览关闭时提示"预览未更新" -->
    <div class="stale-badge" id="staleBadge" role="button" tabindex="0" title="点击运行最新代码" hidden>预览未更新，点击运行</div>

    <!-- 右上角菜单 -->
    <div class="preview-menu-wrap">
      <button class="preview-menu-btn" id="btnPreviewMenu" type="button" title="更多" aria-label="更多" aria-haspopup="true" aria-expanded="false">⋯</button>
      <div class="menu" id="previewMenu" hidden>
        <button class="menu__item" id="btnSave" type="button">保存 HTML</button>
        <button class="menu__item" id="btnSavePNG" type="button">保存 PNG</button>
        <div class="menu__sep"></div>
        <button class="menu__item" id="btnRecordMP4" type="button">录制 MP4</button>
      </div>
    </div>

    <div class="view-controls">
      <div class="bg-switcher" role="group" aria-label="预览背景">
        <button class="bg-btn is-active" data-bg="checker" type="button" title="棋盘格背景" aria-label="棋盘格背景"></button>
        <button class="bg-btn" data-bg="white" type="button" title="白色背景" aria-label="白色背景"></button>
        <button class="bg-btn" data-bg="dark" type="button" title="深色背景" aria-label="深色背景"></button>
      </div>
      <span class="view-controls__sep"></span>
      <button class="zoom-btn" id="zoomOut" type="button" title="缩小" aria-label="缩小">−</button>
      <button class="zoom-label" id="zoomReset" type="button" title="重置为 100%">100%</button>
      <button class="zoom-btn" id="zoomIn" type="button" title="放大" aria-label="放大">+</button>
    </div>
  </section>

  <div class="splitter" id="splitter">
    <!-- 左侧"⋯"菜单，AI 助手入口 -->
    <div class="tool-group tool-group--left">
      <button class="tool-btn menu-btn" id="btnMenuLeft" type="button" title="菜单" aria-label="菜单" aria-haspopup="true" aria-expanded="false">⋯</button>
      <div class="menu" id="menuLeft" hidden>
        <button class="menu__item ai-item" id="btnAI" type="button">✦ AI 助手（即将推出）</button>
      </div>
    </div>
    <div class="tool-center">
      <div class="splitter-grip" id="splitterGrip" title="拖动调整布局 · 双击恢复默认"></div>
      <button class="tool-btn anim-btn" id="btnRun" type="button" title="运行代码" aria-label="运行代码">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.73 10.06l-1.95-.5A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"
                fill="currentColor"/>
        </svg>
      </button>
    </div>
    <!-- 右侧：编辑菜单 -->
    <div class="tool-group tool-group--right">
      <button class="tool-btn menu-btn" id="btnMenuRight" type="button" title="菜单" aria-label="菜单" aria-haspopup="true" aria-expanded="false">⋯</button>
      <div class="menu" id="menuRight" hidden>
        <button class="menu__item" id="btnReset" type="button">重置</button>
        <button class="menu__item" id="btnFormat" type="button">格式化代码</button>
        <div class="menu__sep"></div>
        <button class="menu__item" id="btnWrapToggle" type="button">自动换行</button>
        <button class="menu__item" id="btnAutoPreviewToggle" type="button">自动预览 <span class="wrap-check">✓</span></button>
        <div class="menu__sep"></div>
        <button class="menu__item" id="btnLayoutDefault" type="button">恢复默认布局</button>
        <button class="menu__item" id="btnLayoutCodeMax" type="button">代码最大化</button>
        <button class="menu__item" id="btnLayoutPreviewMax" type="button">预览最大化</button>
        <div class="menu__sep"></div>
        <button class="menu__item danger" id="btnClearCode" type="button">清空代码</button>
      </div>
    </div>
  </div>

  <section class="editor-wrap" id="editorWrap">
    <textarea id="code"></textarea>
  </section>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-beautify@1.15.1/js/lib/beautify.min.js"></script>
<script>
(function () {
'use strict';

const P5_CDN = 'https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js';
const DRAFT_KEY = 'p5-editor.draft.v2';
const SPLIT_KEY = 'p5-editor.split.v1';
const BG_KEY = 'p5-editor.bg.v1';
const WRAP_KEY = 'p5-editor.wrap.v1';
const AUTO_PREVIEW_KEY = 'p5-editor.autopreview.v1';

const $ = id => document.getElementById(id);
const appEl = $('app');
const previewWrap = $('previewWrap');
const previewStage = $('previewStage');
const previewEl = $('preview');
const splitterEl = $('splitter');
const splitterGrip = $('splitterGrip');
const editorWrap = $('editorWrap');
const toastEl = $('toast');
const staleBadge = $('staleBadge');
const btnSave = $('btnSave');
const btnReset = $('btnReset');
const btnFormat = $('btnFormat');
const btnWrapToggle = $('btnWrapToggle');
const btnAutoPreviewToggle = $('btnAutoPreviewToggle');
const btnClearCode = $('btnClearCode');
const btnMenuRight = $('btnMenuRight');
const btnMenuLeft = $('btnMenuLeft');
const menuLeft = $('menuLeft');
const btnPreviewMenu = $('btnPreviewMenu');
const btnSavePNG = $('btnSavePNG');
const btnRecordMP4 = $('btnRecordMP4');
const menuRight = $('menuRight');
const previewMenu = $('previewMenu');
const zoomInBtn = $('zoomIn');
const zoomOutBtn = $('zoomOut');
const zoomResetBtn = $('zoomReset');
const btnRun = $('btnRun');
const btnAI = $('btnAI');
const btnLayoutDefault = $('btnLayoutDefault');
const btnLayoutCodeMax = $('btnLayoutCodeMax');
const btnLayoutPreviewMax = $('btnLayoutPreviewMax');
const bgBtns = Array.from(document.querySelectorAll('.bg-btn'));

let editor = null;
let renderTimer = null;
let inputTimer = 0;
let toastTimer = null;

let stageScale = 1, stagePanX = 0, stagePanY = 0;

// splitRatio = 预览区占比
// 0 = 代码最大化；1 = 预览最大化；0.8 = 默认
let splitRatio = 0.8;
let lastEditorVisible = true;

let previewBg = 'checker';
let wrapEnabled = false;
let autoPreviewEnabled = true;

let isRecording = false;
let pendingRecord = null;

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('is-show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('is-show'), 2200);
}
const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

function blurEditor() {
  if (!editor) return;
  try {
    const input = editor.getInputField();
    if (input && document.activeElement === input) input.blur();
  } catch (_) {}
}

function blurActiveElement() {
  const ae = document.activeElement;
  if (ae && ae !== document.body) {
    try { ae.blur(); } catch (_) {}
  }
  blurEditor();
}

function timestampFilename(prefix, ext) {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${prefix}_${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.${ext}`;
}

function buildTemplate() {
  return `function setup() {
  createCanvas(windowWidth, windowHeight);
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  pixelDensity(Math.min(window.devicePixelRatio || 1, 2));
}

function draw() {
  clear();
}
`;
}

/* 转义用户代码中的 script 闭合标签，防止 srcdoc 提前截断 */
function escapeUserCode(code) {
  return String(code).replace(/<\/script/gi, '<\\/script');
}

function buildRuntimeHTML(userCode) {
  const safeCode = escapeUserCode(userCode);
  return `<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>p5.js Sketch</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:transparent; touch-action:none; }
  canvas { display:block; touch-action:none; }
</style>
<script src="${P5_CDN}" onerror="try{parent.postMessage({type:'p5-error',message:'p5.js 加载失败，请检查网络'},'*')}catch(_){}"><\/script>
</head>
<body>
<script>
${safeCode}

var _recorder = null;
var _chunks = [];
var _recordMime = '';

function _startRecording() {
  var canvas = document.querySelector('canvas');
  if (!canvas) {
    parent.postMessage({ type: 'record-error', message: '画布尚未就绪' }, '*');
    return;
  }
  if (!canvas.captureStream || typeof MediaRecorder === 'undefined') {
    parent.postMessage({ type: 'record-error', message: '此浏览器不支持录制' }, '*');
    return;
  }
  var candidates = [
    'video/mp4;codecs=avc1',
    'video/mp4',
    'video/webm;codecs=vp9',
    'video/webm;codecs=vp8',
    'video/webm'
  ];
  var mime = '';
  for (var i = 0; i < candidates.length; i++) {
    if (MediaRecorder.isTypeSupported(candidates[i])) { mime = candidates[i]; break; }
  }
  if (!mime) {
    parent.postMessage({ type: 'record-error', message: '无可用编码格式' }, '*');
    return;
  }
  _chunks = [];
  _recordMime = mime;
  var stream;
  try {
    stream = canvas.captureStream(30);
    _recorder = new MediaRecorder(stream, { mimeType: mime });
  } catch (err) {
    parent.postMessage({ type: 'record-error', message: '创建录制器失败：' + err.message }, '*');
    return;
  }
  _recorder.ondataavailable = function (ev) {
    if (ev.data && ev.data.size > 0) _chunks.push(ev.data);
  };
  _recorder.onstop = function () {
    var isMP4 = _recordMime.indexOf('mp4') >= 0;
    var blob = new Blob(_chunks, { type: _recordMime });
    blob.arrayBuffer().then(function (buf) {
      try {
        parent.postMessage({ type: 'record-done', buffer: buf, isMP4: isMP4 }, '*', [buf]);
      } catch (_) {
        parent.postMessage({ type: 'record-done', buffer: buf, isMP4: isMP4 }, '*');
      }
    });
    try { stream.getTracks().forEach(function (t) { t.stop(); }); } catch (_) {}
  };
  _recorder.start();
  parent.postMessage({ type: 'record-started' }, '*');
}

function _stopRecording() {
  if (_recorder && _recorder.state !== 'inactive') {
    try { _recorder.stop(); } catch (_) {}
  }
}

window.addEventListener('message', function (e) {
  var cmd = e.data && e.data.type;
  try {
    if (cmd === 'record-start') {
      _startRecording();
    } else if (cmd === 'record-stop') {
      _stopRecording();
    }
  } catch (_) {}
});

/* 手势：pinch 缩放 + 平移 + Ctrl/⌘+wheel + Alt/中键拖拽 */
var _pinchState = null;
var _panState = null;

function _dist(a, b) {
  var dx = a.clientX - b.clientX, dy = a.clientY - b.clientY;
  return Math.sqrt(dx * dx + dy * dy);
}

document.addEventListener('touchstart', function (e) {
  if (e.touches.length === 2) {
    _pinchState = {
      dist: _dist(e.touches[0], e.touches[1]),
      cx: (e.touches[0].clientX + e.touches[1].clientX) / 2,
      cy: (e.touches[0].clientY + e.touches[1].clientY) / 2
    };
  } else {
    _pinchState = null;
  }
}, { passive: true, capture: true });

document.addEventListener('touchmove', function (e) {
  if (e.touches.length === 2 && _pinchState) {
    var dist = _dist(e.touches[0], e.touches[1]);
    var cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    var cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    var scaleFactor = _pinchState.dist > 0 ? (dist / _pinchState.dist) : 1;
    var dcx = cx - _pinchState.cx;
    var dcy = cy - _pinchState.cy;
    try {
      parent.postMessage({
        type: 'gesture-pinch',
        scaleFactor: scaleFactor,
        cx: cx, cy: cy, dcx: dcx, dcy: dcy
      }, '*');
    } catch (_) {}
    _pinchState.dist = dist;
    _pinchState.cx = cx;
    _pinchState.cy = cy;
    e.preventDefault();
    e.stopPropagation();
  }
}, { passive: false, capture: true });

document.addEventListener('touchend', function (e) {
  if (e.touches.length < 2) _pinchState = null;
}, { passive: true, capture: true });
document.addEventListener('touchcancel', function () { _pinchState = null; }, { passive: true, capture: true });

document.addEventListener('wheel', function (e) {
  if (e.ctrlKey || e.metaKey) {
    e.preventDefault();
    try {
      parent.postMessage({ type: 'gesture-wheel', deltaY: e.deltaY, x: e.clientX, y: e.clientY }, '*');
    } catch (_) {}
  }
}, { passive: false, capture: true });

document.addEventListener('pointerdown', function (e) {
  var wantPan = (e.button === 1) || (e.button === 0 && e.altKey);
  if (wantPan) {
    _panState = { x: e.clientX, y: e.clientY };
    e.preventDefault();
    try { if (e.target && e.target.setPointerCapture) e.target.setPointerCapture(e.pointerId); } catch (_) {}
  }
}, { passive: false, capture: true });

document.addEventListener('pointermove', function (e) {
  if (_panState) {
    var dx = e.clientX - _panState.x;
    var dy = e.clientY - _panState.y;
    _panState.x = e.clientX;
    _panState.y = e.clientY;
    try { parent.postMessage({ type: 'gesture-pan', dx: dx, dy: dy }, '*'); } catch (_) {}
    e.preventDefault();
  }
}, { passive: false, capture: true });

document.addEventListener('pointerup', function () { _panState = null; }, { capture: true });
document.addEventListener('pointercancel', function () { _panState = null; }, { capture: true });

['gesturestart', 'gesturechange', 'gestureend'].forEach(function (evt) {
  document.addEventListener(evt, function (e) { e.preventDefault(); }, { passive: false });
});
document.addEventListener('touchmove', function (e) {
  if (e.touches.length > 1) e.preventDefault();
}, { passive: false });
document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
<\/script>
</body>
</html>`;
}

function applyStageTransform() {
  previewStage.style.transform =
    `translate(${stagePanX}px, ${stagePanY}px) scale(${stageScale})`;
  zoomResetBtn.textContent = Math.round(stageScale * 100) + '%';
}

function zoomAt(factor, localX, localY) {
  const rect = previewWrap.getBoundingClientRect();
  const newScale = clamp(stageScale * factor, 0.25, 8);
  if (newScale === stageScale) return;
  const ratio = newScale / stageScale;
  const relX = localX - rect.width / 2 - stagePanX;
  const relY = localY - rect.height / 2 - stagePanY;
  stagePanX = localX - rect.width / 2 - relX * ratio;
  stagePanY = localY - rect.height / 2 - relY * ratio;
  stageScale = newScale;
  applyStageTransform();
}
function zoomByButton(factor) {
  const rect = previewWrap.getBoundingClientRect();
  zoomAt(factor, rect.width / 2, rect.height / 2);
}

function formatCode() {
  if (typeof js_beautify === 'undefined') {
    showToast('格式化库未加载，请检查网络');
    return;
  }
  try {
    const code = editor.getValue();
    const formatted = js_beautify(code, {
      indent_size: 2,
      indent_char: ' ',
      preserve_newlines: true,
      max_preserve_newlines: 2,
      end_with_newline: true,
      wrap_line_length: 0
    });
    if (formatted === code) { return; }
    const lastLine = editor.lastLine();
    const lastCh = editor.getLine(lastLine).length;
    const cur = editor.getCursor();
    editor.operation(() => {
      editor.replaceRange(formatted, { line: 0, ch: 0 }, { line: lastLine, ch: lastCh });
      const newLastLine = editor.lastLine();
      const safeLine = Math.min(cur.line, newLastLine);
      const safeCh = Math.min(cur.ch, editor.getLine(safeLine).length);
      editor.setCursor({ line: safeLine, ch: safeCh });
    });
    saveDraft();
  } catch (err) {
    showToast('格式化失败：' + (err && err.message || '未知错误'));
  }
}

function clearCode() {
  if (isRecording) { showToast('录制中，无法清空'); return; }
  if (!editor) return;
  const lastLine = editor.lineCount() - 1;
  if (lastLine === 0 && editor.getLine(0) === '') {
    return;
  }
  const lastCh = editor.getLine(lastLine).length;
  editor.replaceRange('', { line: 0, ch: 0 }, { line: lastLine, ch: lastCh });
}

/* Safari 修复：必须在用户手势同步栈内触发下载。
   异步 toBlob 回调会丢失手势上下文，Safari 会拦截下载。
   因此使用同步 toDataURL，在 click handler 内立即触发 <a download>。 */
function capturePNG() {
  let canvas = null;
  try {
    const doc = previewEl.contentDocument;
    if (doc) canvas = doc.querySelector('canvas');
  } catch (_) {}
  if (!canvas) { showToast('无法获取画布，请稍后重试'); return; }
  const filename = timestampFilename('sketch', 'png');
  try {
    const url = canvas.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.rel = 'noopener';
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  } catch (err) {
    showToast('保存 PNG 失败：' + (err && err.message || '未知错误'));
  }
}

function legacyDownload(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.rel = 'noopener';
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

function guessMime(filename, fallback) {
  const ext = String(filename).split('.').pop().toLowerCase();
  const map = {
    html: 'text/html',
    htm: 'text/html',
    mp4: 'video/mp4',
    webm: 'video/webm',
    png: 'image/png',
    jpg: 'image/jpeg',
    jpeg: 'image/jpeg'
  };
  return map[ext] || fallback || 'application/octet-stream';
}

function shareOrDownload(blob, filename, onDone) {
  const mime = blob.type && blob.type.indexOf('application/octet-stream') === -1
    ? blob.type
    : guessMime(filename, blob.type);
  let file = null;
  try {
    file = new File([blob], filename, { type: mime });
  } catch (_) {}

  const canShareFiles = !!(file && navigator.share && navigator.canShare &&
                          navigator.canShare({ files: [file] }));

  if (canShareFiles) {
    navigator.share({ files: [file] })
      .then(() => { onDone && onDone('shared'); })
      .catch(err => {
        if (err && err.name === 'AbortError') {
          onDone && onDone('cancelled');
          return;
        }
        try {
          legacyDownload(blob, filename);
          onDone && onDone('downloaded');
        } catch (_) {
          onDone && onDone('failed', err);
        }
      });
    return;
  }

  legacyDownload(blob, filename);
  onDone && onDone('downloaded');
}

function saveHTML() {
  const code = editor.getValue();
  const html = buildRuntimeHTML(code);
  const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  const filename = timestampFilename('sketch', 'html');
  shareOrDownload(blob, filename, (result, err) => {
    // 保存成功不提示；仅失败时反馈
    if (result === 'failed') {
      showToast('保存失败，请重试' + (err && err.message ? '：' + err.message : ''));
    }

}

/* ===== 分栏布局 =====
   splitRatio: 0 = 代码最大化；1 = 预览最大化；0.8 = 默认 */
function applySplit() {
  const EPS = 0.0001;
  const dragging = splitDragging;
  const previewHidden = !dragging && splitRatio <= EPS;
  const editorHidden = !dragging && splitRatio >= 1 - EPS;

  if (previewHidden) {
    previewWrap.style.flex = '0 0 0px';
    previewWrap.style.minHeight = '0';
    editorWrap.style.flex = '1 1 0';
    editorWrap.style.minHeight = '100px';
    editorWrap.style.overflow = '';
  } else if (editorHidden) {
    previewWrap.style.flex = '1 1 0';
    previewWrap.style.minHeight = '80px';
    editorWrap.style.flex = '0 0 0px';
    editorWrap.style.minHeight = '0';
    editorWrap.style.overflow = 'hidden';
  } else {
    const minP = dragging ? 0 : 80;
    const minE = dragging ? 0 : 100;
    previewWrap.style.flex = (splitRatio * 100) + ' 1 0';
    previewWrap.style.minHeight = minP + 'px';
    editorWrap.style.flex = ((1 - splitRatio) * 100) + ' 1 0';
    editorWrap.style.minHeight = minE + 'px';
    editorWrap.style.overflow = '';
  }

  const visible = !editorHidden;
  if (editor && visible !== lastEditorVisible) {
    lastEditorVisible = visible;
    if (visible) requestAnimationFrame(() => { try { editor.refresh(); } catch (_) {} });
  }
}

function refreshEditorSoon() {
  if (editor) requestAnimationFrame(() => { try { editor.refresh(); } catch (_) {} });
}

let splitDragging = false, splitMoved = false;
let splitStartY = 0, splitStartH = 0;
let lastDownTime = 0, lastDownY = 0;
const DBLCLICK_MS = 350, DBLCLICK_DIST = 10;

function onSplitDown(e) {
  if (e.target.closest('.tool-btn, .menu, .menu__item')) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const now = Date.now();
  if (now - lastDownTime < DBLCLICK_MS && Math.abs(e.clientY - lastDownY) < DBLCLICK_DIST) {
    // 双击任意位置 → 恢复 0.8
    lastDownTime = 0; lastDownY = 0; splitDragging = false;
    splitRatio = 0.8;
    applySplit();
    refreshEditorSoon();
    return;
  }
  lastDownTime = now; lastDownY = e.clientY;
  splitDragging = true; splitMoved = false;
  splitStartY = e.clientY;
  splitStartH = previewWrap.getBoundingClientRect().height;
  try { splitterEl.setPointerCapture(e.pointerId); } catch (_) {}
  document.body.style.cursor = 'ns-resize';
  document.body.style.userSelect = 'none';
}

function onSplitMove(e) {
  if (!splitDragging) return;
  const dy = e.clientY - splitStartY;
  if (!splitMoved && Math.abs(dy) < 3) return;
  splitMoved = true;
  const appRect = appEl.getBoundingClientRect();
  const splitterH = splitterEl.getBoundingClientRect().height;
  const totalH = appRect.height - splitterH;
  const ratio = clamp((splitStartH + dy) / totalH, 0, 1);
  splitRatio = ratio;
  applySplit();
}

function onSplitUp(e) {
  if (!splitDragging) return;
  splitDragging = false;
  try { splitterEl.releasePointerCapture(e.pointerId); } catch (_) {}
  document.body.style.cursor = '';
  document.body.style.userSelect = '';
  if (splitMoved) {
    lastDownTime = 0; lastDownY = 0; splitMoved = false;
    // 双向吸附
    if (splitRatio <= 0.10) {
      splitRatio = 0;
      applySplit();
    } else if (splitRatio >= 0.90) {
      splitRatio = 1;
      applySplit();
    }
    refreshEditorSoon();
  }
}
splitterEl.addEventListener('pointerdown', onSplitDown);
splitterEl.addEventListener('pointermove', onSplitMove);
splitterEl.addEventListener('pointerup', onSplitUp);
splitterEl.addEventListener('pointercancel', onSplitUp);

function installDoubleTapGuard(el, opts) {

window.addEventListener('message', e => {
  const d = e.data;
  if (!d) return;
  // 仅信任来自本 iframe 的消息
  if (e.source !== previewEl.contentWindow) return;

  if (d.type === 'outside-click') {

  if (d.type === 'p5-error') {
    showToast(d.message || 'p5.js 加载失败');

  }

  if (d.type === 'gesture-pinch') {
    const W = previewWrap.clientWidth;
    const H = previewWrap.clientHeight;
    stagePanX += (d.dcx || 0) * stageScale;
    stagePanY += (d.dcy || 0) * stageScale;
    if (d.scaleFactor && d.scaleFactor !== 1) {
      const px = W / 2 + stagePanX + (d.cx - W / 2) * stageScale;
      const py = H / 2 + stagePanY + (d.cy - H / 2) * stageScale;
      zoomAt(d.scaleFactor, px, py);
    } else {
      applyStageTransform();
    }
    return;
  }
  if (d.type === 'gesture-wheel') {
    const W = previewWrap.clientWidth;
    const H = previewWrap.clientHeight;
    const px = W / 2 + stagePanX + (d.x - W / 2) * stageScale;
    const py = H / 2 + stagePanY + (d.y - H / 2) * stageScale;
    zoomAt(d.deltaY < 0 ? 1.1 : (1 / 1.1), px, py);
    return;
  }
  if (d.type === 'gesture-pan') {
    stagePanX += (d.dx || 0) * stageScale;
    stagePanY += (d.dy || 0) * stageScale;
    applyStageTransform();
    return;
  }

  if (d.type === 'record-started') {
    isRecording = true;
    setEditorReadOnly(true);
    updateRecordButton();
    showToast('开始录制…');
  } else if (d.type === 'record-done') {
    isRecording = false;
    setEditorReadOnly(false);
    const isMP4 = !!d.isMP4;
    const blob = new Blob([d.buffer], { type: isMP4 ? 'video/mp4' : 'video/webm' });
    const filename = timestampFilename('sketch', isMP4 ? 'mp4' : 'webm');

    shareOrDownload(blob, filename, (result) => {
      if (result === 'shared' || result === 'downloaded') {
        pendingRecord = null;
        updateRecordButton();
        // 保存成功不提示
      } else {
        pendingRecord = { blob, isMP4, filename };
        updateRecordButton();
        if (result === 'failed') {
          showToast('请点击「' + (isMP4 ? '下载 MP4' : '下载 WebM') + '」保存');
        }
        // 取消静默，pendingRecord 保留，可点击按钮再下载
      }
    });
  } else if (d.type === 'record-error') {
    isRecording = false;
    setEditorReadOnly(false);
    updateRecordButton();
    showToast('录制失败：' + (d.message || '未知错误'));
  }
});

window.addEventListener('resize', () => { closeAllMenus(); });

function init() {
  editor = CodeMirror.fromTextArea($('code'), {
    mode: 'javascript',
    theme: 'material-darker',
    lineNumbers: true,
    indentUnit: 2,
    tabSize: 2,
    lineWrapping: false,
    autofocus: false
  });
  editor.setSize('100%', '100%');

  const cmWrapper = editor.getWrapperElement();
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(evt => {
    cmWrapper.addEventListener(evt, e => e.preventDefault(), { passive: false });
  });
  cmWrapper.addEventListener('touchmove', e => {
    if (e.touches.length > 1) e.preventDefault();
  }, { passive: false });

  try {
    if (localStorage.getItem(WRAP_KEY) === '1') wrapEnabled = true;
  } catch (_) {}
  editor.setOption('lineWrapping', wrapEnabled);
  updateWrapLabel();

  try {
    const v = localStorage.getItem(AUTO_PREVIEW_KEY);
    autoPreviewEnabled = (v !== '0');
  } catch (_) {}
  updateAutoPreviewLabel();

  const savedCode = loadDraft();
  editor.setValue(savedCode != null ? savedCode : buildTemplate());

  editor.on('change', () => {
    clearTimeout(inputTimer);
    inputTimer = setTimeout(() => {
      saveDraft();
      schedulePreview();
    }, 500);
  });

  try {
    const v = parseFloat(localStorage.getItem(SPLIT_KEY));
    if (isFinite(v) && v > 0.1 && v < 0.9) splitRatio = v;
  } catch (_) {}

  try {
    const bg = localStorage.getItem(BG_KEY);
    if (bg === 'checker' || bg === 'white' || bg === 'dark') previewBg = bg;
  } catch (_) {}

  applySplit();
  setPreviewBg(previewBg);
  updateRecordButton();
  updatePreview();

  blurEditor();
}

init();

})();
</script>
</body>
</html>
