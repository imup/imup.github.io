<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
<title>p5.js编辑器</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/theme/material-darker.min.css" />
<style>
:root {
  --bg: #f8fafc; --panel: #ffffff;
  --border: #e2e8f0; --border-hover: #cbd5e1;
  --text: #0f172a; --text-dim: #64748b; --text-muted: #94a3b8;
  --accent: #2563eb; --accent-hover: #1d4ed8;
  --hover: #f1f5f9; --active: #e2e8f0;
  --splitter-bg: #f1f5f9; --grip: #cbd5e1; --grip-hover: #94a3b8;
  --shadow-sm: 0 2px 8px rgba(15,23,42,.08);
  --ed-bg: #0f172a;
}
*,*::before,*::after { box-sizing: border-box; }

html {
  height: 100%;
  touch-action: pan-x pan-y;
  -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
}
body {
  margin: 0; height: 100%;
  font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text);
  font-size: 13px; overflow: hidden;
  -webkit-font-smoothing: antialiased;
  touch-action: pan-x pan-y;
}

.app {
  display: flex; flex-direction: column;
  width: 100%; height: 100vh; height: 100dvh;
  position: relative;
}

.preview-wrap {
  flex: 80 1 0; min-height: 0px;
  position: relative; overflow: hidden;
  background: #f1f5f9;
  touch-action: pan-x pan-y;
  user-select: none; -webkit-user-select: none;
  transition: background-color .2s;
}
.preview-wrap.bg-checker {
  background-color: #f8fafc;
  background-image:
    linear-gradient(45deg, #e2e8f0 25%, transparent 25%),
    linear-gradient(-45deg, #e2e8f0 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #e2e8f0 75%),
    linear-gradient(-45deg, transparent 75%, #e2e8f0 75%);
  background-size: 16px 16px;
  background-position: 0 0, 0 8px, 8px -8px, -8px 0;
}
.preview-wrap.bg-white { background: #ffffff; }
.preview-wrap.bg-dark { background: #0f172a; }

.preview-stage {
  position: absolute; inset: 0;
  transform-origin: center center;
  will-change: transform;
}
.preview-stage iframe {
  display: block; width: 100%; height: 100%;
  border: 0; background: transparent;
  pointer-events: auto;
}

.preview-menu-wrap {
  position: absolute;
  top: 14px; right: 14px;
  z-index: 10;
}
.preview-menu-btn {
  width: 32px; height: 32px;
  display: grid; place-items: center;
  font-family: inherit; font-size: 18px; font-weight: 700;
  letter-spacing: 2px; line-height: 1;
  color: var(--text-dim);
  background: rgba(255,255,255,.94);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: var(--shadow-sm);
  backdrop-filter: blur(8px);
  cursor: pointer; touch-action: manipulation;
  transition: background .14s, color .14s;
}
.preview-menu-btn:hover { background: var(--hover); color: var(--text); }
.preview-menu-wrap .menu {
  top: calc(100% + 6px);
  left: auto; right: 0;
}

.menu__item.is-recording { color: #dc2626; }
.menu__item.is-ready { color: var(--accent); font-weight: 600; }

.menu__item .wrap-check {
  color: #16a34a;
  font-weight: 700;
  margin-left: 2px;
}

.menu__sep {
  height: 1px;
  background: var(--border);
  margin: 4px 2px;
}

.view-controls {
  position: absolute; left: 14px; bottom: 12px; z-index: 8;
  display: flex; align-items: center; gap: 8px;
  padding: 6px 10px;
  background: rgba(255,255,255,.94);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: var(--shadow-sm);
  backdrop-filter: blur(8px);
}
.bg-switcher { display: flex; gap: 4px; }
.bg-btn {
  width: 20px; height: 20px; padding: 0;
  border: 1px solid var(--border-hover);
  border-radius: 4px; cursor: pointer;
  touch-action: manipulation;
  transition: box-shadow .14s, border-color .14s;
}
.bg-btn[data-bg="checker"] {
  background-image:
    linear-gradient(45deg, #cbd5e1 25%, transparent 25%),
    linear-gradient(-45deg, #cbd5e1 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #cbd5e1 75%),
    linear-gradient(-45deg, transparent 75%, #cbd5e1 75%);
  background-size: 8px 8px;
  background-position: 0 0, 0 4px, 4px -4px, -4px 0;
  background-color: #f8fafc;
}
.bg-btn[data-bg="white"] { background: #fff; }
.bg-btn[data-bg="dark"] { background: #1e293b; border-color: #334155; }
.bg-btn.is-active {
  box-shadow: 0 0 0 2px var(--accent);
  border-color: var(--accent);
}
.view-controls__sep {
  width: 1px; height: 18px;
  background: var(--border);
  margin: 0 2px;
}

.zoom-btn {
  min-width: 26px; height: 26px; padding: 0 6px;
  display: grid; place-items: center;
  font-family: inherit; font-size: 14px; font-weight: 600;
  color: var(--text-dim);
  background: transparent; border: 0; border-radius: 5px;
  cursor: pointer; touch-action: manipulation;
  transition: background .14s, color .14s;
}
.zoom-btn:hover { background: var(--hover); color: var(--text); }
.zoom-btn:disabled { opacity: .4; cursor: not-allowed; }
.zoom-label {
  min-width: 48px; height: 26px; padding: 0 4px;
  font-family: inherit; font-size: 11.5px; font-weight: 600;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
  background: transparent; border: 0; border-radius: 5px;
  cursor: pointer; touch-action: manipulation;
}
.zoom-label:hover { background: var(--hover); color: var(--text); }

.splitter {
  flex: 0 0 34px;
  display: flex; align-items: center;
  padding: 0 8px;
  background: var(--splitter-bg);
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  user-select: none; -webkit-user-select: none;
  position: relative; z-index: 20;
  touch-action: none;
}
.tool-group { flex: 0 0 auto; display: flex; align-items: center; gap: 2px; }
.tool-group--left, .tool-group--right { position: relative; }

.tool-center {
  flex: 1 1 auto; min-width: 60px;
  display: flex; align-items: center; justify-content: center;
  position: relative;
}
.tool-btn {
  flex: 0 0 auto;
  min-width: 28px; height: 24px;
  display: grid; place-items: center;
  padding: 0 8px;
  font-family: inherit; font-size: 12px; font-weight: 500;
  color: var(--text-dim);
  background: transparent; border: 1px solid transparent; border-radius: 5px;
  cursor: pointer; touch-action: manipulation;
  transition: background .14s, color .14s, border-color .14s;
}
.tool-btn:hover { color: var(--text); background: var(--active); }
.tool-btn:active:not(:disabled) { transform: scale(.94); }
.tool-btn.primary { color: #fff; background: var(--accent); border-color: var(--accent); }
.tool-btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

.tool-btn.anim-btn {
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  z-index: 2;
  margin: 0;
  color: var(--accent);
  background: var(--splitter-bg);
}
.tool-btn.anim-btn:hover { background: var(--active); color: var(--accent); }
.tool-btn.anim-btn:active:not(:disabled) { transform: translate(-50%, -50%) scale(.94); }
.tool-btn.anim-btn.spinning svg {
  animation: runSpin .5s ease;
}
@keyframes runSpin {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}

.menu-btn {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 2px;
  line-height: 1;
  padding: 0 4px;
}
.menu {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  min-width: 140px;
  padding: 4px;
  display: flex; flex-direction: column; gap: 2px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: 0 8px 24px rgba(15,23,42,.18);
  z-index: 30;
}
.tool-group--right .menu { left: auto; right: 0; }
.menu[hidden] { display: none; }
.menu__item {
  width: 100%;
  padding: 8px 12px;
  text-align: left;
  font-family: inherit; font-size: 12.5px; color: var(--text);
  background: transparent; border: 0; border-radius: 5px;
  cursor: pointer; touch-action: manipulation;
  transition: background .14s;
}
.menu__item:hover { background: var(--hover); }
.menu__item:active { background: var(--active); }
.menu__item[disabled] { opacity: .5; cursor: not-allowed; }
.menu__item.danger { color: #dc2626; }
.menu__item.danger:hover { background: #fef2f2; }

/* 左侧菜单中的图片列表项样式（优化：改为删除图标） */
.img-menu-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  padding: 6px 8px;
  background: transparent;
  border: 0;
  border-radius: 4px;
  cursor: pointer;
  text-align: left;
  font-family: inherit;
  font-size: 12px;
  color: var(--text);
  transition: background .14s;
}
.img-menu-item:hover { background: var(--hover); }
.img-menu-item.is-selected { font-weight: 600; color: var(--accent); }
.img-menu-item .img-info {
  display: flex;
  align-items: center;
  gap: 4px;
  overflow: hidden;
  flex: 1;
  margin-right: 6px;
}
.img-menu-item .img-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.img-menu-item .img-check {
  color: #16a34a;
  font-weight: 700;
  flex-shrink: 0;
}
.img-menu-item .img-del-icon {
  background: transparent;
  border: 0;
  color: var(--text-dim);
  cursor: pointer;
  padding: 4px;
  border-radius: 4px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  transition: color .14s, background .14s;
}
.img-menu-item .img-del-icon:hover {
  color: #dc2626;
  background: #fef2f2;
}

.splitter-grip {
  flex: 1 1 auto; min-width: 20px; height: 100%;
  cursor: ns-resize; touch-action: none; position: relative;
}

.editor-wrap {
  flex: 20 1 0; min-height: 0px;
  position: relative; overflow: hidden;
  background: var(--ed-bg);
}
.CodeMirror {
  height: 100% !important;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 13px; line-height: 1.55;
  touch-action: pan-x pan-y;
}
.CodeMirror-scroll,
.CodeMirror-lines,
.CodeMirror textarea {
  touch-action: pan-x pan-y;
}
.editor-wrap[hidden] { display: none !important; }

.toast {
  position: fixed; left: 50%; bottom: 24px;
  transform: translate(-50%, 14px);
  padding: 10px 18px; border-radius: 999px;
  background: rgba(15,23,42,.94); color: #f8fafc;
  font-size: 13px; text-align: center;
  opacity: 0; pointer-events: none;
  transition: opacity .22s, transform .22s;
  z-index: 999;
}
.toast.is-show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 720px) {
  .splitter { flex-basis: 32px; padding: 0 4px; }
  .tool-btn { min-width: 26px; height: 22px; font-size: 11.5px; padding: 0 6px; }
  .menu-btn { font-size: 16px; }
  .menu { min-width: 120px; }

  .CodeMirror { font-size: 14px; }

  .view-controls { left: 8px; bottom: 8px; gap: 4px; padding: 4px 6px; }
  .zoom-label { min-width: 42px; font-size: 11px; }
  .zoom-btn { min-width: 22px; height: 22px; font-size: 12px; }
  .bg-btn { width: 16px; height: 16px; }
  .preview-menu-wrap { top: 8px; right: 8px; }
  .preview-menu-btn { width: 28px; height: 28px; font-size: 16px; }
}
</style>
</head>
<body>

<div class="app" id="app">
  <section class="preview-wrap bg-checker" id="previewWrap">
    <div class="preview-stage" id="previewStage">
      <iframe id="preview" sandbox="allow-scripts allow-same-origin" title="p5.js 预览"></iframe>
    </div>

    <div class="preview-menu-wrap">
      <button class="preview-menu-btn" id="btnPreviewMenu" type="button" title="更多" aria-label="更多" aria-haspopup="true" aria-expanded="false">⋯</button>
      <div class="menu" id="previewMenu" hidden>
        <button class="menu__item" id="btnSave" type="button">保存 HTML</button>
        <button class="menu__item" id="btnSavePNG" type="button">保存 PNG</button>
        <div class="menu__sep"></div>
        <button class="menu__item" id="btnRecordMP4" type="button">录制 MP4</button>
      </div>
    </div>

    <div class="view-controls">
      <div class="bg-switcher" role="group" aria-label="预览背景">
        <button class="bg-btn is-active" data-bg="checker" type="button" title="棋盘格背景" aria-label="棋盘格背景"></button>
        <button class="bg-btn" data-bg="white" type="button" title="白色背景" aria-label="白色背景"></button>
        <button class="bg-btn" data-bg="dark" type="button" title="深色背景" aria-label="深色背景"></button>
      </div>
      <span class="view-controls__sep"></span>
      <button class="zoom-btn" id="zoomOut" type="button" title="缩小" aria-label="缩小">−</button>
      <button class="zoom-label" id="zoomReset" type="button" title="重置为 100%">100%</button>
      <button class="zoom-btn" id="zoomIn" type="button" title="放大" aria-label="放大">+</button>
    </div>
  </section>

  <div class="splitter" id="splitter">
    <!-- 左侧：更多菜单与图片资源管理 -->
    <div class="tool-group tool-group--left">
      <button class="tool-btn menu-btn" id="btnLeftMenu" type="button" title="菜单" aria-label="菜单" aria-haspopup="true" aria-expanded="false">⋯</button>
      <div class="menu" id="leftMenu" hidden>
        <button class="menu__item" id="btnUploadImage" type="button">上传图片</button>
        <div class="menu__sep" id="imgListSep" style="display: none;"></div>
        <div id="uploadedImagesContainer" style="display: flex; flex-direction: column; gap: 2px; max-height: 200px; overflow-y: auto;"></div>
      </div>
    </div>
    <input type="file" id="fileInput" accept="image/*" multiple hidden />

    <div class="tool-center">
      <div class="splitter-grip" id="splitterGrip" title="拖动调整布局 · 双击恢复默认"></div>
      <button class="tool-btn anim-btn" id="btnRun" type="button" title="运行代码" aria-label="运行代码">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.73 10.06l-1.95-.5A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"
                fill="currentColor"/>
        </svg>
      </button>
    </div>

    <div class="tool-group tool-group--right">
      <button class="tool-btn menu-btn" id="btnMenuRight" type="button" title="菜单" aria-label="菜单" aria-haspopup="true" aria-expanded="false">⋯</button>
      <div class="menu" id="menuRight" hidden>
        <button class="menu__item" id="btnReset" type="button">重置</button>
        <button class="menu__item" id="btnFormat" type="button">格式化代码</button>
        <div class="menu__sep"></div>
        <button class="menu__item" id="btnWrapToggle" type="button">自动换行</button>
        <button class="menu__item" id="btnAutoPreviewToggle" type="button">自动预览 <span class="wrap-check">✓</span></button>
        <div class="menu__sep"></div>
        <button class="menu__item danger" id="btnClearCode" type="button">清空代码</button>
      </div>
    </div>
  </div>

  <section class="editor-wrap" id="editorWrap">
    <textarea id="code"></textarea>
  </section>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-beautify@1.15.1/js/lib/beautify.min.js"></script>
<script>
(function () {
'use strict';

const P5_CDN = 'https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js';
const DRAFT_KEY = 'p5-editor.draft.v2';
const SPLIT_KEY = 'p5-editor.split.v1';
const BG_KEY = 'p5-editor.bg.v1';
const WRAP_KEY = 'p5-editor.wrap.v1';
const AUTO_PREVIEW_KEY = 'p5-editor.autopreview.v1';

const $ = id => document.getElementById(id);
const appEl = $('app');
const previewWrap = $('previewWrap');
const previewStage = $('previewStage');
const previewEl = $('preview');
const splitterEl = $('splitter');
const splitterGrip = $('splitterGrip');
const editorWrap = $('editorWrap');
const toastEl = $('toast');
const btnSave = $('btnSave');
const btnReset = $('btnReset');
const btnFormat = $('btnFormat');
const btnWrapToggle = $('btnWrapToggle');
const btnAutoPreviewToggle = $('btnAutoPreviewToggle');
const btnClearCode = $('btnClearCode');
const btnMenuRight = $('btnMenuRight');
const btnPreviewMenu = $('btnPreviewMenu');
const btnSavePNG = $('btnSavePNG');
const btnRecordMP4 = $('btnRecordMP4');
const menuRight = $('menuRight');
const previewMenu = $('previewMenu');
const zoomInBtn = $('zoomIn');
const zoomOutBtn = $('zoomOut');
const zoomResetBtn = $('zoomReset');
const btnRun = $('btnRun');
const btnLeftMenu = $('btnLeftMenu');
const leftMenu = $('leftMenu');
const btnUploadImage = $('btnUploadImage');
const fileInput = $('fileInput');
const uploadedImagesContainer = $('uploadedImagesContainer');
const imgListSep = $('imgListSep');
const bgBtns = Array.from(document.querySelectorAll('.bg-btn'));

let editor = null;
let renderTimer = null;
let inputTimer = 0;
let toastTimer = null;

let stageScale = 1, stagePanX = 0, stagePanY = 0;

let splitRatio = 0.8;
let splitState = 'default';

let previewBg = 'checker';
let wrapEnabled = false;
let autoPreviewEnabled = true;

let isRecording = false;
let pendingRecord = null;

let uploadedImagesMap = {}; // 存储 { filename: blobUrl }
let selectedImageKey = null;

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('is-show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('is-show'), 2200);
}
const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

function blurEditor() {
  if (!editor) return;
  try {
    const input = editor.getInputField();
    if (input && document.activeElement === input) input.blur();
  } catch (_) {}
}

function blurActiveElement() {
  const ae = document.activeElement;
  if (ae && ae !== document.body) {
    try { ae.blur(); } catch (_) {}
  }
  blurEditor();
}

function timestampFilename(prefix, ext) {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${prefix}_${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.${ext}`;
}

function buildTemplate() {
  return `let img;

function preload() {
  // 可以直接使用 imageUrl['文件名'] 调用上传的图片
  // img = loadImage(imageUrl['c3.jpg']);
}

function setup() {
  createCanvas(windowWidth, windowHeight);
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
}

function draw() {
  clear();
  // if (img) {
  //   image(img, 0, 0);
  // }
}
`;
}

function buildRuntimeHTML(userCode, imagesMap) {
  imagesMap = imagesMap || {};
  const imageUrlScript = `const imageUrl = ${JSON.stringify(imagesMap)};\n`;

  return `<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>p5.js Sketch</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:transparent; touch-action:none; }
  canvas { display:block; touch-action:none; }
</style>
<script src="${P5_CDN}"><\/script>
</head>
<body>
<script>
window.addEventListener('error', function(e) {
  parent.postMessage({ type: 'sketch-error', message: e.message, line: e.lineno }, '*');
});

/* 自动注入全局 imageUrl 字典映射，代码中可直接通过 imageUrl['name.jpg'] 调用 */
${imageUrlScript}

${userCode}

var _recorder = null;
var _chunks = [];
var _recordMime = '';

function _startRecording() {
  var canvas = document.querySelector('canvas');
  if (!canvas) {
    parent.postMessage({ type: 'record-error', message: '画布尚未就绪' }, '*');
    return;
  }
  if (!canvas.captureStream || typeof MediaRecorder === 'undefined') {
    parent.postMessage({ type: 'record-error', message: '此浏览器不支持录制' }, '*');
    return;
  }
  var candidates = [
    'video/mp4;codecs=avc1',
    'video/mp4',
    'video/webm;codecs=vp9',
    'video/webm;codecs=vp8',
    'video/webm'
  ];
  var mime = '';
  for (var i = 0; i < candidates.length; i++) {
    if (MediaRecorder.isTypeSupported(candidates[i])) { mime = candidates[i]; break; }
  }
  if (!mime) {
    parent.postMessage({ type: 'record-error', message: '无可用编码格式' }, '*');
    return;
  }
  _chunks = [];
  _recordMime = mime;
  var stream;
  try {
    stream = canvas.captureStream(30);
    _recorder = new MediaRecorder(stream, { mimeType: mime });
  } catch (err) {
    parent.postMessage({ type: 'record-error', message: '创建录制器失败：' + err.message }, '*');
    return;
  }
  _recorder.ondataavailable = function (ev) {
    if (ev.data && ev.data.size > 0) _chunks.push(ev.data);
  };
  _recorder.onstop = function () {
    var isMP4 = _recordMime.indexOf('mp4') >= 0;
    var blob = new Blob(_chunks, { type: _recordMime });
    blob.arrayBuffer().then(function (buf) {
      parent.postMessage({ type: 'record-done', buffer: buf, isMP4: isMP4 }, '*');
    });
    try { stream.getTracks().forEach(function (t) { t.stop(); }); } catch (_) {}
  };
  _recorder.start();
  parent.postMessage({ type: 'record-started' }, '*');
}

function _stopRecording() {
  if (_recorder && _recorder.state !== 'inactive') {
    try { _recorder.stop(); } catch (_) {}
  }
}

window.addEventListener('message', function (e) {
  var cmd = e.data && e.data.type;
  try {
    if (cmd === 'record-start') {
      _startRecording();
    } else if (cmd === 'record-stop') {
      _stopRecording();
    }
  } catch (_) {}
});

document.addEventListener('pointerdown', function (e) {
  try { parent.postMessage({ type: 'outside-click' }, '*'); } catch (_) {}
}, { passive: true, capture: true });

['gesturestart', 'gesturechange', 'gestureend'].forEach(function (evt) {
  document.addEventListener(evt, function (e) { e.preventDefault(); }, { passive: false });
});
document.addEventListener('touchmove', function (e) {
  if (e.touches.length > 1) e.preventDefault();
}, { passive: false });
document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
<\/script>
</body>
</html>`;
}

function updatePreview() {
  const code = editor ? editor.getValue() : buildTemplate();
  previewEl.srcdoc = buildRuntimeHTML(code, uploadedImagesMap);
}

function schedulePreview() {
  if (isRecording) return;
  if (!autoPreviewEnabled) return;
  clearTimeout(renderTimer);
  renderTimer = setTimeout(updatePreview, 300);
}

function runCode() {
  if (isRecording) { showToast('录制中，无法运行'); return; }
  clearTimeout(inputTimer);
  clearTimeout(renderTimer);
  updatePreview();
  blurEditor();
  btnRun.classList.remove('spinning');
  void btnRun.offsetWidth;
  btnRun.classList.add('spinning');
  setTimeout(() => btnRun.classList.remove('spinning'), 520);
}

function applyStageTransform() {
  previewStage.style.transform =
    `translate(${stagePanX}px, ${stagePanY}px) scale(${stageScale})`;
  zoomResetBtn.textContent = Math.round(stageScale * 100) + '%';
}

function zoomAt(factor, localX, localY) {
  const rect = previewWrap.getBoundingClientRect();
  const newScale = clamp(stageScale * factor, 0.25, 8);
  if (newScale === stageScale) return;
  const ratio = newScale / stageScale;
  const relX = localX - rect.width / 2 - stagePanX;
  const relY = localY - rect.height / 2 - stagePanY;
  stagePanX = localX - rect.width / 2 - relX * ratio;
  stagePanY = localY - rect.height / 2 - relY * ratio;
  stageScale = newScale;
  applyStageTransform();
}
function zoomByButton(factor) {
  const rect = previewWrap.getBoundingClientRect();
  zoomAt(factor, rect.width / 2, rect.height / 2);
}

function setPreviewBg(bg) {
  previewBg = bg;
  previewWrap.className = 'preview-wrap bg-' + bg;
  bgBtns.forEach(b => b.classList.toggle('is-active', b.dataset.bg === bg));
  try { localStorage.setItem(BG_KEY, bg); } catch (_) {}
}

function postToIframe(type) {
  try {
    if (previewEl.contentWindow) {
      previewEl.contentWindow.postMessage({ type }, '*');
    }
  } catch (_) {}
}

function updateWrapLabel() {
  if (wrapEnabled) {
    btnWrapToggle.innerHTML = '自动换行 <span class="wrap-check">✓</span>';
  } else {
    btnWrapToggle.textContent = '自动换行';
  }
}
function setWrap(on, silent) {
  wrapEnabled = !!on;
  if (editor) editor.setOption('lineWrapping', wrapEnabled);
  updateWrapLabel();
  try { localStorage.setItem(WRAP_KEY, wrapEnabled ? '1' : '0'); } catch (_) {}
  if (!silent) showToast(wrapEnabled ? '已开启自动换行' : '已关闭自动换行');
}

function updateAutoPreviewLabel() {
  if (autoPreviewEnabled) {
    btnAutoPreviewToggle.innerHTML = '自动预览 <span class="wrap-check">✓</span>';
  } else {
    btnAutoPreviewToggle.textContent = '自动预览';
  }
}
function setAutoPreview(on, silent) {
  autoPreviewEnabled = !!on;
  updateAutoPreviewLabel();
  try { localStorage.setItem(AUTO_PREVIEW_KEY, autoPreviewEnabled ? '1' : '0'); } catch (_) {}
  if (!silent) showToast(autoPreviewEnabled ? '已开启自动预览' : '已关闭自动预览');
  if (autoPreviewEnabled && !isRecording && editor) {
    updatePreview();
  }
}

function formatCode() {
  if (typeof js_beautify === 'undefined') {
    showToast('格式化库未加载，请检查网络');
    return;
  }
  try {
    const code = editor.getValue();
    const formatted = js_beautify(code, {
      indent_size: 2,
      indent_char: ' ',
      preserve_newlines: true,
      max_preserve_newlines: 2,
      end_with_newline: true,
      wrap_line_length: 0
    });
    if (formatted === code) { showToast('代码已是格式化状态'); return; }
    editor.setValue(formatted);
    saveDraft();
    showToast('已格式化');
  } catch (err) {
    showToast('格式化失败：' + (err && err.message || '未知错误'));
  }
}

function clearCode() {
  if (isRecording) { showToast('录制中，无法清空'); return; }
  if (!editor) return;
  const lastLine = editor.lineCount() - 1;
  if (lastLine === 0 && editor.getLine(0) === '') {
    showToast('代码已是空的');
    return;
  }
  const lastCh = editor.getLine(lastLine).length;
  editor.replaceRange('', { line: 0, ch: 0 }, { line: lastLine, ch: lastCh });
  showToast('已清空代码（可撤销）');
}

function capturePNG() {
  let canvas = null;
  try {
    const doc = previewEl.contentDocument;
    if (doc) canvas = doc.querySelector('canvas');
  } catch (_) {}
  if (!canvas) { showToast('无法获取画布，请稍后重试'); return; }
  try {
    const filename = timestampFilename('sketch', 'png');
    const url = canvas.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    showToast('已保存 ' + filename);
  } catch (err) {
    showToast('保存 PNG 失败：' + (err && err.message || '未知错误'));
  }
}

function legacyDownload(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.rel = 'noopener';
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

function shareOrDownload(blob, filename, onDone) {
  let file = null;
  try {
    file = new File([blob], filename, { type: 'application/octet-stream' });
  } catch (_) {}

  const canShareFiles = !!(file && navigator.share && navigator.canShare &&
                          navigator.canShare({ files: [file] }));

  if (canShareFiles) {
    navigator.share({ files: [file] })
      .then(() => { onDone && onDone('shared'); })
      .catch(err => {
        if (err && err.name === 'AbortError') {
          onDone && onDone('cancelled');
          return;
        }
        onDone && onDone('failed', err);
      });
    return;
  }

  legacyDownload(blob, filename);
  onDone && onDone('downloaded');
}

function saveHTML() {
  const code = editor.getValue();
  const html = buildRuntimeHTML(code, uploadedImagesMap);
  const blob = new Blob([html], { type: 'application/octet-stream' });
  const filename = timestampFilename('sketch', 'html');
  shareOrDownload(blob, filename, (result, err) => {
    if (result === 'shared' || result === 'downloaded') {
      showToast('已保存 ' + filename);
    } else if (result === 'cancelled') {
      showToast('已取消');
    } else {
      showToast('保存失败，请重试' + (err && err.message ? '：' + err.message : ''));
    }
  });
}

function updateRecordButton() {
  if (isRecording) {
    btnRecordMP4.textContent = '停止录制';
    btnRecordMP4.classList.add('is-recording');
    btnRecordMP4.classList.remove('is-ready');
  } else if (pendingRecord) {
    btnRecordMP4.textContent = pendingRecord.isMP4 ? '下载 MP4' : '下载 WebM';
    btnRecordMP4.classList.remove('is-recording');
    btnRecordMP4.classList.add('is-ready');
  } else {
    btnRecordMP4.textContent = '录制 MP4';
    btnRecordMP4.classList.remove('is-recording', 'is-ready');
  }
}

function handleRecordClick() {
  if (isRecording) {
    postToIframe('record-stop');
    showToast('正在停止录制…');
    return;
  }

  if (pendingRecord) {
    const { blob, filename } = pendingRecord;
    shareOrDownload(blob, filename, (result, err) => {
      if (result === 'shared' || result === 'downloaded') {
        pendingRecord = null;
        updateRecordButton();
        showToast('已保存 ' + filename);
      } else if (result === 'cancelled') {
        showToast('已取消，可重新点击下载');
      } else {
        showToast('保存失败，请重试' + (err && err.message ? '：' + err.message : ''));
      }
    });
    return;
  }

  postToIframe('record-start');
}

function closeAllMenus() {
  menuRight.hidden = true;
  previewMenu.hidden = true;
  if (typeof leftMenu !== 'undefined') leftMenu.hidden = true;
  btnMenuRight.setAttribute('aria-expanded', 'false');
  btnPreviewMenu.setAttribute('aria-expanded', 'false');
  if (typeof btnLeftMenu !== 'undefined') btnLeftMenu.setAttribute('aria-expanded', 'false');
}

function openMenu(menu, btn) {
  closeAllMenus();
  menu.hidden = false;
  btn.setAttribute('aria-expanded', 'true');
  const btnRect = btn.getBoundingClientRect();
  const menuH = menu.offsetHeight;
  const spaceBelow = window.innerHeight - btnRect.bottom;
  if (spaceBelow < menuH + 12) {
    menu.style.top = 'auto';
    menu.style.bottom = 'calc(100% + 6px)';
  } else {
    menu.style.top = 'calc(100% + 6px)';
    menu.style.bottom = 'auto';
  }
}

btnMenuRight.addEventListener('click', e => {
  e.stopPropagation();
  if (menuRight.hidden) openMenu(menuRight, btnMenuRight); else closeAllMenus();
});
btnPreviewMenu.addEventListener('click', e => {
  e.stopPropagation();
  if (previewMenu.hidden) openMenu(previewMenu, btnPreviewMenu); else closeAllMenus();
});
btnLeftMenu.addEventListener('click', e => {
  e.stopPropagation();
  if (leftMenu.hidden) openMenu(leftMenu, btnLeftMenu); else closeAllMenus();
});

document.addEventListener('pointerdown', e => {
  if (e.target.closest('.menu, #btnMenuRight, #btnPreviewMenu, #btnLeftMenu')) return;
  const anyOpen = !menuRight.hidden || !previewMenu.hidden || !leftMenu.hidden;
  closeAllMenus();
  if (anyOpen) blurActiveElement();
});

window.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeAllMenus();
    blurActiveElement();
  }
});

function renderUploadedImagesList() {
  uploadedImagesContainer.innerHTML = '';
  const keys = Object.keys(uploadedImagesMap);
  
  if (keys.length === 0) {
    imgListSep.style.display = 'none';
    return;
  }
  imgListSep.style.display = 'block';

  keys.forEach(filename => {
    const isSelected = (selectedImageKey === filename);
    const itemEl = document.createElement('div');
    itemEl.className = 'img-menu-item' + (isSelected ? ' is-selected' : '');
    
    itemEl.innerHTML = `
      <div class="img-info" title="${filename}">
        ${isSelected ? '<span class="img-check">✓</span>' : ''}
        <span class="img-name">${filename}</span>
      </div>
      <button class="img-del-icon" type="button" title="删除">
        <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          <line x1="10" y1="11" x2="10" y2="17"></line>
          <line x1="14" y1="11" x2="14" y2="17"></line>
        </svg>
      </button>
    `;

    itemEl.querySelector('.img-info').addEventListener('click', () => {
      selectedImageKey = filename;
      renderUploadedImagesList();
      showToast(`已选中图片：${filename}`);
    });

    itemEl.querySelector('.img-del-icon').addEventListener('click', (ev) => {
      ev.stopPropagation();
      const urlToRevoke = uploadedImagesMap[filename];
      if (urlToRevoke) {
        URL.revokeObjectURL(urlToRevoke);
      }
      delete uploadedImagesMap[filename];
      if (selectedImageKey === filename) {
        const remaining = Object.keys(uploadedImagesMap);
        selectedImageKey = remaining.length > 0 ? remaining[0] : null;
      }
      renderUploadedImagesList();
      updatePreview();
      showToast(`已删除图片：${filename}`);
    });

    uploadedImagesContainer.appendChild(itemEl);
  });
}

btnUploadImage.addEventListener('click', () => {
  closeAllMenus();
  if (isRecording) { showToast('录制中, 无法上传'); return; }
  fileInput.click();
});

fileInput.addEventListener('change', e => {
  const files = e.target.files;
  if (!files || files.length === 0) return;

  Array.from(files).forEach(file => {
    const safeName = file.name.replace(/['"\\]/g, '');
    const blobUrl = URL.createObjectURL(file);
    
    uploadedImagesMap[safeName] = blobUrl;
    if (!selectedImageKey) {
      selectedImageKey = safeName;
    }
    renderUploadedImagesList();
    updatePreview();
    showToast(`成功上传：${safeName}`);
  });
  fileInput.value = '';
});

function applySplit() {
  if (splitState === 'code-max') {
    previewWrap.style.flex = '0 0 0px';
    editorWrap.style.flex = '1 1 0';
    previewWrap.style.minHeight = '0px';
  } else if (splitState === 'preview-max') {
    previewWrap.style.flex = '1 1 0';
    editorWrap.style.flex = '0 0 0px';
    previewWrap.style.minHeight = '0px';
  } else {
    previewWrap.style.flex = (splitRatio * 100) + ' 1 0';
    editorWrap.style.flex = ((1 - splitRatio) * 100) + ' 1 0';
    previewWrap.style.minHeight = '80px';
  }
}

let splitDragging = false, splitMoved = false;
let splitStartY = 0, splitStartH = 0;
let lastDownTime = 0, lastDownY = 0;
const DBLCLICK_MS = 350, DBLCLICK_DIST = 10;

function onSplitDown(e) {
  if (e.target.closest('.tool-btn, .menu, .menu__item')) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const now = Date.now();
  if (now - lastDownTime < DBLCLICK_MS && Math.abs(e.clientY - lastDownY) < DBLCLICK_DIST) {
    lastDownTime = 0; lastDownY = 0; splitDragging = false;
    splitState = 'default'; splitRatio = 0.8;
    applySplit();
    showToast('已恢复默认布局');
    return;
  }
  lastDownTime = now; lastDownY = e.clientY;
  splitDragging = true; splitMoved = false;
  splitStartY = e.clientY;
  splitStartH = previewWrap.getBoundingClientRect().height;
  try { splitterEl.setPointerCapture(e.pointerId); } catch (_) {}
  document.body.style.cursor = 'ns-resize';
  document.body.style.userSelect = 'none';
}
function onSplitMove(e) {
  if (!splitDragging) return;
  const dy = e.clientY - splitStartY;
  if (!splitMoved && Math.abs(dy) < 3) return;
  splitMoved = true;
  
  const appRect = appEl.getBoundingClientRect();
  const splitterH = splitterEl.getBoundingClientRect().height;
  const availableH = appRect.height - splitterH;
  const currentPreviewH = splitStartH + dy;
  const ratio = clamp(currentPreviewH / availableH, 0, 1);
  splitRatio = ratio; 
  splitState = 'default';
  
  splitterGrip.classList.toggle('is-snap-code', ratio <= 0.08);
  splitterGrip.classList.toggle('is-snap-preview', ratio >= 0.92);
  applySplit();
}
function onSplitUp(e) {
  if (!splitDragging) return;
  splitDragging = false;
  try { splitterEl.releasePointerCapture(e.pointerId); } catch (_) {}
  document.body.style.cursor = '';
  document.body.style.userSelect = '';
  splitterGrip.classList.remove('is-snap-code', 'is-snap-preview');
  if (splitMoved) {
    lastDownTime = 0; lastDownY = 0; splitMoved = false;
    if (splitRatio <= 0.08) {
      splitState = 'code-max';
      applySplit();
      showToast('代码区已最大化');
    } else if (splitRatio >= 0.92) {
      splitState = 'preview-max';
      applySplit();
      showToast('预览区已最大化');
    }
  }
}
splitterEl.addEventListener('pointerdown', onSplitDown);
splitterEl.addEventListener('pointermove', onSplitMove);
splitterEl.addEventListener('pointerup', onSplitUp);
splitterEl.addEventListener('pointercancel', onSplitUp);

['gesturestart', 'gesturechange', 'gestureend'].forEach(evt => {
  document.addEventListener(evt, e => e.preventDefault(), { passive: false });
});
document.addEventListener('touchmove', e => {
  if (e.touches.length > 1) e.preventDefault();
}, { passive: false });

function installDoubleTapGuard(el) {
  el.addEventListener('mousedown', e => {
    if (e.detail >= 2 && !e.target.closest('.tool-btn, .menu, .menu__item')) {
      e.preventDefault();
    }
  });
  el.addEventListener('dblclick', e => { e.preventDefault(); });
  let lastEnd = 0;
  el.addEventListener('touchend', e => {
    if (e.target.closest('.tool-btn, .menu, .menu__item, .view-controls, .preview-menu-wrap, .zoom-btn, .zoom-label, .bg-btn')) return;
    const now = Date.now();
    if (now - lastEnd < 300) e.preventDefault();
    lastEnd = now;
  }, { passive: false });
}
installDoubleTapGuard(splitterEl);
installDoubleTapGuard(previewWrap);

function saveDraft() {
  try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ code: editor ? editor.getValue() : '' })); }
  catch (_) {}
}
function loadDraft() {
  try {
    const s = localStorage.getItem(DRAFT_KEY);
    if (!s) return null;
    const d = JSON.parse(s);
    if (d && typeof d.code === 'string') return d.code;
  } catch (_) {}
  return null;
}

btnSave.addEventListener('click', () => { closeAllMenus(); saveHTML(); });
btnReset.addEventListener('click', () => {
  closeAllMenus();
  if (isRecording) { showToast('录制中，无法重置'); return; }
  if (!confirm('恢复默认将丢失当前代码，确定？')) return;
  editor.setValue(buildTemplate());
  updatePreview();
  saveDraft();
  showToast('已重置');
});
btnFormat.addEventListener('click', () => { closeAllMenus(); formatCode(); });
btnWrapToggle.addEventListener('click', () => { setWrap(!wrapEnabled); closeAllMenus(); });
btnAutoPreviewToggle.addEventListener('click', () => { setAutoPreview(!autoPreviewEnabled); closeAllMenus(); });
btnClearCode.addEventListener('click', () => { closeAllMenus(); clearCode(); });

btnSavePNG.addEventListener('click', () => { closeAllMenus(); capturePNG(); });
btnRecordMP4.addEventListener('click', () => { closeAllMenus(); handleRecordClick(); });

bgBtns.forEach(btn => {
  btn.addEventListener('click', () => setPreviewBg(btn.dataset.bg));
});

zoomInBtn.addEventListener('click', () => zoomByButton(1.25));
zoomOutBtn.addEventListener('click', () => zoomByButton(1 / 1.25));
zoomResetBtn.addEventListener('click', () => {
  stageScale = 1; stagePanX = 0; stagePanY = 0;
  applyStageTransform();
});

btnRun.addEventListener('click', runCode);

window.addEventListener('message', e => {
  const d = e.data;
  if (!d) return;
  if (d.type === 'sketch-error') {
    showToast('运行错误: ' + d.message + (d.line ? ' (行 ' + d.line + ')' : ''));
    return;
  }
  if (d.type === 'outside-click') {
    closeAllMenus();
    blurActiveElement();
    return;
  }
  if (d.type === 'record-started') {
    isRecording = true;
    updateRecordButton();
    showToast('开始录制…');
  } else if (d.type === 'record-done') {
    isRecording = false;
    const isMP4 = !!d.isMP4;
    const blob = new Blob([d.buffer], { type: isMP4 ? 'video/mp4' : 'video/webm' });
    const filename = timestampFilename('sketch', isMP4 ? 'mp4' : 'webm');

    shareOrDownload(blob, filename, (result) => {
      if (result === 'shared' || result === 'downloaded') {
        pendingRecord = null;
        updateRecordButton();
        showToast('已保存 ' + filename);
      } else {
        pendingRecord = { blob, isMP4, filename };
        updateRecordButton();
        if (result === 'cancelled') {
          showToast('已取消，点击「下载」可保存');
        } else {
          showToast('请点击「' + (isMP4 ? '下载 MP4' : '下载 WebM') + '」保存');
        }
      }
    });
    updatePreview();
  } else if (d.type === 'record-error') {
    isRecording = false;
    updateRecordButton();
    showToast('录制失败：' + (d.message || '未知错误'));
  }
});

if (window.visualViewport) {
  window.visualViewport.addEventListener('scroll', () => {
    if (window.visualViewport.offsetTop === 0 && Math.abs(window.scrollY) > 1) {
      window.scrollTo(0, 0);
    }
  });
}

window.addEventListener('resize', () => { closeAllMenus(); });

function init() {
  editor = CodeMirror.fromTextArea($('code'), {
    mode: 'javascript',
    theme: 'material-darker',
    lineNumbers: true,
    indentUnit: 2,
    tabSize: 2,
    lineWrapping: false,
    autofocus: false
  });
  editor.setSize('100%', '100%');

  const cmWrapper = editor.getWrapperElement();
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(evt => {
    cmWrapper.addEventListener(evt, e => e.preventDefault(), { passive: false });
  });
  cmWrapper.addEventListener('touchmove', e => {
    if (e.touches.length > 1) e.preventDefault();
  }, { passive: false });

  try {
    if (localStorage.getItem(WRAP_KEY) === '1') wrapEnabled = true;
  } catch (_) {}
  editor.setOption('lineWrapping', wrapEnabled);
  updateWrapLabel();

  try {
    const v = localStorage.getItem(AUTO_PREVIEW_KEY);
    autoPreviewEnabled = (v !== '0');
  } catch (_) {}
  updateAutoPreviewLabel();

  const savedCode = loadDraft();
  editor.setValue(savedCode != null ? savedCode : buildTemplate());

  editor.on('change', () => {
    clearTimeout(inputTimer);
    inputTimer = setTimeout(() => {
      saveDraft();
      schedulePreview();
    }, 500);
  });

  try {
    const v = parseFloat(localStorage.getItem(SPLIT_KEY));
    if (isFinite(v) && v > 0.1 && v < 0.9) splitRatio = v;
  } catch (_) {}

  try {
    const bg = localStorage.getItem(BG_KEY);
    if (bg === 'checker' || bg === 'white' || bg === 'dark') previewBg = bg;
  } catch (_) {}

  applySplit();
  setPreviewBg(previewBg);
  updateRecordButton();
  updatePreview();

  blurEditor();
}

init();

})();
</script>
