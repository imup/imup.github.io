<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a0a">
<title>Web Probe</title>
<style>
  :root { --app-h: 100dvh; --app-top: 0px; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html {
    width: 100%; height: 100%; height: -webkit-fill-available;
    overflow: hidden;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  }
  body {
    position: fixed; top: 0; left: 0; right: 0; width: 100%;
    height: var(--app-h, 100dvh);
    transform: translateY(var(--app-top, 0px));
    overflow: hidden; display: flex; flex-direction: column;
    background: #0a0a0a; color: #0f0;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px; line-height: 1.55;
    touch-action: manipulation; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  #panel { flex: 1; min-height: 0; display: flex; flex-direction: column; border-bottom: 1px solid #222; }
  
  #toolbar {
    flex: none; display: flex; align-items: center; gap: 4px;
    padding: 6px 8px;
    padding-top: calc(6px + env(safe-area-inset-top));
    padding-left: calc(8px + env(safe-area-inset-left));
    padding-right: calc(8px + env(safe-area-inset-right));
    background: #111; border-bottom: 1px solid #1e1e1e; font-size: 12px; color: #888;
    flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; 
  }
  #toolbar::-webkit-scrollbar { display: none; }
  
  #toolbar .title {
    flex: none; color: #0f0; font-weight: bold; white-space: nowrap; padding-right: 8px;
    background: transparent; border: none; cursor: pointer; font-size: 12px; font-family: inherit;
    outline: none; 
  }
  
  #toolbar button:not(.title) {
    padding: 4px 6px; border-radius: 6px; background: #000; color: #999; font: inherit; font-size: 12px;
    border: 1px solid #333; cursor: pointer; touch-action: manipulation;
    transition: background .12s, border-color .12s, transform .08s, color .12s;
    -webkit-user-select: none; user-select: none; transform-origin: center center;
    font-variant-numeric: tabular-nums; flex-shrink: 0; 
  }

  #toolbar button:not(.title):active, #toolbar button:not(.title).is-pressed {
    background: #2a2a2a; border-color: #0a0; color: #0f0; transform: scale(0.96);
  }
  #toolbar button:not(.title):disabled { opacity: .4; }
  #toolbar button:not(.title):disabled:active, #toolbar button:not(.title):disabled.is-pressed {
    background: #000; border-color: #333; color: #999; transform: none;
  }
  
  #btnErrors.has-errors { border-color: #a33; color: #f66; }
  @keyframes errPulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(255,60,60,.5); }
    50%     { box-shadow: 0 0 0 4px rgba(255,60,60,0); }
  }
  #btnErrors.has-errors { animation: errPulse 2s infinite; }
  
  @keyframes btnFlash {
    0%   { background: #0a0; border-color: #0f0; color: #fff; transform: scale(0.94); }
    100% { background: #000; border-color: #333; color: #999; transform: scale(1); }
  }
  #toolbar button.is-flash { animation: btnFlash .35s ease; }
  
  #output {
    flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden;
    padding: 10px 12px;
    padding-left: calc(12px + env(safe-area-inset-left));
    padding-right: calc(12px + env(safe-area-inset-right));
    white-space: pre-wrap; word-break: break-all;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y; overscroll-behavior: contain;
    -webkit-user-select: text; user-select: text;
  }
  #output .row { display: block; padding: 1px 0; }
  #output .ts { color: #555; }
  #output .head { font-weight: bold; }
  #output .row.is-stack { padding-left: 12px; opacity: .85; }
  
  #output details { display: inline-block; margin: 0; vertical-align: top; }
  #output summary { cursor: pointer; outline: none; color: #98c379; user-select: none; }
  #output summary::-webkit-details-marker { display: none; }
  #output summary::before { content: "▶ "; font-size: 10px; color: #888; }
  #output details[open] > summary::before { content: "▼ "; }
  #output .obj-tbody { padding-left: 14px; border-left: 1px solid #333; margin-left: 4px; }
  #output .obj-key { color: #e06c75; }
  #output .obj-str { color: #98c379; }
  #output .obj-num { color: #d19a66; }
  #output .obj-bool { color: #d19a66; }
  #output .obj-null { color: #888; font-style: italic; }
  #output .obj-fn { color: #c678dd; }
  #output table.console-table { border-collapse: collapse; font-size: 12px; margin: 4px 0; width: 100%; table-layout: auto; }
  #output table.console-table th, #output table.console-table td { border: 1px solid #333; padding: 2px 6px; text-align: left; }
  #output table.console-table th { background: #222; color: #0ff; }
  #output table.console-table tr:nth-child(even) { background: #111; }

  #replContainer {
    flex: none; display: none;
    background: #111; border-top: 1px solid #0a0;
    padding: 6px 8px; z-index: 100;
  }
  #replContainer.show { display: flex; }
  #replPrefix { color: #0a0; font-weight: bold; margin-right: 8px; user-select: none; }
  #replInput {
    flex: 1; background: transparent; border: none; outline: none;
    color: #fff; font: inherit; font-size: 13px;
    -webkit-user-select: text; user-select: text;
  }

  #footer {
    flex: none; display: flex; gap: 8px; align-items: stretch;
    padding: 10px 12px;
    padding-left: calc(12px + env(safe-area-inset-left));
    padding-right: calc(12px + env(safe-area-inset-right));
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
    background: #111; border-top: 1px solid #222;
  }
  #urlInput {
    flex: 1; min-width: 0; padding: 12px 14px;
    background: #000; color: #0f0;
    border: 1px solid #2a2a2a; border-radius: 10px;
    font: inherit; font-size: 16px; outline: none;
    touch-action: manipulation;
    -webkit-user-select: text; user-select: text;
    -webkit-appearance: none; appearance: none;
  }
  #urlInput:focus { border-color: #0a0; box-shadow: 0 0 0 2px rgba(0,170,0,.15); }
  #urlInput::placeholder { color: #444; }
  #btnProbe {
    flex: none; padding: 12px 18px; border: 0; border-radius: 10px;
    background: #0a0; color: #fff;
    font: inherit; font-size: 15px; font-weight: bold;
    cursor: pointer; min-width: 96px;
    touch-action: manipulation;
    transition: background .15s, transform .08s;
    -webkit-user-select: none; user-select: none;
  }
  #btnProbe:active { background: #080; transform: scale(0.97); }
  #btnProbe:disabled { background: #263; color: #888; cursor: not-allowed; transform: none; }
</style>
</head>
<body>

<section id="panel">
  <div id="toolbar">
    <button id="btnHome" class="title" type="button">●探针输出</button>
    <button id="btnErrors" type="button">错误</button>
    <button id="btnNetwork" type="button">网络</button>
    <button id="btnStorage" type="button">存储</button>
    <button id="btnPerf" type="button">性能</button>
    <button id="btnDiagnose" type="button">诊断</button>
    <button id="btnConsole" type="button">控制台</button>
    <button id="btnCopy" type="button">复制</button>
    <button id="btnExport" type="button" disabled>导出</button>
    <button id="btnClear" type="button">清空</button>
  </div>
  <div id="output" role="log" aria-live="polite"></div>
  
  <div id="replContainer">
    <span id="replPrefix">&gt;</span>
    <input id="replInput" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="输入 JS 代码并回车 (Esc退出)">
  </div>
</section>

<footer id="footer">
  <input id="urlInput" type="text" list="urlHistory"
         inputmode="url" autocomplete="off"
         autocorrect="off" autocapitalize="off" spellcheck="false"
         enterkeyhint="go"
         placeholder="输入网址，如 example.com">
  <button id="btnProbe" type="button">开始探测</button>
  <datalist id="urlHistory"></datalist>
</footer>

<script>
(function lockViewportAndZoom() {
  const root = document.documentElement;
  let rafId = 0;
  function syncHeight() {
    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(() => {
      const vv = window.visualViewport;
      if (!vv) {
        root.style.setProperty("--app-h", window.innerHeight + "px");
        root.style.setProperty("--app-top", "0px");
        return;
      }
      const diff = Math.abs(window.innerHeight - vv.height - vv.offsetTop);
      if (diff < 2) {
        root.style.setProperty("--app-h", "100dvh");
        root.style.setProperty("--app-top", "0px");
      } else {
        root.style.setProperty("--app-h", vv.height + "px");
        root.style.setProperty("--app-top", vv.offsetTop + "px");
      }
    });
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", syncHeight);
    window.visualViewport.addEventListener("scroll", syncHeight);
  }
  window.addEventListener("resize", syncHeight);
  window.addEventListener("orientationchange", () => setTimeout(syncHeight, 200));
  document.addEventListener("focusin", (e) => {
    if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) {
      syncHeight();
      setTimeout(syncHeight, 100);
      setTimeout(syncHeight, 250);
      setTimeout(syncHeight, 400);
    }
  }, true);
  document.addEventListener("focusout", (e) => {
    if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) {
      syncHeight();
      setTimeout(syncHeight, 100);
      setTimeout(syncHeight, 250);
    }
  }, true);
  syncHeight();
  ["gesturestart", "gesturechange", "gestureend"].forEach((evt) => {
    document.addEventListener(evt, (e) => e.preventDefault(), { passive: false });
  });
  document.addEventListener("touchmove", (e) => {
    if (e.touches.length > 1) e.preventDefault();
  }, { passive: false });
  document.addEventListener("wheel", (e) => {
    if (e.ctrlKey) e.preventDefault();
  }, { passive: false });
  let lastEnd = 0;
  document.addEventListener("touchend", (e) => {
    const now = Date.now();
    if (now - lastEnd <= 300) e.preventDefault();
    lastEnd = now;
  }, { passive: false });
})();

(function tapToDismissKeyboard() {
  const INTERACTIVE = [
    "input", "textarea", "select", "button",
    "a[href]", "[role='button']",
    "[contenteditable='']", "[contenteditable='true']"
  ].join(",");
  const isInteractive = (el) => !!(el && el.closest && el.closest(INTERACTIVE));
  const dismiss = () => {
    const ae = document.activeElement;
    if (ae && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA")) ae.blur();
  };
  let startX = 0, startY = 0, tracking = false;
  const handleEnd = (target, x, y) => {
    if (!tracking) return;
    tracking = false;
    if (Math.abs(x - startX) > 8 || Math.abs(y - startY) > 8) return;
    if (isInteractive(target)) return;
    dismiss();
  };
  if (window.PointerEvent) {
    document.addEventListener("pointerdown", (e) => {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      startX = e.clientX; startY = e.clientY; tracking = true;
    }, { passive: true });
    document.addEventListener("pointerup", (e) => handleEnd(e.target, e.clientX, e.clientY), { passive: true });
    document.addEventListener("pointercancel", () => { tracking = false; }, { passive: true });
    document.addEventListener("click", (e) => {
      if (e.pointerType === undefined && !isInteractive(e.target)) dismiss();
    }, { passive: true });
  } else {
    document.addEventListener("touchstart", (e) => {
      const t = e.touches[0] || e.changedTouches[0];
      if (t) { startX = t.clientX; startY = t.clientY; tracking = true; }
    }, { passive: true });
    document.addEventListener("touchend", (e) => {
      const t = e.changedTouches[0];
      if (t) handleEnd(e.target, t.clientX, t.clientY);
    }, { passive: true });
    document.addEventListener("touchcancel", () => { tracking = false; }, { passive: true });
    document.addEventListener("click", (e) => {
      if (!isInteractive(e.target)) dismiss();
    }, { passive: true });
  }
})();

function createObjectTree(obj, depth = 0, seen = new WeakSet()) {
  if (obj === null) return '<span class="obj-null">null</span>';
  if (obj === undefined) return '<span class="obj-null">undefined</span>';
  
  const type = typeof obj;
  if (type === 'string') return '<span class="obj-str">"' + obj.replace(/</g, '&lt;') + '"</span>';
  if (type === 'number' || type === 'boolean') return '<span class="obj-num">' + obj + '</span>';
  if (type === 'function') {
    return '<span class="obj-fn">ƒ ' + (obj.name || 'anonymous') + '()</span>';
  }
  if (type === 'symbol') return '<span class="obj-num">' + String(obj) + '</span>';
  
  if (type === 'object') {
    if (seen.has(obj)) return '<span class="obj-null">[Circular]</span>';
    if (depth > 4) return '<span class="obj-null">[Object]</span>';
    
    seen.add(obj);
    const isArray = Array.isArray(obj);
    const keys = Object.keys(obj);
    
    if (keys.length === 0) {
      return isArray ? '[]' : '{}';
    }

    let html = '<details ' + (depth === 0 ? 'open' : '') + '>';
    html += '<summary>' + (isArray ? 'Array(' + keys.length + ')' : 'Object') + '</summary>';
    html += '<div class="obj-tbody">';
    
    for (const k of keys) {
      let val;
      try { val = obj[k]; } catch (e) { val = '[Getter Error]'; }
      html += '<div>';
      html += '<span class="obj-key">' + (isArray ? k : '"' + k + '"') + '</span>: ';
      html += createObjectTree(val, depth + 1, seen);
      html += '</div>';
    }
    
    html += '</div></details>';
    return html;
  }
  
  return String(obj);
}

function buildDOMTree(node, depth = 0) {
  if (!node) return "";
  if (node.nodeType === 3) {
    const text = node.textContent.trim();
    return text ? `<span class="obj-str">${text.replace(/</g, '&lt;')}</span>` : "";
  }
  if (node.nodeType !== 1) return "";

  const tag = node.tagName.toLowerCase();
  const attrs = Array.from(node.attributes).map(a => 
    `<span class="obj-key">${a.name}</span><span style="color:#888">="</span><span class="obj-num">${a.value.replace(/</g, '&lt;')}</span><span style="color:#888">"</span>`
  ).join(" ");
  
  const attrStr = attrs ? " " + attrs : "";
  let html = `<details ${depth < 3 ? 'open' : ''} style="margin-left:10px;">`;
  html += `<summary style="cursor:pointer;"><span class="obj-fn">&lt;${tag}</span>${attrStr}<span class="obj-fn">&gt;</span></summary>`;
  
  if (node.childNodes.length < 500) {
    for (const child of node.childNodes) {
      html += buildDOMTree(child, depth + 1);
    }
  } else {
    html += '<div style="color:#888;padding-left:10px;">... (节点过多已省略)</div>';
  }
  html += `</details>`;
  return html;
}

function installDevToolsLike(log, onNetPush, onError, logNode) {
  const errors = [];
  const ERR_CAP = 300;

  function pushError(rec) {
    const key = [rec.type, rec.errName, rec.message, rec.url, rec.line, rec.col].join("|");
    for (let i = errors.length - 1; i >= 0; i--) {
      if (errors[i].key === key) {
        errors[i].count++;
        errors[i].lastAt = Date.now();
        return errors[i];
      }
    }
    const e = Object.assign(
      { key, count: 1, firstAt: Date.now(), lastAt: Date.now() },
      rec
    );
    errors.push(e);
    if (errors.length > ERR_CAP) errors.shift();
    return e;
  }
  
  function guessErrorName(msg) {
    if (!msg) return "Error";
    const m = /^(\w*Error)\b/.exec(msg);
    return m ? m[1] : "Error";
  }

  window.addEventListener("error", (e) => {
    if (e.target && e.target !== window) return;
    const err = e.error;
    const entry = pushError({
      type: "JS-ERR",
      errName: (err && err.name) || guessErrorName(e.message),
      message: e.message || "(unknown)",
      url: e.filename || "",
      line: e.lineno || 0,
      col: e.colno || 0,
      stack: err && err.stack ? String(err.stack) : ""
    });
    if (onError) { try { onError(entry); } catch (_) {} }
  });

  window.addEventListener("unhandledrejection", (e) => {
    const r = e.reason;
    const isErr = r instanceof Error;
    const entry = pushError({
      type: "PROMISE",
      errName: isErr ? (r.name || "Error") : "PromiseRejection",
      message: isErr ? r.message : String(r),
      url: "", line: 0, col: 0,
      stack: isErr && r.stack ? String(r.stack) : ""
    });
    if (onError) { try { onError(entry); } catch (_) {} }
  });

  document.addEventListener("securitypolicyviolation", (e) => {
    const entry = pushError({
      type: "CSP",
      errName: "CSPViolation",
      message: (e.violatedDirective || "?") + " 拦截 " + (e.blockedURI || "?"),
      url: e.sourceFile || "",
      line: e.lineNumber || 0,
      col: e.columnNumber || 0,
      disposition: e.disposition || ""
    });
    if (onError) { try { onError(entry); } catch (_) {} }
  });

  window.addEventListener("error", (e) => {
    const t = e.target;
    if (!t || t === window) return;
    const tag = t.tagName;
    if (tag !== "SCRIPT" && tag !== "LINK" && tag !== "IMG" &&
        tag !== "VIDEO" && tag !== "AUDIO" && tag !== "SOURCE") return;
    const url = t.src || t.href || "(unknown)";
    const entry = pushError({
      type: "RES-FAIL", errName: tag,
      message: "资源加载失败", url, line: 0, col: 0, stack: ""
    });
    if (onError) { try { onError(entry); } catch (_) {} }
  }, true);

  (function hookConsole() {
    const map = { log:"#0ff", info:"#0ff", debug:"#777", warn:"#fa0", error:"#f66" };
    
    const parseArgs = (args) => {
      let hasObj = false;
      const parts = args.map(a => {
        if (a === null) return '<span class="obj-null">null</span>';
        if (a === undefined) return '<span class="obj-null">undefined</span>';
        if (typeof a === 'object') {
          hasObj = true;
          return createObjectTree(a);
        }
        return String(a).replace(/</g, '&lt;');
      });
      return { text: parts.join(" "), hasObj };
    };

    Object.keys(map).forEach((level) => {
      const orig = console[level];
      console[level] = function () {
        try { orig.apply(console, arguments); } catch (_) {}
        try {
          const { text, hasObj } = parseArgs(arguments);
          if (hasObj) {
            logNode("[CONSOLE." + level + "] ", text, map[level]);
          } else {
            log("[CONSOLE." + level + "] " + text, map[level]);
          }
        } catch (_) {}
      };
    });

    console.table = function (data) {
      try {
        if (!data || typeof data !== 'object') return;
        const rows = Array.isArray(data) ? data : [data];
        if (!rows.length) return;
        
        let html = '<table class="console-table"><tr>';
        const cols = Object.keys(rows[0] || {});
        html += '<th>(index)</th>' + cols.map(c => '<th>' + c + '</th>').join('');
        html += '</tr>';
        
        rows.forEach((row, i) => {
          html += '<tr><td>' + i + '</td>';
          cols.forEach(c => {
            const val = row[c];
            html += '<td>' + (typeof val === 'object' && val !== null ? '[Object]' : String(val)) + '</td>';
          });
          html += '</tr>';
        });
        html += '</table>';
        logNode("[CONSOLE.TABLE] ", html, map.log);
      } catch (e) {}
    };

    console.trace = function (...args) {
      const stack = new Error().stack;
      log("[CONSOLE.TRACE] " + args.join(" ") + "\n" + stack, "warn");
    };
  })();

  const netLog = [];
  const NET_CAP = 200;
  const perfStats = { lcp: 0, cls: 0, longTasks: [], longTaskTotal: 0 };

  function pushNet(rec) {
    netLog.push(rec);
    if (netLog.length > NET_CAP) netLog.shift();
    if (onNetPush) { try { onNetPush(netLog.length); } catch (_) {} }
  }

  (function hookFetch() {
    const origFetch = window.fetch;
    window.fetch = async function (...args) {
      const url = typeof args[0] === "string" ? args[0] : (args[0] && args[0].url) || "?";
      const method = ((args[1] && args[1].method) || "GET").toUpperCase();
      const internal = (window.__probeInternalCount || 0) > 0;
      const startTime = performance.now();
      try {
        const res = await origFetch.apply(this, args);
        pushNet({ kind: "fetch", method, url, status: res.status, ok: res.ok,
                  ms: (performance.now() - startTime) | 0, startTime, internal });
        return res;
      } catch (e) {
        pushNet({ kind: "fetch", method, url, status: 0, ok: false,
                  ms: (performance.now() - startTime) | 0, startTime,
                  err: e && e.message || String(e), internal });
        throw e;
      }
    };
  })();

  (function hookXHR() {
    const oOpen = XMLHttpRequest.prototype.open;
    const oSend = XMLHttpRequest.prototype.send;
    XMLHttpRequest.prototype.open = function (method, url, ...rest) {
      this.__probeReq = {
        method: String(method || "GET").toUpperCase(),
        url: String(url || ""),
        internal: (window.__probeInternalCount || 0) > 0
      };
      return oOpen.call(this, method, url, ...rest);
    };
    XMLHttpRequest.prototype.send = function (...args) {
      const req = this.__probeReq;
      if (!req) return oSend.apply(this, args);
      const startTime = performance.now();
      this.addEventListener("loadend", () => {
        pushNet({ kind: "xhr", method: req.method, url: req.url,
                  status: this.status, ok: this.status >= 200 && this.status < 300,
                  ms: (performance.now() - startTime) | 0, startTime, internal: req.internal });
      });
      return oSend.apply(this, args);
    };
  })();

  if ("PerformanceObserver" in window) {
    try {
      let lastLCP = 0;
      new PerformanceObserver((list) => {
        const entries = list.getEntries();
        const last = entries[entries.length - 1];
        if (last && last.startTime > lastLCP) {
          lastLCP = last.startTime;
          perfStats.lcp = lastLCP;
          try { log("[PERF-LCP] " + lastLCP.toFixed(0) + "ms", "#0ff"); } catch (_) {}
        }
      }).observe({ type: "largest-contentful-paint", buffered: true });
    } catch (_) {}
    try {
      let cls = 0, lastLogged = -1;
      new PerformanceObserver((list) => {
        for (const e of list.getEntries()) if (!e.hadRecentInput) cls += e.value;
        const v = Math.round(cls * 1000) / 1000;
        if (v !== lastLogged) {
          lastLogged = v; perfStats.cls = v;
          try { log("[PERF-CLS] 累积布局偏移 " + v, "#0ff"); } catch (_) {}
        }
      }).observe({ type: "layout-shift", buffered: true });
    } catch (_) {}
    try {
      new PerformanceObserver((list) => {
        for (const e of list.getEntries()) {
          if (e.duration > 50) {
            perfStats.longTasks.push(e.duration);
            perfStats.longTaskTotal += e.duration;
            if (perfStats.longTasks.length > 100) perfStats.longTasks.shift();
            try { log("[PERF-LONG] 长任务 " + e.duration.toFixed(0) + "ms", "#fa0"); } catch (_) {}
          }
        }
      }).observe({ type: "longtask", buffered: true });
    } catch (_) {}
  }

  return { netLog, NET_CAP, perfStats, errors, pushError };
}

  async function readTextLimited(res, maxBytes) {
    maxBytes = maxBytes || (2 * 1024 * 1024);
    if (!res.body || typeof res.body.getReader !== "function") {
      const t = await res.text();
      return t.length > maxBytes ? t.slice(0, maxBytes) : t;
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder("utf-8");
    let text = "", bytes = 0;
    try {
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        bytes += value.byteLength;
        text += decoder.decode(value, { stream: true });
        if (bytes >= maxBytes) { try { await reader.cancel(); } catch (_) {} break; }
      }
      text += decoder.decode();
    } catch (_) {}
    return text;
  }

  async function pool(tasks, limit, onTick) {
    const results = new Array(tasks.length);
    let next = 0;
    async function worker() {
      while (next < tasks.length) {
        const i = next++;
        try { results[i] = await tasks[i](); }
        catch (e) { results[i] = { ok:false, ms:0, err:(e && e.message) || String(e) }; }
        if (onTick) { try { onTick(); } catch (_) {} }
      }
    }
    await Promise.all(Array.from({ length: Math.min(limit, tasks.length) }, worker));
    return results;
  }

  async function stageContent(url) {

    return withInternal(async () => {

        const r = await fetchWithTimeout(url, {
          mode: "cors", cache: "no-store", redirect: "follow",

        log("CORS 请求成功：HTTP " + r.status + " " + (r.statusText || ""), r.ok ? "ok" : "warn");

        log("响应体长度: " + text.length + " 字符" + (truncated ? "（已达上限截断）" : ""), "ok");

        log("结果：无法读取HTML源码，资源清单无法枚举", "dim");

  async function extractCssUrls(cssUrl) {
    return withInternal(async () => {
      try {
        const r = await fetchWithTimeout(cssUrl, {
          mode: "cors", cache: "no-store", referrerPolicy: "no-referrer"
        }, 8000);
        if (!r.ok) return { assets: [], imports: [] };
        const text = await readTextLimited(r, 1024 * 1024);
        const assets = [], imports = [];
        let m;
        const re = /url\(\s*(['"]?)([^'")]+)\1\s*\)/g;
        while ((m = re.exec(text))) {
          const u = m[2].trim();
          if (/^(data:|blob:|about:|#)/i.test(u)) continue;
          try { assets.push(new URL(u, cssUrl).href); } catch (_) {}
        }
        const impRe = /@import\s+(?:url\(\s*)?(['"]?)([^'")\s;]+)\1\s*\)?[^;]*;/gi;
        while ((m = impRe.exec(text))) {
          const u = m[2].trim();
          if (!u || /^(data:|blob:|about:|#)/i.test(u)) continue;
          try { imports.push(new URL(u, cssUrl).href); } catch (_) {}
        }
        return { assets, imports };
      } catch (_) { return { assets: [], imports: [] }; }
    });
  }

  function parseSrcset(v) {
    if (!v) return [];
    return v.split(",").map(s => s.trim().split(/\s+/)[0]).filter(Boolean);
  }

  async function stageResources(baseUrl, html) {
    const doc = new DOMParser().parseFromString(html, "text/html");
    const baseEl = doc.querySelector("base[href]");
    let base = baseUrl;
    if (baseEl) {
      try { base = new URL(baseEl.getAttribute("href"), baseUrl).href; } catch (_) {}
      log("发现 <base href>: " + base, "info");
    }
    const abs   = (u) => { try { return new URL(u, base).href; } catch (_) { return null; } };
    const valid = (u) => u && !/^(data:|blob:|javascript:|about:|#)/i.test(u);

    const title = (doc.title || "").trim();
    const lang  = doc.documentElement.getAttribute("lang") || "";
    const cs    = doc.querySelector("meta[charset]");
    const vp    = doc.querySelector('meta[name="viewport"]');
    const desc  = doc.querySelector('meta[name="description"]');

    log("页面标题: " + (title || "(空)"), "ok");
    if (lang) log("lang: " + lang, "info"); else log("缺少lang属性", "warn");
    if (cs)   log("charset: " + cs.getAttribute("charset"), "info");
    if (vp)   log("viewport: " + vp.getAttribute("content"), "info");
    else      log("缺少viewport meta，移动端可能缩放异常", "warn");
    if (desc) log("description: " + desc.getAttribute("content").slice(0, 120), "info");

    const cspMeta = Array.from(doc.querySelectorAll("meta[http-equiv]")).find(
      m => (m.getAttribute("http-equiv") || "").toLowerCase() === "content-security-policy"
    );
    if (cspMeta) log("页面CSP(meta): " + (cspMeta.getAttribute("content") || "").slice(0, 200), "info");

    const inventory = [];
    const seen = new Set();
    const add = (kind, raw) => {
      if (!raw) return;
      const u = abs(raw);
      if (!valid(u) || seen.has(u)) return;
      seen.add(u);
      inventory.push({ kind, url: u });
    };

    doc.querySelectorAll("script[src]").forEach(e => add("script", e.getAttribute("src")));
    doc.querySelectorAll("link[href]").forEach(e => {
      const rel = (e.getAttribute("rel") || "").toLowerCase();
      const kind = rel.includes("stylesheet") ? "style"
                 : rel.includes("icon")        ? "icon"
                 : rel.includes("manifest")    ? "manifest"
                 : rel.includes("preload")     ? "preload"
                 : "link";
      add(kind, e.getAttribute("href"));
    });
    doc.querySelectorAll("img").forEach(e => {
      const s = e.getAttribute("src"); if (s) add("img", s);
      parseSrcset(e.getAttribute("srcset")).forEach(u => add("img", u));
    });
    doc.querySelectorAll("source").forEach(e => {
      const s = e.getAttribute("src"); if (s) add("media", s);
      parseSrcset(e.getAttribute("srcset")).forEach(u => add("media", u));
    });
    doc.querySelectorAll("video,audio").forEach(e => {
      const s = e.getAttribute("src"); if (s) add("media", s);
      const p = e.getAttribute("poster"); if (p) add("img", p);
    });
    doc.querySelectorAll("iframe[src]").forEach(e => add("iframe", e.getAttribute("src")));

    log("HTML静态资源清单: " + inventory.length + " 条（去重后）", "ok");

    const cssUrls = inventory.filter(x => x.kind === "style").map(x => x.url);
    if (cssUrls.length) {
      log("尝试解析 " + cssUrls.length + " 个CSS内的url()与@import（受CORS限制）…", "info");
      const MAX_CSS_FETCH = 40;
      const cssSeen = new Set();
      const queue = cssUrls.slice();
      let cssAssetCount = 0, cssImportCount = 0;
      while (queue.length && cssSeen.size < MAX_CSS_FETCH) {
        const cu = queue.shift();
        if (cssSeen.has(cu)) continue;
        cssSeen.add(cu);
        const { assets, imports } = await extractCssUrls(cu);
        cssAssetCount += assets.length;
        assets.forEach(u => add("asset", u));
        for (const iu of imports) {
          cssImportCount++;
          add("style", iu);
          if (!cssSeen.has(iu)) queue.push(iu);
        }
      }
      log("CSS内资源: " + cssAssetCount + " 条，@import样式表: " + cssImportCount + " 条" +
          (cssAssetCount ? "" : "（可能全部被CORS拦截）"),
          cssAssetCount ? "ok" : "warn");
    }

    const byKind = {};
    inventory.forEach(x => { byKind[x.kind] = (byKind[x.kind] || 0) + 1; });
    log("资源分类: " + Object.keys(byKind).map(k => k + "×" + byKind[k]).join("  "), "info");

    log("──── 完整地址清单（共 " + inventory.length + " 条）────", "head");
    inventory.forEach(x => log("  " + x.kind.padEnd(9) + " " + x.url, "dim"));

    const toProbe = inventory.filter(x =>
      /^https?:/i.test(x.url) && x.kind !== "icon" && x.kind !== "preload"
    );
    const LIMIT = 60;
    const list = toProbe.slice(0, LIMIT);
    if (toProbe.length > LIMIT)
      log("探测上限 " + LIMIT + "，剩余 " + (toProbe.length - LIMIT) + " 个仅列清单不探测", "warn");
    if (!list.length) { log("无可探测资源", "info"); return { inventory, results: [] }; }

    log("开始探测 " + list.length + " 个资源（并发6，超时8s）…", "info");
    const tasks = list.map(it => () =>
      (it.kind === "img" ? probeImage(it.url) : probeFetch(it.url))
        .then(r => ({ kind: it.kind, url: it.url, ...r }))
    );
    let finished = 0;
    const results = await pool(tasks, 6, () => {
      finished++;
      btn.textContent = "探测中 " + finished + "/" + list.length;
    });
    results.forEach(r => {
      log("[" + (r.ok ? "OK " : "ERR") + "] " + r.kind.padEnd(9) + " " + r.url +
          "  (" + (r.ms|0) + "ms)" + (r.ok ? "" : "  ← " + r.err),
          r.ok ? "ok" : "err");
    });

    return { inventory, results };
  }

  async function stageJsAudit(inventory) {
    const scripts = inventory.filter(x => x.kind === "script" && /^https?:/i.test(x.url));
    if (!scripts.length) {
      log("无可审计的外链脚本（无script资源）", "dim");
      return { audited: 0, fetched: 0, issues: [] };
    }
    const MAX_AUDIT = 20;
    const list = scripts.slice(0, MAX_AUDIT);
    if (scripts.length > MAX_AUDIT) {
      log("审计上限 " + MAX_AUDIT + "，剩余 " + (scripts.length - MAX_AUDIT) + " 个跳过", "warn");
    }
    log("开始静态审计 " + list.length + " 个脚本（语法 / sourcemap / 危险模式）…", "info");

    const fetchTasks = list.map(s => async () => {
      return withInternal(async () => {
        try {
          const r = await fetchWithTimeout(s.url, {
            mode: "cors", cache: "no-store", referrerPolicy: "no-referrer"
          }, 8000);
          if (!r.ok) return { url: s.url, ok: false, err: "HTTP " + r.status };
          const src = await readTextLimited(r, 512 * 1024);
          return { url: s.url, ok: true, src };
        } catch (e) {
          return { url: s.url, ok: false,
                   err: e.name === "AbortError" ? "超时" : (e.message || String(e)) };
        }
      });
    });

    const results = await pool(fetchTasks, 4);
    const issues = [];
    let fetched = 0;

    for (const r of results) {
      if (!r.ok) {
        issues.push({ level: "dim", kind: "FETCH", url: r.url, msg: "无法获取源码：" + r.err });
        continue;
      }
      fetched++;
      const src = r.src;

      const sm = src.match(/\/\/[#@]\s*sourceMappingURL=(\S+)/);
      if (sm) {
        issues.push({ level: "warn", kind: "SRCMAP", url: r.url,
                      msg: "包含 sourceMappingURL: " + sm[1] + "（源码可能被还原）" });
      }

      const isModule =
        /\.mjs(\?|#|$)/i.test(r.url) ||
        /\bimport\.meta\b/.test(src) ||
        /\bimport\s+[\{*a-zA-Z'"]/.test(src) ||
        /\bexport\s+[\{*a-zA-Z]/.test(src);

      if (isModule) {
        issues.push({ level: "dim", kind: "MODULE", url: r.url,
                      msg: "模块脚本，跳过Function语法检查" });
      } else if (src.length <= 512 * 1024) {
        try { new Function(src); }
        catch (e) {
          if (e instanceof SyntaxError) {
            issues.push({ level: "err", kind: "SYNTAX", url: r.url,
                          msg: "SyntaxError: " + e.message });
          }
        }
      }

      const patterns = [
        [/\beval\s*\(/,                 "EVAL",       "warn", "使用eval()，CSP严格模式下会被拒绝"],
        [/new\s+Function\s*\(/,          "NEW-FN",     "dim",  "使用new Function()"],
        [/document\.write\s*\(/,         "DOC-WRITE",  "warn", "使用document.write()，可能阻塞解析"],
        [/\.innerHTML\s*=\s*(?!["'`])/,   "INNERHTML",  "dim",  "innerHTML动态赋值（XSS风险）"],
        [/\bdebugger\b/,                 "DEBUGGER",   "warn", "包含debugger语句（生产环境不应保留）"],
        [/\bconsole\.error\s*\(/,        "CONSOLE-ERR","info", "含console.error调用（非异常）"]
      ];
      for (const [re, kind, level, msg] of patterns) {
        if (re.test(src)) issues.push({ level, kind, url: r.url, msg });
      }
    }

    log("静态审计：成功获取 " + fetched + " / " + list.length + " 个脚本源码",
        fetched ? "ok" : "warn");
    if (!issues.length) {
      log("静态审计：未发现问题", "ok");
      return { audited: list.length, fetched, issues: [] };
    }
    const errs  = issues.filter(i => i.level === "err");
    const warns = issues.filter(i => i.level === "warn");
    log("静态审计：发现 " + issues.length + " 项（错误 " + errs.length +
        "，警告 " + warns.length + "）",
        errs.length ? "err" : warns.length ? "warn" : "info");
    issues.forEach(it => log("[" + it.kind + "] " + it.url + " — " + it.msg, it.level));
    return { audited: list.length, fetched, issues };
  }

  async function diagnoseFile(fileUrl) {
    logTemp("──── 启动文件诊断 ────", "head");
    logTemp("目标文件: " + fileUrl, "info");

    let text;
    try {
      const r = await fetchWithTimeout(fileUrl, { cache: "no-store" }, 8000);
      if (!r.ok) throw new Error("HTTP " + r.status);
      text = await readTextLimited(r, 1024 * 1024);
      logTemp("源码拉取成功，长度 " + text.length + " 字符", "ok");
    } catch (e) {
      logTemp("源码拉取失败: " + (e.message || e), "err");
      logTemp("可能原因：跨域限制(CORS) / 文件不存在 / 网络超时", "warn");
      return;
    }

    const cleanUrl = fileUrl.split("?")[0].split("#")[0].toLowerCase();
    const isJson = cleanUrl.endsWith(".json") || text.trim().startsWith("{") || text.trim().startsWith("[");
    const isCss = cleanUrl.endsWith(".css");
    const isHtml = cleanUrl.endsWith(".html") || cleanUrl.endsWith(".htm") || /<html[\s>]/i.test(text.slice(0, 200));

    if (isJson) {
      diagnoseJSON(text);
    } else if (isCss) {
      diagnoseCSS(text, fileUrl);
    } else if (isHtml) {
      diagnoseHTML(text, fileUrl);
    } else {
      logTemp("判定为JS文件，转入安全沙箱执行…", "info");
      await sandboxRunJS(fileUrl, text);
    }
  }

  function diagnoseJSON(text) {
    logTemp("类型: JSON数据", "info");
    try {
      const obj = JSON.parse(text);
      logTemp("JSON语法合法，解析成功", "ok");
      logTemp("根节点类型: " + (Array.isArray(obj) ? "Array" : typeof obj), "dim");
      if (typeof obj === "object" && obj !== null) {
        const keys = Object.keys(obj);
        logTemp("包含 " + keys.length + " 个顶层键: " + keys.slice(0, 10).join(", ") + (keys.length > 10 ? "..." : ""), "dim");
      }
    } catch (e) {
      logTemp("JSON语法错误: " + e.message, "err");
      const match = e.message.match(/at position (\d+)/);
      if (match) {
        const pos = parseInt(match[1]);
        const start = Math.max(0, pos - 20);
        const end = Math.min(text.length, pos + 20);
        logTemp("错误位置附近: ..." + text.slice(start, end).replace(/\n/g, " ") + "...", "dim");
      }
      devtools.pushError({
        type: "JSON-ERR", errName: "SyntaxError", message: e.message,
        url: lastTarget, line: 0, col: 0, stack: ""
      });
      btnErr.classList.add("has-errors");
      btnErr.textContent = "错误·" + devtools.errors.length;
    }
  }

  function diagnoseCSS(cssText, url) {
    logTemp("类型: CSS样式表", "info");
    let ruleCount = 0;
    
    try {
      const sheet = new CSSStyleSheet();
      sheet.replaceSync(cssText);
      ruleCount = sheet.cssRules.length;
    } catch (e) {
      logTemp("CSS解析崩溃: " + e.message, "err");
      return;
    }

    if (ruleCount === 0) {
      logTemp("未解析到任何有效的CSS规则（可能为空或语法严重错误）", "warn");
    } else {
      logTemp("成功解析 " + ruleCount + " 条CSS规则", "ok");
    }

    const assets = [];
    const re = /url\(\s*(['"]?)([^'")]+)\1\s*\)/g;
    let m;
    while ((m = re.exec(cssText))) {
      let u = m[2].trim();
      if (/^(data:|blob:|about:|#)/i.test(u)) continue;
      try { assets.push(new URL(u, url).href); } catch (_) {}
    }
    if (assets.length) {
      logTemp("检测到引用的资源: " + assets.length + " 个", "info");
      assets.slice(0, 10).forEach(a => logTemp("  · " + a, "dim"));
    }
  }

  function diagnoseHTML(htmlText, url) {
    logTemp("类型: HTML文档", "info");
    const parser = new DOMParser();
    const doc = parser.parseFromString(htmlText, "text/html");
    const parserError = doc.querySelector("parsererror");
    
    if (parserError) {
      logTemp("HTML解析错误: " + parserError.textContent, "err");
      return;
    }

    const title = doc.title || "(空)";
    const chars = doc.querySelectorAll("*").length;
    logTemp("解析成功，包含 " + chars + " 个 DOM 节点", "ok");
    logTemp("页面Title: " + title, "info");

    const hasViewport = doc.querySelector('meta[name="viewport"]');
    if (!hasViewport) logTemp("缺少viewport meta标签，移动端可能缩放异常", "warn");

    let emptyLinks = 0;
    doc.querySelectorAll("a[href]").forEach(a => {
      const href = a.getAttribute("href").trim();
      if (href === "" || href === "#" || href === "javascript:void(0)") emptyLinks++;
    });
    if (emptyLinks > 0) logTemp("发现 " + emptyLinks + " 个无效链接 (空href或 # )", "warn");

    const scripts = doc.querySelectorAll("script[src]").length;
    const css = doc.querySelectorAll("link[rel='stylesheet']").length;
    const imgs = doc.querySelectorAll("img").length;
    logTemp("资源引用: script×" + scripts + " style×" + css + " img×" + imgs, "info");

    logTemp("可视DOM树 (支持点击展开):", "head");
    const treeHTML = buildDOMTree(doc.documentElement, 0);
    logNodeTemp("", `<div style="font-family:monospace;font-size:12px;line-height:1.4;">${treeHTML}</div>`, "");
  }

  async function sandboxRunJS(jsUrl, src) {
    const isESM =
      /\.mjs(\?|#|$)/i.test(jsUrl) ||
      /\bimport\.meta\b/.test(src) ||
      /\bimport\s+[\{*a-zA-Z'"]/.test(src) ||
      /\bexport\s+[\{*a-zA-Z]/.test(src);

    logTemp("沙箱模式: " + (isESM ? "ESM模块（type=module）" : "经典脚本（classic）"), "info");
    logTemp("沙箱环境: 无同源权限 (sandbox='allow-scripts')", "dim");

    // ===== [新增] SourceMap 检测 =====
    const smMatch = src.match(/\/\/[#@]\s*sourceMappingURL=(\S+)/);
    if (smMatch) {
      logTemp("发现Source Map: " + smMatch[1], "warn");
      logTemp("提示：该JS包含SourceMap，可通过F12或第三方工具还原未压缩源码", "dim");
    }

    let baseHref = "";
    try {
      const u = new URL(jsUrl);
      u.pathname = u.pathname.substring(0, u.pathname.lastIndexOf("/") + 1);
      u.search = ""; u.hash = "";
      baseHref = u.href;
    } catch (_) {}

    const safeSrc = src.replace(/<\x2Fscript/gi, '<\\\x2Fscript');

    const scriptBlock = isESM
      ? '\x3Cscript type="module">\n' +
        safeSrc + '\n' +
        '\x3C/script>\n'
      : '\x3Cscript>\n' +
        'try {\n' + safeSrc + '\n' +
        '} catch (e) {\n' +
        '  parent.postMessage({\n' +
        '    __probeSandbox: true,\n' +
        '    type: "JS-SYNC-ERR",\n' +
        '    err: { message: e.message, stack: e.stack }\n' +
        '  }, "*");\n' +
        '}\n' +
        '\x3C/script>\n';

    const sandboxHtml =
      '<!DOCTYPE html>\n' +
      '<html><head>\n' +
      '<meta charset="utf-8">\n' +
      (baseHref ? '<base href="' + baseHref.replace(/"/g, '&quot;') + '">\n' : '') +
      '\x3Cscript>\n' +
      '  window.addEventListener("error", function(e) {\n' +
      '    var isSyntax = e.error && e.error.name === "SyntaxError";\n' +
      '    parent.postMessage({\n' +
      '      __probeSandbox: true,\n' +
      '      type: isSyntax ? "JS-SYNTAX-ERR" : "JS-RUNTIME-ERR",\n' +
      '      err: {\n' +
      '        message: e.message || (e.error && e.error.message) || String(e.error),\n' +
      '        line: e.lineno || 0,\n' +
      '        col: e.colno || 0,\n' +
      '        file: e.filename || "",\n' +
      '        stack: e.error && e.error.stack ? e.error.stack : ""\n' +
      '      }\n' +
      '    }, "*");\n' +
      '    e.preventDefault();\n' +
      '  }, true);\n' +
      '  window.addEventListener("unhandledrejection", function(e) {\n' +
      '    var r = e.reason;\n' +
      '    parent.postMessage({\n' +
      '      __probeSandbox: true,\n' +
      '      type: "JS-PROMISE-ERR",\n' +
      '      err: {\n' +
      '        message: (r && r.message) || String(r),\n' +
      '        stack: r && r.stack ? r.stack : ""\n' +
      '      }\n' +
      '    }, "*");\n' +
      '  });\n' +
      '\x3C/script>\n' +
      scriptBlock +
      '</head><body></body></html>';

    const iframe = document.createElement("iframe");
    iframe.setAttribute("sandbox", "allow-scripts");
    iframe.style.cssText = "position:absolute;left:-9999px;width:1px;height:1px;opacity:0;";
    iframe.srcdoc = sandboxHtml;

    return new Promise((resolve) => {
      let errorCount = 0;
      let timer = null;

      const onMessage = (e) => {
        if (!e.data || e.data.__probeSandbox !== true) return;
        errorCount++;
        const { type, err } = e.data;

        logTemp("[" + type + "] " + err.message, type === "JS-SYNTAX-ERR" ? "err" : "err");
        if (err.file) logTemp("  ⤷ " + err.file + (err.line ? ":" + err.line : ""), "dim", { cls: "is-stack" });
        else if (err.line) logTemp("  ⤷ 位置: 第 " + err.line + " 行", "dim", { cls: "is-stack" });
        if (err.stack) {
          const frames = parseStack(err.stack);
          frames.slice(0, 5).forEach(f => {
            if (f.url) logTemp("  at " + f.fn + " (" + f.url + ":" + f.line + ")", "dim", { cls: "is-stack" });
          });
        }

        const entry = devtools.pushError({
          type: type,
          errName: "SandboxError",
          message: err.message,
          url: err.file || jsUrl,
          line: err.line || 0,
          col: err.col || 0,
          stack: err.stack || ""
        });
        btnErr.classList.add("has-errors");
        btnErr.textContent = "错误·" + devtools.errors.length;
      };

      window.addEventListener("message", onMessage);
      document.body.appendChild(iframe);

      timer = setTimeout(() => {
        window.removeEventListener("message", onMessage);
        iframe.remove();
        if (errorCount === 0) {
          logTemp("沙箱执行完毕：未捕获到错误", "ok");
          if (isESM) {
            logTemp("注：若该模块依赖其他子模块，且目标服务器未开启CORS，可能已静默失败", "dim");
          }
          resolve({ ok: true });
        } else {
          logTemp("沙箱执行完毕：共捕获 " + errorCount + " 个错误", "warn");
          resolve({ ok: false });
        }
      }, isESM ? 4000 : 3000);
    });
  }

  function idbOpenExisting(factory, name, timeoutMs) {
    timeoutMs = timeoutMs || 2000;
    return new Promise((resolve, reject) => {
      let settled = false;
      const req = factory.open(name);
      req.onupgradeneeded = () => {
        try { req.transaction.abort(); } catch (_) {}
      };
      req.onsuccess = () => {
        if (settled) return; settled = true;
        resolve(req.result);
      };
      req.onerror = () => {
        if (settled) return; settled = true;
        reject(req.error || new Error("open 失败"));
      };
      req.onblocked = () => {
        if (settled) return; settled = true;
        reject(new Error("被其他连接阻塞（其他tab正在升级）"));
      };
      setTimeout(() => {
        if (settled) return; settled = true;
        reject(new Error("打开超时（" + timeoutMs + "ms）"));
      }, timeoutMs);
    });
  }

  function idbCountStore(db, storeName) {
    return new Promise((resolve) => {
      try {
        const tx = db.transaction(storeName, "readonly");
        const req = tx.objectStore(storeName).count();
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => resolve(-1);
        setTimeout(() => resolve(-1), 1000);
      } catch (_) { resolve(-1); }
    });
  }

  async function probeIndexedDB(factory, label) {
    const result = { supported: false, enumerable: false, databases: [] };
    if (!factory) return result;
    result.supported = true;

    if (typeof factory.databases !== "function") {
      logTemp("[" + label + "] IndexedDB 存在，但indexedDB.databases()不可用，无法枚举库名", "warn");
      return result;
    }
    result.enumerable = true;

    let list;
    try {
      list = await factory.databases();
    } catch (e) {
      logTemp("[" + label + "] indexedDB.databases() 调用失败：" + ((e && e.message) || e), "err");
      return result;
    }

    if (!list || !list.length) {
      logTemp("[" + label + "] IndexedDB 无已建库", "dim");
      return result;
    }

    const MAX_DB = 20;
    for (const d of list.slice(0, MAX_DB)) {
      const info = { name: d.name, version: d.version || 0, stores: [], err: null };
      try {
        const db = await idbOpenExisting(factory, d.name, 2000);
        const storeNames = Array.from(db.objectStoreNames);
        for (const sName of storeNames) {
          const cnt = await idbCountStore(db, sName);
          info.stores.push({ name: sName, count: cnt });
        }
        db.close();
      } catch (e) {
        info.err = (e && e.message) || String(e);
      }
      result.databases.push(info);
    }
    if (list.length > MAX_DB) result.truncated = list.length - MAX_DB;
    return result;
  }

  function logIndexedDBResult(result, label) {
    if (!result.supported) {
      logTemp("[" + label + "] 浏览器不支持IndexedDB", "dim");
      return;
    }
    if (!result.enumerable) return;
    if (!result.databases.length) return;

    let totalStores = 0;
    result.databases.forEach(d => { totalStores += d.stores.length; });
    logTemp("[" + label + "] IndexedDB: " + result.databases.length + " 个库，" +
        totalStores + " 个 objectStore", "info");

    result.databases.forEach(d => {
      logTemp("  · DB " + d.name + " (v" + d.version + ")", "dim", { cls: "is-stack" });
      if (d.err) {
        logTemp("    ⚠ " + d.err, "warn", { cls: "is-stack" });
      }
      d.stores.forEach(s => {
        const cnt = s.count >= 0 ? s.count + " 条" : "读取失败";
        logTemp("    ▸ store " + s.name + " — " + cnt, "dim", { cls: "is-stack" });
      });
    });
    if (result.truncated) {
      logTemp("  …另有 " + result.truncated + " 个库省略", "dim");
    }
  }

  async function probeIframeStorage(w, label) {
    const out = {
      label,
      origin: "",
      localStorage: null,
      sessionStorage: null,
      indexedDB: null,
      blocked: false,
      reason: ""
    };

    try { out.origin = w.location.href; }
    catch (e) {
      out.blocked = true;
      out.reason = "跨域：" + ((e && e.name) || "SecurityError");
      return out;
    }

    try {
      const ls = w.localStorage;
      const total = ls.length;
      let bytes = 0;
      const items = [];
      const keys = [];
      for (let i = 0; i < total; i++) {
        try { const k = ls.key(i); if (k != null) keys.push(k); } catch (_) {}
      }
      keys.forEach(k => {
        try {
          const v = ls.getItem(k) || "";
          const b = k.length + v.length;
          bytes += b;
          items.push({ k, b, preview: v.slice(0, 60) });
        } catch (_) {}
      });
      out.localStorage = { count: items.length, bytes, items };
    } catch (e) {
      out.localStorage = { error: (e && e.message) || String(e) };
    }

    try {
      const ss = w.sessionStorage;
      const total = ss.length;
      let bytes = 0;
      const items = [];
      const keys = [];
      for (let i = 0; i < total; i++) {
        try { const k = ss.key(i); if (k != null) keys.push(k); } catch (_) {}
      }
      keys.forEach(k => {
        try {
          const v = ss.getItem(k) || "";
          const b = k.length + v.length;
          bytes += b;
          items.push({ k, b, preview: v.slice(0, 60) });
        } catch (_) {}
      });
      out.sessionStorage = { count: items.length, bytes, items };
    } catch (e) {
      out.sessionStorage = { error: (e && e.message) || String(e) };
    }

    try {
      out.indexedDB = await probeIndexedDB(w.indexedDB, label);
    } catch (e) {
      out.indexedDB = { supported: false, error: (e && e.message) || String(e) };
    }

    return out;
  }

  function logIframeStorage(r) {
    logTemp("──── iframe存储快照（" + r.label + "）────", "head");
    if (r.blocked) {
      logTemp(r.reason + "：无法读取iframe内的任何存储", "warn");
      logTemp("这是浏览器同源策略的硬限制，非代码bug", "dim");
      return;
    }
    logTemp("origin: " + r.origin, "info");

    if (r.localStorage && !r.localStorage.error) {
      logTemp("localStorage: " + r.localStorage.count + " 项，约 " +
          (r.localStorage.bytes / 1024).toFixed(1) + " KB", "info");
      r.localStorage.items.slice(0, 20).forEach(it => {
        logTemp("  · " + it.k + " (" + it.b + " B) = " + JSON.stringify(it.preview), "dim", { cls: "is-stack" });
      });
      if (r.localStorage.items.length > 20) {
        logTemp("  · …剩余 " + (r.localStorage.items.length - 20) + " 项省略", "dim");
      }
    } else if (r.localStorage) {
      logTemp("localStorage: 访问失败 — " + r.localStorage.error, "err");
    }

    if (r.sessionStorage && !r.sessionStorage.error) {
      logTemp("sessionStorage: " + r.sessionStorage.count + " 项，约 " +
          (r.sessionStorage.bytes / 1024).toFixed(1) + " KB", "info");
      r.sessionStorage.items.slice(0, 20).forEach(it => {
        logTemp("  · " + it.k + " (" + it.b + " B) = " + JSON.stringify(it.preview), "dim", { cls: "is-stack" });
      });
      if (r.sessionStorage.items.length > 20) {
        logTemp("  · …剩余 " + (r.sessionStorage.items.length - 20) + " 项省略", "dim");
      }
    } else if (r.sessionStorage) {
      logTemp("sessionStorage: 访问失败 — " + r.sessionStorage.error, "err");
    }

    logIndexedDBResult(r.indexedDB, r.label);
  }

  function stageIframe(url) {
    return new Promise((resolve) => {
      const iframe = document.createElement("iframe");
      iframe.setAttribute("sandbox",
        "allow-scripts allow-forms allow-popups allow-same-origin");
      iframe.setAttribute("referrerpolicy", "no-referrer");
      iframe.style.cssText =
        "position:absolute;left:-9999px;top:0;width:" + Math.max(320, window.innerWidth) +
        "px;height:" + Math.max(480, window.innerHeight) +
        "px;border:0;visibility:hidden;";

      let done = false;
      const s = performance.now();
      const timer = setTimeout(() => fin(false, "超时 15s"), 15000);

      function fin(ok, note) {
        if (done) return; done = true; clearTimeout(timer);
        const ms = (performance.now() - s) | 0;
        if (ok) {
          log("[IFRAME] 加载完成，耗时 " + ms + " ms", "ok");
          log("注意：load 事件不代表真实渲染成功。X-Frame-Options / CSP frame-ancestors拒绝时仍会触发load", "dim");
        } else {
          log("[IFRAME] 加载失败，耗时 " + ms + " ms：" + note, "err");
        }
        iframe.remove();
        resolve(ok);
      }

      async function tryBridgeAndStorage() {
        const w = iframe.contentWindow;
        if (!w) return;
        try {
          // eslint-disable-next-line no-unused-expressions
          w.location.href;
        } catch (_) {
          log("[IFRAME] 跨域限制，无法桥接运行时错误与存储探测", "warn");
          log("说明：浏览器同源策略禁止父页读取跨域iframe的error / storage / indexedDB", "dim");
          log("替代方案：查看阶段 4「JS静态审计」/ 使用浏览器F12 Application面板", "dim");
          return;
        }

        w.addEventListener("error", (ev) => {
          const err = ev.error;
          const entry = devtools.pushError({
            type: "IFRAME-JS",
            errName: (err && err.name) || "Error",
            message: (ev.message || (err && err.message) || "(unknown)"),
            url: ev.filename || "",
            line: ev.lineno || 0,
            col: ev.colno || 0,
            stack: err && err.stack ? String(err.stack) : ""
          });
          logErrorEntry(entry);
          btnErr.classList.add("has-errors");
          btnErr.textContent = "错误·" + devtools.errors.length;
        });
        w.addEventListener("unhandledrejection", (ev) => {
          const r = ev.reason;
          const isErr = r instanceof Error;
          const entry = devtools.pushError({
            type: "IFRAME-PROMISE",
            errName: isErr ? (r.name || "Error") : "PromiseRejection",
            message: isErr ? r.message : String(r),
            url: "", line: 0, col: 0,
            stack: isErr && r.stack ? String(r.stack) : ""
          });
          logErrorEntry(entry);
          btnErr.classList.add("has-errors");
          btnErr.textContent = "错误·" + devtools.errors.length;
        });
        log("[IFRAME] 同源可访问，已桥接JS错误监听", "ok");
        log("提示：桥接只捕获load之后发生的错误，解析期错误已在浏览器内抛出、无法拦截", "dim");

        try {
          log("[IFRAME] 正在探测iframe内存储（localStorage / sessionStorage / IndexedDB）…", "info");
          const snap = await probeIframeStorage(w, "iframe(" + url + ")");
          lastIframeStorage = snap;
          logIframeStorage(snap);
        } catch (e) {
          log("[IFRAME] 存储探测异常：" + ((e && e.message) || e), "err");
        }
      }

      iframe.onload  = async () => { await tryBridgeAndStorage(); fin(true); };
      iframe.onerror = () => fin(false, "onerror 触发");
      document.body.appendChild(iframe);
      iframe.src = url;
    });
  }

  function printNetwork() {
    const list = devtools.netLog;
    logTemp("──── 网络缓冲区（" + list.length + " 条） ────", "head");
    if (!list.length) { logTemp("暂无网络记录", "dim"); return; }
    
    const maxMs = Math.max(...list.map(r => r.ms), 100);

    list.forEach((r, i) => {
      const barWidth = Math.max(2, (r.ms / maxMs) * 100);
      const color = r.ok ? '#0f0' : '#f66';
      const statusText = r.status ? r.status : 'ERR';
      const tag = r.internal ? " [探针]" : "";
      
      const html = `
        <div style="display:flex;align-items:center;gap:6px;font-size:12px;margin:2px 0;border-bottom:1px solid #222;padding-bottom:2px;">
          <span style="color:#888;width:20px;">#${i+1}</span>
          <span style="color:${color};width:36px;">${statusText}</span>
          <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#0ff;" title="${r.url}">${r.url}${tag}</span>
          <div style="width:60px;height:8px;background:#222;position:relative;border-radius:4px;overflow:hidden;">
             <div style="position:absolute;left:0;top:0;height:100%;width:${barWidth}%;background:${color};"></div>
          </div>
          <span style="color:#888;width:40px;text-align:right;">${r.ms}ms</span>
        </div>
      `;
      logNodeTemp("", html, "");
    });
    logTemp("提示：长按「网络」按钮 0.7s 可清空缓冲区", "dim");
  }

  function printPerf() {
    const p = devtools.perfStats;
    logTemp("──── 性能指标 (探针页自身) ────", "head");
    
    if (p.lcp) {
      const grade = p.lcp <= 2500 ? "良好" : p.lcp <= 4000 ? "需改进" : "较差";
      logTemp("LCP 最大内容绘制: " + p.lcp.toFixed(0) + " ms（" + grade + "）", p.lcp <= 2500 ? "ok" : p.lcp <= 4000 ? "warn" : "err");
    } else {
      logTemp("LCP: 未采集到", "dim");
    }
    const clsGrade = p.cls <= 0.1 ? "良好" : p.cls <= 0.25 ? "需改进" : "较差";
    logTemp("CLS 累积布局偏移: " + p.cls.toFixed(3) + "（" + clsGrade + "）", p.cls <= 0.1 ? "ok" : p.cls <= 0.25 ? "warn" : "err");
    if (p.longTasks.length) {
      logTemp("长任务(>50ms): " + p.longTasks.length + " 个，累计 " + p.longTaskTotal.toFixed(0) + " ms", "warn");
    } else {
      logTemp("长任务: 无", "ok");
    }

    if (performance.memory) {
      const used = (performance.memory.usedJSHeapSize / 1048576).toFixed(2);
      const total = (performance.memory.totalJSHeapSize / 1048576).toFixed(2);
      logTemp(`JS 堆内存: 已用 ${used} MB / 分配 ${total} MB`, "info");
    }

    const t = performance.timing;
    if (t && t.loadEventEnd > 0) {
      const dns = t.domainLookupEnd - t.domainLookupStart;
      const tcp = t.connectEnd - t.connectStart;
      const ttfb = t.responseStart - t.requestStart;
      const download = t.responseEnd - t.responseStart;
      const domReady = t.domContentLoadedEventEnd - t.navigationStart;
      
      logTemp("── 导航阶段耗时 ──", "warn");
      logTemp(`  DNS 解析: ${dns}ms | TCP 连接: ${tcp}ms`, "dim");
      logTemp(`  首字节(TTFB): ${ttfb}ms | 资源下载: ${download}ms`, "dim");
      logTemp(`  DOM 就绪: ${domReady}ms`, "dim");
    }

    const res = performance.getEntriesByType("resource");
    if (res.length) {
      const slowest = res.sort((a, b) => b.duration - a.duration).slice(0, 5);
      logTemp("── 加载最慢的 5 个资源 ──", "warn");
      slowest.forEach(r => {
        const name = r.name.split('/').pop().split('?')[0].slice(0, 30);
        logTemp(`  ${r.duration.toFixed(0)}ms - ${name}`, "dim");
      });
    }
  }

  async function printStorage() {
    logTemp("──── 存储摘要 ────", "head");

    logTemp("【探针页自身】", "warn");
    [["localStorage", localStorage], ["sessionStorage", sessionStorage]].forEach(([name, store]) => {
      let total = 0;
      try { total = store.length; } catch (_) { logTemp(name + ": 不可访问", "err"); return; }
      const keys = [];
      for (let i = 0; i < total; i++) {
        try { const k = store.key(i); if (k != null) keys.push(k); } catch (_) {}
      }
      let bytes = 0;
      const items = [];
      keys.forEach(k => {
        try {
          const v = store.getItem(k) || "";
          const b = k.length + v.length;
          bytes += b;
          items.push({ k, b });
        } catch (_) {}
      });
      logTemp(name + ": " + items.length + " 项，约 " + (bytes / 1024).toFixed(1) + " KB", "info");
    });

    try {
      const idbResult = await probeIndexedDB(window.indexedDB, "探针页");
      logIndexedDBResult(idbResult, "探针页");
    } catch (e) {
      logTemp("[探针页] IndexedDB 探测异常：" + ((e && e.message) || e), "err");
    }

    logTemp("【Cookies】", "warn");
    const cookies = document.cookie.split(";").filter(Boolean);
    if (!cookies.length) {
      logTemp("无可见 Cookie (HttpOnly 无法被 JS 读取)", "dim");
    } else {
      cookies.forEach(c => {
        const [k, ...v] = c.trim().split("=");
        logTemp(`  · ${k} = ${v.join("=")}`, "dim");
      });
    }

    if (window.caches) {
      try {
        const cacheKeys = await caches.keys();
        logTemp(`【Cache Storage】共 ${cacheKeys.length} 个缓存库`, "warn");
        for (const key of cacheKeys) {
          const cache = await caches.open(key);
          const keys = await cache.keys();
          logTemp(`  · 缓存名称: ${key} (${keys.length} 个资源)`, "dim");
        }
      } catch (e) {
        logTemp("Cache API 不可访问", "warn");
      }
    }

    if (lastIframeStorage) {
      logTemp("", "dim");
      logTemp("【最近一次探测的 iframe 快照】", "head");
      logIframeStorage(lastIframeStorage);
    }
  }

  function printErrors() {
    const list = devtools.errors;
    logTemp("──── 错误汇总（共 " + list.length + " 条唯一错误）────", "head");
    if (!list.length) { logTemp("未捕获到任何错误", "ok"); return; }
    const byType = {};
    list.forEach(e => { byType[e.type] = (byType[e.type] || 0) + 1; });
    logTemp("按类型: " + Object.keys(byType).map(k => k + "×" + byType[k]).join("  "), "info");
    const totalHits = list.reduce((a, e) => a + e.count, 0);
    logTemp("总命中次数: " + totalHits + "（同一条错误会被合并计数）", "info");
    logTemp("", "dim");
    list.forEach((e, i) => {
      const countTag = e.count > 1 ? " ×" + e.count : "";
      const errLabel = e.errName && e.errName !== e.type ? e.errName + ": " : "";
      const color = e.type === "CSP" || e.type === "RES-FAIL" ? "warn" : "err";
      logTemp("#" + (i + 1) + " [" + e.type + countTag + "] " + errLabel + e.message, color);
      if (e.url) {
        const pos = e.line ? ":" + e.line + (e.col ? ":" + e.col : "") : "";
        logTemp("  ⤷ " + e.url + pos, "dim", { cls: "is-stack" });
      }
      const frames = parseStack(e.stack);
      frames.slice(0, 10).forEach(f => {
        if (f.raw && !f.url) {
          logTemp("  " + f.raw, "dim", { cls: "is-stack" });
        } else if (f.url) {
          const pos = f.line ? ":" + f.line + (f.col ? ":" + f.col : "") : "";
          logTemp("  at " + f.fn + " (" + f.url + pos + ")", "dim", { cls: "is-stack" });
        }
      });
      if (frames.length > 10) {
        logTemp("  …还有 " + (frames.length - 10) + " 帧省略", "dim", { cls: "is-stack" });
      }
    });
  }

  async function copyOutput() {
    const text = out.innerText || out.textContent || "";
    if (!text.trim()) { log("输出为空，无需复制", "warn"); return; }
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
      } else {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.cssText = "position:fixed;left:-9999px;top:0;opacity:0;";
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand("copy");
        ta.remove();
        if (!ok) throw new Error("execCommand 返回 false");
      }
      log("已复制输出内容（" + text.length + " 字符）到剪贴板", "ok");
    } catch (e) {
      log("复制失败：" + ((e && e.message) || e), "err");
    }
    out.scrollTop = out.scrollHeight;
  }

  async function run(raw) {
    if (running) return;
    running = true;
    btn.disabled = true;
    btn.textContent = "探测中…";
    
    sessionLogs = [];
    viewMode = 'logs';
    out.innerHTML = "";
    rowCount = 0;
    t0 = performance.now();
    lastResources = [];
    lastResults = [];
    lastAudit = null;
    lastIframeStorage = null;
    lastTarget = "";
    btnExp.disabled = true;
    devtools.errors.length = 0;
    btnErr.classList.remove("has-errors");
    btnErr.textContent = "错误";
    closeRepl();

    try {
      let v = (raw || "").trim();
      if (!v) { log("请输入网址", "err"); return; }
      if (!/^[a-z][a-z0-9+.\-]*:\/\//i.test(v)) v = "https://" + v;

      let target;
      try { target = new URL(v); }
      catch (_) { log("URL 格式非法: " + raw, "err"); return; }

      if (!/^https?:$/.test(target.protocol)) {
        log("仅支持 http/https，当前协议: " + target.protocol, "err");
        return;
      }

      log("探测目标: " + target.href, "head");
      saveHistory(target.href);
      log("探针环境: " + navigator.userAgent, "dim");
      log("视口: " + window.innerWidth + "×" + window.innerHeight +
          " · DPR " + (window.devicePixelRatio || 1), "dim");
      
      if (target.protocol === "http:" && target.hostname !== "localhost" && target.hostname !== "127.0.0.1") {
        log("⚠️ 安全警告：目标站点使用明文 HTTP，极易被中间人劫持！", "err");
      }

      log("──── 阶段 1 / 5：网络可达性 ────", "head");
      const reachable = await stageReach(target.href);

      log("──── 阶段 2 / 5：内容抓取与解析 ────", "head");
      const html = await stageContent(target.href);

      let inventory = [], results = [];
      if (html) {
        log("──── 阶段 3 / 5：资源清单 + 探测 ────", "head");
        const r = await stageResources(target.href, html);
        inventory = r.inventory;
        results   = r.results;
        lastResources = inventory;
        lastResults   = results;
        lastTarget = target.href;
        btnExp.disabled = !inventory.length;
      } else {
        log("──── 阶段 3 / 5：资源探测（已跳过） ────", "head");
        log("未获取 HTML 源码，无法枚举资源", "warn");
      }

      if (inventory.length) {
        log("──── 阶段 4 / 5：JS 静态审计 ────", "head");
        lastAudit = await stageJsAudit(inventory);
      } else {
        log("──── 阶段 4 / 5：JS 静态审计（已跳过） ────", "head");
      }

      log("──── 阶段 5 / 5：页面渲染 + 同源存储探测（iframe） ────", "head");
      await stageIframe(target.href);

      log("════════ 探测结束 ════════", "head");
      log("总耗时: " + now() + " ms", "ok");
      log("网络可达性: " + (reachable ? "通" : "不通"), reachable ? "ok" : "err");
      log("HTML 源码: " + (html ? "已获取（" + html.length + " 字符）" : "未获取（CORS 限制）"),
          html ? "ok" : "warn");
      log("资源清单: " + inventory.length + " 条完整地址", inventory.length ? "ok" : "warn");
      if (results.length) {
        const okN = results.filter(r => r.ok).length;
        log("可达性探测: 共 " + results.length + "，可达 " + okN +
            "，失败 " + (results.length - okN),
            okN === results.length ? "ok" : "warn");
      }
      if (devtools.errors.length) {
        log("错误捕获: " + devtools.errors.length + " 条唯一错误（点「错误」查看详情）", "err");
      } else {
        log("错误捕获: 无", "ok");
      }
      if (lastAudit && lastAudit.issues.length) {
        const errs = lastAudit.issues.filter(i => i.level === "err").length;
        log("JS 静态审计: " + lastAudit.issues.length + " 项问题" +
            (errs ? "（其中 " + errs + " 项错误）" : ""),
            errs ? "err" : "warn");
      }
      if (lastIframeStorage) {
        if (lastIframeStorage.blocked) {
          log("iframe 存储: 跨域，未探测（同源策略限制）", "warn");
        } else {
          const ls = lastIframeStorage.localStorage;
          const ss = lastIframeStorage.sessionStorage;
          const idb = lastIframeStorage.indexedDB;
          log("iframe 存储: localStorage " + (ls && !ls.error ? ls.count + " 项" : "失败") +
              " · sessionStorage " + (ss && !ss.error ? ss.count + " 项" : "失败") +
              " · IndexedDB " + (idb && idb.enumerable ? idb.databases.length + " 库" : "不可枚举"),
              "ok");
        }
      }
    } catch (e) {
      log("探针内部异常: " + ((e && e.message) || e), "err");
      if (e && e.stack) console.error(e);
    } finally {
      running = false;
      btn.disabled = false;
      btn.textContent = "开始探测";
    }
  }
