  menuHighlightLine.addEventListener('click', e => {
    e.stopPropagation();
    highlightCurrentLineEnabled = !highlightCurrentLineEnabled;
    menuHighlightLine.setAttribute('aria-checked', String(highlightCurrentLineEnabled));
    updateCurrentLineHighlight();
    showToast(highlightCurrentLineEnabled ? '已开启当前行高亮' : '已关闭当前行高亮');
  });

  menuAutoIndent.addEventListener('click', e => {
    e.stopPropagation();
    autoIndentEnabled = !autoIndentEnabled;
    menuAutoIndent.setAttribute('aria-checked', String(autoIndentEnabled));
    showToast(autoIndentEnabled ? '已开启自动缩进' : '已关闭自动缩进');
  });

  menuHistory.addEventListener('click', () => {
    closeAllMenus();
    openHistory();
  });
  menuResetExample.addEventListener('click', () => {
    closeAllMenus();
    codeEl.value = DEFAULT_CODE;
    renderEditor();
    render();
    saveDraftDebounced();
    snapshot(true);
    showToast('已恢复示例代码');
  });

  menuClearDraft.addEventListener('click', () => {
    closeAllMenus();
    try { localStorage.removeItem(DRAFT_KEY); } catch (_) {}
    showToast('草稿已清空（当前编辑内容保留）');
  });

  document.addEventListener('click', e => {
    if (!e.target.closest('#previewActions')) {
      previewMenu.hidden = true;
      btnPreviewMenu.setAttribute('aria-expanded', 'false');
    }
    if (!e.target.closest('#editorActions')) {
      editorMenu.hidden = true;
      btnEditorMenu.setAttribute('aria-expanded', 'false');
    }
    if (!e.target.closest('#findPanel') &&
        !e.target.closest('#menuFind') &&
        e.target !== codeEl &&
        !findPanel.hidden) {
    }
  });

  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (!historyMask.hidden) { closeHistory(); return; }
    if (!modalMask.hidden) { closeModal(); return; }
    if (!findPanel.hidden) { closeFindPanel(); return; }
    closeAllMenus();
  });

  findPrev.addEventListener('click', () => findNextMatch(true));
  findNext.addEventListener('click', () => findNextMatch(false));
  findReplace.addEventListener('click', replaceOne);
  findReplaceAll.addEventListener('click', replaceAll);
  findClose.addEventListener('click', closeFindPanel);

  findInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      findNextMatch(e.shiftKey);
    }
  });

  replaceInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      replaceOne();
    }
  });

  exportWInput.addEventListener('input', syncHeightFromWidth);
  exportHInput.addEventListener('input', syncWidthFromHeight);

  exportLock.addEventListener('click', () => {
    if (!exportState) return;
    exportState.lockRatio = !exportState.lockRatio;
    exportLock.textContent = exportState.lockRatio ? '🔒' : '🔓';
    exportLock.classList.toggle('is-locked', exportState.lockRatio);
    exportLock.setAttribute('aria-pressed', String(exportState.lockRatio));
    if (exportState.lockRatio) syncHeightFromWidth();
  });

  exportFormat.addEventListener('change', () => {
    if (!exportState) return;
    const isJpg = exportFormat.value === 'jpg';
    bgRow.hidden = isJpg;
    if (isJpg) exportWhiteBg.checked = false;
  });

  exportOriginal.addEventListener('click', () => {
    if (!exportState) return;
    exportWInput.value = exportState.originWidth;
    exportHInput.value = exportState.originHeight;
  });

  exportCancel.addEventListener('click', closeModal);
  exportConfirm.addEventListener('click', confirmExport);

  modalMask.addEventListener('click', e => {
    if (e.target === modalMask) closeModal();
  });

  historyClose.addEventListener('click', closeHistory);
  historyMask.addEventListener('click', e => {
    if (e.target === historyMask) closeHistory();
  });
  historyClear.addEventListener('click', () => {
    try { localStorage.removeItem(HISTORY_KEY); } catch (_) {}
    historyList.innerHTML = '<div class="history-empty">暂无历史版本</div>';
    showToast('历史版本已清空');
  });

  warningClose.addEventListener('click', hideWarning);

  fileInput.addEventListener('change', e => {
    const f = e.target.files?.[0];
    if (f) loadFile(f);
    e.target.value = '';
  });

  let dragCounter = 0;

  window.addEventListener('dragenter', e => {
    if (!e.dataTransfer) return;
    const types = e.dataTransfer.types || [];
    if (!Array.from(types).includes('Files')) return;
    e.preventDefault();
    dragCounter++;
    dropOverlay.hidden = false;
  });

  window.addEventListener('dragover', e => {
    if (!e.dataTransfer) return;
    const types = e.dataTransfer.types || [];
    if (!Array.from(types).includes('Files')) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
    try {
      const items = e.dataTransfer.items;
      if (items && items.length > 0 && items[0].kind === 'file') {
        const type = items[0].type || '';
        if (/svg/i.test(type)) {
          dropOverlayText.textContent = '松开以载入 SVG 文件';
        } else if (type) {
          dropOverlayText.textContent = `松开以载入：${type}`;
        }
      }
    } catch (_) {}
  });

  window.addEventListener('dragleave', e => {
    e.preventDefault();
    dragCounter--;
    if (dragCounter <= 0) {
      dragCounter = 0;
      dropOverlay.hidden = true;
      dropOverlayText.textContent = '松开以载入文件（SVG）';
    }
  });

  window.addEventListener('drop', e => {
    e.preventDefault();
    dragCounter = 0;
    dropOverlay.hidden = true;
    dropOverlayText.textContent = '松开以载入文件（SVG）';
    const file = e.dataTransfer?.files?.[0];
    if (file) loadFile(file);
  });

  bgBtns.forEach(btn => {
    btn.addEventListener('click', () => setPreviewBg(btn.dataset.bg));
  });

  previewWrap.addEventListener('wheel', e => {
    if (!currentSvg || !modalMask.hidden) return;
    if (e.target.closest &&
        e.target.closest('.preview-actions, .view-controls, .warning-bar')) return;
    e.preventDefault();
    const rect = getPreviewRect();
    const cx = e.clientX - rect.left;
    const cy = e.clientY - rect.top;
    const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
    zoomAt(factor, cx, cy);
  }, { passive: false });

  zoomInBtn.addEventListener('click', () => zoomByButton(1.25));
  zoomOutBtn.addEventListener('click', () => zoomByButton(1 / 1.25));

  zoomResetBtn.addEventListener('click', () => {
    if (!currentSvg) return;
    fitToView();
    showToast('视图已重置为适应窗口');
  });

  let isDragging = false;
  let hasMoved = false;
  let dragStartX = 0, dragStartY = 0;
  let dragStartTx = 0, dragStartTy = 0;

  const activePointers = new Map();
  let pinchStartDist = 0;
  let pinchStartScale = 1;
  let pinchStartTx = 0;
  let pinchStartTy = 0;
  let pinchCenterX = 0;
  let pinchCenterY = 0;

  previewWrap.addEventListener('pointerdown', e => {
    if (!currentSvg || !modalMask.hidden) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (e.target.closest &&
        e.target.closest('.preview-actions, .view-controls, .warning-bar')) return;

    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (activePointers.size === 2) {
      const pts = Array.from(activePointers.values());
      pinchStartDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      pinchStartScale = previewScale;
      pinchStartTx = previewTx;
      pinchStartTy = previewTy;
      const rect = getPreviewRect();
      pinchCenterX = (pts[0].x + pts[1].x) / 2 - rect.left;
      pinchCenterY = (pts[0].y + pts[1].y) / 2 - rect.top;
      isDragging = false;
      hasMoved = true;
      try { previewWrap.setPointerCapture(e.pointerId); } catch (err) {}
      return;
    }

    isDragging = true;
    hasMoved = false;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    dragStartTx = previewTx;
    dragStartTy = previewTy;
    try { previewWrap.setPointerCapture(e.pointerId); } catch (err) {}
  });

  previewWrap.addEventListener('pointermove', e => {
    if (activePointers.has(e.pointerId)) {
      activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    }

    if (activePointers.size === 2 && pinchStartDist > 0) {
      const pts = Array.from(activePointers.values());
      const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      const newScale = clamp(pinchStartScale * (dist / pinchStartDist), 0.05, 20);
      if (newScale !== previewScale) {
        const size = getSize(currentSvg);
        const rect = getPreviewRect();
        const s0 = pinchStartScale;
        const s1 = newScale;
        // 用初始中心点保持内容不漂移
        const offsetX0 = (rect.width  - size.width  * s0) / 2 + pinchStartTx;
        const offsetY0 = (rect.height - size.height * s0) / 2 + pinchStartTy;
        const px = (pinchCenterX - offsetX0) / s0;
        const py = (pinchCenterY - offsetY0) / s0;
        const newOffsetX = pinchCenterX - px * s1;
        const newOffsetY = pinchCenterY - py * s1;
        previewTx = newOffsetX - (rect.width  - size.width  * s1) / 2;
        previewTy = newOffsetY - (rect.height - size.height * s1) / 2;
        previewScale = s1;
        applyView();
      }
      return;
    }

    if (!isDragging) return;
    const dx = e.clientX - dragStartX;
    const dy = e.clientY - dragStartY;
    if (!hasMoved && (Math.abs(dx) > 2 || Math.abs(dy) > 2)) hasMoved = true;
    if (hasMoved) {
      previewTx = dragStartTx + dx;
      previewTy = dragStartTy + dy;
      applyView();
    }
  });

  function endDrag(e) {
    if (activePointers.has(e.pointerId)) {
      activePointers.delete(e.pointerId);
    }
    if (activePointers.size < 2) {
      pinchStartDist = 0;
    }
    if (!isDragging) return;
    isDragging = false;
    try { previewWrap.releasePointerCapture(e.pointerId); } catch (err) {}
  }

  previewWrap.addEventListener('pointerup', endDrag);
  previewWrap.addEventListener('pointercancel', endDrag);

  previewWrap.addEventListener('dblclick', e => {
    if (!currentSvg || !modalMask.hidden) return;
    if (e.target.closest &&
        e.target.closest('.preview-actions, .view-controls, .warning-bar')) return;
    fitToView();
    showToast('已回中');
  });

  window.addEventListener('resize', () => {
    invalidatePreviewRect();
    if (currentSvg) applyView();
  });

  const DEFAULT_CODE = `<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320">
  <!-- 渐变与发光滤镜 -->
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="480" height="320" rx="16" fill="#0f172a"/>

  <circle cx="240" cy="140" r="64" fill="url(#grad)" filter="url(#glow)">
    <animate attributeName="r" values="58;70;58" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <text x="240" y="252" text-anchor="middle" fill="#94a3b8"
        font-family="system-ui, sans-serif" font-size="15">
    编辑下方代码，实时预览
  </text>
</svg>`;

  const draft = loadDraft();
  codeEl.value = draft || DEFAULT_CODE;

  setPreviewBg('checker');

  snapshot(true);

  renderEditor();
  render();
  applySplit();

  updateUndoRedoMenu();
})();
</script>
</body>
</html>
