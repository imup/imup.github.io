<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>randomArt可视化创意编程</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/default.min.css"
      id="cm-theme-light"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css"
      id="cm-theme-dark"
      disabled
    />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>

/* 主题变量 */
:root {
  /* 固定色（亮暗共用）*/
  --primary: #007bff;
  --primary-hover: #0056b3;
  --primary-focus: #007bff;
  --danger: #d9534f;
  --success: #28a745;
  --warn: #f0ad4e;
  --purple: #9b59b6;
  --neutral-btn: #6c757d;

  /* 亮色主题 */
  --bg: #f5f5f5;
  --surface: #ffffff;
  --text: #222222;
  --hamburger: #333333;
  --text-muted: #888888;
  --text-secondary: #888888;
  --text-tertiary: #999999;
  --text-placeholder: #9aa0a6;
  --hover: rgba(0, 0, 0, 0.055);
  --hover-strong: rgba(0, 0, 0, 0.06);
  --line: rgba(0, 0, 0, 0.08);
  --border-input: #cccccc;
  --input-bg: transparent;
  --input-bg-fill: #ffffff;
  --result-bg: #e9f7fe;
  --modal-bg: #ffffff;
  --modal-text: #222222;
  --bubble-user-bg: #007bff;
  --bubble-user-text: #ffffff;
  --bubble-assistant-bg: #e9ecef;
  --bubble-assistant-text: #222222;
  --cm-border: #cccccc;
  --shadow-modal: 0 8px 32px rgba(0, 0, 0, 0.4);
  --shadow-ai-bar: 0 8px 26px rgba(0, 0, 0, 0.16);
  --sidebar-shadow: rgba(0, 0, 0, 0.55);
  --ai-input-grad: linear-gradient(to top, #ffffff 62%, rgba(255, 255, 255, 0));
  --hover-key: rgba(240, 173, 78, 0.15);
  --hover-prompt: rgba(155, 89, 182, 0.15);
  --hover-dl: rgba(0, 0, 0, 0.08);

  --sidebar-w: min(280px, 78vw);
}

/* 暗色主题 */
body.dark-mode {
  --bg: #1e1e1e;
  --surface: #2d2d2d;
  --text: #dddddd;
  --hamburger: #ffffff;
  --text-secondary: #999999;
  --text-tertiary: #888888;
  --text-placeholder: #8a8a8a;
  --hover: rgba(255, 255, 255, 0.07);
  --hover-strong: rgba(255, 255, 255, 0.08);
  --line: rgba(255, 255, 255, 0.08);
  --border-input: #555555;
  --input-bg: #3a3a3a;
  --input-bg-fill: #3a3a3a;
  --result-bg: #2a4a5a;
  --modal-bg: #2d2d2d;
  --modal-text: #dddddd;
  --bubble-assistant-bg: #3a3a3a;
  --bubble-assistant-text: #dddddd;
  --cm-border: #555555;
  --primary-focus: #4da3ff;
  --shadow-ai-bar: 0 8px 26px rgba(0, 0, 0, 0.55);
  --sidebar-shadow: rgba(0, 0, 0, 1);
  --ai-input-grad: linear-gradient(to top, #2d2d2d 62%, rgba(45, 45, 45, 0));
  --hover-key: rgba(240, 173, 78, 0.2);
  --hover-prompt: rgba(155, 89, 182, 0.25);
  --hover-dl: rgba(255, 255, 255, 0.14);
}

/* 全局 */
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  font-family: Arial, "Helvetica Neue", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  touch-action: pan-x pan-y;
  overscroll-behavior: none;
  transition:
    background 0.3s,
    color 0.3s;
}

body.preview-lock {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: none;
}

/* 汉堡按钮 */
.hamburger-btn {
  position: fixed;
  top: clamp(8px, 2vw, 14px);
  left: clamp(10px, 3vw, 18px);
  z-index: 300;
  background: none;
  border: none;
  color: var(--hamburger);
  font-size: clamp(30px, 6vw, 40px);
  font-weight: bold;
  cursor: pointer;
  padding: 4px 8px;
  line-height: 1;
  user-select: none;
  transition:
    color 0.3s,
    opacity 0.22s ease,
    transform 0.22s ease;
}
.hamburger-btn:hover {
  transform: scale(1.1);
}

body.preview-lock .hamburger-btn {
  color: #fff;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
}
body.sidebar-open .hamburger-btn {
  opacity: 0;
  transform: scale(0.6);
  pointer-events: none;
}

/* 侧边栏 */
.sidebar {
  position: fixed;
  top: 0;
  left: 0;
  width: var(--sidebar-w);
  height: 100vh;
  height: 100dvh;
  background: var(--bg);
  color: var(--text);
  transform: translateX(-100%);
  transition:
    transform 0.3s ease,
    background 0.3s,
    color 0.3s;
  z-index: 200;
  padding: clamp(14px, 3vw, 20px) 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  -webkit-overflow-scrolling: touch;
  box-shadow: inset -22px 0 28px -26px var(--sidebar-shadow);
  border-right: 1px solid var(--line);
}
.sidebar.open {
  transform: translateX(0);
}

/* 搜索框 */
.sidebar-search {
  padding: 0 clamp(14px, 4vw, 18px) 12px;
  margin-top: -4px;
}
.sidebar-search input {
  width: 100%;
  padding: 9px 12px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--input-bg);
  color: inherit;
  font-size: 16px;
  font-family: inherit;
  outline: none;
  transition:
    border-color 0.15s,
    background 0.15s;
}
.sidebar-search input:focus {
  border-color: var(--primary-focus);
}
.sidebar-search input::placeholder {
  color: var(--text-placeholder);
}
.sidebar-search input[type="search"]::-webkit-search-cancel-button {
  -webkit-appearance: none;
  appearance: none;
  height: 14px;
  width: 14px;
  background:
    linear-gradient(
      45deg,
      transparent 45%,
      #888 45%,
      #888 55%,
      transparent 55%
    ),
    linear-gradient(
      -45deg,
      transparent 45%,
      #888 45%,
      #888 55%,
      transparent 55%
    );
  cursor: pointer;
}

/* 导航项 */
.sidebar .nav-item {
  padding: 12px clamp(16px, 4vw, 20px);
  border-bottom: 1px solid var(--line);
  cursor: pointer;
  transition: background 0.15s;
}
.sidebar .nav-item:hover {
  background: var(--hover);
}
.sidebar .nav-item[aria-current="page"] {
  background: var(--hover);
}

.sidebar .divider {
  border-top: 1px solid var(--line);
  margin: 10px 0;
}

.sidebar .section-title {
  padding: 8px clamp(16px, 4vw, 20px);
  font-size: 0.85rem;
  color: var(--text-secondary);
  font-weight: bold;
}

.sidebar .page-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px clamp(16px, 4vw, 20px) 8px clamp(22px, 6vw, 30px);
  border-bottom: 1px solid var(--line);
}
.sidebar .page-item:hover {
  background: var(--hover);
}
.sidebar .page-item .page-title {
  flex: 1;
  color: inherit;
  cursor: pointer;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.sidebar .page-item .actions button {
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 0.85rem;
  padding: 2px 5px;
  transition: color 0.15s;
}
.sidebar .page-item .actions .rename:hover {
  color: #5bc0de;
}
.sidebar .page-item .actions .del:hover {
  color: var(--danger);
}

.sidebar .no-pages {
  padding: 12px clamp(16px, 4vw, 20px);
  color: var(--text-muted);
  font-style: italic;
}

/* 侧边栏底部 */
.sidebar-footer {
  margin-top: auto;
  border-top: 1px solid var(--line);
  padding: 0;
}
.sidebar-footer .footer-row {
  display: flex;
  align-items: stretch;
}
.sidebar-footer .footer-item {
  flex: 1 1 0;
  min-width: 0;
  padding: 12px clamp(8px, 2vw, 14px);
  border-bottom: none;
  text-align: center;
  font-size: 0.9rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sidebar-footer .footer-vdivider {
  width: 1px;
  flex: 0 0 1px;
  background: var(--line);
}

/* 遮罩 */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.35);
  z-index: 150;
  opacity: 0;
  transition: opacity 0.3s ease;
}
.overlay.show {
  display: block;
  opacity: 1;
}

/* 主内容区 */
#app {
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  padding: clamp(56px, 10vw, 78px) clamp(14px, 5vw, 32px) clamp(28px, 7vw, 52px);
  background: var(--surface);
  color: var(--text);
  transition:
    background 0.3s,
    color 0.3s;
  overflow-x: hidden;
}
#app > div {
  width: 100%;
  max-width: 940px;
  margin: 0 auto;
}
#app > div.generator-page {
  max-width: none;
}

#app.preview-mode {
  padding: 0;
  max-width: none;
  min-height: 0;
  background: #000;
  overflow: hidden;
  z-index: 100;
}
#app.preview-mode iframe {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
  background: #fff;
  touch-action: none;
}

#app.ai-mode {
  padding: 0;
  max-width: none;
  height: 100vh;
  height: 100dvh;
  min-height: 0;
  overflow: hidden;
}
#app.ai-mode > div {
  max-width: none;
  margin: 0;
}

#app h1 {
  font-size: clamp(1.35rem, 4.5vw, 1.9rem);
  margin: 0 0 0.6em;
  line-height: 1.25;
  word-break: break-word;
}
#app p {
  font-size: clamp(0.9rem, 2.6vw, 1rem);
  line-height: 1.6;
  margin: 0.5em 0;
}

/* 表单 */
.form-group {
  margin-bottom: 15px;
}
.form-group label {
  display: block;
  font-weight: bold;
  margin-bottom: 5px;
  font-size: clamp(0.85rem, 2.5vw, 0.95rem);
}
.form-group input,
.form-group textarea {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--border-input);
  border-radius: 4px;
  font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: 16px;
  background: var(--input-bg-fill);
  color: var(--modal-text);
}
.form-group .CodeMirror {
  border: 1px solid var(--cm-border);
  border-radius: 4px;
  height: clamp(160px, 32vh, 240px) !important;
  font-size: 14px;
}

/* CodeMirror占位符浮层 */
.cm-placeholder-overlay {
  position: absolute;
  top: 5px;
  right: 8px;
  color: var(--text-placeholder);
  pointer-events: none;
  font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: 13px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
  z-index: 5;
  user-select: none;
  overflow: hidden;
}

/* 通用按钮 */
button {
  background: var(--primary);
  color: white;
  border: none;
  padding: 10px clamp(14px, 4vw, 20px);
  border-radius: 4px;
  cursor: pointer;
  font-size: 0.95rem;
  transition: background 0.2s;
}
button:hover {
  background: var(--primary-hover);
}
button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.result {
  margin-top: 20px;
  padding: 12px;
  background: var(--result-bg);
  border-radius: 4px;
  word-break: break-word;
}

.preview-img {
  max-width: min(200px, 60vw);
  max-height: 200px;
  margin-top: 10px;
  border: 1px solid var(--border-input);
  border-radius: 4px;
  display: block;
}

.action-buttons {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 10px;
}
.action-buttons button {
  background: var(--neutral-btn);
}
.action-buttons button.preview,
.action-buttons button.download {
  background: var(--success);
}

/* 弹窗 */
.modal-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.5);
  z-index: 400;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.modal-backdrop.show {
  display: flex;
}
.modal {
  background: var(--modal-bg);
  color: var(--modal-text);
  border-radius: 8px;
  width: min(480px, 100%);
  max-height: 88vh;
  overflow-y: auto;
  padding: clamp(16px, 4vw, 22px);
  box-shadow: var(--shadow-modal);
}
.modal h3 {
  margin: 0 0 12px;
  font-size: 1.1rem;
}
.modal p {
  margin: 0 0 16px;
  line-height: 1.55;
  word-break: break-word;
}
.modal input {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--border-input);
  border-radius: 4px;
  margin-bottom: 16px;
  font-size: 16px;
  background: var(--input-bg-fill);
  color: var(--modal-text);
}
.modal textarea {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--border-input);
  border-radius: 4px;
  margin-bottom: 16px;
  font-size: 14px;
  font-family: inherit;
  line-height: 1.5;
  resize: vertical;
  min-height: 120px;
  outline: none;
  background: var(--input-bg-fill);
  color: var(--modal-text);
}
.modal textarea:focus {
  border-color: var(--primary-focus);
}
.modal .modal-hint {
  font-size: 0.82rem;
  color: var(--text-secondary);
  margin: -8px 0 12px;
  line-height: 1.5;
}
.modal-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.modal-actions .right-group {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.modal-actions .cancel {
  background: var(--neutral-btn);
}
.modal-actions .danger {
  background: var(--danger);
}
.modal-actions .link-btn {
  background: transparent;
  color: var(--text-muted);
  padding: 8px 10px;
  font-size: 0.88rem;
  border-radius: 4px;
  text-decoration: underline;
}
.modal-actions .link-btn:hover {
  background: var(--hover-strong);
  color: var(--danger);
}

/* AI助手 */
.ai-page {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  width: 100%;
  overflow: hidden;
}

/* 清除按钮 */
.ai-clear-btn {
  position: absolute;
  top: clamp(8px, 2vw, 14px);
  right: clamp(10px, 3vw, 18px);
  z-index: 60;
  width: 40px;
  height: 40px;
  min-width: 40px;
  padding: 0;
  border-radius: 50%;
  background: transparent;
  border: none;
  color: inherit;
  font-size: 32px;
  font-weight: 300;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  opacity: 0.7;
  transition:
    opacity 0.15s,
    color 0.15s,
    transform 0.15s;
}
.ai-clear-btn:hover {
  opacity: 1;
  color: var(--danger);
  transform: scale(1.15);
}
.ai-clear-btn:active {
  transform: scale(0.95);
}

.ai-messages {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 64px 14px 16px;
  scroll-behavior: smooth;
}
.ai-msg {
  margin-bottom: 12px;
  display: flex;
}
.ai-msg:last-child {
  margin-bottom: 0;
}
.ai-msg.user {
  justify-content: flex-end;
}
.ai-msg .bubble {
  max-width: 84%;
  padding: 9px 13px;
  border-radius: 16px;
  white-space: pre-wrap;
  word-break: break-word;
  line-height: 1.55;
  font-size: 0.95rem;
}
.ai-msg.user .bubble {
  background: var(--bubble-user-bg);
  color: var(--bubble-user-text);
  border-bottom-right-radius: 4px;
}
.ai-msg.assistant .bubble {
  background: var(--bubble-assistant-bg);
  color: var(--bubble-assistant-text);
  border-bottom-left-radius: 4px;
}
.ai-msg.pending .bubble {
  opacity: 0.65;
  font-style: italic;
}

.ai-empty {
  color: var(--text-tertiary);
  text-align: center;
  padding: 48px 12px;
  font-size: 0.92rem;
  line-height: 1.8;
  white-space: pre-line;
}

/* 底部浮动输入区 */
.ai-input-wrap {
  flex: 0 0 auto;
  padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
  background: var(--ai-input-grad);
  pointer-events: none;
}

.ai-input-bar {
  display: flex;
  align-items: flex-end;
  gap: 6px;
  width: 100%;
  max-width: 940px;
  margin: 0 auto;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 26px;
  padding: 6px;
  box-shadow: var(--shadow-ai-bar);
  pointer-events: auto;
  transition:
    background 0.3s,
    border-color 0.3s;
}

.ai-model-picker {
  position: relative;
  flex: 0 0 auto;
}
.ai-model-btn {
  width: 38px;
  height: 38px;
  min-width: 38px;
  padding: 0;
  border-radius: 50%;
  background: transparent;
  color: inherit;
  border: none;
  font-size: 26px;
  font-weight: 300;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition:
    background 0.15s,
    transform 0.15s;
}
.ai-model-btn:hover {
  background: var(--hover);
}
.ai-model-btn:active {
  transform: scale(0.94);
}
.ai-model-btn.has-model {
  font-size: 18px;
  font-weight: bold;
  background: rgba(0, 123, 255, 0.12);
}

.ai-model-menu {
  display: none;
  position: absolute;
  bottom: calc(100% + 10px);
  left: 0;
  background: var(--modal-bg);
  color: var(--modal-text);
  border: 1px solid var(--border-input);
  border-radius: 12px;
  box-shadow: 0 12px 34px rgba(0, 0, 0, 0.32);
  min-width: 280px;
  z-index: 500;
  overflow: hidden;
}
.ai-model-menu.show {
  display: block;
}

.ai-model-item {
  display: flex;
  align-items: center;
  padding: 9px 10px;
  cursor: pointer;
  gap: 4px;
  font-size: 0.93rem;
  user-select: none;
}
.ai-model-item:hover {
  background: var(--hover);
}
.ai-model-item .ai-check {
  width: 16px;
  flex: 0 0 16px;
  display: inline-block;
  color: var(--success);
  font-weight: bold;
  text-align: center;
  visibility: hidden;
}
.ai-model-item.active .ai-check {
  visibility: visible;
}
.ai-model-item .ai-model-name {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ai-model-item .ai-key,
.ai-model-item .ai-prompt,
.ai-model-item .ai-dl {
  background: transparent;
  color: var(--text-muted);
  padding: 4px 6px;
  border-radius: 6px;
  border: 1px solid var(--line);
  font-size: 0.95rem;
  line-height: 1;
  cursor: pointer;
  transition:
    background 0.15s,
    color 0.15s;
  flex: 0 0 auto;
}
.ai-model-item .ai-key:hover {
  background: var(--hover-key);
  color: var(--warn);
}
.ai-model-item .ai-prompt:hover {
  background: var(--hover-prompt);
  color: var(--purple);
}
.ai-model-item .ai-dl:hover {
  background: var(--hover-dl);
  color: var(--primary);
}

/* 已设置提示词时显示小圆点标记 */
.ai-model-item .ai-prompt.has-prompt {
  color: var(--purple);
}
.ai-model-item .ai-prompt.has-prompt::after {
  content: "•";
  margin-left: 1px;
  color: var(--purple);
}

.ai-input-bar textarea {
  flex: 1 1 auto;
  min-width: 0;
  resize: none;
  border: none;
  outline: none;
  background: transparent;
  color: inherit;
  min-height: 38px;
  max-height: 140px;
  padding: 9px 6px;
  font-family: inherit;
  font-size: 16px;
  line-height: 1.45;
  overflow-y: auto;
}

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>

    <script>
      /* 应用主逻辑（IIFE包裹避免污染全局） */
      (function () {
        "use strict";

        /* 常量定义 */
        /* localStorage 存储键 */
        var STORAGE_KEY = "p5_pages"; // 作品列表
        var THEME_KEY = "p5_theme"; // 主题
        var MAX_IMAGE_BYTES = 1.5 * 1024 * 1024; // 上传图片大小上限 1.5MB

        /* p5脚本目录与文件清单（首页随机运行） */
        var P5_DIR = "p5/";
        var P5_CDN =
          "https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js";
        var P5_FILES = ["sketch1.js", "sketch2.js", "sketch3.js"];

        /* AI相关存储键 */
        var AI_KEY_STORAGE = "p5_ai_keys"; // 各模型API Key
        var AI_CHAT_STORAGE = "p5_ai_chats"; // 各模型对话记录
        var AI_PROMPT_STORAGE = "p5_ai_prompts"; // 各模型系统提示词

        /* 支持的AI模型清单 */
        var AI_MODELS = [
          {
            id: "chatgpt",
            name: "ChatGPT",
            endpoint: "https://api.openai.com/v1/chat/completions",
            apiModel: "gpt-4o-mini",
          },
          {
            id: "gemini",
            name: "Gemini",
            endpoint:
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent",
            apiModel: "gemini-2.0-flash",
          },
          {
            id: "deepseek",
            name: "DeepSeek",
            endpoint: "https://api.deepseek.com/chat/completions",
            apiModel: "deepseek-chat",
          },
        ];

        /* AI运行时状态（内存态，持久化到 localStorage） */
        var aiState = {
          currentModel: null, // 当前选中模型id
          keys: {}, // { modelId: apiKey }
          chats: {}, // { modelId: [{role, content, raw?}] }
          prompts: {}, // { modelId: systemPrompt }
          busy: false, // 是否正在流式请求中
        };

        /* AI 状态辅助函数 */

        /* 通过 id 找到模型配置对象 */
        function aiModelConf(id) {
          for (var i = 0; i < AI_MODELS.length; i++) {
            if (AI_MODELS[i].id === id) return AI_MODELS[i];
          }
          return null;
        }
        /* 通过id取模型显示名（找不到就返回原 id） */
        function aiModelName(id) {
          var c = aiModelConf(id);
          return c ? c.name : id;
        }

        /* 从localStorage读取所有模型的Key */
        function loadAIKeys() {
          try {
            var raw = localStorage.getItem(AI_KEY_STORAGE);
            var o = raw ? JSON.parse(raw) : {};
            return o && typeof o === "object" ? o : {};
          } catch (e) {
            return {};
          }
        }

        /* 写入模型 Key；超限时弹窗提示 */
        function saveAIKeys() {
          try {
            localStorage.setItem(AI_KEY_STORAGE, JSON.stringify(aiState.keys));
            return true;
          } catch (e) {
            handleStorageQuotaError(e, "API Key");
            return false;
          }
        }

/* 从localStorage读取所有模型的对话记录 */
        function loadAIChats() {
          try {
            var raw = localStorage.getItem(AI_CHAT_STORAGE);
            var o = raw ? JSON.parse(raw) : {};
            return o && typeof o === "object" ? o : {};
          } catch (e) {
            return {};
          }
        }

        /* 写入对话记录；超限时弹窗提示 */
        function saveAIChats() {
          try {
            localStorage.setItem(
              AI_CHAT_STORAGE,
              JSON.stringify(aiState.chats),
            );
            return true;
          } catch (e) {
            handleStorageQuotaError(e, "AI 对话记录");
            return false;
          }
        }

        /* 从localStorage读取所有模型的系统提示词 */
        function loadAIPrompts() {
          try {
            var raw = localStorage.getItem(AI_PROMPT_STORAGE);
            var o = raw ? JSON.parse(raw) : {};
            return o && typeof o === "object" ? o : {};
          } catch (e) {
            return {};
          }
        }

        /* 写入系统提示词；超限时弹窗提示 */
        function saveAIPrompts() {
          try {
            localStorage.setItem(
              AI_PROMPT_STORAGE,
              JSON.stringify(aiState.prompts),
            );
            return true;
          } catch (e) {
            handleStorageQuotaError(e, "系统提示词");
            return false;
          }
        }

        /* 初始化AI状态：加载三张表，补齐缺失结构，重置currentModel */
        function initAIState() {
          aiState.keys = loadAIKeys();
          aiState.chats = loadAIChats();
          aiState.prompts = loadAIPrompts();
          AI_MODELS.forEach(function (m) {
            if (!Array.isArray(aiState.chats[m.id])) aiState.chats[m.id] = [];
            if (typeof aiState.prompts[m.id] !== "string") {
              aiState.prompts[m.id] = "";
            }
          });

          aiState.currentModel = null;
        }

        /* 存储超限统一处理 */

        /* 判断错误是否为“存储超限”（不同浏览器字段名不同） */
        function isQuotaError(e) {
          if (!e) return false;
          if (e.name === "QuotaExceededError") return true;
          if (e.name === "NS_ERROR_DOM_QUOTA_REACHED") return true;
          if (e.code === 22 || e.code === 1014) return true;
          return false;
        }

        /* 估算当前localStorage已使用量（字符数近似值，单位 KB） */
        function estimateLocalStorageKB() {
          var total = 0;
          try {
            for (var i = 0; i < localStorage.length; i++) {
              var k = localStorage.key(i);
              var v = localStorage.getItem(k) || "";
              total += k.length + v.length;
            }
          } catch (e) {
            return -1;
          }
          // 按 UTF-16 估算：1 字符 ≈ 2 字节
          return Math.round((total * 2) / 1024);
        }

        /* 存储超限时的统一弹窗 */
        function handleStorageQuotaError(e, context) {
          if (!isQuotaError(e)) {
            showAlert(
              "保存失败",
              String((e && e.message) || e || "未知错误"),
              true,
            );
            return;
          }
          var usedKB = estimateLocalStorageKB();
          var usedText =
            usedKB >= 0
              ? "当前 localStorage 已使用约 " + usedKB + " KB。"
              : "";
          showAlert(
            "本地存储已满",
            (context ? "「" + context + "」" : "数据") +
              "保存失败：浏览器 localStorage 空间已满。\n\n" +
              usedText +
              "\n\n建议：\n" +
              "1. 打开 AI 助手，点击右上角“−”清除部分对话；\n" +
              "2. 在侧边栏删除不再需要的脚本作品；\n" +
              "3. 导出 JSON 备份后，清理对应模型的对话记录。",
            true,
          );
        }

        /* 编辑器默认占位提示 */
        var SCRIPT_PLACEHOLDER =
          "例如：\n" +
          "function setup() {\n" +
          "  createCanvas(windowWidth, windowHeight);\n" +
          "  background(102);\n" +
          "}\n" +
          "function draw() {\n" +
          "  variableEllipse(mouseX, mouseY, pmouseX, pmouseY);\n" +
          "}\n" +
          "function variableEllipse(x, y, px, py) {\n" +
          "  let speed = abs(x - px) + abs(y - py);\n" +
          "  stroke(speed);\n" +
          "  ellipse(x, y, speed, speed);\n" +
          "}";

        /* 通用工具函数 */

        /* querySelector 简写 */
        function $(sel, root) {
          return (root || document).querySelector(sel);
        }

        /* querySelectorAll简写，返回数组 */
        function $$(sel, root) {
          return Array.prototype.slice.call(
            (root || document).querySelectorAll(sel),
          );
        }

        /* HTML转义，防止注入 */
        function escapeHtml(text) {
          return String(text)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
        }

        /* 转义字符串中的 </script（防止提前闭合外嵌脚本） */
        function escapeScriptClose(str) {
          return String(str).replace(/<\/script/gi, "<\\/script");
        }

        /* 生成安全的文件名（去掉文件系统保留字符） */
        function safeFileName(name) {
          var n = String(name || "")
            .replace(/[\\/:*?"<>|]/g, "_")
            .trim();
          return n || "untitled";
        }

        /* 作品（p5页面）存储 */

        /* 读取作品列表 */
        function getPages() {
          try {
            var raw = localStorage.getItem(STORAGE_KEY);
            var list = raw ? JSON.parse(raw) : [];
            return Array.isArray(list) ? list : [];
          } catch (e) {
            return [];
          }
        }

        /* 写入作品列表；超限时弹窗提示 */
        function savePages(pages) {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(pages));
            return true;
          } catch (e) {
            handleStorageQuotaError(e, "脚本作品");
            return false;
          }
        }

        /* 弹窗组件（Alert / Confirm / Prompt / Textarea） */
        var modalBackdrop, modalBox, lastFocused;

        /* 打开弹窗；builder负责往modalBox 里塞内容 */
        function openModal(builder) {
          lastFocused = document.activeElement;
          modalBox.innerHTML = "";
          builder(modalBox);
          modalBackdrop.classList.add("show");
          var f = $("input, textarea, button", modalBox);
          if (f && f.focus) f.focus();
        }

        /* 关闭弹窗，焦点还给触发元素 */
        function closeModal() {
          modalBackdrop.classList.remove("show");
          modalBox.innerHTML = "";
          if (lastFocused && lastFocused.focus) lastFocused.focus();
        }

        /* 简易Alert（单按钮） */
        function showAlert(title, message, isError) {
          openModal(function (box) {
            var h = document.createElement("h3");
            h.textContent = title;
            var p = document.createElement("p");
            p.textContent = message;
            var a = document.createElement("div");
            a.className = "modal-actions";
            var right = document.createElement("div");
            right.className = "right-group";
            var ok = document.createElement("button");
            ok.textContent = "知道了";
            if (isError) ok.className = "danger";
            ok.addEventListener("click", closeModal);
            right.appendChild(ok);
            a.appendChild(right);
            box.appendChild(h);
            box.appendChild(p);
            box.appendChild(a);
          });
        }

        /* 确认框（取消 + 确定） */
        function showConfirm(title, message, onConfirm, danger) {
          openModal(function (box) {
            var h = document.createElement("h3");
            h.textContent = title;
            var p = document.createElement("p");
            p.textContent = message;
            var a = document.createElement("div");
            a.className = "modal-actions";
            var right = document.createElement("div");
            right.className = "right-group";
            var cancel = document.createElement("button");
            cancel.className = "cancel";
            cancel.textContent = "取消";
            cancel.addEventListener("click", closeModal);
            var ok = document.createElement("button");
            ok.textContent = "确定";
            if (danger) ok.className = "danger";
            ok.addEventListener("click", function () {
              closeModal();
              onConfirm();
            });
            right.appendChild(cancel);
            right.appendChild(ok);
            a.appendChild(right);
            box.appendChild(h);
            box.appendChild(p);
            box.appendChild(a);
          });
        }

        /* 输入框弹窗（用于重命名、设置API Key等） */
        function showPrompt(title, defaultValue, onOk, inputType) {
          openModal(function (box) {
            var h = document.createElement("h3");
            h.textContent = title;
            var input = document.createElement("input");
            input.type = inputType || "text";
            input.value = defaultValue || "";
            input.autocomplete = "off";
            input.spellcheck = false;
            var a = document.createElement("div");
            a.className = "modal-actions";
            var right = document.createElement("div");
            right.className = "right-group";
            var cancel = document.createElement("button");
            cancel.className = "cancel";
            cancel.textContent = "取消";
            cancel.addEventListener("click", closeModal);
            var ok = document.createElement("button");
            ok.textContent = "保存";
            ok.addEventListener("click", function () {
              var v = input.value.trim();
              if (!v) {
                input.focus();
                return;
              }
              closeModal();
              onOk(v);
            });
            input.addEventListener("keydown", function (e) {
              if (e.key === "Enter") ok.click();
            });
            right.appendChild(cancel);
            right.appendChild(ok);
            a.appendChild(right);
            box.appendChild(h);
            box.appendChild(input);
            box.appendChild(a);
          });
        }

        /* 多行文本弹窗（用于设置系统提示词） */
        function showPromptArea(opts) {
          openModal(function (box) {
            var h = document.createElement("h3");
            h.textContent = opts.title;

            var hint = document.createElement("div");
            hint.className = "modal-hint";
            hint.textContent =
              opts.hint || "提示词会在每次对话时作为系统消息发送给模型。";

            var ta = document.createElement("textarea");
            ta.value = opts.value || "";
            ta.placeholder = opts.placeholder || "";
            ta.rows = 7;
            ta.spellcheck = false;

            var a = document.createElement("div");
            a.className = "modal-actions";

            var leftWrap = document.createElement("div");
            if (opts.value && opts.value.trim()) {
              var clearBtn = document.createElement("button");
              clearBtn.className = "link-btn";
              clearBtn.textContent = "清除提示词";
              clearBtn.addEventListener("click", function () {
                closeModal();
                if (opts.onClear) opts.onClear();
              });
              leftWrap.appendChild(clearBtn);
            }

            var rightWrap = document.createElement("div");
            rightWrap.className = "right-group";
            var cancel = document.createElement("button");
            cancel.className = "cancel";
            cancel.textContent = "取消";
            cancel.addEventListener("click", closeModal);

            var ok = document.createElement("button");
            ok.textContent = "保存";
            ok.addEventListener("click", function () {
              var v = ta.value;
              closeModal();
              opts.onOk(v);
            });
            ta.addEventListener("keydown", function (e) {
              if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                ok.click();
              }
            });
            rightWrap.appendChild(cancel);
            rightWrap.appendChild(ok);

            a.appendChild(leftWrap);
            a.appendChild(rightWrap);
            box.appendChild(h);
            box.appendChild(hint);
            box.appendChild(ta);
            box.appendChild(a);
          });
        }

        /* 生成作品 HTML / 下载  */

        /* 把 title / script / image 拼成一整份可独立运行的 HTML */
        function generatePageHtml(title, script, imageDataUrl) {
          var safeTitle = escapeHtml(title || "未命名页面");
          var imgVar = imageDataUrl
            ? 'var imageUrl = "' + imageDataUrl + '";'
            : "var imageUrl = null;";
          var safeImgVar = escapeScriptClose(imgVar);
          var safeScript = escapeScriptClose(script);

          return (
            "<!DOCTYPE html>\n" +
            '<html lang="zh-CN">\n' +
            "<head>\n" +
            '  <meta charset="UTF-8">\n' +
            '  <meta name="viewport" content="width=device-width, initial-scale=1.0">\n' +
            "  <title>" +
            safeTitle +
            "</title>\n" +
            "  <style>\n" +
            "    html, body { margin: 0; padding: 0; }\n" +
            "    canvas { display: block; }\n" +
            "  </style>\n" +
            '  <script src="' +
            P5_CDN +
            '"><\/script>\n' +
            "</head>\n" +
            "<body>\n" +
            "  <script>\n" +
            "    " +
            safeImgVar +
            "\n" +
            "    " +
            safeScript +
            "\n" +
            "  <\/script>\n" +
            "</body>\n" +
            "</html>"
          );
        }

        /* 单文件下载（触发浏览器“另存为”） */
        function downloadSingleHtml(filename, html) {
          try {
            var blob = new Blob([html], { type: "text/html;charset=utf-8" });
            var url = URL.createObjectURL(blob);
            var link = document.createElement("a");
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setTimeout(function () {
              URL.revokeObjectURL(url);
            }, 1000);
          } catch (err) {
            showAlert("下载失败", String((err && err.message) || err), true);
          }
        }

        /* 打包所有作品为 ZIP */
        function exportZip() {
          var pages = getPages();
          if (!pages.length) {
            showAlert("无法导出", "当前没有可导出的作品。");
            return;
          }
          var zip = new JSZip();
          pages.forEach(function (page, idx) {
            var base = (page.title || "untitled").replace(/[\\/:*?"<>|]/g, "_");
            zip.file("p5_" + base + "_" + (idx + 1) + ".html", page.html);
          });
          zip
            .generateAsync({ type: "blob" })
            .then(function (blob) {
              var url = URL.createObjectURL(blob);
              var link = document.createElement("a");
              link.href = url;
              link.download = "p5_works.zip";
              document.body.appendChild(link);
              link.click();
              document.body.removeChild(link);
              setTimeout(function () {
                URL.revokeObjectURL(url);
              }, 1000);
            })
            .catch(function (err) {
              showAlert("导出失败", String((err && err.message) || err), true);
            });
        }

        /* 全局 DOM 引用与运行状态 */
        var sidebarPagesEl, sidebarEl, overlayEl, hamburgerBtn;
        var sidebarSearchEl;
        var sidebarSearchKeyword = "";
        var appEl;

        /* 首页运行器：mode = random（随机脚本）| page（指定作品） */
        var runner = { mode: "random", pageId: null };
        var currentRandomFile = null;

        /* 首页随机脚本 */

        /* 随机挑一个p5脚本（尽量不重复上一次） */
        function pickRandomP5File() {
          if (!P5_FILES || !P5_FILES.length) return null;
          if (P5_FILES.length === 1) return P5_FILES[0];
          var pool = P5_FILES.filter(function (f) {
            return f !== currentRandomFile;
          });
          if (!pool.length) pool = P5_FILES.slice();
          return pool[Math.floor(Math.random() * pool.length)];
        }

        /* 对路径各段做URL编码 */
        function encodePath(fileName) {
          return String(fileName)
            .split("/")
            .map(function (seg) {
              return encodeURIComponent(seg);
            })
            .join("/");
        }

        /* 构造首页随机脚本的内嵌 HTML（iframe srcdoc） */
        function buildP5SrcDoc(fileName) {
          var src = P5_DIR + encodePath(fileName);
          return (
            "<!DOCTYPE html>\n" +
            '<html lang="zh-CN">\n' +

        /* iframe 内p5画布的事件代理
           （解决外层容器遮住canvas时，鼠标/触摸事件无法传进iframe） */

        /* 等待iframe内出现canvas，然后挂接代理 */
        function bindIframeProxy(iframe) {
          var iwin, idoc;
          try {
            iwin = iframe.contentWindow;
            idoc = iframe.contentDocument;
          } catch (e) {
            console.warn("无法访问 iframe 内部文档：", e);
            return;
          }
          if (!iwin || !idoc) return;

          var tries = 0;
          function tryFindCanvas() {
            var canvas = idoc.querySelector("canvas");
            if (canvas) {
              attachProxy(canvas, iwin, idoc);
              return;
            }
            if (++tries < 80) setTimeout(tryFindCanvas, 100);
          }
          tryFindCanvas();
        }

        /* 给canvas挂事件代理：外层文档的鼠标/触摸事件转发进去 */
        function attachProxy(canvas, iwin, idoc) {
          if (canvas.__proxyAttached) return;
          canvas.__proxyAttached = true;

          var MOUSE_TYPES = [
            "mousemove",
            "mousedown",
            "mouseup",
            "click",
            "dblclick",
          ];
          var TOUCH_TYPES = [
            "touchstart",
            "touchmove",
            "touchend",
            "touchcancel",
          ];

          /* 鼠标事件转发 */
          function relayMouse(e) {
            if (e.target === canvas) return;
            if (
              (e.type === "mousedown" ||
                e.type === "mouseup" ||
                e.type === "click" ||
                e.type === "dblclick") &&
              e.button !== 0
            )
              return;

            var ev;
            try {
              ev = new iwin.MouseEvent(e.type, {
                bubbles: true,
                cancelable: true,
                view: iwin,
                detail: e.detail || 1,
                screenX: e.screenX,
                screenY: e.screenY,
                clientX: e.clientX,
                clientY: e.clientY,
                ctrlKey: e.ctrlKey,
                shiftKey: e.shiftKey,
                altKey: e.altKey,
                metaKey: e.metaKey,
                button: e.button,
                buttons: e.buttons,
                relatedTarget: null,
              });
            } catch (err) {
              return;
            }
            canvas.dispatchEvent(ev);
          }

          /* 触摸事件转成鼠标事件转发 */
          function relayTouch(e) {
            if (e.target === canvas) return;
            if (!e.touches || !e.touches.length) return;
            var t = e.touches[0];
            var type =
              e.type === "touchstart"
                ? "mousedown"
                : e.type === "touchmove"
                  ? "mousemove"
                  : e.type === "touchend"
                    ? "mouseup"
                    : null;
            if (!type) return;
            var ev;
            try {
              ev = new iwin.MouseEvent(type, {
                bubbles: true,
                cancelable: true,
                view: iwin,
                clientX: t.clientX,
                clientY: t.clientY,
                screenX: t.screenX,
                screenY: t.screenY,
                button: 0,
                buttons: type === "mouseup" ? 0 : 1,
              });
            } catch (err) {
              return;
            }
            canvas.dispatchEvent(ev);
          }

          MOUSE_TYPES.forEach(function (type) {
            idoc.addEventListener(type, relayMouse, true);
          });
          TOUCH_TYPES.forEach(function (type) {
            idoc.addEventListener(type, relayTouch, {
              capture: true,
              passive: true,
            });
          });
        }

        /* 首页运行器渲染 */

        /* 渲染首页：随机脚本或指定作品（iframe 内嵌运行） */
        function renderRunner() {
          destroyEditor();
          appEl.replaceChildren();
          appEl.classList.remove("preview-mode");
          appEl.classList.remove("ai-mode");
          setActiveNav("/");

          var html = null;

          /* 指定作品模式 */
          if (runner.mode === "page") {
            var page = getPages().find(function (p) {
              return p.id === runner.pageId;
            });
            if (page) {
              html = page.html;
              appEl.dataset.currentPageId = String(page.id);
            } else {
              /* 作品不存在：回退到随机 */
              runner.mode = "random";
              runner.pageId = null;
            }
          }

          /* 随机脚本模式 */
          if (html === null) {
            var file = pickRandomP5File();
            if (!file) {
              unlockAppSize();
              delete appEl.dataset.currentPageId;
              var wrap = document.createElement("div");
              wrap.innerHTML =
                "<h1>还没有可运行的脚本</h1>" +
                "<p>请把脚本放进与本页面同级的文件夹，" +
                "并在页面代码顶部的数组里写上文件名</p>";
              appEl.appendChild(wrap);
              return;
            }
            currentRandomFile = file;
            html = buildP5SrcDoc(file);
            delete appEl.dataset.currentPageId;
          }

          lockAppSize();
          appEl.classList.add("preview-mode");

          var iframe = document.createElement("iframe");
          iframe.setAttribute("title", "p5 运行");
          iframe.setAttribute("scrolling", "no");
          iframe.srcdoc = html;
          iframe.addEventListener("load", function () {
            bindIframeProxy(iframe);
          });
          appEl.appendChild(iframe);
        }

        /* 编辑器与主题 */
        var editor = null;

        /* 应用主题（亮/暗）到body + CodeMirror */
        function applyTheme(theme) {
          var lightTheme = $("#cm-theme-light");
          var darkTheme = $("#cm-theme-dark");
          if (theme === "dark") {
            document.body.classList.add("dark-mode");
            if (lightTheme) lightTheme.disabled = true;
            if (darkTheme) darkTheme.disabled = false;
          } else {
            document.body.classList.remove("dark-mode");
            if (lightTheme) lightTheme.disabled = false;
            if (darkTheme) darkTheme.disabled = true;
          }
          if (editor)
            editor.setOption("theme", theme === "dark" ? "dracula" : "default");
        }

        /* 当前主题字符串 */
        function currentTheme() {
          return document.body.classList.contains("dark-mode")
            ? "dark"
            : "light";
        }

        /* 切换主题并持久化 */
        function toggleTheme() {
          var next = currentTheme() === "dark" ? "light" : "dark";
          applyTheme(next);
          try {
            localStorage.setItem(THEME_KEY, next);
          } catch (e) {}
        }

        /* 路由 */

        /* 读取 hash 路由 */
        function getRoute() {
          var hash = location.hash;
          if (!hash || hash === "#" || hash === "#/") return "/";
          return hash.replace(/^#/, "") || "/";
        }

        /* 同步侧边栏导航的高亮状态 */
        function setActiveNav(path) {
          $$(".sidebar .nav-item[data-path]").forEach(function (el) {
            if (el.getAttribute("data-path") === "#" + path) {
              el.setAttribute("aria-current", "page");
            } else {
              el.removeAttribute("aria-current");
            }
          });
        }

        /* 销毁 CodeMirror 实例 */
        function destroyEditor() {
          if (editor) {
            try {
              editor.toTextArea();
            } catch (e) {}
            editor = null;
          }
        }

        /* 绑定-编写脚本-页交互 */
        function bindGenerator() {
          var titleInput = $("#title");
          var textarea = $("#script");
          var fileInput = $("#image");
          var previewEl = $("#image-preview");
          var resultEl = $("#result");
          var buildBtn = $("#buildBtn");

          uploadedImageDataUrl = null;

          /* 初始化CodeMirror + 占位符浮层 */
          destroyEditor();
          if (window.CodeMirror) {
            var themeName = currentTheme() === "dark" ? "dracula" : "default";
            editor = window.CodeMirror.fromTextArea(textarea, {
              mode: "javascript",
              lineNumbers: true,
              theme: themeName,
              tabSize: 2,
              indentUnit: 2,
              autofocus: true,
            });
            editor.setSize(null, "100%");

            var cmWrapper = editor.getWrapperElement();
            if (getComputedStyle(cmWrapper).position === "static") {
              cmWrapper.style.position = "relative";
            }

            var cmPlaceholderEl = document.createElement("div");
            cmPlaceholderEl.className = "cm-placeholder-overlay";
            cmPlaceholderEl.textContent = SCRIPT_PLACEHOLDER;
            cmWrapper.appendChild(cmPlaceholderEl);

            var gutters = cmWrapper.querySelector(".CodeMirror-gutters");
            var leftOffset = gutters ? gutters.offsetWidth + 8 : 44;
            cmPlaceholderEl.style.left = leftOffset + "px";

            /* 内容为空时显示占位，否则隐藏 */
            function updateCmPlaceholder() {
              cmPlaceholderEl.style.display =
                editor.getValue().length === 0 ? "block" : "none";
            }
            editor.on("change", updateCmPlaceholder);
            editor.on("optionChange", function () {
              var g = cmWrapper.querySelector(".CodeMirror-gutters");
              if (g) cmPlaceholderEl.style.left = g.offsetWidth + 8 + "px";
            });
            updateCmPlaceholder();
          }

          /* 上传图片：校验类型/体积，读取为 DataURL预览 */
          fileInput.addEventListener("change", function () {
            var file = this.files && this.files[0];
            if (!file) return;
            if (!/^image\//.test(file.type)) {
              showAlert("文件类型不支持", "请选择图片文件。", true);
              this.value = "";
              return;
            }
            if (file.size > MAX_IMAGE_BYTES) {
              showAlert(
                "图片太大",
                "单张图片请小于 1.5MB，以免本地存储空间耗尽。",
                true,
              );
              this.value = "";
              return;
            }
            var reader = new FileReader();
            reader.onload = function (e) {
              uploadedImageDataUrl = e.target.result;
              var tip = document.createElement("p");
              tip.textContent = "✅ 图片上传成功";
              var img = document.createElement("img");
              img.src = e.target.result;
              img.className = "preview-img";
              img.alt = "上传预览";
              previewEl.replaceChildren(tip, img);
            };
            reader.onerror = function () {
              showAlert("读取失败", "无法读取该图片，请重试。", true);
            };
            reader.readAsDataURL(file);
          });

          /* 提交：生成 HTML，存入作品列表，显示预览 / 下载按钮 */
          buildBtn.addEventListener("click", function () {
            var title = titleInput.value.trim() || "未命名脚本";
            var script = (editor ? editor.getValue() : textarea.value).trim();
            if (!script) {
              showAlert("缺少脚本", "请填写 p5.js 脚本代码。", true);
              return;
            }
            var imageDataUrl = uploadedImageDataUrl || "";
            var htmlContent = generatePageHtml(title, script, imageDataUrl);

            var newId = Date.now() + Math.floor(Math.random() * 1000);
            var pages = getPages();
            pages.push({
              id: newId,
              title: title,
              html: htmlContent,
              timestamp: new Date().toISOString(),
            });
            if (!savePages(pages)) return;

            updateSidebarPages();

            resultEl.style.display = "block";
            var msg = document.createElement("p");
            msg.textContent = "✅ 页面生成成功！已保存到本地存储。";

            var btnContainer = document.createElement("div");
            btnContainer.className = "action-buttons";

            var previewBtn = document.createElement("button");
            previewBtn.className = "preview";
            previewBtn.textContent = "▶️ 预览";
            previewBtn.addEventListener("click", function () {
              runPage(newId);
            });

            var downloadBtn = document.createElement("button");
            downloadBtn.className = "download";
            downloadBtn.textContent = "⬇️ 下载HTML";
            downloadBtn.addEventListener("click", function () {
              downloadSingleHtml(
                "p5_" + safeFileName(title) + "_" + newId + ".html",
                htmlContent,
              );
            });

            btnContainer.appendChild(previewBtn);
            btnContainer.appendChild(downloadBtn);
            resultEl.replaceChildren(msg, btnContainer);

            titleInput.value = "";
            if (editor) editor.setValue("");
            uploadedImageDataUrl = "";
            previewEl.replaceChildren();
            fileInput.value = "";
          });
        }

          if (menu) menu.classList.remove("show");
        }
        function toggleAIModelMenu() {
          var menu = $("#aiModelMenu");
          if (!menu) return;
          menu.classList.toggle("show");
        }

        /* 渲染对话气泡列表 */
        function renderAIMessages() {
          var box = $("#aiMessages");
          if (!box) return;
          var model = aiState.currentModel;

          /* 未选模型 */
          if (!model) {
            var empty = document.createElement("div");
            empty.className = "ai-empty";
            empty.textContent =
              "还没有选择模型\n\n点击左下角 + 选择模型并设置API Key后开始对话";
            box.replaceChildren(empty);
            return;
          }

          var chat = aiState.chats[model] || [];
          if (!chat.length) {
            var empty2 = document.createElement("div");
            empty2.className = "ai-empty";
            empty2.textContent = "开始与 " + aiModelName(model) + " 对话吧";
            box.replaceChildren(empty2);
            return;
          }

          var frag = document.createDocumentFragment();
          chat.forEach(function (m) {
            var row = document.createElement("div");
            row.className =
              "ai-msg " + (m.role === "assistant" ? "assistant" : "user");
            var b = document.createElement("div");
            b.className = "bubble";
            if (m.role === "assistant" && !m.content) {
              b.textContent = "正在思考…";
              b.classList.add("pending");
            } else {
              b.textContent = m.content;
            }
            row.appendChild(b);
            frag.appendChild(row);
          });
          box.replaceChildren(frag);
          box.scrollTop = box.scrollHeight;
        }

        /* 更新发送按钮的可用状态 */
        function updateAISendBtn() {
          var btn = $("#aiSendBtn");
          if (!btn) return;
          btn.disabled = !!aiState.busy;
        }

        /* 获取最后一条 assistant 气泡（用于流式更新） */
        function getLastAssistantBubble() {
          var box = $("#aiMessages");
          if (!box) return null;
          var rows = box.querySelectorAll(".ai-msg.assistant");
          if (!rows.length) return null;
          var last = rows[rows.length - 1];
          return last.querySelector(".bubble");
        }

        /* 流式请求核心 */
        /*
         * streamAI(model, key, messages, systemPrompt, onDelta, onRaw)
         *  - model:        模型 id（chatgpt / gemini / deepseek）
         *  - key:          API Key
         *  - messages:     历史消息（不含系统提示）
         *  - systemPrompt: 系统提示词，可为空
         *  - onDelta(obj): 每帧回调（已解析的 JSON）
         *  - onRaw(obj):   每帧回调（未处理的原始 JSON，用于导出）
         */
        function streamAI(model, key, messages, systemPrompt, onDelta, onRaw) {
          var conf = aiModelConf(model);
          var url, options;

          if (model === "gemini") {
            /* Gemini：SSE 端点 + key 查询参数 */
            url =
              conf.endpoint.replace(
                ":generateContent",
                ":streamGenerateContent",
              ) +
              "?alt=sse&key=" +
              encodeURIComponent(key);
            var contents = messages.map(function (m) {
              return {
                role: m.role === "assistant" ? "model" : "user",
                parts: [{ text: m.content }],
              };
            });
            var body = { contents: contents };
            if (systemPrompt) {
              body.systemInstruction = { parts: [{ text: systemPrompt }] };
            }
            options = {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(body),
            };
          } else {
            /* OpenAI 兼容（ChatGPT / DeepSeek） */
            var msgs = [];
            if (systemPrompt) {
              msgs.push({ role: "system", content: systemPrompt });
            }
            messages.forEach(function (m) {
              msgs.push({ role: m.role, content: m.content });
            });
            url = conf.endpoint;
            options = {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: "Bearer " + key,
              },
              body: JSON.stringify({
                model: conf.apiModel,
                messages: msgs,
                stream: true,
              }),
            };
          }

          return fetch(url, options).then(function (res) {
            /* 非2xx：尝试解析错误信息 */
            if (!res.ok) {
              return res.text().then(function (t) {
                var msg = "HTTP " + res.status;
                try {
                  var d = JSON.parse(t);
                  msg =
                    (d.error && d.error.message) ||
                    d.message ||
                    (d.error && d.error.status) ||
                    msg;
                } catch (e) {}
                throw new Error(msg);
              });
            }
            if (!res.body || !res.body.getReader) {
              throw new Error("当前浏览器不支持流式响应");
            }

            var reader = res.body.getReader();
            var decoder = new TextDecoder();
            var buffer = "";

            /* 处理一条 SSE data 段 */
            function dispatchData(data) {
              if (!data) return;
              if (data === "[DONE]") {
                if (onRaw) onRaw("[DONE]");
                return;
              }
              try {
                var obj = JSON.parse(data);
                if (onRaw) onRaw(obj); // 原始帧回调
                onDelta(obj); // 提取文本回调
              } catch (e) {}
            }

            /* 按 "\n\n" 切分 SSE 事件 */
            function processBuffer(flush) {
              var sepIndex;
              while ((sepIndex = buffer.indexOf("\n\n")) !== -1) {
                var evt = buffer.slice(0, sepIndex);
                buffer = buffer.slice(sepIndex + 2);
                var lines = evt.split("\n");
                for (var i = 0; i < lines.length; i++) {
                  var line = lines[i].trim();
                  if (line.indexOf("data:") === 0) {
                    dispatchData(line.slice(5).trim());
                  }
                }
              }
              /* 流结束：处理残余内容 */
              if (flush && buffer.trim()) {
                var tail = buffer.trim();
                if (tail.indexOf("data:") === 0) {
                  dispatchData(tail.slice(5).trim());
                }
                buffer = "";
              }
            }

            /* 递归读取 reader */
            function pump() {
              return reader.read().then(function (result) {
                if (result.done) {
                  processBuffer(true);
                  return;
                }
                buffer += decoder.decode(result.value, { stream: true });
                processBuffer(false);
                return pump();
              });
            }

            return pump();
          });
        }

        /* AI：设置 Key / 提示词、选模型、下载、发送、清空 */

        /* 弹窗设置某模型的 API Key */
        function promptAPIKey(model, onSaved) {
          showPrompt(
            "设置 " + aiModelName(model) + " API Key",
            aiState.keys[model] || "",
            function (v) {
              aiState.keys[model] = v;
              saveAIKeys();
              if (onSaved) onSaved();
            },
            "password",
          );
        }

        /* 弹窗设置某模型的系统提示词 */
        function promptSystemPrompt(model) {
          var existing = aiState.prompts[model] || "";
          showPromptArea({
            title: "设置 " + aiModelName(model) + " 系统提示词",
            hint:
              "这段提示词会作为system消息在每次对话时发送给模型，用于设定角色、语气或规则。" +
              "留空则不发送。Ctrl+回车可快速保存。",
            value: existing,
            placeholder:
              "例如：你是一位擅长p5.js生成艺术的助手，回答简洁专业，代码附注释。",
            onOk: function (v) {
              aiState.prompts[model] = v.trim();
              saveAIPrompts();
              buildAIModelMenu();
              refreshAIModelUI();
            },
            onClear: function () {
              aiState.prompts[model] = "";
              saveAIPrompts();
              buildAIModelMenu();
              refreshAIModelUI();
            },
          });
        }

        /* 选择模型：无 Key 时先弹窗让用户设置 */
        function selectAIModel(model) {
          if (!aiModelConf(model)) return;
          if (!aiState.keys[model]) {
            promptAPIKey(model, function () {
              aiState.currentModel = model;
              refreshAIModelUI();
              renderAIMessages();
              updateAISendBtn();
            });
            return;
          }
          aiState.currentModel = model;
          refreshAIModelUI();
          renderAIMessages();
          updateAISendBtn();
        }

        /* 实际触发 JSON 下载 */
        function doDownloadJSON(data, model) {
          var json = JSON.stringify(data, null, 2);
          var blob = new Blob([json], {
            type: "application/json;charset=utf-8",
          });
          var url = URL.createObjectURL(blob);
          var a = document.createElement("a");
          a.href = url;
          a.download = "ai_chat_" + model + "_" + Date.now() + ".json";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(function () {
            URL.revokeObjectURL(url);
          }, 1000);
        }

        /* 下载某模型对话为 JSON（含 API 原始响应） */
        function downloadAIChat(model) {
          var chat = aiState.chats[model] || [];
          if (!chat.length) {
            showAlert(
              "无法下载",
              "「" + aiModelName(model) + "」还没有对话内容。",
            );
            return;
          }

          var sys = aiState.prompts[model];
          var hasAnyRaw = false;

          var data = {
            model: model,
            modelName: aiModelName(model),
            exportedAt: new Date().toISOString(),
            systemPrompt: sys && sys.trim() ? sys : null,
            messages: chat.map(function (m) {
              if (m.raw && m.raw.length) hasAnyRaw = true;
              return {
                role: m.role,
                content: m.content,
                raw: m.raw && m.raw.length ? m.raw : null,
              };
            }),
          };

          /* 旧对话没有 raw：弹确认框提示后仍可导出 */
          if (!hasAnyRaw) {
            showConfirm(
              "提示",
              "当前对话没有原始响应数据（可能是改版前的旧对话），" +
                "仍要导出 JSON 吗？",
              function () {
                doDownloadJSON(data, model);
              },
            );
            return;
          }

          doDownloadJSON(data, model);
        }

        /* 发送消息（含流式渲染 + 原始帧收集 + 保存） */
        function aiSend() {
          if (aiState.busy) return;
          var model = aiState.currentModel;
          if (!model) {
            showAlert(
              "请先选择模型",
              "点击左下角 + 按钮选择模型并设置Key。",
              true,
            );
            return;
          }
          var key = aiState.keys[model];
          if (!key) {
            promptAPIKey(model, function () {
              aiSend();
            });
            return;
          }

          var inputEl = $("#aiInput");
          if (!inputEl) return;
          var text = (inputEl.value || "").trim();
          if (!text) return;

          var chat = aiState.chats[model];
          if (!Array.isArray(chat)) chat = aiState.chats[model] = [];

          /* 先落一条 user + 一条占位 assistant */
          chat.push({ role: "user", content: text });
          chat.push({ role: "assistant", content: "" });
          saveAIChats();

          inputEl.value = "";
          inputEl.style.height = "auto";

          aiState.busy = true;
          updateAISendBtn();
          renderAIMessages();

          var bubble = getLastAssistantBubble();
          var accumulated = "";
          var isGemini = model === "gemini";
          var box = $("#aiMessages");
          var rawChunks = []; /* 收集 API 原始帧 */

          /* 追加一段流式文本到气泡 */
          function pushDelta(text2) {
            if (!text2) return;
            accumulated += text2;
            if (bubble) {
              bubble.classList.remove("pending");
              bubble.textContent = accumulated;
            }
            if (box) box.scrollTop = box.scrollHeight;
          }

          /* 从每帧对象里提取文本 */
          var onDelta = function (obj) {
            if (isGemini) {
              var cand = obj.candidates && obj.candidates[0];
              if (cand && cand.content && cand.content.parts) {
                var t = "";
                for (var i = 0; i < cand.content.parts.length; i++) {
                  t += cand.content.parts[i].text || "";
                }
                pushDelta(t);
              }
            } else {
              var d = obj.choices && obj.choices[0] && obj.choices[0].delta;
              if (d && d.content) pushDelta(d.content);
            }
          };

          /* 发给模型的历史：去掉占位 assistant */
          var payload = chat.slice(0, -1);
          var systemPrompt = aiState.prompts[model] || "";

          streamAI(model, key, payload, systemPrompt, onDelta, function (raw) {
            rawChunks.push(raw);
          })
            .then(function () {
              chat[chat.length - 1].content = accumulated || "(空回复)";
              chat[chat.length - 1].raw = rawChunks;
              saveAIChats();
              aiState.busy = false;
              updateAISendBtn();
              renderAIMessages();
            })
            .catch(function (err) {
              aiState.busy = false;
              updateAISendBtn();
              if (accumulated) {
                chat[chat.length - 1].content = accumulated;
                chat[chat.length - 1].raw = rawChunks;
              } else {
                chat.pop();
              }
              saveAIChats();
              renderAIMessages();
              showAlert(
                "请求失败",
                String((err && err.message) || err) ||
                  "网络错误，请检查API Key或稍后重试。",
                true,
              );
            });
        }

        /* 清空当前模型对话（先确认） */
        function clearAIChat() {
          var model = aiState.currentModel;
          if (!model) {
            showAlert(
              "无需清除",
              "还没有选择模型，请点击左下角 + 选择模型。",
            );
            return;
          }
          var chat = aiState.chats[model] || [];
          if (!chat.length) {
            showAlert(
              "无需清除",
              "「" + aiModelName(model) + "」当前没有对话内容。",
            );
            return;
          }
          showConfirm(
            "清除对话",
            "确定要清除与" + aiModelName(model) + "的全部对话内容吗？",
            function () {
              aiState.chats[model] = [];
              saveAIChats();
              renderAIMessages();
            },
            true,
          );
        }

        /* 绑定 AI 助手页所有交互 */
        function bindAIAssistant() {
          buildAIModelMenu();
          refreshAIModelUI();
          renderAIMessages();
          updateAISendBtn();

          var modelBtn = $("#aiModelBtn");
          var modelMenu = $("#aiModelMenu");
          var inputEl = $("#aiInput");
          var sendBtn = $("#aiSendBtn");
          var clearBtn = $("#aiClearBtn");

          /* 模型按钮：切换菜单 */
          if (modelBtn) {
            modelBtn.addEventListener("click", function (e) {
              e.stopPropagation();
              toggleAIModelMenu();
            });
          }

          /* 菜单内事件委托：P / K / D / 选中 */
          if (modelMenu) {
            modelMenu.addEventListener("click", function (e) {
              var promptBtn = e.target.closest("[data-prompt]");
              if (promptBtn) {
                e.stopPropagation();
                closeAIModelMenu();
                promptSystemPrompt(promptBtn.dataset.prompt);
                return;
              }
              var keyBtn = e.target.closest("[data-key]");
              if (keyBtn) {
                e.stopPropagation();
                promptAPIKey(keyBtn.dataset.key);
                return;
              }
              var dl = e.target.closest("[data-dl]");
              if (dl) {
                e.stopPropagation();
                downloadAIChat(dl.dataset.dl);
                return;
              }
              var item = e.target.closest(".ai-model-item");
              if (item) {
                e.stopPropagation();
                closeAIModelMenu();
                selectAIModel(item.dataset.model);
              }
            });
          }

          /* 输入框：自适应高度 + 回车发送 */
          if (inputEl) {
            inputEl.addEventListener("input", function () {
              this.style.height = "auto";
              this.style.height = Math.min(this.scrollHeight, 140) + "px";
            });
            inputEl.addEventListener("keydown", function (e) {
              if (
                e.key === "Enter" &&
                !e.shiftKey &&
                !e.isComposing &&
                e.keyCode !== 229
              ) {
                e.preventDefault();
                aiSend();
              }
            });
          }

          if (sendBtn) {
            sendBtn.addEventListener("click", function () {
              aiSend();
            });
          }

          if (clearBtn) {
            clearBtn.addEventListener("click", function () {
              clearAIChat();
            });
          }
        }

        /* 总渲染入口（根据路由切换页面） */
        function render() {
          var path = getRoute();

          /* 离开首页时，把“指定作品”模式重置回随机 */
          if (path !== "/" && path !== "" && path !== "/index.html") {
            if (runner.mode === "page") {
              runner.mode = "random";
              runner.pageId = null;
            }
          }

          /* 首页 */
          if (path === "/" || path === "" || path === "/index.html") {
            renderRunner();
            return;
          }

          /* 非首页：清理预览态 / 编辑器 / #app */
          if (appEl.classList.contains("preview-mode")) {
            appEl.classList.remove("preview-mode");
          }
          appEl.classList.remove("ai-mode");
          delete appEl.dataset.currentPageId;
          unlockAppSize();

          destroyEditor();
          appEl.replaceChildren();
          setActiveNav(path);

          /* AI 助手 */
          if (path === "/ai") {
            appEl.classList.add("ai-mode");
            appEl.appendChild(renderAIAssistant());
            bindAIAssistant();
            return;
          }

          /* 关于 / 编写脚本 / 未定义 */
          if (path === "/about") {
            appEl.appendChild(renderAbout());
          } else if (path === "/generator") {
            appEl.appendChild(renderGenerator());
            bindGenerator();
          } else {
            var wrap = document.createElement("div");
            var h = document.createElement("h1");
            h.textContent = "页面 " + path;
            var p = document.createElement("p");
            p.textContent = "内容未定义。";
            wrap.appendChild(h);
            wrap.appendChild(p);
            appEl.appendChild(wrap);
          }
        }

        /* 初始化 */
        function init() {
          /* DOM 引用 */
          modalBackdrop = $("#modalBackdrop");
          modalBox = $("#modalBox");
          sidebarPagesEl = $("#sidebar-pages");
          sidebarEl = $("#sidebar");
          overlayEl = $("#overlay");
          hamburgerBtn = $("#hamburgerBtn");
          appEl = $("#app");
          sidebarSearchEl = $("#sidebarSearch");

          /* 加载 AI 状态 */
          initAIState();

          /* 应用主题 */
          var savedTheme = "light";
          try {
            savedTheme = localStorage.getItem(THEME_KEY) || "light";
          } catch (e) {}
          applyTheme(savedTheme);

          /* 禁用双指缩放 / 手势缩放 */
          ["gesturestart", "gesturechange", "gestureend"].forEach(
            function (type) {
              document.addEventListener(
                type,
                function (e) {
                  e.preventDefault();
                },
                {
                  passive: false,
                },
              );
            },
          );
          document.addEventListener(
            "touchmove",
            function (e) {
              if (e.touches && e.touches.length > 1) {
                e.preventDefault();
              }
            },
            { passive: false },
          );

          /* 阻止移动端双击缩放（输入/按钮/链接除外） */
          var lastTouchEnd = 0;
          document.addEventListener(
            "touchend",
            function (e) {
              var now = Date.now();
              if (now - lastTouchEnd <= 300) {
                var t = e.target;
                var tag = t && t.tagName ? t.tagName.toLowerCase() : "";
                if (
                  tag !== "input" &&
                  tag !== "textarea" &&
                  tag !== "button" &&
                  tag !== "select" &&
                  tag !== "a"
                ) {
                  e.preventDefault();
                }
              }
              lastTouchEnd = now;
            },
            { passive: false },
          );

          /* 点击空白处关闭模型菜单 */
          document.addEventListener("click", function (e) {
            var menu = $("#aiModelMenu");
            if (!menu || !menu.classList.contains("show")) return;
            var picker = menu.parentNode;
            if (picker && !picker.contains(e.target)) {
              menu.classList.remove("show");
            }
          });

          /* 侧边栏搜索框 */
          if (sidebarSearchEl) {
            sidebarSearchEl.addEventListener("input", function () {
              sidebarSearchKeyword = this.value || "";
              updateSidebarPages();
            });
            sidebarSearchEl.addEventListener("keydown", function (e) {
              if (e.key === "Escape") {
                if (this.value) {
                  this.value = "";
                  sidebarSearchKeyword = "";
                  updateSidebarPages();
                }
                e.stopPropagation();
              } else {
                e.stopPropagation();
              }
            });
            sidebarSearchEl.addEventListener("click", function (e) {
              e.stopPropagation();
            });
          }

          /* 侧边栏 / 遮罩 / 弹窗背景 */
          hamburgerBtn.addEventListener("click", openSidebar);
          overlayEl.addEventListener("click", closeSidebar);
          modalBackdrop.addEventListener("click", function (e) {
            if (e.target === modalBackdrop) closeModal();
          });

          /* Esc：优先关弹窗 → 关侧边栏 → 回随机首页 */
          document.addEventListener("keydown", function (e) {
            if (e.key === "Escape") {
              if (modalBackdrop.classList.contains("show")) {
                closeModal();
              } else if (sidebarEl.classList.contains("open")) {
                closeSidebar();
              } else if (runner.mode === "page" && getRoute() === "/") {
                setRandom();
              }
            }
          });

          /* 侧边栏底部：导出 ZIP */
          var exportZipBtn = $("#exportZipSidebar");
          if (exportZipBtn) {
            var runExport = function () {
              closeSidebar();
              exportZip();
            };
            exportZipBtn.addEventListener("click", runExport);
            exportZipBtn.addEventListener("keydown", function (e) {
              if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                runExport();
              }
            });
          }

          /* 侧边栏底部：切换主题 */
          var themeBtn = $("#themeToggleSidebar");
          if (themeBtn) themeBtn.addEventListener("click", toggleTheme);

          /* 侧边栏主导航项 */
          $$(".sidebar .nav-item[data-path]").forEach(function (el) {
            var go = function () {
              var path = el.getAttribute("data-path");
              closeSidebar();
              if (path === "#/") {
                setRandom();
                return;
              }
              if (location.hash === path) render();
              else location.hash = path;
            };
            el.addEventListener("click", go);
            el.addEventListener("keydown", function (e) {
              if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                go();
              }
            });
          });

          /* 侧边栏作品列表：打开 / 重命名 / 删除 */
          sidebarPagesEl.addEventListener("click", function (e) {
            var btn = e.target.closest("[data-action]");
            if (!btn) return;
            var id = Number(btn.dataset.id);
            var action = btn.dataset.action;
            if (action === "open") {
              closeSidebar();
              runPage(id);
            } else if (action === "rename") {
              renamePage(id);
            } else if (action === "delete") {
              deletePage(id);
            }
          });

          /* hash 变化 → 渲染 + 关侧边栏 */
          window.addEventListener("hashchange", function () {
            render();
            closeSidebar();
          });

          /* 屏幕旋转：刷新 CodeMirror 布局 */
          window.addEventListener("orientationchange", function () {
            if (editor) editor.refresh();
          });

          /* 窗口尺寸变化：预览模式跟随尺寸 + 刷新编辑器 */
          window.addEventListener("resize", function () {
            if (appEl.classList.contains("preview-mode")) {
              appEl.style.width = window.innerWidth + "px";
              appEl.style.height = window.innerHeight + "px";
            }
            if (editor) editor.refresh();
          });

          updateSidebarPages();
          render();
        }

        /* DOM 就绪后启动 */
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", init);
        } else {
          init();
        }
      })();
    </script>
  </body>
</html>
