<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>randomArt创意脚本编辑</title>

    <!-- CodeMirror -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/default.min.css"
      id="cm-theme-light"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css"
      id="cm-theme-dark"
      disabled
    />

    <!-- JSZip -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        font-family: Arial, "Helvetica Neue", sans-serif;
        background: #f5f5f5;
        transition: background 0.3s;
      }
      body.dark-mode { background: #1e1e1e; color: #ddd; }

      /*  汉堡按钮  */
      .hamburger-btn {
        position: fixed;
        top: 12px;
        left: 16px;
        z-index: 300;
        background: none;
        border: none;
        color: #333;
        font-size: 40px;
        font-weight: bold;
        cursor: pointer;
        padding: 4px 8px;
        line-height: 1;
        user-select: none;
        transition: color 0.3s, transform 0.15s;
      }
      .hamburger-btn:hover { transform: scale(1.1); }
      body.dark-mode .hamburger-btn { color: #fff; }

      /* ============ 侧边栏 ============ */
      .sidebar {
        position: fixed;
        top: 0;
        left: -280px;
        width: 280px;
        height: 100%;
        background: #2c2c2c;
        color: #eee;
        transition: left 0.3s ease;
        z-index: 200;
        padding: 20px 0;
        overflow-y: auto;
        box-shadow: 2px 0 10px rgba(0, 0, 0, 0.5);
        display: flex;
        flex-direction: column;
      }
      .sidebar.open { left: 0; }
      .sidebar .nav-item {
        padding: 12px 20px;
        border-bottom: 1px solid #444;
        cursor: pointer;
      }
      .sidebar .nav-item:hover { background: #3a3a3a; }
      .sidebar .nav-item[aria-current="page"] { background: #3a3a3a; }
      .sidebar .divider { border-top: 2px solid #666; margin: 10px 0; }
      .sidebar .section-title {
        padding: 8px 20px;
        font-size: 0.9rem;
        color: #aaa;
        font-weight: bold;
      }
      .sidebar .page-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 20px 8px 30px;
        border-bottom: 1px solid #3a3a3a;
      }
      .sidebar .page-item:hover { background: #3a3a3a; }
      .sidebar .page-item .page-title {
        flex: 1;
        color: #eee;
        cursor: pointer;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .sidebar .page-item .actions button {
        background: none;
        border: none;
        color: #aaa;
        cursor: pointer;
        font-size: 0.85rem;
        padding: 2px 5px;
      }
      .sidebar .page-item .actions .rename:hover { color: #5bc0de; }
      .sidebar .page-item .actions .del:hover { color: #d9534f; }
      .sidebar .no-pages {
        padding: 12px 20px;
        color: #888;
        font-style: italic;
      }
      .sidebar-footer {
        margin-top: auto;
        border-top: 2px solid #666;
        padding: 10px 0;
      }
      .sidebar-footer .nav-item { padding: 10px 20px; border-bottom: none; }

      /* ============ 遮罩层 ============ */
      .overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        z-index: 150;
      }
      .overlay.show { display: block; }

      /* ============ 主内容 ============ */
      #app {
        width: 100%;
        min-height: 100vh;
        padding: 70px 20px 40px;
        background: white;
        transition: background 0.3s;
      }
      body.dark-mode #app { background: #2d2d2d; color: #ddd; }
      #app.preview-mode {
        padding: 0;
        background: #000;
        min-height: 100vh;
      }
      #app.preview-mode iframe {
        width: 100%;
        height: 100vh;
        border: none;
        display: block;
      }

      /* ============ 表单 ============ */
      .form-group { margin-bottom: 15px; }
      .form-group label {
        display: block;
        font-weight: bold;
        margin-bottom: 5px;
      }
      .form-group input,
      .form-group textarea {
        width: 100%;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-family: monospace;
      }
      body.dark-mode .form-group input,
      body.dark-mode .form-group textarea {
        background: #3a3a3a;
        color: #ddd;
        border-color: #555;
      }
      .form-group .CodeMirror {
        border: 1px solid #ccc;
        border-radius: 4px;
        height: 200px;
        font-size: 14px;
      }
      body.dark-mode .form-group .CodeMirror { border-color: #555; }

      button {
        background: #007bff;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.95rem;
      }
      button:hover { background: #0056b3; }
      button:disabled { opacity: 0.6; cursor: not-allowed; }

      .result {
        margin-top: 20px;
        padding: 10px;
        background: #e9f7fe;
        border-radius: 4px;
      }
      body.dark-mode .result { background: #2a4a5a; }
      .preview-img {
        max-width: 200px;
        max-height: 200px;
        margin-top: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        display: block;
      }
      .action-buttons {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 10px;
      }
      .action-buttons button { background: #6c757d; }
      .action-buttons button.preview { background: #28a745; }
      .action-buttons button.zip { background: #17a2b8; }

      /* ============ 模态框 ============ */
      .modal-backdrop {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 400;
        align-items: center;
        justify-content: center;
      }
      .modal-backdrop.show { display: flex; }
      .modal {
        background: #fff;
        color: #222;
        border-radius: 8px;
        width: min(420px, 90vw);
        padding: 20px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      }
      body.dark-mode .modal { background: #2d2d2d; color: #ddd; }
      .modal h3 { margin: 0 0 12px; }
      .modal input {
        width: 100%;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
        margin-bottom: 16px;
        font-size: 1rem;
      }
      body.dark-mode .modal input {
        background: #3a3a3a;
        color: #ddd;
        border-color: #555;
      }
      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      .modal-actions .cancel { background: #6c757d; }
      .modal-actions .danger { background: #d9534f; }

      /* ============ 响应式 ============ */
      @media (max-width: 600px) {
        .sidebar { width: 240px; left: -240px; }
        .hamburger-btn { top: 8px; left: 10px; font-size: 34px; }
        #app { padding: 60px 12px 30px; }
      }
    </style>
  </head>
  <body>
    <button
      class="hamburger-btn"
      id="hamburgerBtn"
      aria-label="打开菜单"
      aria-expanded="false"
      aria-controls="sidebar"
    >☰</button>

    <nav class="sidebar" id="sidebar" aria-label="主导航">
      <div class="nav-item" data-path="#/" role="button" tabindex="0">🏠 首页</div>
      <div class="nav-item" data-path="#/about" role="button" tabindex="0">📖 关于</div>
      <div class="nav-item" data-path="#/generator" role="button" tabindex="0">✏️ 生成脚本</div>
      <div class="divider"></div>
      <div class="section-title">📄 我的脚本</div>
      <div id="sidebar-pages">
        <div class="no-pages">暂无生成的脚本</div>
      </div>
      <div class="sidebar-footer">
        <div class="nav-item" id="themeToggleSidebar" role="button" tabindex="0">
          🌓 切换主题
        </div>
      </div>
    </nav>
    <div class="overlay" id="overlay"></div>

    <main id="app">加载中…</main>

    <!-- 通用模态框 -->
    <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true">
      <div class="modal" id="modalBox"></div>
    </div>

    <!-- CodeMirror -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>

    <script>
      (function () {
        "use strict";

        /* =====================================================================
         * 常量 & 工具
         * ===================================================================== */
        const STORAGE_KEY = "p5_pages";
        const THEME_KEY = "p5_theme";
        const MAX_IMAGE_BYTES = 1.5 * 1024 * 1024; // 单张图片 1.5MB 上限

        const $ = (sel, root) => (root || document).querySelector(sel);
        const $$ = (sel, root) =>
          Array.prototype.slice.call((root || document).querySelectorAll(sel));

        function escapeHtml(text) {
          return String(text)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
        }

        function escapeScriptClose(str) {
          // 防止用户脚本里的 </script> 提前闭合宿主 <script>
          return String(str).replace(/<\/script/gi, "<\\/script");
        }

        /* =====================================================================
         * 本地存储
         * ===================================================================== */
        function getPages() {
          try {
            const raw = localStorage.getItem(STORAGE_KEY);
            const list = raw ? JSON.parse(raw) : [];
            return Array.isArray(list) ? list : [];
          } catch (e) {
            console.warn("读取本地存储失败:", e);
            return [];
          }
        }

        function savePages(pages) {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(pages));
            return true;
          } catch (e) {
            if (
              e.name === "QuotaExceededError" ||
              e.code === 22 ||
              e.name === "NS_ERROR_DOM_QUOTA_REACHED"
            ) {
              showAlert(
                "本地存储已满",
                "请删除部分作品，或上传更小的图片后再试。",
                true
              );
            } else {
              showAlert("保存失败", String(e && e.message ? e.message : e), true);
            }
            return false;
          }
        }

        /* =====================================================================
         * 模态框（替代 confirm / prompt / alert）
         * ===================================================================== */
        const modalBackdrop = $("#modalBackdrop");
        const modalBox = $("#modalBox");
        let lastFocused = null;

        function openModal(builder) {
          lastFocused = document.activeElement;
          modalBox.innerHTML = "";
          builder(modalBox);
          modalBackdrop.classList.add("show");
          const firstInput = $("input, button", modalBox);
          if (firstInput) firstInput.focus();
        }
        function closeModal() {
          modalBackdrop.classList.remove("show");
          modalBox.innerHTML = "";
          if (lastFocused && lastFocused.focus) lastFocused.focus();
        }
        modalBackdrop.addEventListener("click", function (e) {
          if (e.target === modalBackdrop) closeModal();
        });

        function showAlert(title, message, isError) {
          openModal(function (box) {
            const h = document.createElement("h3");
            h.textContent = title;
            const p = document.createElement("p");
            p.textContent = message;
            const actions = document.createElement("div");
            actions.className = "modal-actions";
            const ok = document.createElement("button");
            ok.textContent = "知道了";
            if (isError) ok.className = "danger";
            ok.addEventListener("click", closeModal);
            actions.appendChild(ok);
            box.append(h, p, actions);
          });
        }

        function showConfirm(title, message, onConfirm, danger) {
          openModal(function (box) {
            const h = document.createElement("h3");
            h.textContent = title;
            const p = document.createElement("p");
            p.textContent = message;
            const actions = document.createElement("div");
            actions.className = "modal-actions";

            const cancel = document.createElement("button");
            cancel.className = "cancel";
            cancel.textContent = "取消";
            cancel.addEventListener("click", closeModal);

            const ok = document.createElement("button");
            ok.textContent = "确定";
            if (danger) ok.className = "danger";
            ok.addEventListener("click", function () {
              closeModal();
              onConfirm();
            });

            actions.append(cancel, ok);
            box.append(h, p, actions);
          });
        }

        function showPrompt(title, defaultValue, onOk) {
          openModal(function (box) {
            const h = document.createElement("h3");
            h.textContent = title;
            const input = document.createElement("input");
            input.type = "text";
            input.value = defaultValue || "";

            const actions = document.createElement("div");
            actions.className = "modal-actions";

            const cancel = document.createElement("button");
            cancel.className = "cancel";
            cancel.textContent = "取消";
            cancel.addEventListener("click", closeModal);

            const ok = document.createElement("button");
            ok.textContent = "保存";
            ok.addEventListener("click", function () {
              const value = input.value.trim();
              if (!value) {
                input.focus();
                return;
              }
              closeModal();
              onOk(value);
            });

            input.addEventListener("keydown", function (e) {
              if (e.key === "Enter") ok.click();
            });

            actions.append(cancel, ok);
            box.append(h, input, actions);
          });
        }

        /* =====================================================================
         * 生成独立 HTML
         * ===================================================================== */
        function generatePageHtml(title, script, imageDataUrl) {
          const safeTitle = escapeHtml(title || "未命名页面");
          const imgVar = imageDataUrl
            ? 'var imageUrl = "' + imageDataUrl + '";'
            : "var imageUrl = null;";
          const safeImgVar = escapeScriptClose(imgVar);
          const safeScript = escapeScriptClose(script);

          return (
            "<!DOCTYPE html>\n" +
            '<html lang="zh-CN">\n' +
            "<head>\n" +
            '  <meta charset="UTF-8">\n' +
            '  <meta name="viewport" content="width=device-width, initial-scale=1.0">\n' +
            "  <title>" + safeTitle + "</title>\n" +
            '  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"><\/script>\n' +
            "</head>\n" +
            "<body>\n" +
            "  <script>\n" +
            "    " + safeImgVar + "\n" +
            "    " + safeScript + "\n" +
            "  <\/script>\n" +
            "</body>\n" +
            "</html>"
          );
        }

        /* =====================================================================
         * 预览 / 导出
         * ===================================================================== */
        function previewPage(htmlContent) {
          const blob = new Blob([htmlContent], { type: "text/html" });
          const url = URL.createObjectURL(blob);
          const win = window.open(url, "_blank", "noopener");
          if (!win) {
            URL.revokeObjectURL(url);
            showAlert("无法打开预览", "请允许本站弹出新窗口后重试。", true);
            return;
          }
          // 延迟回收，避免新窗口尚未加载完毕
          setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
        }

        function exportZip() {
          const pages = getPages();
          if (!pages.length) {
            showAlert("无法导出", "当前没有可导出的作品。");
            return;
          }
          const zip = new JSZip();
          pages.forEach(function (page, idx) {
            // 保留中文和 Unicode，只替换文件系统非法字符
            const base = (page.title || "untitled").replace(/[\\/:*?"<>|]/g, "_");
            zip.file("p5_" + base + "_" + (idx + 1) + ".html", page.html);
          });
          zip.generateAsync({ type: "blob" })
            .then(function (blob) {
              const url = URL.createObjectURL(blob);
              const link = document.createElement("a");
              link.href = url;
              link.download = "p5_works.zip";
              document.body.appendChild(link);
              link.click();
              document.body.removeChild(link);
              setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
            })
            .catch(function (err) {
              showAlert("导出失败", String(err && err.message ? err.message : err), true);
            });
        }

        /* =====================================================================
         * 侧边栏：渲染 & 事件委托
         * ===================================================================== */
        const sidebarPagesEl = $("#sidebar-pages");

        function updateSidebarPages() {
          const pages = getPages();
          if (!pages.length) {
            const empty = document.createElement("div");
            empty.className = "no-pages";
            empty.textContent = "暂无生成的脚本";
            sidebarPagesEl.replaceChildren(empty);
            return;
          }

          const frag = document.createDocumentFragment();
          pages.forEach(function (page) {
            const item = document.createElement("div");
            item.className = "page-item";

            const titleSpan = document.createElement("span");
            titleSpan.className = "page-title";
            titleSpan.textContent = page.title;
            titleSpan.dataset.action = "open";
            titleSpan.dataset.id = page.id;

            const actions = document.createElement("div");
            actions.className = "actions";

            const renameBtn = document.createElement("button");
            renameBtn.className = "rename";
            renameBtn.title = "重命名";
            renameBtn.textContent = "✏️";
            renameBtn.dataset.action = "rename";
            renameBtn.dataset.id = page.id;

            const delBtn = document.createElement("button");
            delBtn.className = "del";
            delBtn.title = "删除";
            delBtn.textContent = "🗑️";
            delBtn.dataset.action = "delete";
            delBtn.dataset.id = page.id;

            actions.append(renameBtn, delBtn);
            item.append(titleSpan, actions);
            frag.appendChild(item);
          });
          sidebarPagesEl.replaceChildren(frag);
        }

        // 单一委托监听：所有页面操作
        sidebarPagesEl.addEventListener("click", function (e) {
          const btn = e.target.closest("[data-action]");
          if (!btn) return;
          const id = Number(btn.dataset.id);
          const action = btn.dataset.action;
          if (action === "open") navigateToPage(id);
          else if (action === "rename") renamePage(id);
          else if (action === "delete") deletePage(id);
        });

        function navigateToPage(id) {
          const page = getPages().find(function (p) { return p.id === id; });
          if (!page) return;
          const app = $("#app");
          app.innerHTML = "";
          const iframe = document.createElement("iframe");
          iframe.setAttribute("title", page.title);
          iframe.setAttribute("sandbox", "allow-scripts allow-pointer-lock allow-popups");
          iframe.srcdoc = page.html;
          app.appendChild(iframe);
          app.classList.add("preview-mode");
          closeSidebar();
          // 记录当前查看的作品，便于路由变化时清理
          app.dataset.currentPageId = String(id);
        }

        function deletePage(id) {
          const pages = getPages();
          const page = pages.find(function (p) { return p.id === id; });
          if (!page) return;
          showConfirm(
            "删除作品",
            '确定要删除「' + page.title + '」吗？此操作不可恢复。',
            function () {
              const list = getPages().filter(function (p) { return p.id !== id; });
              savePages(list);
              updateSidebarPages();
              const app = $("#app");
              if (app.classList.contains("preview-mode")) {
                app.classList.remove("preview-mode");
                if (location.hash !== "#/") location.hash = "#/";
              }
              render();
            },
            true
          );
        }

        function renamePage(id) {
          const pages = getPages();
          const page = pages.find(function (p) { return p.id === id; });
          if (!page) return;
          showPrompt("重命名作品", page.title, function (newTitle) {
            page.title = newTitle;
            savePages(pages);
            updateSidebarPages();
            render();
          });
        }

        /* =====================================================================
         * 侧边栏开关
         * ===================================================================== */
        const sidebarEl = $("#sidebar");
        const overlayEl = $("#overlay");
        const hamburgerBtn = $("#hamburgerBtn");

        function openSidebar() {
          sidebarEl.classList.add("open");
          overlayEl.classList.add("show");
          hamburgerBtn.setAttribute("aria-expanded", "true");
        }
        function closeSidebar() {
          sidebarEl.classList.remove("open");
          overlayEl.classList.remove("show");
          hamburgerBtn.setAttribute("aria-expanded", "false");
        }

        hamburgerBtn.addEventListener("click", openSidebar);
        overlayEl.addEventListener("click", closeSidebar);
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") {
            if (modalBackdrop.classList.contains("show")) closeModal();
            else closeSidebar();
          }
        });

        /* =====================================================================
         * 主题
         * ===================================================================== */
        let editor = null;
        let uploadedImageDataUrl = null;

        function applyTheme(theme) {
          const lightTheme = $("#cm-theme-light");
          const darkTheme = $("#cm-theme-dark");
          if (theme === "dark") {
            document.body.classList.add("dark-mode");
            lightTheme.disabled = true;
            darkTheme.disabled = false;
          } else {
            document.body.classList.remove("dark-mode");
            lightTheme.disabled = false;
            darkTheme.disabled = true;
          }
          if (editor) editor.setOption("theme", theme === "dark" ? "dracula" : "default");
        }

        function currentTheme() {
          return document.body.classList.contains("dark-mode") ? "dark" : "light";
        }

        function toggleTheme() {
          const next = currentTheme() === "dark" ? "light" : "dark";
          applyTheme(next);
          try { localStorage.setItem(THEME_KEY, next); } catch (e) { /* 忽略 */ }
        }

        $("#themeToggleSidebar").addEventListener("click", toggleTheme);

        /* =====================================================================
         * 侧边栏导航（hash 路由）
         * ===================================================================== */
        $$(".sidebar .nav-item[data-path]").forEach(function (el) {
          const go = function () {
            const path = el.getAttribute("data-path");
            if (location.hash === path) {
              render();
            } else {
              location.hash = path;
            }
            closeSidebar();
          };
          el.addEventListener("click", go);
          el.addEventListener("keydown", function (e) {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              go();
            }
          });
        });

        /* =====================================================================
         * 页面渲染
         * ===================================================================== */
        const appEl = $("#app");

        function destroyEditor() {
          if (editor) {
            try { editor.toTextArea(); } catch (e) { /* ignore */ }
            editor = null;
          }
        }

        function getRoute() {
          const hash = location.hash || "#/";
          return hash.replace(/^#/, "") || "/";
        }

        function setActiveNav(path) {
          $$(".sidebar .nav-item[data-path]").forEach(function (el) {
            if (el.getAttribute("data-path") === "#" + path) {
              el.setAttribute("aria-current", "page");
            } else {
              el.removeAttribute("aria-current");
            }
          });
        }

        /* ---------- 首页 ---------- */
        function renderHome() {
          const wrap = document.createElement("div");
          wrap.innerHTML =
            "<h1>🎨 p5.js 脚本生成器</h1>" +
            "<p>所有数据保存在本地浏览器中，无需服务器。</p>" +
            "<p>编写 p5.js 脚本，上传图片素材，生成独立的 HTML 页面。</p>" +
            "<p>支持预览、导出 ZIP、删除和重命名作品。</p>" +
            "<p>点击左上角 ☰ 菜单查看所有作品。</p>";
          return wrap;
        }

        /* ---------- 关于 ---------- */
        function renderAbout() {
          const wrap = document.createElement("div");
          wrap.innerHTML =
            "<h1>📖 关于</h1>" +
            "<p>纯前端工具，基于 localStorage 存储，无需后端。</p>" +
            "<p>使用 CodeMirror 实现代码高亮，支持亮色 / 暗色主题。</p>" +
            "<p>所有脚本均可导出为 ZIP 包。</p>";
          return wrap;
        }

        /* ---------- 生成器 ---------- */
        function renderGenerator() {
          const wrap = document.createElement("div");
          wrap.innerHTML =
            "<h1>✏️ 编写 p5.js 脚本</h1>" +
            "<p>输入标题和 p5.js 代码，上传图片（可选），点击提交。</p>" +
            '<div class="form-group">' +
            '  <label for="title">页面标题</label>' +
            '  <input type="text" id="title" placeholder="例如：我的创意绘图">' +
            "</div>" +
            '<div class="form-group">' +
            '  <label for="script">p5.js 脚本代码</label>' +
            '  <textarea id="script" placeholder="例如：&#10;function setup() {&#10;  createCanvas(400, 400);&#10;  background(220);&#10;}&#10;function draw() {&#10;  ellipse(mouseX, mouseY, 50, 50);&#10;}"></textarea>' +
            "</div>" +
            '<div class="form-group">' +
            '  <label for="image">上传图片（可选，脚本可通过 <code>imageUrl</code> 加载）</label>' +
            '  <input type="file" id="image" accept="image/*">' +
            '  <div id="image-preview"></div>' +
            "</div>" +
            '<button id="buildBtn" type="button">提交页面</button>' +
            '<div id="result" class="result" style="display:none;"></div>';
          return wrap;
        }

        function bindGenerator() {
          const titleInput = $("#title");
          const textarea = $("#script");
          const fileInput = $("#image");
          const previewEl = $("#image-preview");
          const resultEl = $("#result");
          const buildBtn = $("#buildBtn");

          uploadedImageDataUrl = null;

          // 直接同步初始化 CodeMirror（元素已挂载）
          destroyEditor();
          const themeName = currentTheme() === "dark" ? "dracula" : "default";
          editor = CodeMirror.fromTextArea(textarea, {
            mode: "javascript",
            lineNumbers: true,
            theme: themeName,
            tabSize: 2,
            indentUnit: 2,
            autofocus: true,
          });
          editor.setSize(null, 200);

          // 文件选择
          fileInput.addEventListener("change", function () {
            const file = this.files && this.files[0];
            if (!file) return;

            if (!/^image\//.test(file.type)) {
              showAlert("文件类型不支持", "请选择图片文件。", true);
              this.value = "";
              return;
            }
            if (file.size > MAX_IMAGE_BYTES) {
              showAlert(
                "图片太大",
                "单张图片请小于 " + Math.round(MAX_IMAGE_BYTES / 1024 / 1024 * 10) / 10 + "MB，以免本地存储空间耗尽。",
                true
              );
              this.value = "";
              return;
            }

            const reader = new FileReader();
            reader.onload = function (e) {
              uploadedImageDataUrl = e.target.result;
              const tip = document.createElement("p");
              tip.textContent = "✅ 图片上传成功";
              const img = document.createElement("img");
              img.src = e.target.result;
              img.className = "preview-img";
              img.alt = "上传预览";
              previewEl.replaceChildren(tip, img);
            };
            reader.onerror = function () {
              showAlert("读取失败", "无法读取该图片，请重试。", true);
            };
            reader.readAsDataURL(file);
          });

          // 提交
          buildBtn.addEventListener("click", function () {
            const title = titleInput.value.trim() || "未命名脚本";
            const script = (editor ? editor.getValue() : textarea.value).trim();
            if (!script) {
              showAlert("缺少脚本", "请填写 p5.js 脚本代码。", true);
              return;
            }

            const imageDataUrl = uploadedImageDataUrl || "";
            const htmlContent = generatePageHtml(title, script, imageDataUrl);

            const pages = getPages();
            pages.push({
              id: Date.now() + Math.floor(Math.random() * 1000),
              title: title,
              html: htmlContent,
              timestamp: new Date().toISOString(),
            });

            if (!savePages(pages)) return; // 保存失败不继续

            updateSidebarPages();

            // 结果展示
            resultEl.style.display = "block";
            const msg = document.createElement("p");
            msg.textContent = "✅ 页面生成成功！已保存到本地存储。";

            const btnContainer = document.createElement("div");
            btnContainer.className = "action-buttons";

            const previewBtn = document.createElement("button");
            previewBtn.className = "preview";
            previewBtn.textContent = "👁️ 预览";
            previewBtn.addEventListener("click", function () {
              previewPage(htmlContent);
            });

            const zipBtn = document.createElement("button");
            zipBtn.className = "zip";
            zipBtn.textContent = "📦 导出所有脚本 (ZIP)";
            zipBtn.addEventListener("click", exportZip);

            btnContainer.append(previewBtn, zipBtn);
            resultEl.replaceChildren(msg, btnContainer);

            // 重置表单
            titleInput.value = "";
            if (editor) editor.setValue("");
            uploadedImageDataUrl = "";
            previewEl.replaceChildren();
            fileInput.value = "";
          });
        }

        function render() {
          const path = getRoute();
          destroyEditor();

          if (appEl.classList.contains("preview-mode")) {
            app启动El.classList.remove("pre
view-mode");
            delete appEl.dataset        .currentPageId;
          }
          * appEl.replaceChildren();
          setActiveNav(path =);

          if (path === "/" || path================================================================ === "/index.html" || path === "") {
            appEl.appendChild(renderHome());
          } else if (path === "/about") {
            appEl.appendChild(renderAbout());
          } else if (path === "/generator") {
            appEl.appendChild(renderGenerator());
            bindGenerator();
          } else {
            const wrap = document.createElement("div");
            const h = document.createElement("h1");
            h.textContent = "📄 页面 " + path;
            const p = document.createElement("p");
            p.textContent = "内容未定义。";
            wrap.append(h, p);
            appEl.appendChild(wrap);
          }
        }

        /* =====================================================================
         * 路由监听
         * ===================================================================== */
        window.addEventListener("hashchange", function () {
          render();
          closeSidebar();
        });

        // 如果用户直接打开时没有 hash，补一个
        if (!location.hash) {
          location.replace(location.pathname + "#/");
        }

        /* =====================================================================
         * ==== */
        window.addEventListener("DOMContentLoaded", function () {
          // 恢复主题
          let savedTheme = "light";
          try { savedTheme = localStorage.getItem(THEME_KEY) || "light"; } catch (e) {}
          applyTheme(savedTheme);

          updateSidebarPages();
          render();
        });
      })();
    </script>
  </body>
</html>
