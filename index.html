<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>randomArt创意脚本编辑</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/default.min.css"
      id="cm-theme-light"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css"
      id="cm-theme-dark"
      disabled
    />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
      :root {
        --bg-light: #f5f5f5;
        --bg-dark: #1e1e1e;
        --surface-light: #ffffff;
        --surface-dark: #2d2d2d;
        --text-light: #222222;
        --text-dark: #dddddd;
        --hover-light: rgba(0, 0, 0, 0.055);
        --hover-dark: rgba(255, 255, 255, 0.07);
        --line-light: rgba(0, 0, 0, 0.08);
        --line-dark: rgba(255, 255, 255, 0.08);
        --sidebar-w: min(280px, 78vw);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        font-family: Arial, "Helvetica Neue", system-ui, sans-serif;
        background: var(--bg-light);
        color: var(--text-light);
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        touch-action: pan-x pan-y;
        overscroll-behavior: none;
        transition:
          background 0.3s,
          color 0.3s;
      }
      body.dark-mode {
        background: var(--bg-dark);
        color: var(--text-dark);
      }

      body.preview-lock {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
      }

      .hamburger-btn {
        position: fixed;
        top: clamp(8px, 2vw, 14px);
        left: clamp(10px, 3vw, 18px);
        z-index: 300;
        background: none;
        border: none;
        color: #333;
        font-size: clamp(30px, 6vw, 40px);
        font-weight: bold;
        cursor: pointer;
        padding: 4px 8px;
        line-height: 1;
        user-select: none;
        transition:
          color 0.3s,
          opacity 0.22s ease,
          transform 0.22s ease;
      }
      .hamburger-btn:hover {
        transform: scale(1.1);
      }
      body.dark-mode .hamburger-btn {
        color: #fff;
      }
      body.preview-lock .hamburger-btn {
        color: #fff;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
      }
      body.sidebar-open .hamburger-btn {
        opacity: 0;
        transform: scale(0.6);
        pointer-events: none;
      }

      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: var(--sidebar-w);
        height: 100vh;
        height: 100dvh;
        background: var(--bg-light);
        color: var(--text-light);
        transform: translateX(-100%);
        transition:
          transform 0.3s ease,
          background 0.3s,
          color 0.3s;
        z-index: 200;
        padding: clamp(14px, 3vw, 20px) 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        -webkit-overflow-scrolling: touch;
        box-shadow: inset -22px 0 28px -26px rgba(0, 0, 0, 0.55);
        border-right: 1px solid var(--line-light);
      }
      .sidebar.open {
        transform: translateX(0);
      }
      body.dark-mode .sidebar {
        background: var(--bg-dark);
        color: var(--text-dark);
        box-shadow: inset -22px 0 28px -26px rgba(0, 0, 0, 1);
        border-right-color: var(--line-dark);
      }

      /* 搜索框 */
      .sidebar-search {
        padding: 0 clamp(14px, 4vw, 18px) 12px;
        margin-top: -4px;
      }
      .sidebar-search input {
        width: 100%;
        padding: 9px 12px;
        border: 1px solid var(--line-light);
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font-size: 16px;
        font-family: inherit;
        outline: none;
        transition:
          border-color 0.15s,
          background 0.15s;
      }
      .sidebar-search input:focus {
        border-color: #007bff;
      }
      body.dark-mode .sidebar-search input {
        border-color: var(--line-dark);
        background: rgba(255, 255, 255, 0.05);
      }
      body.dark-mode .sidebar-search input:focus {
        border-color: #4da3ff;
      }
      .sidebar-search input::placeholder {
        color: #999;
      }
      body.dark-mode .sidebar-search input::placeholder {
        color: #777;
      }
      .sidebar-search input[type="search"]::-webkit-search-cancel-button {
        -webkit-appearance: none;
        appearance: none;
        height: 14px;
        width: 14px;
        background:
          linear-gradient(
            45deg,
            transparent 45%,
            #888 45%,
            #888 55%,
            transparent 55%
          ),
          linear-gradient(
            -45deg,
            transparent 45%,
            #888 45%,
            #888 55%,
            transparent 55%
          );
        cursor: pointer;
      }

      .sidebar .nav-item {
        padding: 12px clamp(16px, 4vw, 20px);
        border-bottom: 1px solid var(--line-light);
        cursor: pointer;
        transition: background 0.15s;
      }
      body.dark-mode .sidebar .nav-item {
        border-bottom-color: var(--line-dark);
      }
      .sidebar .nav-item:hover {
        background: var(--hover-light);
      }
      body.dark-mode .sidebar .nav-item:hover {
        background: var(--hover-dark);
      }
      .sidebar .nav-item[aria-current="page"] {
        background: var(--hover-light);
      }
      body.dark-mode .sidebar .nav-item[aria-current="page"] {
        background: var(--hover-dark);
      }

      .sidebar .divider {
        border-top: 1px solid var(--line-light);
        margin: 10px 0;
      }
      body.dark-mode .sidebar .divider {
        border-top-color: var(--line-dark);
      }

      .sidebar .section-title {
        padding: 8px clamp(16px, 4vw, 20px);
        font-size: 0.85rem;
        color: #888;
        font-weight: bold;
      }
      body.dark-mode .sidebar .section-title {
        color: #999;
      }

      .sidebar .page-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px clamp(16px, 4vw, 20px) 8px clamp(22px, 6vw, 30px);
        border-bottom: 1px solid var(--line-light);
      }
      body.dark-mode .sidebar .page-item {
        border-bottom-color: var(--line-dark);
      }
      .sidebar .page-item:hover {
        background: var(--hover-light);
      }
      body.dark-mode .sidebar .page-item:hover {
        background: var(--hover-dark);
      }

      .sidebar .page-item .page-title {
        flex: 1;
        color: inherit;
        cursor: pointer;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .sidebar .page-item .actions button {
        background: none;
        border: none;
        color: #888;
        cursor: pointer;
        font-size: 0.85rem;
        padding: 2px 5px;
        transition: color 0.15s;
      }
      .sidebar .page-item .actions .rename:hover {
        color: #5bc0de;
      }
      .sidebar .page-item .actions .del:hover {
        color: #d9534f;
      }

      .sidebar .no-pages {
        padding: 12px clamp(16px, 4vw, 20px);
        color: #888;
        font-style: italic;
      }

      /* 侧边栏底部*/
      .sidebar-footer {
        margin-top: auto;
        border-top: 1px solid var(--line-light);
        padding: 0;
      }
      body.dark-mode .sidebar-footer {
        border-top-color: var(--line-dark);
      }

      .sidebar-footer .footer-row {
        display: flex;
        align-items: stretch;
      }
      .sidebar-footer .footer-item {
        flex: 1 1 0;
        min-width: 0;
        padding: 12px clamp(8px, 2vw, 14px);
        border-bottom: none;
        text-align: center;
        font-size: 0.9rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .sidebar-footer .footer-vdivider {
        width: 1px;
        flex: 0 0 1px;
        background: var(--line-light);
      }
      body.dark-mode .sidebar-footer .footer-vdivider {
        background: var(--line-dark);
      }

      .overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        z-index: 150;
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      .overlay.show {
        display: block;
        opacity: 1;
      }

      #app {
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        padding: clamp(56px, 10vw, 78px) clamp(14px, 5vw, 32px)
          clamp(28px, 7vw, 52px);
        background: var(--surface-light);
        color: var(--text-light);
        transition:
          background 0.3s,
          color 0.3s;
        overflow-x: hidden;
      }
      body.dark-mode #app {
        background: var(--surface-dark);
        color: var(--text-dark);
      }
      #app > div {
        width: 100%;
        max-width: 940px;
        margin: 0 auto;
      }
      #app > div.generator-page {
        max-width: none;
      }

      #app.preview-mode {
        padding: 0;
        max-width: none;
        min-height: 0;
        background: #000;
        overflow: hidden;
        z-index: 100;
      }
      #app.preview-mode iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
        background: #fff;
        touch-action: none;
      }

      /* AI页面全屏最大化 */
      #app.ai-mode {
        padding: 0;
        max-width: none;
        height: 100vh;
        height: 100dvh;
        min-height: 0;
        overflow: hidden;
      }
      #app.ai-mode > div {
        max-width: none;
        margin: 0;
      }

      #app h1 {
        font-size: clamp(1.35rem, 4.5vw, 1.9rem);
        margin: 0 0 0.6em;
        line-height: 1.25;
        word-break: break-word;
      }
      #app p {
        font-size: clamp(0.9rem, 2.6vw, 1rem);
        line-height: 1.6;
        margin: 0.5em 0;
      }

      .form-group {
        margin-bottom: 15px;
      }
      .form-group label {
        display: block;
        font-weight: bold;
        margin-bottom: 5px;
        font-size: clamp(0.85rem, 2.5vw, 0.95rem);
      }
      .form-group input,
      .form-group textarea {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 16px;
      }
      body.dark-mode .form-group input,
      body.dark-mode .form-group textarea {
        background: #3a3a3a;
        color: #ddd;
        border-color: #555;
      }
      .form-group .CodeMirror {
        border: 1px solid #ccc;
        border-radius: 4px;
        height: clamp(160px, 32vh, 240px) !important;
        font-size: 14px;
      }
      body.dark-mode .form-group .CodeMirror {
        border-color: #555;
      }

      .cm-placeholder-overlay {
        position: absolute;
        top: 5px;
        right: 8px;
        color: #9aa0a6;
        pointer-events: none;
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 13px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
        z-index: 5;
        user-select: none;
        overflow: hidden;
      }
      body.dark-mode .cm-placeholder-overlay {
        color: #8a8a8a;
      }

      button {
        background: #007bff;
        color: white;
        border: none;
        padding: 10px clamp(14px, 4vw, 20px);
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.95rem;
        transition: background 0.2s;
      }
      button:hover {
        background: #0056b3;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .result {
        margin-top: 20px;
        padding: 12px;
        background: #e9f7fe;
        border-radius: 4px;
        word-break: break-word;
      }
      body.dark-mode .result {
        background: #2a4a5a;
      }

      .preview-img {
        max-width: min(200px, 60vw);
        max-height: 200px;
        margin-top: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        display: block;
      }

      .action-buttons {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 10px;
      }
      .action-buttons button {
        background: #6c757d;
      }
      .action-buttons button.preview,
      .action-buttons button.download {
        background: #28a745;
      }

      .modal-backdrop {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 400;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      .modal-backdrop.show {
        display: flex;
      }
      .modal {
        background: #fff;
        color: #222;
        border-radius: 8px;
        width: min(480px, 100%);
        max-height: 88vh;
        overflow-y: auto;
        padding: clamp(16px, 4vw, 22px);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      }
      body.dark-mode .modal {
        background: #2d2d2d;
        color: #ddd;
      }
      .modal h3 {
        margin: 0 0 12px;
        font-size: 1.1rem;
      }
      .modal p {
        margin: 0 0 16px;
        line-height: 1.55;
        word-break: break-word;
      }
      .modal input {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        margin-bottom: 16px;
        font-size: 16px;
      }
      body.dark-mode .modal input {
        background: #3a3a3a;
        color: #ddd;
        border-color: #555;
      }
      .modal textarea {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        margin-bottom: 16px;
        font-size: 14px;
        font-family: inherit;
        line-height: 1.5;
        resize: vertical;
        min-height: 120px;
        outline: none;
      }
      .modal textarea:focus {
        border-color: #007bff;
      }
      body.dark-mode .modal textarea {
        background: #3a3a3a;
        color: #ddd;
        border-color: #555;
      }
      body.dark-mode .modal textarea:focus {
        border-color: #4da3ff;
      }
      .modal .modal-hint {
        font-size: 0.82rem;
        color: #888;
        margin: -8px 0 12px;
        line-height: 1.5;
      }
      body.dark-mode .modal .modal-hint {
        color: #999;
      }
      .modal-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .modal-actions .right-group {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .modal-actions .cancel {
        background: #6c757d;
      }
      .modal-actions .danger {
        background: #d9534f;
      }
      .modal-actions .link-btn {
        background: transparent;
        color: #888;
        padding: 8px 10px;
        font-size: 0.88rem;
        border-radius: 4px;
        text-decoration: underline;
      }
      .modal-actions .link-btn:hover {
        background: rgba(0, 0, 0, 0.06);
        color: #d9534f;
      }
      body.dark-mode .modal-actions .link-btn:hover {
        background: rgba(255, 255, 255, 0.08);
      }

      /* AI助手页面 */
      .ai-page {
        position: relative;
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        width: 100%;
        overflow: hidden;
      }

      /* 清除按钮 */
      .ai-clear-btn {
        position: absolute;
        top: clamp(8px, 2vw, 14px);
        right: clamp(10px, 3vw, 18px);
        z-index: 60;
        width: 20px;
        height: 20px;
        min-width: 20px;
        padding: 0;
        border-radius: 50%;
        background: transparent;
        border: 1.5px solid currentColor;
        color: inherit;
        font-size: 26px;
        font-weight: 400;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        opacity: 0.7;
        transition:
          opacity 0.15s,
          color 0.15s,
          border-color 0.15s,
          background 0.15s,
          transform 0.15s;
      }
      .ai-clear-btn:hover {
        opacity: 1;
        color: #d9534f;
        transform: scale(1.15);
      }
      .ai-clear-btn:active {
        transform: scale(0.95);
      }

      .ai-messages {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 64px 14px 16px;
        scroll-behavior: smooth;
      }
      .ai-msg {
        margin-bottom: 12px;
        display: flex;
      }
      .ai-msg:last-child {
        margin-bottom: 0;
      }
      .ai-msg.user {
        justify-content: flex-end;
      }
      .ai-msg .bubble {
        max-width: 84%;
        padding: 9px 13px;
        border-radius: 16px;
        white-space: pre-wrap;
        word-break: break-word;
        line-height: 1.55;
        font-size: 0.95rem;
      }
      .ai-msg.user .bubble {
        background: #007bff;
        color: #fff;
        border-bottom-right-radius: 4px;
      }
      .ai-msg.assistant .bubble {
        background: #e9ecef;
        color: #222;
        border-bottom-left-radius: 4px;
      }
      body.dark-mode .ai-msg.assistant .bubble {
        background: #3a3a3a;
        color: #ddd;
      }
      .ai-msg.pending .bubble {
        opacity: 0.65;
        font-style: italic;
      }
      .ai-empty {
        color: #999;
        text-align: center;
        padding: 48px 12px;
        font-size: 0.92rem;
        line-height: 1.8;
        white-space: pre-line;
      }
      body.dark-mode .ai-empty {
        color: #888;
      }

      /* 底部浮动输入区 */
      .ai-input-wrap {
        flex: 0 0 auto;
        padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
        background: linear-gradient(
          to top,
          var(--surface-light) 62%,
          rgba(255, 255, 255, 0)
        );
        pointer-events: none;
      }
      body.dark-mode .ai-input-wrap {
        background: linear-gradient(
          to top,
          var(--surface-dark) 62%,
          rgba(45, 45, 45, 0)
        );
      }

      .ai-input-bar {
        display: flex;
        align-items: flex-end;
        gap: 6px;
        width: 100%;
        max-width: 940px;
        margin: 0 auto;
        background: var(--surface-light);
        border: 1px solid var(--line-light);
        border-radius: 26px;
        padding: 6px;
        box-shadow: 0 8px 26px rgba(0, 0, 0, 0.16);
        pointer-events: auto;
        transition:
          background 0.3s,
          border-color 0.3s;
      }
      body.dark-mode .ai-input-bar {
        background: var(--surface-dark);
        border-color: var(--line-dark);
        box-shadow: 0 8px 26px rgba(0, 0, 0, 0.55);
      }

      .ai-model-picker {
        position: relative;
        flex: 0 0 auto;
      }
      .ai-model-btn {
        width: 38px;
        height: 38px;
        min-width: 38px;
        padding: 0;
        border-radius: 50%;
        background: transparent;
        color: inherit;
        border: none;
        font-size: 26px;
        font-weight: 300;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition:
          background 0.15s,
          transform 0.15s;
      }
      .ai-model-btn:hover {
        background: var(--hover-light);
      }
      body.dark-mode .ai-model-btn:hover {
        background: var(--hover-dark);
      }
      .ai-model-btn:active {
        transform: scale(0.94);
      }
      .ai-model-btn.has-model {
        font-size: 18px;
        font-weight: bold;
        background: rgba(0, 123, 255, 0.12);
      }

      .ai-model-menu {
        display: none;
        position: absolute;
        bottom: calc(100% + 10px);
        left: 0;
        background: #fff;
        color: #222;
        border: 1px solid #ccc;
        border-radius: 12px;
        box-shadow: 0 12px 34px rgba(0, 0, 0, 0.32);
        min-width: 280px;
        z-index: 500;
        overflow: hidden;
      }
      body.dark-mode .ai-model-menu {
        background: #2d2d2d;
        color: #ddd;
        border-color: #555;
      }
      .ai-model-menu.show {
        display: block;
      }
      .ai-model-item {
        display: flex;
        align-items: center;
        padding: 9px 10px;
        cursor: pointer;
        gap: 4px;
        font-size: 0.93rem;
        user-select: none;
      }
      .ai-model-item:hover {
        background: var(--hover-light);
      }
      body.dark-mode .ai-model-item:hover {
        background: var(--hover-dark);
      }
      .ai-model-item .ai-check {
        width: 16px;
        flex: 0 0 16px;
        display: inline-block;
        color: #28a745;
        font-weight: bold;
        text-align: center;
        visibility: hidden;
      }
      .ai-model-item.active .ai-check {
        visibility: visible;
      }
      .ai-model-item .ai-model-name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .ai-model-item .ai-key,
      .ai-model-item .ai-prompt,
      .ai-model-item .ai-dl {
        background: transparent;
        color: #888;
        padding: 4px 6px;
        border-radius: 6px;

  </head>
  <body>
    <button

    <main id="app">加载中…</main>

    <div
      class="modal-backdrop"
      id="modalBackdrop"
      role="dialog"
      aria-modal="true"
    >
      <div class="modal" id="modalBox"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>

    <script>
      (function () {
        "use strict";

        var STORAGE_KEY = "p5_pages";
        var THEME_KEY = "p5_theme";
        var MAX_IMAGE_BYTES = 1.5 * 1024 * 1024;

        /* p5脚本文件夹配置 */
        var P5_DIR = "p5/";
        var P5_CDN =
          "https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js";
        var P5_FILES = ["sketch1.js", "sketch2.js", "sketch3.js"];

        /* AI助手配置 */
        var AI_KEY_STORAGE = "p5_ai_keys";
        var AI_CHAT_STORAGE = "p5_ai_chats";
        var AI_PROMPT_STORAGE = "p5_ai_prompts";

        var AI_MODELS = [
          {
            id: "chatgpt",
            name: "ChatGPT",
            endpoint: "https://api.openai.com/v1/chat/completions",
            apiModel: "gpt-4o-mini",
          },
          {
            id: "gemini",
            name: "Gemini",
            endpoint:
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent",
            apiModel: "gemini-2.0-flash",
          },
          {
            id: "deepseek",
            name: "DeepSeek",
            endpoint: "https://api.deepseek.com/chat/completions",
            apiModel: "deepseek-chat",
          },
        ];

        var aiState = {
          currentModel: null,
          keys: {},
          chats: {},
          prompts: {},
          busy: false,
        };

        function aiModelConf(id) {
          for (var i = 0; i < AI_MODELS.length; i++) {
            if (AI_MODELS[i].id === id) return AI_MODELS[i];
          }
          return null;
        }
        function aiModelName(id) {
          var c = aiModelConf(id);
          return c ? c.name : id;
        }
        function loadAIKeys() {
          try {
            var raw = localStorage.getItem(AI_KEY_STORAGE);
            var o = raw ? JSON.parse(raw) : {};
            return o && typeof o === "object" ? o : {};
          } catch (e) {
            return {};
          }
        }
        function saveAIKeys() {
          try {
            localStorage.setItem(AI_KEY_STORAGE, JSON.stringify(aiState.keys));
          } catch (e) {}
        }
        function loadAIChats() {
          try {
            var raw = localStorage.getItem(AI_CHAT_STORAGE);
            var o = raw ? JSON.parse(raw) : {};
            return o && typeof o === "object" ? o : {};
          } catch (e) {
            return {};
          }
        }
        function saveAIChats() {
          try {
            localStorage.setItem(
              AI_CHAT_STORAGE,
              JSON.stringify(aiState.chats),
            );
          } catch (e) {}
        }
        function loadAIPrompts() {
          try {
            var raw = localStorage.getItem(AI_PROMPT_STORAGE);
            var o = raw ? JSON.parse(raw) : {};
            return o && typeof o === "object" ? o : {};
          } catch (e) {
            return {};
          }
        }
        function saveAIPrompts() {
          try {
            localStorage.setItem(
              AI_PROMPT_STORAGE,
              JSON.stringify(aiState.prompts),
            );
          } catch (e) {}
        }
        function initAIState() {
          aiState.keys = loadAIKeys();
          aiState.chats = loadAIChats();
          aiState.prompts = loadAIPrompts();
          AI_MODELS.forEach(function (m) {
            if (!Array.isArray(aiState.chats[m.id])) aiState.chats[m.id] = [];
            if (typeof aiState.prompts[m.id] !== "string") {
              aiState.prompts[m.id] = "";
            }
          });
          /* 默认不选中模型 */
          aiState.currentModel = null;
        }

        var SCRIPT_PLACEHOLDER =
          "例如：\n" +
          "function setup() {\n" +
          "  createCanvas(windowWidth, windowHeight);\n" +
          "  background(102);\n" +
          "}\n" +
          "function draw() {\n" +
          "  variableEllipse(mouseX, mouseY, pmouseX, pmouseY);\n" +
          "}\n" +
          "function variableEllipse(x, y, px, py) {\n" +
          "  let speed = abs(x - px) + abs(y - py);\n" +
          "  stroke(speed);\n" +
          "  ellipse(x, y, speed, speed);\n" +
          "}";

        function $(sel, root) {
          return (root || document).querySelector(sel);
        }
        function $$(sel, root) {
          return Array.prototype.slice.call(
            (root || document).querySelectorAll(sel),
          );
        }
        function escapeHtml(text) {
          return String(text)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
        }
        function escapeScriptClose(str) {
          return String(str).replace(/<\/script/gi, "<\\/script");
        }
        function safeFileName(name) {
          var n = String(name || "")
            .replace(/[\\/:*?"<>|]/g, "_")
            .trim();
          return n || "untitled";
        }

        function getPages() {
          try {
            var raw = localStorage.getItem(STORAGE_KEY);
            var list = raw ? JSON.parse(raw) : [];
            return Array.isArray(list) ? list : [];
          } catch (e) {
            return [];
          }
        }
        function savePages(pages) {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(pages));
            return true;
          } catch (e) {
            if (e && (e.name === "QuotaExceededError" || e.code === 22)) {
              showAlert(
                "本地存储已满",
                "请删除部分作品，或上传更小的图片后再试。",
                true,
              );
            } else {
              showAlert("保存失败", String((e && e.message) || e), true);
            }
            return false;
          }
        }

        var modalBackdrop, modalBox, lastFocused;

        function openModal(builder) {
          lastFocused = document.activeElement;
          modalBox.innerHTML = "";
          builder(modalBox);
          modalBackdrop.classList.add("show");
          var f = $("input, textarea, button", modalBox);
          if (f && f.focus) f.focus();
        }
        function closeModal() {
          modalBackdrop.classList.remove("show");
          modalBox.innerHTML = "";
          if (lastFocused && lastFocused.focus) lastFocused.focus();
        }
        function showAlert(title, message, isError) {
          openModal(function (box) {
            var h = document.createElement("h3");
            h.textContent = title;
            var p = document.createElement("p");
            p.textContent = message;
            var a = document.createElement("div");
            a.className = "modal-actions";
            var right = document.createElement("div");
            right.className = "right-group";
            var ok = document.createElement("button");
            ok.textContent = "知道了";
            if (isError) ok.className = "danger";
            ok.addEventListener("click", closeModal);
            right.appendChild(ok);
            a.appendChild(right);
            box.appendChild(h);
            box.appendChild(p);
            box.appendChild(a);
          });
        }
        function showConfirm(title, message, onConfirm, danger) {
          openModal(function (box) {
            var h = document.createElement("h3");
            h.textContent = title;
            var p = document.createElement("p");
            p.textContent = message;
            var a = document.createElement("div");
            a.className = "modal-actions";
            var right = document.createElement("div");
            right.className = "right-group";
            var cancel = document.createElement("button");
            cancel.className = "cancel";
            cancel.textContent = "取消";
            cancel.addEventListener("click", closeModal);
            var ok = document.createElement("button");
            ok.textContent = "确定";
            if (danger) ok.className = "danger";
            ok.addEventListener("click", function () {
              closeModal();
              onConfirm();
            });
            right.appendChild(cancel);
            right.appendChild(ok);
            a.appendChild(right);
            box.appendChild(h);
            box.appendChild(p);
            box.appendChild(a);
          });
        }
        function showPrompt(title, defaultValue, onOk, inputType) {
          openModal(function (box) {
            var h = document.createElement("h3");
            h.textContent = title;
            var input = document.createElement("input");
            input.type = inputType || "text";
            input.value = defaultValue || "";
            input.autocomplete = "off";
            input.spellcheck = false;
            var a = document.createElement("div");
            a.className = "modal-actions";
            var right = document.createElement("div");
            right.className = "right-group";
            var cancel = document.createElement("button");
            cancel.className = "cancel";
            cancel.textContent = "取消";
            cancel.addEventListener("click", closeModal);
            var ok = document.createElement("button");
            ok.textContent = "保存";
            ok.addEventListener("click", function () {
              var v = input.value.trim();
              if (!v) {
                input.focus();
                return;
              }
              closeModal();
              onOk(v);
            });
            input.addEventListener("keydown", function (e) {
              if (e.key === "Enter") ok.click();
            });
            right.appendChild(cancel);
            right.appendChild(ok);
            a.appendChild(right);
            box.appendChild(h);
            box.appendChild(input);
            box.appendChild(a);
          });
        }

        /* 多行文本输入弹窗（用于系统提示词） */
        function showPromptArea(opts) {
          openModal(function (box) {
            var h = document.createElement("h3");
            h.textContent = opts.title;

            var hint = document.createElement("div");
            hint.className = "modal-hint";
            hint.textContent =
              opts.hint || "提示词会在每次对话时作为系统消息发送给模型。";

            var ta = document.createElement("textarea");
            ta.value = opts.value || "";
            ta.placeholder = opts.placeholder || "";
            ta.rows = 7;
            ta.spellcheck = false;

            var a = document.createElement("div");
            a.className = "modal-actions";

            /* 左侧“清除提示词”按钮（仅当已有内容时显示） */
            var leftWrap = document.createElement("div");
            if (opts.value && opts.value.trim()) {
              var clearBtn = document.createElement("button");
              clearBtn.className = "link-btn";
              clearBtn.textContent = "清除提示词";
              clearBtn.addEventListener("click", function () {
                closeModal();
                if (opts.onClear) opts.onClear();
              });
              leftWrap.appendChild(clearBtn);
            }

            var rightWrap = document.createElement("div");
            rightWrap.className = "right-group";
            var cancel = document.createElement("button");
            cancel.className = "cancel";
            cancel.textContent = "取消";
            cancel.addEventListener("click", closeModal);

            var ok = document.createElement("button");
            ok.textContent = "保存";
            ok.addEventListener("click", function () {
              var v = ta.value; // 保留用户换行不做trim
              closeModal();
              opts.onOk(v);
            });
            ta.addEventListener("keydown", function (e) {
              // Ctrl+Enter快速保存
              if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                ok.click();
              }
            });
            rightWrap.appendChild(cancel);
            rightWrap.appendChild(ok);

            a.appendChild(leftWrap);
            a.appendChild(rightWrap);
            box.appendChild(h);
            box.appendChild(hint);
            box.appendChild(ta);
            box.appendChild(a);
          });
        }

        function generatePageHtml(title, script, imageDataUrl) {
          var safeTitle = escapeHtml(title || "未命名页面");
          var imgVar = imageDataUrl
            ? 'var imageUrl = "' + imageDataUrl + '";'
            : "var imageUrl = null;";
          var safeImgVar = escapeScriptClose(imgVar);
          var safeScript = escapeScriptClose(script);

          return (
            "<!DOCTYPE html>\n" +
            '<html lang="zh-CN">\n' +
            "<head>\n" +
            '  <meta charset="UTF-8">\n' +
            '  <meta name="viewport" content="width=device-width, initial-scale=1.0">\n' +
            "  <title>" +
            safeTitle +
            "</title>\n" +
            "  <style>\n" +
            "    html, body { margin: 0; padding: 0; }\n" +
            "    canvas { display: block; }\n" +
            "  </style>\n" +
            '  <script src="' +
            P5_CDN +
            '"><\/script>\n' +
            "</head>\n" +
            "<body>\n" +
            "  <script>\n" +
            "    " +
            safeImgVar +
            "\n" +
            "    " +
            safeScript +
            "\n" +
            "  <\/script>\n" +
            "</body>\n" +
            "</html>"
          );
        }

        function downloadSingleHtml(filename, html) {
          try {
            var blob = new Blob([html], { type: "text/html;charset=utf-8" });
            var url = URL.createObjectURL(blob);
            var link = document.createElement("a");
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setTimeout(function () {
              URL.revokeObjectURL(url);
            }, 1000);
          } catch (err) {
            showAlert("下载失败", String((err && err.message) || err), true);
          }
        }

        function exportZip() {
          var pages = getPages();
          if (!pages.length) {
            showAlert("无法导出", "当前没有可导出的作品。");
            return;
          }
          var zip = new JSZip();
          pages.forEach(function (page, idx) {
            var base = (page.title || "untitled").replace(/[\\/:*?"<>|]/g, "_");
            zip.file("p5_" + base + "_" + (idx + 1) + ".html", page.html);
          });
          zip
            .generateAsync({ type: "blob" })
            .then(function (blob) {
              var url = URL.createObjectURL(blob);
              var link = document.createElement("a");
              link.href = url;
              link.download = "p5_works.zip";
              document.body.appendChild(link);
              link.click();
              document.body.removeChild(link);
              setTimeout(function () {
                URL.revokeObjectURL(url);
              }, 1000);
            })
            .catch(function (err) {
              showAlert("导出失败", String((err && err.message) || err), true);
            });
        }

        var sidebarPagesEl, sidebarEl, overlayEl, hamburgerBtn;
        var sidebarSearchEl;
        var sidebarSearchKeyword = "";
        var appEl;

        /* 首页运行器 */
        var runner = { mode: "random", pageId: null };
        var currentRandomFile = null;

        function pickRandomP5File() {
          if (!P5_FILES || !P5_FILES.length) return null;
          if (P5_FILES.length === 1) return P5_FILES[0];
          var pool = P5_FILES.filter(function (f) {
            return f !== currentRandomFile;
          });
          if (!pool.length) pool = P5_FILES.slice();
          return pool[Math.floor(Math.random() * pool.length)];
        }

        function encodePath(fileName) {
          return String(fileName)
            .split("/")
            .map(function (seg) {
              return encodeURIComponent(seg);
            })
            .join("/");
        }

        function buildP5SrcDoc(fileName) {
          var src = P5_DIR + encodePath(fileName);
          return (
            "<!DOCTYPE html>\n" +
            '<html lang="zh-CN">\n' +
            "<head>\n" +
            '  <meta charset="UTF-8">\n' +
            '  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">\n' +
            "  <style>\n" +
            "    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; touch-action: none; }\n" +
            "    canvas { display: block; touch-action: none; }\n" +
            "  </style>\n" +
            '  <script src="' +
            P5_CDN +
            '"><\/script>\n' +
            '  <script src="' +
            src +
            '"><\/script>\n' +
            "</head>\n" +
            "<body></body>\n" +
            "</html>"
          );
        }

        function updateSidebarPages() {
          var pages = getPages();
          var kw = sidebarSearchKeyword.trim().toLowerCase();
          var filtered = pages;
          if (kw) {
            filtered = pages.filter(function (p) {
              return (
                String(p.title || "")
                  .toLowerCase()
                  .indexOf(kw) !== -1
              );
            });
          }

          if (!filtered.length) {
            var empty = document.createElement("div");
            empty.className = "no-pages";
            empty.textContent = kw ? "没有找到匹配的脚本" : "暂无生成的脚本";
            sidebarPagesEl.replaceChildren(empty);
            return;
          }

          var frag = document.createDocumentFragment();
          filtered.forEach(function (page) {
            var item = document.createElement("div");
            item.className = "page-item";

            var titleSpan = document.createElement("span");
            titleSpan.className = "page-title";
            titleSpan.textContent = page.title;
            titleSpan.dataset.action = "open";
            titleSpan.dataset.id = String(page.id);

            var actions = document.createElement("div");
            actions.className = "actions";

            var renameBtn = document.createElement("button");
            renameBtn.className = "rename";
            renameBtn.title = "重命名";
            renameBtn.textContent = "✏️";
            renameBtn.dataset.action = "rename";
            renameBtn.dataset.id = String(page.id);

            var delBtn = document.createElement("button");
            delBtn.className = "del";
            delBtn.title = "删除";
            delBtn.textContent = "🗑️";
            delBtn.dataset.action = "delete";
            delBtn.dataset.id = String(page.id);

            actions.appendChild(renameBtn);
            actions.appendChild(delBtn);
            item.appendChild(titleSpan);
            item.appendChild(actions);
            frag.appendChild(item);
          });
          sidebarPagesEl.replaceChildren(frag);
        }

        function bindIframeProxy(iframe) {
          var iwin, idoc;
          try {
            iwin = iframe.contentWindow;
            idoc = iframe.contentDocument;
          } catch (e) {
            console.warn("无法访问 iframe 内部文档：", e);
            return;
          }
          if (!iwin || !idoc) return;

          var tries = 0;
          function tryFindCanvas() {
            var canvas = idoc.querySelector("canvas");
            if (canvas) {
              attachProxy(canvas, iwin, idoc);
              return;
            }
            if (++tries < 80) setTimeout(tryFindCanvas, 100);
          }
          tryFindCanvas();
        }

        function attachProxy(canvas, iwin, idoc) {
          if (canvas.__proxyAttached) return;
          canvas.__proxyAttached = true;

          var MOUSE_TYPES = [
            "mousemove",
            "mousedown",
            "mouseup",
            "click",
            "dblclick",
          ];
          var TOUCH_TYPES = [
            "touchstart",
            "touchmove",
            "touchend",
            "touchcancel",
          ];

          function relayMouse(e) {
            if (e.target === canvas) return;
            if (
              (e.type === "mousedown" ||
                e.type === "mouseup" ||
                e.type === "click" ||
                e.type === "dblclick") &&
              e.button !== 0
            )
              return;

            var ev;
            try {
              ev = new iwin.MouseEvent(e.type, {
                bubbles: true,
                cancelable: true,
                view: iwin,
                detail: e.detail || 1,
                screenX: e.screenX,
                screenY: e.screenY,
                clientX: e.clientX,
                clientY: e.clientY,
                ctrlKey: e.ctrlKey,
                shiftKey: e.shiftKey,
                altKey: e.altKey,
                metaKey: e.metaKey,
                button: e.button,
                buttons: e.buttons,
                relatedTarget: null,
              });
            } catch (err) {
              return;
            }
            canvas.dispatchEvent(ev);
          }

          function relayTouch(e) {
            if (e.target === canvas) return;
            if (!e.touches || !e.touches.length) return;
            var t = e.touches[0];
            var type =
              e.type === "touchstart"
                ? "mousedown"
                : e.type === "touchmove"
                  ? "mousemove"
                  : e.type === "touchend"
                    ? "mouseup"
                    : null;
            if (!type) return;
            var ev;
            try {
              ev = new iwin.MouseEvent(type, {
                bubbles: true,
                cancelable: true,
                view: iwin,
                clientX: t.clientX,
                clientY: t.clientY,
                screenX: t.screenX,
                screenY: t.screenY,
                button: 0,
                buttons: type === "mouseup" ? 0 : 1,
              });
            } catch (err) {
              return;
            }
            canvas.dispatchEvent(ev);
          }

          MOUSE_TYPES.forEach(function (type) {
            idoc.addEventListener(type, relayMouse, true);
          });
          TOUCH_TYPES.forEach(function (type) {
            idoc.addEventListener(type, relayTouch, {
              capture: true,
              passive: true,
            });
          });
        }

        /* AI 助手 — 流式请求 */

        function streamAI(model, key, messages, systemPrompt, onDelta) {
          var conf = aiModelConf(model);
          var url, options;

          if (model === "gemini") {
            url =
              conf.endpoint.replace(
                ":generateContent",
                ":streamGenerateContent",
              ) +
              "?alt=sse&key=" +
              encodeURIComponent(key);
            var contents = messages.map(function (m) {
              return {
                role: m.role === "assistant" ? "model" : "user",
                parts: [{ text: m.content }],
              };
            });
            var body = { contents: contents };
            if (systemPrompt) {
              body.systemInstruction = { parts: [{ text: systemPrompt }] };
            }
            options = {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(body),
            };
          } else {
            var msgs = [];
            if (systemPrompt) {
              msgs.push({ role: "system", content: systemPrompt });
            }
            messages.forEach(function (m) {
              msgs.push({ role: m.role, content: m.content });
            });
            url = conf.endpoint;
            options = {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: "Bearer " + key,
              },
              body: JSON.stringify({
                model: conf.apiModel,
                messages: msgs,
                stream: true,
              }),
            };
          }

          return fetch(url, options).then(function (res) {
            if (!res.ok) {
              return res.text().then(function (t) {
                var msg = "HTTP " + res.status;
                try {
                  var d = JSON.parse(t);
                  msg =
                    (d.error && d.error.message) ||
                    d.message ||
                    (d.error && d.error.status) ||
                    msg;
                } catch (e) {}
                throw new Error(msg);
              });
            }
            if (!res.body || !res.body.getReader) {
              throw new Error("当前浏览器不支持流式响应");
            }

            var reader = res.body.getReader();
            var decoder = new TextDecoder();
            var buffer = "";

            function dispatchData(data) {
              if (!data) return;
              if (data === "[DONE]") return;
              try {
                onDelta(JSON.parse(data));
              } catch (e) {}
            }

            function processBuffer(flush) {
              var sepIndex;
              while ((sepIndex = buffer.indexOf("\n\n")) !== -1) {
                var evt = buffer.slice(0, sepIndex);
                buffer = buffer.slice(sepIndex + 2);
                var lines = evt.split("\n");
                for (var i = 0; i < lines.length; i++) {
                  var line = lines[i].trim();
                  if (line.indexOf("data:") === 0) {
                    dispatchData(line.slice(5).trim());
                  }
                }
              }
              if (flush && buffer.trim()) {
                var tail = buffer.trim();
                if (tail.indexOf("data:") === 0) {
                  dispatchData(tail.slice(5).trim());
                }
                buffer = "";
              }
            }

            function pump() {
              return reader.read().then(function (result) {
                if (result.done) {
                  processBuffer(true);
                  return;
                }
                buffer += decoder.decode(result.value, { stream: true });
                processBuffer(false);
                return pump();
              });
            }

            return pump();
          });
        }

            hint:
              "这段提示词会作为system 消息在每次对话时发送给模型，用于设定角色、语气或规则。" +
              "留空则不发送。Ctrl+Enter 可快速保存。",
            value: existing,
            placeholder:
              "例如：你是一位擅长p5.js生成艺术的助手，回答简洁专业，代码附注释。",
            onOk: function (v) {
              aiState.prompts[model] = v.trim();
              saveAIPrompts();
              buildAIModelMenu();
              refreshAIModelUI();
              /* 如果当前模型就是它，刷新一次界面即可 */
            },
            onClear: function () {
              aiState.prompts[model] = "";
              saveAIPrompts();
              buildAIModelMenu();
              refreshAIModelUI();
            },
          });
        }

        /* 选择和切换模型：无Key时先要求输入Key */
        function selectAIModel(model) {
          if (!aiModelConf(model)) return;
          if (!aiState.keys[model]) {
            promptAPIKey(model, function () {
              aiState.currentModel = model;
              refreshAIModelUI();
              renderAIMessages();
              updateAISendBtn();
            });
            return;
          }
          aiState.currentModel = model;
          refreshAIModelUI();
          renderAIMessages();
          updateAISendBtn();
        }

        function downloadAIChat(model) {
          var chat = aiState.chats[model] || [];
          if (!chat.length) {
            showAlert(
              "无法下载",
              "「" + aiModelName(model) + "」还没有对话内容。",
            );
            return;
          }
          var lines = ["# " + aiModelName(model) + " 对话记录", ""];
          var sys = aiState.prompts[model];
          if (sys && sys.trim()) {
            lines.push("## 🎭 系统提示词");
            lines.push("");
            lines.push(sys);
            lines.push("");
          }
          chat.forEach(function (m) {
            lines.push(
              m.role === "user" ? "## 🧑 我" : "## 🤖 " + aiModelName(model),
            );
            lines.push("");
            lines.push(m.content);
            lines.push("");
          });
          var md = lines.join("\n");
          var blob = new Blob([md], { type: "text/markdown;charset=utf-8" });
          var url = URL.createObjectURL(blob);
          var a = document.createElement("a");
          a.href = url;
          a.download = "ai_chat_" + model + "_" + Date.now() + ".md";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(function () {
            URL.revokeObjectURL(url);
          }, 1000);
        }

        function aiSend() {
          if (aiState.busy) return;
          var model = aiState.currentModel;
          if (!model) {
            showAlert(
              "请先选择模型",
              "点击左下角的 + 按钮选择一个模型并设置Key。",
              true,
            );
            return;
          }
          var key = aiState.keys[model];
          if (!key) {
            promptAPIKey(model, function () {
              aiSend();
            });
            return;
          }

          var inputEl = $("#aiInput");
          if (!inputEl) return;
          var text = (inputEl.value || "").trim();
          if (!text) return;

          var chat = aiState.chats[model];
          if (!Array.isArray(chat)) chat = aiState.chats[model] = [];

          chat.push({ role: "user", content: text });
          chat.push({ role: "assistant", content: "" }); // 占位
          saveAIChats();

          inputEl.value = "";
          inputEl.style.height = "auto";

          aiState.busy = true;
          updateAISendBtn();
          renderAIMessages();

          var bubble = getLastAssistantBubble();
          var accumulated = "";
          var isGemini = model === "gemini";
          var box = $("#aiMessages");

          function pushDelta(text2) {
            if (!text2) return;
            accumulated += text2;
            if (bubble) {
              bubble.classList.remove("pending");
              bubble.textContent = accumulated;
            }
            if (box) box.scrollTop = box.scrollHeight;
          }

          var onDelta = function (obj) {
            if (isGemini) {
              var cand = obj.candidates && obj.candidates[0];
              if (cand && cand.content && cand.content.parts) {
                var t = "";
                for (var i = 0; i < cand.content.parts.length; i++) {
                  t += cand.content.parts[i].text || "";
                }
                pushDelta(t);
              }
            } else {
              var d = obj.choices && obj.choices[0] && obj.choices[0].delta;
              if (d && d.content) pushDelta(d.content);
            }
          };

          /* 发送给API的 messages不含最后那个占位assistant */
          var payload = chat.slice(0, -1);
          /* 取该模型的系统提示词 */
          var systemPrompt = aiState.prompts[model] || "";

          streamAI(model, key, payload, systemPrompt, onDelta)
            .then(function () {
              chat[chat.length - 1].content = accumulated || "(空回复)";
              saveAIChats();
              aiState.busy = false;
              updateAISendBtn();
              renderAIMessages();
            })
            .catch(function (err) {
              aiState.busy = false;
              updateAISendBtn();
              if (accumulated) {
                chat[chat.length - 1].content = accumulated;
              } else {
                chat.pop();
              }
              saveAIChats();
              renderAIMessages();
              showAlert(
                "请求失败",
                String((err && err.message) || err) ||
                  "网络错误，请检查 API Key 或稍后重试。",
                true,
              );
            });
        }

        function clearAIChat() {
          var model = aiState.currentModel;
          if (!model) {
            showAlert(
              "无需清除",
              "还没有选择模型，请点击左下角的 + 选择一个模型。",
            );
            return;
          }
          var chat = aiState.chats[model] || [];
          if (!chat.length) {
            showAlert(
              "无需清除",
              "「" + aiModelName(model) + "」当前没有对话内容。",
            );
            return;
          }
          showConfirm(
            "清除对话",
            "确定要清除与「" + aiModelName(model) + "」的全部对话内容吗？",
            function () {
              aiState.chats[model] = [];
              saveAIChats();
              renderAIMessages();
            },
            true,
          );
        }

        function bindAIAssistant() {
          buildAIModelMenu();
          refreshAIModelUI();
          renderAIMessages();
          updateAISendBtn();

          var modelBtn = $("#aiModelBtn");
          var modelMenu = $("#aiModelMenu");
          var inputEl = $("#aiInput");
          var sendBtn = $("#aiSendBtn");
          var clearBtn = $("#aiClearBtn");

          if (modelBtn) {
            modelBtn.addEventListener("click", function (e) {
              e.stopPropagation();
              toggleAIModelMenu();
            });
          }

          if (modelMenu) {
            modelMenu.addEventListener("click", function (e) {
              /* 点击 🎭：设置系统提示词 */
              var promptBtn = e.target.closest("[data-prompt]");
              if (promptBtn) {
                e.stopPropagation();
                closeAIModelMenu();
                promptSystemPrompt(promptBtn.dataset.prompt);
                return;
              }
              /* 点击 🔑：设置 / 更新 Key */
              var keyBtn = e.target.closest("[data-key]");
              if (keyBtn) {
                e.stopPropagation();
                promptAPIKey(keyBtn.dataset.key);
                return;
              }
              /* 点击 ⬇：下载该模型对话 */
              var dl = e.target.closest("[data-dl]");
              if (dl) {
                e.stopPropagation();
                downloadAIChat(dl.dataset.dl);
                return;
              }
              /* 点击模型项：选择模型 */
              var item = e.target.closest(".ai-model-item");
              if (item) {
                e.stopPropagation();
                closeAIModelMenu();
                selectAIModel(item.dataset.model);
              }
            });
          }

          if (inputEl) {
            inputEl.addEventListener("input", function () {
              this.style.height = "auto";
              this.style.height = Math.min(this.scrollHeight, 140) + "px";
            });
            inputEl.addEventListener("keydown", function (e) {
              if (
                e.key === "Enter" &&
                !e.shiftKey &&
                !e.isComposing &&
                e.keyCode !== 229
              ) {
                e.preventDefault();
                aiSend();
              }
            });
          }

          if (sendBtn) {
            sendBtn.addEventListener("click", function () {
              aiSend();
            });
          }

          if (clearBtn) {
            clearBtn.addEventListener("click", function () {
              clearAIChat();
            });
          }
        }

        /* 路由渲染 */

        function render() {
          var path = getRoute();

          /* 离开首页时，若当前是运行指定脚本状态，则重置为随机状态 */
          if (path !== "/" && path !== "" && path !== "/index.html") {
            if (runner.mode === "page") {
              runner.mode = "random";
              runner.pageId = null;
            }
          }

          /* 首页全屏p5运行器 */
          if (path === "/" || path === "" || path === "/index.html") {
            renderRunner();
            return;
          }

          /* 离开首页：解除全屏锁定，移除AI模式 */
          if (appEl.classList.contains("preview-mode")) {
            appEl.classList.remove("preview-mode");
          }
          appEl.classList.remove("ai-mode");
          delete appEl.dataset.currentPageId;
          unlockAppSize();

          destroyEditor();
          appEl.replaceChildren();
          setActiveNav(path);

          if (path === "/ai") {
            appEl.classList.add("ai-mode");
            appEl.appendChild(renderAIAssistant());
            bindAIAssistant();
            return;
          }

          if (path === "/about") {
            appEl.appendChild(renderAbout());
          } else if (path === "/generator") {
            appEl.appendChild(renderGenerator());
            bindGenerator();
          } else {
            var wrap = document.createElement("div");
            var h = document.createElement("h1");
            h.textContent = "页面 " + path;
            var p = document.createElement("p");
            p.textContent = "内容未定义。";
            wrap.appendChild(h);
            wrap.appendChild(p);
            appEl.appendChild(wrap);
          }
        }

        /* 初始化 */
        function init() {
          modalBackdrop = $("#modalBackdrop");
          modalBox = $("#modalBox");
          sidebarPagesEl = $("#sidebar-pages");
          sidebarEl = $("#sidebar");
          overlayEl = $("#overlay");
          hamburgerBtn = $("#hamburgerBtn");
          appEl = $("#app");
          sidebarSearchEl = $("#sidebarSearch");

          initAIState();

          var savedTheme = "light";
          try {
            savedTheme = localStorage.getItem(THEME_KEY) || "light";
          } catch (e) {}
          applyTheme(savedTheme);

          /* 全局禁止缩放 */
          ["gesturestart", "gesturechange", "gestureend"].forEach(
            function (type) {
              document.addEventListener(
                type,
                function (e) {
                  e.preventDefault();
                },
                {
                  passive: false,
                },
              );
            },
          );
          document.addEventListener(
            "touchmove",
            function (e) {
              if (e.touches && e.touches.length > 1) {
                e.preventDefault();
              }
            },
            { passive: false },
          );
          var lastTouchEnd = 0;
          document.addEventListener(
            "touchend",
            function (e) {
              var now = Date.now();
              if (now - lastTouchEnd <= 300) {
                var t = e.target;
                var tag = t && t.tagName ? t.tagName.toLowerCase() : "";
                if (
                  tag !== "input" &&
                  tag !== "textarea" &&
                  tag !== "button" &&
                  tag !== "select" &&
                  tag !== "a"
                ) {
                  e.preventDefault();
                }
              }
              lastTouchEnd = now;
            },
            { passive: false },
          );

          /* 点击页面空白处关闭AI模型菜单 */
          document.addEventListener("click", function (e) {
            var menu = $("#aiModelMenu");
            if (!menu || !menu.classList.contains("show")) return;
            var picker = menu.parentNode;
            if (picker && !picker.contains(e.target)) {
              menu.classList.remove("show");
            }
          });

          /* 搜索框*/
          if (sidebarSearchEl) {
            sidebarSearchEl.addEventListener("input", function () {
              sidebarSearchKeyword = this.value || "";
              updateSidebarPages();
            });
            sidebarSearchEl.addEventListener("keydown", function (e) {
              if (e.key === "Escape") {
                if (this.value) {
                  this.value = "";
                  sidebarSearchKeyword = "";
                  updateSidebarPages();
                }
                e.stopPropagation();
              } else {
                e.stopPropagation();
              }
            });
            sidebarSearchEl.addEventListener("click", function (e) {
              e.stopPropagation();
            });
          }

          hamburgerBtn.addEventListener("click", openSidebar);
          overlayEl.addEventListener("click", closeSidebar);
          modalBackdrop.addEventListener("click", function (e) {
            if (e.target === modalBackdrop) closeModal();
          });

          document.addEventListener("keydown", function (e) {
            if (e.key === "Escape") {
              if (modalBackdrop.classList.contains("show")) {
                closeModal();
              } else if (sidebarEl.classList.contains("open")) {
                closeSidebar();
              } else if (runner.mode === "page" && getRoute() === "/") {
                setRandom();
              }
            }
          });

          /* 侧边栏底部 */
          var exportZipBtn = $("#exportZipSidebar");
          if (exportZipBtn) {
            var runExport = function () {
              closeSidebar();
              exportZip();
            };
            exportZipBtn.addEventListener("click", runExport);
            exportZipBtn.addEventListener("keydown", function (e) {
              if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                runExport();
              }
            });
          }

          var themeBtn = $("#themeToggleSidebar");
          if (themeBtn) themeBtn.addEventListener("click", toggleTheme);

          /* 顶部导航 */
          $$(".sidebar .nav-item[data-path]").forEach(function (el) {
            var go = function () {
              var path = el.getAttribute("data-path");
              closeSidebar();
              if (path === "#/") {
                setRandom();
                return;
              }
              if (location.hash === path) render();
              else location.hash = path;
            };
            el.addEventListener("click", go);
            el.addEventListener("keydown", function (e) {
              if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                go();
              }
            });
          });

          /* 侧边栏脚本名 */
          sidebarPagesEl.addEventListener("click", function (e) {
            var btn = e.target.closest("[data-action]");
            if (!btn) return;
            var id = Number(btn.dataset.id);
            var action = btn.dataset.action;
            if (action === "open") {
              closeSidebar();
              runPage(id);
            } else if (action === "rename") {
              renamePage(id);
            } else if (action === "delete") {
              deletePage(id);
            }
          });

          window.addEventListener("hashchange", function () {
            render();
            closeSidebar();
          });

          window.addEventListener("orientationchange", function () {
            if (editor) editor.refresh();
          });

          window.addEventListener("resize", function () {
            if (appEl.classList.contains("preview-mode")) {
              appEl.style.width = window.innerWidth + "px";
              appEl.style.height = window.innerHeight + "px";
            }
            if (editor) editor.refresh();
          });

          updateSidebarPages();
          render();
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", init);
        } else {
          init();
        }
      })();
    </script>
  </body>
</html>
