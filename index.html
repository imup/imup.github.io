<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>randomArt可视化创意编程</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/default.min.css"
      id="cm-theme-light"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css"
      id="cm-theme-dark"
      disabled
    />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>

/* 
   主题变量
    */
:root {
  /* 固定色（亮暗共用）*/
  --primary: #007bff;
  --primary-hover: #0056b3;
  --primary-focus: #007bff;
  --danger: #d9534f;
  --success: #28a745;
  --warn: #f0ad4e;
  --purple: #9b59b6;
  --neutral-btn: #6c757d;

  /* 亮色主题 */
  --bg: #f5f5f5;
  --surface: #ffffff;
  --text: #222222;
  --hamburger: #333333;
  --text-muted: #888888;
  --text-secondary: #888888;
  --text-tertiary: #999999;
  --text-placeholder: #9aa0a6;
  --hover: rgba(0, 0, 0, 0.055);
  --hover-strong: rgba(0, 0, 0, 0.06);
  --line: rgba(0, 0, 0, 0.08);
  --border-input: #cccccc;
  --input-bg: transparent;
  --input-bg-fill: #ffffff;
  --result-bg: #e9f7fe;
  --modal-bg: #ffffff;
  --modal-text: #222222;
  --bubble-user-bg: #007bff;
  --bubble-user-text: #ffffff;
  --bubble-assistant-bg: #e9ecef;
  --bubble-assistant-text: #222222;
  --cm-border: #cccccc;
  --shadow-modal: 0 8px 32px rgba(0, 0, 0, 0.4);
  --shadow-ai-bar: 0 8px 26px rgba(0, 0, 0, 0.16);
  --sidebar-shadow: rgba(0, 0, 0, 0.55);
  --ai-input-grad: linear-gradient(to top, #ffffff 62%, rgba(255, 255, 255, 0));
  --hover-key: rgba(240, 173, 78, 0.15);
  --hover-prompt: rgba(155, 89, 182, 0.15);
  --hover-dl: rgba(0, 0, 0, 0.08);

  --sidebar-w: min(280px, 78vw);
}

/* 暗色主题 */
body.dark-mode {
  --bg: #1e1e1e;
  --surface: #2d2d2d;
  --text: #dddddd;
  --hamburger: #ffffff;
  --text-secondary: #999999;
  --text-tertiary: #888888;
  --text-placeholder: #8a8a8a;
  --hover: rgba(255, 255, 255, 0.07);
  --hover-strong: rgba(255, 255, 255, 0.08);
  --line: rgba(255, 255, 255, 0.08);
  --border-input: #555555;
  --input-bg: #3a3a3a;
  --input-bg-fill: #3a3a3a;
  --result-bg: #2a4a5a;
  --modal-bg: #2d2d2d;
  --modal-text: #dddddd;
  --bubble-assistant-bg: #3a3a3a;
  --bubble-assistant-text: #dddddd;
  --cm-border: #555555;
  --primary-focus: #4da3ff;
  --shadow-ai-bar: 0 8px 26px rgba(0, 0, 0, 0.55);
  --sidebar-shadow: rgba(0, 0, 0, 1);
  --ai-input-grad: linear-gradient(to top, #2d2d2d 62%, rgba(45, 45, 45, 0));
  --hover-key: rgba(240, 173, 78, 0.2);
  --hover-prompt: rgba(155, 89, 182, 0.25);
  --hover-dl: rgba(255, 255, 255, 0.14);
}

/* 
   全局
    */
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  font-family: Arial, "Helvetica Neue", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  touch-action: pan-x pan-y;
  overscroll-behavior: none;
  transition:
    background 0.3s,
    color 0.3s;
}

body.preview-lock {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: none;
}

/* 
   汉堡按钮
    */
.hamburger-btn {
  position: fixed;
  top: clamp(8px, 2vw, 14px);
  left: clamp(10px, 3vw, 18px);
  z-index: 300;
  background: none;
  border: none;
  color: var(--hamburger);
  font-size: clamp(30px, 6vw, 40px);
  font-weight: bold;
  cursor: pointer;
  padding: 4px 8px;
  line-height: 1;
  user-select: none;
  transition:
    color 0.3s,
    opacity 0.22s ease,
    transform 0.22s ease;
}
.hamburger-btn:hover {
  transform: scale(1.1);
}

body.preview-lock .hamburger-btn {
  color: #fff;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
}
body.sidebar-open .hamburger-btn {
  opacity: 0;
  transform: scale(0.6);
  pointer-events: none;
}

/* 
   侧边栏
    */
.sidebar {
  position: fixed;
  top: 0;
  left: 0;
  width: var(--sidebar-w);
  height: 100vh;
  height: 100dvh;
  background: var(--bg);
  color: var(--text);
  transform: translateX(-100%);
  transition:
    transform 0.3s ease,
    background 0.3s,
    color 0.3s;
  z-index: 200;
  padding: clamp(14px, 3vw, 20px) 0 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  -webkit-overflow-scrolling: touch;
  box-shadow: inset -22px 0 28px -26px var(--sidebar-shadow);
  border-right: 1px solid var(--line);
  touch-action: pan-y;
}
.sidebar.open {
  transform: translateX(0);
}

/* 搜索框 */
.sidebar-search {
  padding: 0 clamp(14px, 4vw, 18px) 12px;
  margin-top: -4px;
}
.sidebar-search input {
  width: 100%;
  padding: 9px 12px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--input-bg);
  color: inherit;
  font-size: 16px;
  font-family: inherit;
  outline: none;
  transition:
    border-color 0.15s,
    background 0.15s;
}
.sidebar-search input:focus {
  border-color: var(--primary-focus);
}
.sidebar-search input::placeholder {
  color: var(--text-placeholder);
}
.sidebar-search input[type="search"]::-webkit-search-cancel-button {
  -webkit-appearance: none;
  appearance: none;
  height: 14px;
  width: 14px;
  background:
    linear-gradient(
      45deg,
      transparent 45%,
      #888 45%,
      #888 55%,
      transparent 55%
    ),
    linear-gradient(
      -45deg,
      transparent 45%,
      #888 45%,
      #888 55%,
      transparent 55%
    );
  cursor: pointer;
}

/* 导航项 */
.sidebar .nav-item {
  padding: 12px clamp(16px, 4vw, 20px);
  border-bottom: 1px solid var(--line);
  cursor: pointer;
  transition: background 0.15s;
}
.sidebar .nav-item:hover {
  background: var(--hover);
}
.sidebar .nav-item[aria-current="page"] {
  background: var(--hover);
}

.sidebar .divider {
  border-top: 1px solid var(--line);
  margin: 10px 0;
}

.sidebar .section-title {
  padding: 8px clamp(16px, 4vw, 20px);
  font-size: 0.85rem;
  color: var(--text-secondary);
  font-weight: bold;
}

.sidebar .page-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px clamp(16px, 4vw, 20px) 8px clamp(22px, 6vw, 30px);
  border-bottom: 1px solid var(--line);
}
.sidebar .page-item:hover {
  background: var(--hover);
}
.sidebar .page-item .page-title {
  flex: 1;
  color: inherit;
  cursor: pointer;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.sidebar .page-item .actions button {
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 0.85rem;
  padding: 2px 5px;
  transition: color 0.15s;
}
.sidebar .page-item .actions .rename:hover {
  color: #5bc0de;
}
.sidebar .page-item .actions .del:hover {
  color: var(--danger);
}

.sidebar .no-pages {
  padding: 12px clamp(16px, 4vw, 20px);
  color: var(--text-muted);
  font-style: italic;
}

/* 侧边栏底部 */
.sidebar-footer {
  margin-top: auto;
  border-top: 1px solid var(--line);
  padding: 0;
}
.sidebar-footer .footer-row {
  display: flex;
  align-items: stretch;
}
.sidebar-footer .footer-item {
  flex: 1 1 0;
  min-width: 0;
  padding: 12px clamp(8px, 2vw, 14px) calc(12px + env(safe-area-inset-bottom, 0px));
  border-bottom: none;
  text-align: center;
  font-size: 0.9rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sidebar-footer .footer-vdivider {
  width: 1px;
  flex: 0 0 1px;
  background: var(--line);
}

/* 
   遮罩
    */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.35);
  z-index: 150;
  opacity: 0;
  transition: opacity 0.3s ease;
}
.overlay.show {
  display: block;
  opacity: 1;
}

/* 
   主内容区
    */
#app {
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  padding: clamp(56px, 10vw, 78px) clamp(14px, 5vw, 32px) clamp(28px, 7vw, 52px);
  background: var(--surface);
  color: var(--text);
  transition:
    background 0.3s,
    color 0.3s;
  overflow-x: hidden;
}
#app > div {
  width: 100%;
  max-width: 940px;
  margin: 0 auto;
}
#app > div.generator-page {
  max-width: none;
}

#app.preview-mode {
  padding: 0;
  max-width: none;
  min-height: 0;
  background: #000;
  overflow: hidden;
  z-index: 100;
}
#app.preview-mode iframe {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
  background: #fff;
  touch-action: none;
}

#app.ai-mode {
  padding: 0;
  max-width: none;
  height: 100vh;
  height: 100dvh;
  min-height: 0;
  overflow: hidden;
}
#app.ai-mode > div {
  max-width: none;
  margin: 0;
}

#app h1 {
  font-size: clamp(1.35rem, 4.5vw, 1.9rem);
  margin: 0 0 0.6em;
  line-height: 1.25;
  word-break: break-word;
}
#app p {
  font-size: clamp(0.9rem, 2.6vw, 1rem);
  line-height: 1.6;
  margin: 0.5em 0;
}

/* 
   表单
    */
.form-group {
  margin-bottom: 15px;
}
.form-group label {
  display: block;
  font-weight: bold;
  margin-bottom: 5px;
  font-size: clamp(0.85rem, 2.5vw, 0.95rem);
}
.form-group input,
.form-group textarea {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--border-input);
  border-radius: 4px;
  font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: 16px;
  background: var(--input-bg-fill);
  color: var(--modal-text);
}
.form-group .CodeMirror {
  border: 1px solid var(--cm-border);
  border-radius: 4px;
  height: clamp(160px, 32vh, 240px) !important;
  font-size: 14px;
}

/* CodeMirror占位符浮层 */
.cm-placeholder-overlay {
  position: absolute;
  top: 5px;
  right: 8px;
  color: var(--text-placeholder);
  pointer-events: none;
  font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: 13px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
  z-index: 5;
  user-select: none;
  overflow: hidden;
}

/* 
   通用按钮
    */
button {
  background: var(--primary);
  color: white;
  border: none;
  padding: 10px clamp(14px, 4vw, 20px);
  border-radius: 4px;
  cursor: pointer;
  font-size: 0.95rem;
  transition: background 0.2s;
}
button:hover {
  background: var(--primary-hover);
}
button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.result {
  margin-top: 20px;
  padding: 12px;
  background: var(--result-bg);
  border-radius: 4px;
  word-break: break-word;
}

.preview-img {
  max-width: min(200px, 60vw);
  max-height: 200px;
  margin-top: 10px;
  border: 1px solid var(--border-input);
  border-radius: 4px;
  display: block;
}

.action-buttons {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 10px;
}
.action-buttons button {
  background: var(--neutral-btn);
}
.action-buttons button.preview,
.action-buttons button.download {
  background: var(--success);
}

/* 
   弹窗
    */
.modal-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.5);
  z-index: 400;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.modal-backdrop.show {
  display: flex;
}
.modal {
  background: var(--modal-bg);
  color: var(--modal-text);
  border-radius: 8px;
  width: min(480px, 100%);
  max-height: 88vh;
  overflow-y: auto;
  padding: clamp(16px, 4vw, 22px);
  box-shadow: var(--shadow-modal);
}
.modal h3 {
  margin: 0 0 12px;
  font-size: 1.1rem;
}
.modal p {
  margin: 0 0 16px;
  line-height: 1.55;
  word-break: break-word;
}
.modal input {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--border-input);
  border-radius: 4px;
  margin-bottom: 16px;
  font-size: 16px;
  background: var(--input-bg-fill);
  color: var(--modal-text);
}
.modal textarea {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--border-input);
  border-radius: 4px;
  margin-bottom: 16px;
  font-size: 14px;
  font-family: inherit;
  line-height: 1.5;
  resize: vertical;
  min-height: 120px;
  outline: none;
  background: var(--input-bg-fill);
  color: var(--modal-text);
}
.modal textarea:focus {
  border-color: var(--primary-focus);
}
.modal .modal-hint {
  font-size: 0.82rem;
  color: var(--text-secondary);
  margin: -8px 0 12px;
  line-height: 1.5;
}
.modal-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.modal-actions .right-group {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.modal-actions .cancel {
  background: var(--neutral-btn);
}
.modal-actions .danger {
  background: var(--danger);
}
.modal-actions .link-btn {
  background: transparent;
  color: var(--text-muted);
  padding: 8px 10px;
  font-size: 0.88rem;
  border-radius: 4px;
  text-decoration: underline;
}
.modal-actions .link-btn:hover {
  background: var(--hover-strong);
  color: var(--danger);
}

/* 
   AI助手
    */
.ai-page {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  width: 100%;
  overflow: hidden;
}

/* 清除按钮 */
.ai-clear-btn {
  position: absolute;
  top: clamp(8px, 2vw, 14px);
  right: clamp(10px, 3vw, 18px);
  z-index: 60;
  width: 28px;
  height: 28px;
  min-width: 28px;
  padding: 0;
  border-radius: 50%;
  background: transparent;
  border: none;
  color: inherit;
  font-size: 32px;
  font-weight: 300;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  opacity: 0.7;
  transition:
    opacity 0.15s,
    color 0.15s,
    transform 0.15s;
  overflow: visible;
}
.ai-clear-btn:hover {
  opacity: 1;
  color: var(--danger);
  transform: scale(1.15);
}
.ai-clear-btn:active {
  transform: scale(0.95);
}

/* 导入按钮：与清除按钮并排，位于其左侧 */
.ai-import-btn {
  position: absolute;
  top: clamp(8px, 2vw, 14px);
  right: calc(clamp(10px, 3vw, 18px) + 36px);
  z-index: 60;
  width: 28px;
  height: 28px;
  min-width: 28px;
  padding: 0;
  border-radius: 50%;
  background: transparent;
  border: none;
  color: inherit;
  font-size: 24px;
  font-weight: 300;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  opacity: 0.7;
  transition:
    opacity 0.15s,
    color 0.15s,
    transform 0.15s;
  overflow: visible;
}
.ai-import-btn:hover {
  opacity: 1;
  color: var(--primary);
  transform: scale(1.15);
}
.ai-import-btn:active {
  transform: scale(0.95);
}

.ai-messages {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 64px 14px 16px;
  scroll-behavior: smooth;
  touch-action: pan-y;
}
.ai-msg {
  margin-bottom: 12px;
  display: flex;
}
.ai-msg:last-child {
  margin-bottom: 0;
}
.ai-msg.user {
  justify-content: flex-end;
}
.ai-msg .bubble {
  max-width: 84%;
  padding: 9px 13px;
  border-radius: 16px;
  white-space: pre-wrap;
  word-break: break-word;
  line-height: 1.55;
  font-size: 0.95rem;
}
.ai-msg.user .bubble {
  background: var(--bubble-user-bg);
  color: var(--bubble-user-text);
  border-bottom-right-radius: 4px;
}
.ai-msg.assistant .bubble {
  background: var(--bubble-assistant-bg);
  color: var(--bubble-assistant-text);
  border-bottom-left-radius: 4px;
}
.ai-msg.pending .bubble {
  opacity: 0.65;
  font-style: italic;
}

.ai-empty {
  color: var(--text-tertiary);
  text-align: center;
  padding: 48px 12px;
  font-size: 0.92rem;
  line-height: 1.8;
  white-space: pre-line;
}

/* 底部浮动输入区 */
.ai-input-wrap {
  flex: 0 0 auto;
  padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
  background: var(--ai-input-grad);
  pointer-events: none;
}

.ai-input-bar {
  display: flex;
  align-items: flex-end;
  gap: 6px;
  width: 100%;
  max-width: 940px;
  margin: 0 auto;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 26px;
  padding: 6px;
  box-shadow: var(--shadow-ai-bar);
  pointer-events: auto;
  transition:
    background 0.3s,
    border-color 0.3s;
}

.ai-model-picker {
  position: relative;
  flex: 0 0 auto;
}
.ai-model-btn {
  width: 38px;
  height: 38px;
  min-width: 38px;
  padding: 0;
  border-radius: 50%;
  background: transparent;
  color: inherit;
  border: none;
  font-size: 26px;
  font-weight: 300;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition:
    background 0.15s,
    transform 0.15s;
}
.ai-model-btn:hover {
  background: var(--hover);
}
.ai-model-btn:active {
  transform: scale(0.94);
}
.ai-model-btn.has-model {
  font-size: 18px;
  font-weight: bold;
  background: rgba(0, 123, 255, 0.12);
}

.ai-model-menu {
  display: none;
  position: absolute;
  bottom: calc(100% + 10px);
  left: 0;
  background: var(--modal-bg);
  color: var(--modal-text);
  border: 1px solid var(--border-input);
  border-radius: 12px;
  box-shadow: 0 12px 34px rgba(0, 0, 0, 0.32);
  min-width: 320px;
  z-index: 500;
  overflow: hidden;
}
.ai-model-menu.show {
  display: block;
}

.ai-model-item {
  display: flex;
  align-items: center;
  padding: 9px 10px;
  cursor: pointer;
  gap: 4px;
  font-size: 0.93rem;
  user-select: none;
}
.ai-model-item:hover {
  background: var(--hover);
}
.ai-model-item .ai-check {
  width: 16px;
  flex: 0 0 16px;
  display: inline-block;
  color: var(--success);
  font-weight: bold;
  text-align: center;
  visibility: hidden;
}
.ai-model-item.active .ai-check {
  visibility: visible;
}
.ai-model-item .ai-model-name {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ai-model-item .ai-key,
.ai-model-item .ai-prompt,
.ai-model-item .ai-dl {
  background: transparent;
  color: var(--text-muted);
  padding: 4px 6px;
  border-radius: 6px;

    <script>
      /* 
         应用主逻辑（IIFE 包裹，避免污染全局）
          */
      (function () {
        "use strict";

        /* 
           常量定义
            */

        /* localStorage 存储键 */
        var STORAGE_KEY = "p5_pages"; // 作品列表
        var THEME_KEY = "p5_theme"; // 主题
        var MAX_IMAGE_BYTES = 1.5 * 1024 * 1024; // 上传图片大小上限 1.5MB

        /* p5 脚本目录与文件清单（首页随机运行） */
        var P5_DIR = "p5/";
        var P5_CDN =
          "https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js";
        var P5_FILES = ["sketch1.js", "sketch2.js", "sketch3.js"];

        /* AI 相关存储键
         * 注：AI_CHAT_STORAGE 为前缀，实际写入 AI_CHAT_STORAGE + "_" + modelId
         *     旧版整块数据从 AI_CHAT_STORAGE 读取并迁移后删除
         */
        var AI_KEY_STORAGE = "p5_ai_keys"; // 各模型 API Key
        var AI_CHAT_STORAGE = "p5_ai_chats"; // 各模型对话记录（前缀）
        var AI_PROMPT_STORAGE = "p5_ai_prompts"; // 各模型系统提示词

        /* 发送给模型的最大历史消息数（不含当前占位） */
        var MAX_CONTEXT_MESSAGES = 30;

        /* 支持的 AI 模型清单 */
        var AI_MODELS = [
          {
            id: "chatgpt",
            name: "ChatGPT",
            endpoint: "https://api.openai.com/v1/chat/completions",
            apiModel: "gpt-4o-mini",
          },
          {
            id: "gemini",
            name: "Gemini",
            endpoint:
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent",
            apiModel: "gemini-2.0-flash",
          },
          {
            id: "deepseek",
            name: "DeepSeek",
            endpoint: "https://api.deepseek.com/chat/completions",
            apiModel: "deepseek-chat",
          },
        ];

        /* AI 运行时状态（内存态，持久化到 localStorage）
         * 每条 assistant 消息结构（结构化字段，替代整帧 raw）：
         *   {
         *     role: "assistant",
         *     content: "...",
         *     id: "chatcmpl-xxx",
         *     model: "deepseek-chat",
         *     created: 1736900000,
         *     finish_reason: "stop",
         *     usage: {...},
         *     tool_calls: [...] | null
         *   }
         */
        var aiState = {
          currentModel: null,
          keys: {},
          chats: {},
          prompts: {},
          busy: false,
          /* 流式控制：AbortController + 令牌（防切模型后回调错乱） */
          abortController: null,
          streamToken: 0,
        };

        /* 
           AI 状态辅助函数
            */

        function aiModelConf(id) {
          for (var i = 0; i < AI_MODELS.length; i++) {
            if (AI_MODELS[i].id === id) return AI_MODELS[i];
          }
          return null;
        }

        function aiModelName(id) {
          var c = aiModelConf(id);
          return c ? c.name : id;
        }

        function loadAIKeys() {
          try {
            var raw = localStorage.getItem(AI_KEY_STORAGE);
            var o = raw ? JSON.parse(raw) : {};
            return o && typeof o === "object" ? o : {};
          } catch (e) {
            return {};
          }
        }

        function saveAIKeys() {
          try {
            localStorage.setItem(AI_KEY_STORAGE, JSON.stringify(aiState.keys));
            return true;
          } catch (e) {
            handleStorageQuotaError(e, "API Key");
            return false;
          }
        }

        /*
         * 分模型读取对话：
         *   - 每个模型一个 key：AI_CHAT_STORAGE + "_" + modelId
         *   - 自动迁移老版本单 key 整块数据
         */
        function loadAIChats() {
          var result = {};
          AI_MODELS.forEach(function (m) {
            try {
              var raw = localStorage.getItem(AI_CHAT_STORAGE + "_" + m.id);
              var v = raw ? JSON.parse(raw) : [];
              result[m.id] = Array.isArray(v) ? v : [];
            } catch (e) {
              result[m.id] = [];
            }
          });
          /* 迁移老数据：单 key → 分模型 key */
          try {
            var oldRaw = localStorage.getItem(AI_CHAT_STORAGE);
            if (oldRaw) {
              var old = JSON.parse(oldRaw);
              if (old && typeof old === "object") {
                AI_MODELS.forEach(function (m) {
                  if (
                    Array.isArray(old[m.id]) &&
                    old[m.id].length &&
                    (!result[m.id] || !result[m.id].length)
                  ) {
                    result[m.id] = old[m.id];
                    try {
                      localStorage.setItem(
                        AI_CHAT_STORAGE + "_" + m.id,
                        JSON.stringify(old[m.id]),
                      );
                    } catch (e) {}
                  }
                });
              }
              localStorage.removeItem(AI_CHAT_STORAGE);
            }
          } catch (e) {}
          return result;
        }

        /*
         * 分模型写入对话：
         *   - saveAIChats(modelId)：只写该模型（推荐，节省时间/空间）
         *   - saveAIChats()：写全部（迁移/清空等场景）
         */
        function saveAIChats(modelId) {
          if (!modelId) {
            var ok = true;
            AI_MODELS.forEach(function (m) {
              try {
                localStorage.setItem(
                  AI_CHAT_STORAGE + "_" + m.id,
                  JSON.stringify(aiState.chats[m.id] || []),
                );
              } catch (e) {
                handleStorageQuotaError(e, "AI 对话记录");
                ok = false;
              }
            });
            return ok;
          }
          try {
            localStorage.setItem(
              AI_CHAT_STORAGE + "_" + modelId,
              JSON.stringify(aiState.chats[modelId] || []),
            );
            return true;
          } catch (e) {
            handleStorageQuotaError(e, "AI 对话记录");
            return false;
          }
        }

        function loadAIPrompts() {
          try {
            var raw = localStorage.getItem(AI_PROMPT_STORAGE);
            var o = raw ? JSON.parse(raw) : {};
            return o && typeof o === "object" ? o : {};
          } catch (e) {
            return {};
          }
        }

        function saveAIPrompts() {
          try {
            localStorage.setItem(
              AI_PROMPT_STORAGE,
              JSON.stringify(aiState.prompts),
            );
            return true;
          } catch (e) {
            handleStorageQuotaError(e, "系统提示词");
            return false;
          }
        }

        function initAIState() {
          aiState.keys = loadAIKeys();
          aiState.chats = loadAIChats();
          aiState.prompts = loadAIPrompts();
          AI_MODELS.forEach(function (m) {
            if (!Array.isArray(aiState.chats[m.id])) aiState.chats[m.id] = [];
            if (typeof aiState.prompts[m.id] !== "string") {
              aiState.prompts[m.id] = "";
            }
          });
          aiState.currentModel = null;
        }

        /* 
           存储超限统一处理
            */

        function isQuotaError(e) {
          if (!e) return false;
          if (e.name === "QuotaExceededError") return true;
          if (e.name === "NS_ERROR_DOM_QUOTA_REACHED") return true;
          if (e.code === 22 || e.code === 1014) return true;
          return false;
        }

        function estimateLocalStorageKB() {
          var total = 0;
          try {
            for (var i = 0; i < localStorage.length; i++) {
              var k = localStorage.key(i);
              var v = localStorage.getItem(k) || "";
              total += k.length + v.length;
            }
          } catch (e) {
            return -1;
          }
          return Math.round((total * 2) / 1024);
        }

        function handleStorageQuotaError(e, context) {
          if (!isQuotaError(e)) {
            showAlert(
              "保存失败",
              String((e && e.message) || e || "未知错误"),
              true,
            );
            return;
          }
          var usedKB = estimateLocalStorageKB();
          var usedText =
            usedKB >= 0
              ? "当前 localStorage 已使用约 " + usedKB + " KB。"
              : "";
          showAlert(
            "本地存储已满",
            (context ? "「" + context + "」" : "数据") +
              "保存失败：浏览器 localStorage 空间已满。\n\n" +
              usedText +
              "\n\n建议：\n" +
              "1. 打开 AI 助手，点击右上角“−”清除部分对话；\n" +
              "2. 在侧边栏删除不再需要的脚本作品；\n" +
              "3. 导出 JSON 备份后，清理对应模型的对话记录。",
            true,
          );
        }

        /* 
           编辑器默认占位提示
            */
        var SCRIPT_PLACEHOLDER =
          "例如：\n" +
          "function setup() {\n" +
          "  createCanvas(windowWidth, windowHeight);\n" +
          "  background(102);\n" +
          "}\n" +
          "function draw() {\n" +
          "  variableEllipse(mouseX, mouseY, pmouseX, pmouseY);\n" +
          "}\n" +
          "function variableEllipse(x, y, px, py) {\n" +
          "  let speed = abs(x - px) + abs(y - py);\n" +
          "  stroke(speed);\n" +
          "  ellipse(x, y, speed, speed);\n" +
          "}";

        /* 
           通用工具函数
            */

        function $(sel, root) {
          return (root || document).querySelector(sel);
        }

        function $$(sel, root) {
          return Array.prototype.slice.call(
            (root || document).querySelectorAll(sel),
          );
        }

        function escapeHtml(text) {
          return String(text)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
        }

        /* 转义 </script、<script、<!-- 防止提前闭合或进入注释模式 */
        function escapeScriptClose(str) {
          return String(str)
            .replace(/<\/script/gi, "<\\/script")
            .replace(/<!--/g, "<\\!--")
            .replace(/<script/gi, "<\\script");
        }

        function safeFileName(name) {
          var n = String(name || "")
            .replace(/[\\/:*?"<>|]/g, "_")
            .trim();
          return n || "untitled";
        }

        /* 
           作品（p5 页面）存储
            */

        function getPages() {
          try {
            var raw = localStorage.getItem(STORAGE_KEY);
            var list = raw ? JSON.parse(raw) : [];
            return Array.isArray(list) ? list : [];
          } catch (e) {
            return [];
          }
        }

        function savePages(pages) {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(pages));
            return true;
          } catch (e) {
            handleStorageQuotaError(e, "脚本作品");
            return false;
          }
        }

        /* 
           弹窗组件（Alert / Confirm / Prompt / Textarea）
            */
        var modalBackdrop, modalBox, lastFocused;

        function openModal(builder) {
          lastFocused = document.activeElement;
          modalBox.innerHTML = "";
          builder(modalBox);
          modalBackdrop.classList.add("show");
          var f = $("input, textarea, button", modalBox);
          if (f && f.focus) f.focus();
        }

        function closeModal() {
          modalBackdrop.classList.remove("show");
          modalBox.innerHTML = "";
          if (lastFocused && lastFocused.focus) lastFocused.focus();
        }

        function showAlert(title, message, isError) {
          openModal(function (box) {
            var h = document.createElement("h3");
            h.textContent = title;
            var p = document.createElement("p");
            p.textContent = message;
            var a = document.createElement("div");
            a.className = "modal-actions";
            var right = document.createElement("div");
            right.className = "right-group";
            var ok = document.createElement("button");
            ok.textContent = "知道了";
            if (isError) ok.className = "danger";
            ok.addEventListener("click", closeModal);
            right.appendChild(ok);
            a.appendChild(right);
            box.appendChild(h);
            box.appendChild(p);
            box.appendChild(a);
          });
        }

        function showConfirm(title, message, onConfirm, danger) {
          openModal(function (box) {
            var h = document.createElement("h3");
            h.textContent = title;
            var p = document.createElement("p");
            p.textContent = message;
            var a = document.createElement("div");
            a.className = "modal-actions";
            var right = document.createElement("div");
            right.className = "right-group";
            var cancel = document.createElement("button");
            cancel.className = "cancel";
            cancel.textContent = "取消";
            cancel.addEventListener("click", closeModal);
            var ok = document.createElement("button");
            ok.textContent = "确定";
            if (danger) ok.className = "danger";
            ok.addEventListener("click", function () {
              closeModal();
              onConfirm();
            });
            right.appendChild(cancel);
            right.appendChild(ok);
            a.appendChild(right);
            box.appendChild(h);
            box.appendChild(p);
            box.appendChild(a);
          });
        }

        function showPrompt(title, defaultValue, onOk, inputType) {
          openModal(function (box) {
            var h = document.createElement("h3");
            h.textContent = title;
            var input = document.createElement("input");
            input.type = inputType || "text";
            input.value = defaultValue || "";
            input.autocomplete = "off";
            input.spellcheck = false;
            var a = document.createElement("div");
            a.className = "modal-actions";
            var right = document.createElement("div");
            right.className = "right-group";
            var cancel = document.createElement("button");
            cancel.className = "cancel";
            cancel.textContent = "取消";
            cancel.addEventListener("click", closeModal);
            var ok = document.createElement("button");
            ok.textContent = "保存";
            ok.addEventListener("click", function () {
              var v = input.value.trim();
              if (!v) {
                input.focus();
                return;
              }
              closeModal();
              onOk(v);
            });
            input.addEventListener("keydown", function (e) {
              if (e.key === "Enter") ok.click();
            });
            right.appendChild(cancel);
            right.appendChild(ok);
            a.appendChild(right);
            box.appendChild(h);
            box.appendChild(input);
            box.appendChild(a);
          });
        }

        function showPromptArea(opts) {
          openModal(function (box) {
            var h = document.createElement("h3");
            h.textContent = opts.title;

            var hint = document.createElement("div");
            hint.className = "modal-hint";
            hint.textContent =
              opts.hint || "提示词会在每次对话时作为系统消息发送给模型。";

            var ta = document.createElement("textarea");
            ta.value = opts.value || "";
            ta.placeholder = opts.placeholder || "";
            ta.rows = 7;
            ta.spellcheck = false;

            var a = document.createElement("div");
            a.className = "modal-actions";

            var leftWrap = document.createElement("div");
            if (opts.value && opts.value.trim()) {
              var clearBtn = document.createElement("button");
              clearBtn.className = "link-btn";
              clearBtn.textContent = "清除提示词";
              clearBtn.addEventListener("click", function () {
                closeModal();
                if (opts.onClear) opts.onClear();
              });
              leftWrap.appendChild(clearBtn);
            }

            var rightWrap = document.createElement("div");
            rightWrap.className = "right-group";
            var cancel = document.createElement("button");
            cancel.className = "cancel";
            cancel.textContent = "取消";
            cancel.addEventListener("click", closeModal);

            var ok = document.createElement("button");
            ok.textContent = "保存";
            ok.addEventListener("click", function () {
              var v = ta.value;
              closeModal();
              opts.onOk(v);
            });
            ta.addEventListener("keydown", function (e) {
              if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                ok.click();
              }
            });
            rightWrap.appendChild(cancel);
            rightWrap.appendChild(ok);

            a.appendChild(leftWrap);
            a.appendChild(rightWrap);
            box.appendChild(h);
            box.appendChild(hint);
            box.appendChild(ta);
            box.appendChild(a);
          });
        }

        /* 
           生成作品 HTML / 下载
            */

        function generatePageHtml(title, script, imageDataUrl) {
          var safeTitle = escapeHtml(title || "未命名页面");
          var imgVar = imageDataUrl
            ? 'var imageUrl = "' + imageDataUrl + '";'
            : "var imageUrl = null;";
          var safeImgVar = escapeScriptClose(imgVar);
          var safeScript = escapeScriptClose(script);

          return (
            "<!DOCTYPE html>\n" +
            '<html lang="zh-CN">\n' +
            "<head>\n" +
            '  <meta charset="UTF-8">\n' +
            '  <meta name="viewport" content="width=device-width, initial-scale=1.0">\n' +
            "  <title>" +
            safeTitle +
            "</title>\n" +
            "  <style>\n" +
            "    html, body { margin: 0; padding: 0; }\n" +
            "    canvas { display: block; }\n" +
            "  </style>\n" +
            '  <script src="' +
            P5_CDN +
            '"><\/script>\n' +
            "</head>\n" +
            "<body>\n" +
            "  <script>\n" +
            "    " +
            safeImgVar +
            "\n" +
            "    " +
            safeScript +
            "\n" +
            "  <\/script>\n" +
            "</body>\n" +
            "</html>"
          );
        }

        function downloadSingleHtml(filename, html) {
          try {
            var blob = new Blob([html], { type: "text/html;charset=utf-8" });
            var url = URL.createObjectURL(blob);
            var link = document.createElement("a");
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setTimeout(function () {
              URL.revokeObjectURL(url);
            }, 1000);
          } catch (err) {
            showAlert("下载失败", String((err && err.message) || err), true);
          }

        /* 
           iframe 内 p5 画布的事件代理
            */

        function bindIframeProxy(iframe) {
          var iwin, idoc;
          try {
            iwin = iframe.contentWindow;
            idoc = iframe.contentDocument;
          } catch (e) {
            console.warn("无法访问 iframe 内部文档：", e);
            return;
          }
          if (!iwin || !idoc) return;

          var tries = 0;
          function tryFindCanvas() {
            var canvas = idoc.querySelector("canvas");
            if (canvas) {
              attachProxy(canvas, iwin, idoc);
              return;
            }
            if (++tries < 80) setTimeout(tryFindCanvas, 100);
          }
          tryFindCanvas();
        }

        function attachProxy(canvas, iwin, idoc) {
          if (canvas.__proxyAttached) return;
          canvas.__proxyAttached = true;

          var MOUSE_TYPES = [
            "mousemove",
            "mousedown",
            "mouseup",
            "click",
            "dblclick",
          ];
          var TOUCH_TYPES = [
            "touchstart",
            "touchmove",
            "touchend",
            "touchcancel",
          ];

          function relayMouse(e) {
            if (e.target === canvas) return;
            if (
              (e.type === "mousedown" ||
                e.type === "mouseup" ||
                e.type === "click" ||
                e.type === "dblclick") &&
              e.button !== 0
            )
              return;

            var ev;
            try {
              ev = new iwin.MouseEvent(e.type, {
                bubbles: true,
                cancelable: true,
                view: iwin,
                detail: e.detail || 1,
                screenX: e.screenX,
                screenY: e.screenY,
                clientX: e.clientX,
                clientY: e.clientY,
                ctrlKey: e.ctrlKey,
                shiftKey: e.shiftKey,
                altKey: e.altKey,
                metaKey: e.metaKey,
                button: e.button,
                buttons: e.buttons,
                relatedTarget: null,
              });
            } catch (err) {
              return;
            }
            canvas.dispatchEvent(ev);
          }

          function relayTouch(e) {
            if (e.target === canvas) return;
            if (!e.touches || !e.touches.length) return;
            var t = e.touches[0];
            var type =
              e.type === "touchstart"
                ? "mousedown"
                : e.type === "touchmove"
                  ? "mousemove"
                  : e.type === "touchend"
                    ? "mouseup"
                    : null;
            if (!type) return;
            var ev;
            try {
              ev = new iwin.MouseEvent(type, {
                bubbles: true,
                cancelable: true,
                view: iwin,
                clientX: t.clientX,
                clientY: t.clientY,
                screenX: t.screenX,
                screenY: t.screenY,
                button: 0,
                buttons: type === "mouseup" ? 0 : 1,
              });
            } catch (err) {
              return;
            }
            canvas.dispatchEvent(ev);
          }

          MOUSE_TYPES.forEach(function (type) {
            idoc.addEventListener(type, relayMouse, true);
          });
          TOUCH_TYPES.forEach(function (type) {
            idoc.addEventListener(type, relayTouch, {
              capture: true,
              passive: true,
            });
          });
        }

        function renderAIMessages() {
          var box = $("#aiMessages");
          if (!box) return;
          var model = aiState.currentModel;

          if (!model) {
            if (!box.firstChild || !box.querySelector(".ai-empty")) {
              box.replaceChildren(
                buildEmptyNode(
                  "还没有选择模型\n\n点击左下角 + 选择模型并设置API Key后开始对话",
                ),
              );
            }
            renderedModelId = null;
            renderedMsgCount = 0;
            return;
          }

          if (renderedModelId !== model) {
            renderedModelId = model;
            renderedMsgCount = 0;
          }

          var chat = aiState.chats[model] || [];

          if (!chat.length) {
            if (!box.firstChild || !box.querySelector(".ai-empty")) {
              box.replaceChildren(
                buildEmptyNode("开始与 " + aiModelName(model) + " 对话吧"),
              );
            }
            renderedMsgCount = 0;
            return;
          }

          if (renderedMsgCount > chat.length) {
            renderedMsgCount = 0;
          }

          if (renderedMsgCount === 0) {
            var frag = document.createDocumentFragment();
            for (var i = 0; i < chat.length; i++) {
              frag.appendChild(buildMsgNode(chat[i]));
            }
            box.replaceChildren(frag);
            renderedMsgCount = chat.length;
            box.scrollTop = box.scrollHeight;
            return;
          }

          if (renderedMsgCount < chat.length) {
            var emptyEl = box.querySelector(".ai-empty");
            if (emptyEl && box.children.length === 1) {
              box.replaceChildren();
              renderedMsgCount = 0;
              var frag2 = document.createDocumentFragment();
              for (var k = 0; k < chat.length; k++) {
                frag2.appendChild(buildMsgNode(chat[k]));
              }
              box.replaceChildren(frag2);
              renderedMsgCount = chat.length;
              box.scrollTop = box.scrollHeight;
              return;
            }
            for (var j = renderedMsgCount; j < chat.length; j++) {
              box.appendChild(buildMsgNode(chat[j]));
            }
            renderedMsgCount = chat.length;
            box.scrollTop = box.scrollHeight;
          }
        }

        /* 
           流式请求核心
            */
        function streamAI(model, key, messages, systemPrompt, onDelta, onRaw) {
          var conf = aiModelConf(model);
          var url, options;

          if (model === "gemini") {
            url =
              conf.endpoint.replace(
                ":generateContent",
                ":streamGenerateContent",
              ) +
              "?alt=sse&key=" +
              encodeURIComponent(key);
            var contents = messages.map(function (m) {
              return {
                role: m.role === "assistant" ? "model" : "user",
                parts: [{ text: m.content }],
              };
            });
            var body = { contents: contents };
            if (systemPrompt) {
              body.systemInstruction = { parts: [{ text: systemPrompt }] };
            }
            options = {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(body),
            };
          } else {
            var msgs = [];
            if (systemPrompt) {
              msgs.push({ role: "system", content: systemPrompt });
            }
            messages.forEach(function (m) {
              msgs.push({ role: m.role, content: m.content });
            });
            url = conf.endpoint;
            options = {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: "Bearer " + key,
              },
              body: JSON.stringify({
                model: conf.apiModel,
                messages: msgs,
                stream: true,
                stream_options: { include_usage: true },
              }),
            };
          }

          /* 注入 abort signal */
          if (aiState.abortController) {
            options.signal = aiState.abortController.signal;
          }

          return fetch(url, options).then(function (res) {
            if (!res.ok) {
              return res.text().then(function (t) {
                var msg = "HTTP " + res.status;
                try {
                  var d = JSON.parse(t);
                  msg =
                    (d.error && d.error.message) ||
                    d.message ||
                    (d.error && d.error.status) ||
                    msg;
                } catch (e) {}
                throw new Error(msg);
              });
            }
            if (!res.body || !res.body.getReader) {
              throw new Error("当前浏览器不支持流式响应");
            }

            var reader = res.body.getReader();
            var decoder = new TextDecoder();
            var buffer = "";

            function dispatchData(data) {
              if (!data) return;
              if (data === "[DONE]") {
                if (onRaw) onRaw("[DONE]");
                return;
              }
              try {
                var obj = JSON.parse(data);
                if (onRaw) onRaw(obj);
                onDelta(obj);
              } catch (e) {}
            }

            /* 按 "\n\n" 或 "\r\n\r\n" 切分 SSE 事件 */
            function processBuffer(flush) {
              if (buffer.indexOf("\r") !== -1) {
                buffer = buffer.replace(/\r\n/g, "\n").replace(/\r/g, "\n");
              }

              var sepIndex;
              while ((sepIndex = buffer.indexOf("\n\n")) !== -1) {
                var evt = buffer.slice(0, sepIndex);
                buffer = buffer.slice(sepIndex + 2);
                var lines = evt.split("\n");
                for (var i = 0; i < lines.length; i++) {
                  var line = lines[i].trim();
                  if (line.indexOf("data:") === 0) {
                    dispatchData(line.slice(5).trim());
                  }
                }
              }
              if (flush && buffer.trim()) {
                var tail = buffer.trim();
                if (tail.indexOf("data:") === 0) {
                  dispatchData(tail.slice(5).trim());
                }
                buffer = "";
              }
            }

            function pump() {
              return reader.read().then(function (result) {
                if (result.done) {
                  processBuffer(true);
                  return;
                }
                buffer += decoder.decode(result.value, { stream: true });
                processBuffer(false);
                return pump();
              });
            }

            return pump();
          });
        }

        /* 
           结构化元数据提取器
            */

        function createStructuredAccumulator() {
          var meta = {
            id: null,
            model: null,
            created: null,
            finish_reason: null,
            usage: null,
            tool_calls: null,
          };
          var tcBuf = {};
          var hasToolCall = false;

          function consume(obj) {
            if (!obj || obj === "[DONE]") return;

            if (obj.id && !meta.id) meta.id = obj.id;
            if (obj.model && !meta.model) meta.model = obj.model;
            if (obj.created && !meta.created) meta.created = obj.created;
            if (obj.usage) meta.usage = obj.usage;

            var ch = obj.choices && obj.choices[0];
            if (ch) {
              if (ch.finish_reason) meta.finish_reason = ch.finish_reason;

              var delta = ch.delta || {};
              var tcs = delta.tool_calls;
              if (tcs && tcs.length) {
                hasToolCall = true;
                tcs.forEach(function (t) {
                  var idx = t.index != null ? t.index : 0;
                  if (!tcBuf[idx]) {
                    tcBuf[idx] = {
                      id: "",
                      type: "function",
                      function: { name: "", arguments: "" },
                    };
                  }
                  var buf = tcBuf[idx];
                  if (t.id) buf.id = t.id;
                  if (t.type) buf.type = t.type;
                  if (t.function) {
                    if (t.function.name) buf.function.name += t.function.name;
                    if (t.function.arguments) {
                      buf.function.arguments += t.function.arguments;
                    }
                  }
                });
              }
            }

            var cand = obj.candidates && obj.candidates[0];
            if (cand) {
              if (cand.finishReason && !meta.finish_reason) {
                meta.finish_reason = cand.finishReason;
              }
              if (cand.content && cand.content.parts) {
                cand.content.parts.forEach(function (p) {
                  if (p.functionCall) {
                    hasToolCall = true;
                    var idx = Object.keys(tcBuf).length;
                    tcBuf[idx] = {
                      id: "call_" + Date.now() + "_" + idx,
                      type: "function",
                      function: {
                        name: p.functionCall.name || "",
                        arguments: JSON.stringify(p.functionCall.args || {}),
                      },
                    };
                  }
                });
              }
            }
            if (obj.usageMetadata) {
              meta.usage = {
                prompt_tokens: obj.usageMetadata.promptTokenCount,
                completion_tokens: obj.usageMetadata.candidatesTokenCount,
                total_tokens: obj.usageMetadata.totalTokenCount,
              };
            }
          }

          function finalize() {
            if (hasToolCall) {
              var arr = [];
              var keys = Object.keys(tcBuf).sort(function (a, b) {
                return a - b;
              });
              keys.forEach(function (k) {
                var t = tcBuf[k];
                if (t.function && t.function.name) arr.push(t);
              });
              if (arr.length) meta.tool_calls = arr;
            }
            return meta;
          }

          return { consume: consume, finalize: finalize };
        }

        /*

        /* 测试模型连接：发一个最小请求验证 API Key 是否有效 */
        function testAIModelConnection(model) {
          var conf = aiModelConf(model);
          if (!conf) return;
          var key = aiState.keys[model];
          if (!key) {
            showAlert(
              "无法测试",
              "请先为「" + aiModelName(model) + "」设置 API Key。",
              true,
            );
            return;
          }

          var url, body, headers;
          if (model === "gemini") {
            url = conf.endpoint + "?key=" + encodeURIComponent(key);
            body = { contents: [{ role: "user", parts: [{ text: "hi" }] }] };
            headers = { "Content-Type": "application/json" };
          } else {
            url = conf.endpoint;
            body = {
              model: conf.apiModel,
              messages: [{ role: "user", content: "hi" }],
              max_tokens: 1,
            };
            headers = {
              "Content-Type": "application/json",
              Authorization: "Bearer " + key,
            };
          }

          showAlert(
            "测试连接",
            "正在连接「" + aiModelName(model) + "」，请稍候…",
          );

          var testAbort = new AbortController();
          var timeoutId = setTimeout(function () {
            try {
              testAbort.abort();
            } catch (e) {}
          }, 15000);

          fetch(url, {
            method: "POST",
            headers: headers,
            body: JSON.stringify(body),
            signal: testAbort.signal,
          })
            .then(function (res) {
              clearTimeout(timeoutId);
              return res.text().then(function (t) {
                if (res.ok) {
                  showAlert(
                    "连接成功",
                    "「" + aiModelName(model) + "」API Key 有效，连接正常。",
                  );
                } else {
                  var msg = "HTTP " + res.status;
                  try {
                    var d = JSON.parse(t);
                    msg =
                      (d.error && d.error.message) ||
                      d.message ||
                      (d.error && d.error.status) ||
                      msg;
                  } catch (e) {}
                  showAlert("连接失败", msg, true);
                }
              });
            })
            .catch(function (err) {
              clearTimeout(timeoutId);
              var msg = String((err && err.message) || err);
              if (err && err.name === "AbortError") {
                msg = "请求超时（15 秒），请检查网络或 API Key。";
              }
              showAlert("连接失败", msg, true);
            });
        }
