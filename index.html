<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>randomArt创意脚本编辑</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/default.min.css"
      id="cm-theme-light"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css"
      id="cm-theme-dark"
      disabled
    />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
      :root {
        --bg-light: #f5f5f5;
        --bg-dark: #1e1e1e;
        --surface-light: #ffffff;
        --surface-dark: #2d2d2d;
        --text-light: #222222;
        --text-dark: #dddddd;
        --hover-light: rgba(0, 0, 0, 0.055);
        --hover-dark: rgba(255, 255, 255, 0.07);
        --line-light: rgba(0, 0, 0, 0.08);
        --line-dark: rgba(255, 255, 255, 0.08);
        --sidebar-w: min(280px, 78vw);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        font-family: Arial, "Helvetica Neue", system-ui, sans-serif;
        background: var(--bg-light);
        color: var(--text-light);
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        touch-action: pan-x pan-y;
        overscroll-behavior: none;
        transition:
          background 0.3s,
          color 0.3s;
      }
      body.dark-mode {
        background: var(--bg-dark);
        color: var(--text-dark);
      }

      body.preview-lock {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
      }

      .hamburger-btn {
        position: fixed;
        top: clamp(8px, 2vw, 14px);
        left: clamp(10px, 3vw, 18px);
        z-index: 300;
        background: none;
        border: none;
        color: #333;
        font-size: clamp(30px, 6vw, 40px);
        font-weight: bold;
        cursor: pointer;
        padding: 4px 8px;
        line-height: 1;
        user-select: none;
        transition:
          color 0.3s,
          opacity 0.22s ease,
          transform 0.22s ease;
      }
      .hamburger-btn:hover {
        transform: scale(1.1);
      }
      body.dark-mode .hamburger-btn {
        color: #fff;
      }
      body.preview-lock .hamburger-btn {
        color: #fff;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
      }
      body.sidebar-open .hamburger-btn {
        opacity: 0;
        transform: scale(0.6);
        pointer-events: none;
      }

      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: var(--sidebar-w);
        height: 100vh;
        height: 100dvh;
        background: var(--bg-light);
        color: var(--text-light);
        transform: translateX(-100%);
        transition:
          transform 0.3s ease,
          background 0.3s,
          color 0.3s;
        z-index: 200;
        padding: clamp(14px, 3vw, 20px) 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        -webkit-overflow-scrolling: touch;
        box-shadow: inset -22px 0 28px -26px rgba(0, 0, 0, 0.55);
        border-right: 1px solid var(--line-light);
      }
      .sidebar.open {
        transform: translateX(0);
      }
      body.dark-mode .sidebar {
        background: var(--bg-dark);
        color: var(--text-dark);
        box-shadow: inset -22px 0 28px -26px rgba(0, 0, 0, 1);
        border-right-color: var(--line-dark);
      }

      /* 搜索框 */
      .sidebar-search {
        padding: 0 clamp(14px, 4vw, 18px) 12px;
        margin-top: -4px;
      }
      .sidebar-search input {
        width: 100%;
        padding: 9px 12px;
        border: 1px solid var(--line-light);
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font-size: 16px;
        font-family: inherit;
        outline: none;
        transition:
          border-color 0.15s,
          background 0.15s;
      }
      .sidebar-search input:focus {
        border-color: #007bff;
      }
      body.dark-mode .sidebar-search input {
        border-color: var(--line-dark);
        background: rgba(255, 255, 255, 0.05);
      }
      body.dark-mode .sidebar-search input:focus {
        border-color: #4da3ff;
      }
      .sidebar-search input::placeholder {
        color: #999;
      }
      body.dark-mode .sidebar-search input::placeholder {
        color: #777;
      }
      .sidebar-search input[type="search"]::-webkit-search-cancel-button {
        -webkit-appearance: none;
        appearance: none;
        height: 14px;
        width: 14px;
        background:
          linear-gradient(
            45deg,
            transparent 45%,
            #888 45%,
            #888 55%,
            transparent 55%
          ),
          linear-gradient(
            -45deg,
            transparent 45%,
            #888 45%,
            #888 55%,
            transparent 55%
          );
        cursor: pointer;
      }

      .sidebar .nav-item {
        padding: 12px clamp(16px, 4vw, 20px);
        border-bottom: 1px solid var(--line-light);
        cursor: pointer;
        transition: background 0.15s;
      }
      body.dark-mode .sidebar .nav-item {
        border-bottom-color: var(--line-dark);
      }
      .sidebar .nav-item:hover {
        background: var(--hover-light);
      }
      body.dark-mode .sidebar .nav-item:hover {
        background: var(--hover-dark);
      }
      .sidebar .nav-item[aria-current="page"] {
        background: var(--hover-light);
      }
      body.dark-mode .sidebar .nav-item[aria-current="page"] {
        background: var(--hover-dark);
      }

      .sidebar .divider {
        border-top: 1px solid var(--line-light);
        margin: 10px 0;
      }
      body.dark-mode .sidebar .divider {
        border-top-color: var(--line-dark);
      }

      .sidebar .section-title {
        padding: 8px clamp(16px, 4vw, 20px);
        font-size: 0.85rem;
        color: #888;
        font-weight: bold;
      }
      body.dark-mode .sidebar .section-title {
        color: #999;
      }

      .sidebar .page-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px clamp(16px, 4vw, 20px) 8px clamp(22px, 6vw, 30px);
        border-bottom: 1px solid var(--line-light);
      }
      body.dark-mode .sidebar .page-item {
        border-bottom-color: var(--line-dark);
      }
      .sidebar .page-item:hover {
        background: var(--hover-light);
      }
      body.dark-mode .sidebar .page-item:hover {
        background: var(--hover-dark);
      }

      .sidebar .page-item .page-title {
        flex: 1;
        color: inherit;
        cursor: pointer;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .sidebar .page-item .actions button {
        background: none;
        border: none;
        color: #888;
        cursor: pointer;
        font-size: 0.85rem;
        padding: 2px 5px;
        transition: color 0.15s;
      }
      .sidebar .page-item .actions .rename:hover {
        color: #5bc0de;
      }
      .sidebar .page-item .actions .del:hover {
        color: #d9534f;
      }

      .sidebar .no-pages {
        padding: 12px clamp(16px, 4vw, 20px);
        color: #888;
        font-style: italic;
      }

      /* 侧边栏底部*/
      .sidebar-footer {
        margin-top: auto;
        border-top: 1px solid var(--line-light);
        padding: 0;
      }
      body.dark-mode .sidebar-footer {
        border-top-color: var(--line-dark);
      }

      .sidebar-footer .footer-row {
        display: flex;
        align-items: stretch;
      }
      .sidebar-footer .footer-item {
        flex: 1 1 0;
        min-width: 0;
        padding: 12px clamp(8px, 2vw, 14px);
        border-bottom: none;
        text-align: center;
        font-size: 0.9rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .sidebar-footer .footer-vdivider {
        width: 1px;
        flex: 0 0 1px;
        background: var(--line-light);
      }
      body.dark-mode .sidebar-footer .footer-vdivider {
        background: var(--line-dark);
      }

      .overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        z-index: 150;
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      .overlay.show {
        display: block;
        opacity: 1;
      }

      #app {
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        padding: clamp(56px, 10vw, 78px) clamp(14px, 5vw, 32px)
          clamp(28px, 7vw, 52px);
        background: var(--surface-light);
        color: var(--text-light);
        transition:
          background 0.3s,
          color 0.3s;
        overflow-x: hidden;
      }
      body.dark-mode #app {
        background: var(--surface-dark);
        color: var(--text-dark);
      }
      #app > div {
        width: 100%;
        max-width: 940px;
        margin: 0 auto;
      }
      #app > div.generator-page {
        max-width: none;
      }

      #app.preview-mode {
        padding: 0;
        max-width: none;
        min-height: 0;
        background: #000;
        overflow: hidden;
        z-index: 100;
      }
      #app.preview-mode iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
        background: #fff;
      }

      #app h1 {
        font-size: clamp(1.35rem, 4.5vw, 1.9rem);
        margin: 0 0 0.6em;
        line-height: 1.25;
        word-break: break-word;
      }
      #app p {
        font-size: clamp(0.9rem, 2.6vw, 1rem);
        line-height: 1.6;
        margin: 0.5em 0;
      }

      .form-group {
        margin-bottom: 15px;
      }
      .form-group label {
        display: block;
        font-weight: bold;
        margin-bottom: 5px;
        font-size: clamp(0.85rem, 2.5vw, 0.95rem);
      }
      .form-group input,
      .form-group textarea {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 16px;
      }
      body.dark-mode .form-group input,
      body.dark-mode .form-group textarea {
        background: #3a3a3a;
        color: #ddd;
        border-color: #555;
      }
      .form-group .CodeMirror {
        border: 1px solid #ccc;
        border-radius: 4px;
        height: clamp(160px, 32vh, 240px) !important;
        font-size: 14px;
      }
      body.dark-mode .form-group .CodeMirror {
        border-color: #555;
      }

      .cm-placeholder-overlay {
        position: absolute;
        top: 5px;
        right: 8px;
        color: #9aa0a6;
        pointer-events: none;
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 13px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
        z-index: 5;
        user-select: none;
        overflow: hidden;
      }
      body.dark-mode .cm-placeholder-overlay {
        color: #8a8a8a;
      }

      button {
        background: #007bff;
        color: white;
        border: none;
        padding: 10px clamp(14px, 4vw, 20px);
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.95rem;
        transition: background 0.2s;
      }
      button:hover {
        background: #0056b3;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .result {
        margin-top: 20px;
        padding: 12px;
        background: #e9f7fe;
        border-radius: 4px;
        word-break: break-word;
      }
      body.dark-mode .result {
        background: #2a4a5a;
      }

      .preview-img {
        max-width: min(200px, 60vw);
        max-height: 200px;
        margin-top: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        display: block;
      }

      .action-buttons {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 10px;
      }
      .action-buttons button {
        background: #6c757d;
      }
      .action-buttons button.preview,
      .action-buttons button.download {
        background: #28a745;
      }

      .modal-backdrop {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 400;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      .modal-backdrop.show {
        display: flex;
      }
      .modal {
        background: #fff;
        color: #222;
        border-radius: 8px;
        width: min(440px, 100%);
        max-height: 88vh;
        overflow-y: auto;
        padding: clamp(16px, 4vw, 22px);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      }
      body.dark-mode .modal {
        background: #2d2d2d;
        color: #ddd;
      }
      .modal h3 {
        margin: 0 0 12px;
        font-size: 1.1rem;
      }
      .modal p {
        margin: 0 0 16px;
        line-height: 1.55;
        word-break: break-word;
      }
      .modal input {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        margin-bottom: 16px;
        font-size: 16px;
      }
      body.dark-mode .modal input {
        background: #3a3a3a;
        color: #ddd;
        border-color: #555;
      }
      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        flex-wrap: wrap;
      }
      .modal-actions .cancel {
        background: #6c757d;
      }
      .modal-actions .danger {
        background: #d9534f;
      }

      /* ============================================================
       * AI 助手页面
       * ============================================================ */
      .ai-page {
        display: flex;
        flex-direction: column;
        height: calc(100vh - 140px);
        height: calc(100dvh - 140px);
        min-height: 340px;
      }
      .ai-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
        gap: 10px;
      }
      .ai-header h1 {
        margin: 0;
        font-size: clamp(1.2rem, 4vw, 1.6rem);
      }
      .ai-clear-btn {
        background: transparent;
        color: inherit;
        border: 1px solid var(--line-light);
        width: 36px;
        height: 36px;
        min-width: 36px;
        border-radius: 50%;
        font-size: 22px;
        font-weight: bold;
        line-height: 1;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition:
          background 0.15s,
          border-color 0.15s,
          color 0.15s;
      }
      body.dark-mode .ai-clear-btn {
        border-color: var(--line-dark);
      }
      .ai-clear-btn:hover {
        background: var(--hover-light);
        border-color: #d9534f;
        color: #d9534f;
      }
      body.dark-mode .ai-clear-btn:hover {
        background: var(--hover-dark);
      }

      .ai-messages {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        border: 1px solid var(--line-light);
        border-radius: 10px;
        padding: 12px;
        background: rgba(0, 0, 0, 0.02);
        margin-bottom: 10px;
      }
      body.dark-mode .ai-messages {
        border-color: var(--line-dark);
        background: rgba(255, 255, 255, 0.03);
      }
      .ai-msg {
        margin-bottom: 12px;
        display: flex;
      }
      .ai-msg:last-child {
        margin-bottom: 0;
      }
      .ai-msg.user {
        justify-content: flex-end;
      }
      .ai-msg .bubble {
        max-width: 82%;
        padding: 8px 12px;
        border-radius: 12px;
        white-space: pre-wrap;
        word-break: break-word;
        line-height: 1.55;
        font-size: 0.95rem;
      }
      .ai-msg.user .bubble {
        background: #007bff;
        color: #fff;
        border-bottom-right-radius: 3px;
      }
      .ai-msg.assistant .bubble {
        background: #e9ecef;
        color: #222;
        border-bottom-left-radius: 3px;
      }
      body.dark-mode .ai-msg.assistant .bubble {
        background: #3a3a3a;
        color: #ddd;
      }
      .ai-msg.pending .bubble {
        opacity: 0.65;
        font-style: italic;
      }
      .ai-empty {
        color: #999;
        text-align: center;
        padding: 36px 10px;
        font-size: 0.9rem;
        line-height: 1.7;
      }
      body.dark-mode .ai-empty {
        color: #888;
      }

      .ai-input-bar {
        display: flex;
        gap: 8px;
        align-items: flex-end;
        flex-wrap: nowrap;
      }
      .ai-model-picker {
        position: relative;
        flex: 0 0 auto;
      }
      .ai-model-btn {
        background: #6c757d;
        color: #fff;
        padding: 11px 12px;
        border-radius: 8px;
        white-space: nowrap;
        font-size: 0.88rem;
        line-height: 1.1;
      }
      .ai-model-btn:hover {
        background: #5a6268;
      }
      .ai-model-menu {
        display: none;
        position: absolute;
        bottom: calc(100% + 6px);
        left: 0;
        background: #fff;
        color: #222;
        border: 1px solid #ccc;
        border-radius: 8px;
        box-shadow: 0 8px 26px rgba(0, 0, 0, 0.3);
        min-width: 210px;
        z-index: 500;
        overflow: hidden;
      }
      body.dark-mode .ai-model-menu {
        background: #2d2d2d;
        color: #ddd;
        border-color: #555;
      }
      .ai-model-menu.show {
        display: block;
      }
      .ai-model-item {
        display: flex;
        align-items: center;
        padding: 10px 10px;
        cursor: pointer;
        gap: 8px;
        font-size: 0.92rem;
        user-select: none;
      }
      .ai-model-item:hover {
        background: var(--hover-light);
      }
      body.dark-mode .ai-model-item:hover {
        background: var(--hover-dark);
      }
      .ai-model-item .ai-check {
        width: 16px;
        flex: 0 0 16px;
        display: inline-block;
        color: #28a745;
        font-weight: bold;
        text-align: center;
        visibility: hidden;
      }
      .ai-model-item.active .ai-check {
        visibility: visible;
      }
      .ai-model-item .ai-model-name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .ai-model-item .ai-dl {
        background: transparent;
        color: #888;
        padding: 2px 7px;
        border-radius: 4px;
        font-size: 1rem;
        line-height: 1;
        cursor: pointer;
      }
      .ai-model-item .ai-dl:hover {
        background: rgba(0, 0, 0, 0.08);
        color: #007bff;
      }
      body.dark-mode .ai-model-item .ai-dl:hover {
        background: rgba(255, 255, 255, 0.12);
      }

      .ai-input-bar textarea {
        flex: 1 1 auto;
        min-width: 0;
        resize: none;
        min-height: 44px;
        max-height: 140px;
        padding: 11px 12px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-family: inherit;
        font-size: 16px;
        line-height: 1.4;
        outline: none;
        transition: border-color 0.15s;
      }
      .ai-input-bar textarea:focus {
        border-color: #007bff;
      }
      body.dark-mode .ai-input-bar textarea {
        background: #3a3a3a;
        color: #ddd;
        border-color: #555;
      }
      body.dark-mode .ai-input-bar textarea:focus {
        border-color: #4da3ff;
      }

      .ai-send-btn {
        flex: 0 0 auto;
        background: #007bff;
        padding: 11px 16px;
        border-radius: 8px;
        white-space: nowrap;
      }
      .ai-send-btn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      @media (max-width: 420px) {
        .hamburger-btn {
          font-size: 28px;
        }
        .action-buttons button {
          flex: 1 1 auto;
        }
        .sidebar-footer .footer-item {
          font-size: 0.82rem;
          padding: 10px 6px;
        }
        .ai-model-btn {
          padding: 11px 9px;
          font-size: 0.82rem;
        }
        .ai-send-btn {
          padding: 11px 12px;
          font-size: 0.9rem;
        }
      }
      @media (max-height: 480px) {
        #app {
          padding-top: 52px;
          padding-bottom: 20px;
        }
        .form-group .CodeMirror {
          height: 140px !important;
        }
        .ai-page {
          height: calc(100dvh - 90px);
        }
      }
    </style>
  </head>
  <body>
    <button
      class="hamburger-btn"
      id="hamburgerBtn"
      aria-label="打开菜单"
      aria-expanded="false"
      aria-controls="sidebar"
    >
      ☰
    </button>

    <nav class="sidebar" id="sidebar" aria-label="主导航">
      <!-- 搜索框 -->
      <div class="sidebar-search">
        <input
          type="search"
          id="sidebarSearch"
          placeholder="🔍搜索脚本..."
          autocomplete="off"
          aria-label="搜索脚本"
        />
      </div>

      <div class="nav-item" data-path="#/" role="button" tabindex="0">
        🏠 首页
      </div>
      <div class="nav-item" data-path="#/about" role="button" tabindex="0">
        📖 关于
      </div>
      <div class="nav-item" data-path="#/ai" role="button" tabindex="0">

          {

            name: "Gemini",

              "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent",

          aiState.keys = loadAIKeys();

        var SCRIPT_PLACEHOLDER =
          "例如：\n" +
          "function setup() {\n" +

          "  background(102);\n" +
          "}\n" +
          "function draw() {\n" +
          "  variableEllipse(mouseX, mouseY, pmouseX, pmouseY);\n" +

          "}";

        function $(sel, root) {
          return (root || document).querySelector(sel);
        }
        function $$(sel, root) {
          return Array.prototype.slice.call(
            (root || document).querySelectorAll(sel),
          );
        }
        function escapeHtml(text) {
          return String(text)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
        }
        function escapeScriptClose(str) {
          return String(str).replace(/<\/script/gi, "<\\/script");
        }
        function safeFileName(name) {
          var n = String(name || "")
            .replace(/[\\/:*?"<>|]/g, "_")

        function getPages() {
          try {
            var raw = localStorage.getItem(STORAGE_KEY);
            var list = raw ? JSON.parse(raw) : [];

          } catch (e) {
            return [];
          }
        }
        function savePages(pages) {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(pages));
            return true;
          } catch (e) {
            if (e && (e.name === "QuotaExceededError" || e.code === 22)) {
              showAlert(
                "本地存储已满",
                "请删除部分作品，或上传更小的图片后再试。",
                true,
              );
            } else {
              showAlert("保存失败", String((e && e.message) || e), true);
            }
            return false;
          }
        }

        var modalBackdrop, modalBox, lastFocused;

        function openModal(builder) {
          lastFocused = document.activeElement;
          modalBox.innerHTML = "";
          builder(modalBox);
          modalBackdrop.classList.add("show");
          var f = $("input, button", modalBox);
          if (f && f.focus) f.focus();
        }
        function closeModal() {
          modalBackdrop.classList.remove("show");
          modalBox.innerHTML = "";
          if (lastFocused && lastFocused.focus) lastFocused.focus();
        }
        function showAlert(title, message, isError) {
          openModal(function (box) {
            var h = document.createElement("h3");
            h.textContent = title;
            var p = document.createElement("p");
            p.textContent = message;
            var a = document.createElement("div");
            a.className = "modal-actions";
            var ok = document.createElement("button");
            ok.textContent = "知道了";
            if (isError) ok.className = "danger";
            ok.addEventListener("click", closeModal);
            a.appendChild(ok);
            box.appendChild(h);
            box.appendChild(p);
            box.appendChild(a);
          });
        }
        function showConfirm(title, message, onConfirm, danger) {
          openModal(function (box) {
            var h = document.createElement("h3");
            h.textContent = title;
            var p = document.createElement("p");
            p.textContent = message;
            var a = document.createElement("div");
            a.className = "modal-actions";
            var cancel = document.createElement("button");
            cancel.className = "cancel";
            cancel.textContent = "取消";
            cancel.addEventListener("click", closeModal);
            var ok = document.createElement("button");
            ok.textContent = "确定";
            if (danger) ok.className = "danger";
            ok.addEventListener("click", function () {
              closeModal();
              onConfirm();
            });
            a.appendChild(cancel);
            a.appendChild(ok);
            box.appendChild(h);
            box.appendChild(p);
            box.appendChild(a);
          });
        }
        function showPrompt(title, defaultValue, onOk) {
          openModal(function (box) {
            var h = document.createElement("h3");
            h.textContent = title;
            var input = document.createElement("input");
            input.type = "text";
            input.value = defaultValue || "";
            var a = document.createElement("div");
            a.className = "modal-actions";
            var cancel = document.createElement("button");
            cancel.className = "cancel";
            cancel.textContent = "取消";
            cancel.addEventListener("click", closeModal);
            var ok = document.createElement("button");
            ok.textContent = "保存";
            ok.addEventListener("click", function () {
              var v = input.value.trim();
              if (!v) {
                input.focus();
                return;
              }
              closeModal();
              onOk(v);
            });
            input.addEventListener("keydown", function (e) {
              if (e.key === "Enter") ok.click();
            });
            a.appendChild(cancel);
            a.appendChild(ok);
            box.appendChild(h);
            box.appendChild(input);
            box.appendChild(a);
          });
        }

        function generatePageHtml(title, script, imageDataUrl) {
          var safeTitle = escapeHtml(title || "未命名页面");

        function downloadSingleHtml(filename, html) {
          try {
            var blob = new Blob([html], { type: "text/html;charset=utf-8" });
            var url = URL.createObjectURL(blob);
            var link = document.createElement("a");
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setTimeout(function () {
              URL.revokeObjectURL(url);
            }, 1000);
          } catch (err) {
            showAlert("下载失败", String((err && err.message) || err), true);
          }
        }

          pages.forEach(function (page, idx) {
            var base = (page.title || "untitled").replace(/[\\/:*?"<>|]/g, "_");
            zip.file("p5_" + base + "_" + (idx + 1) + ".html", page.html);
          });
          zip
            .generateAsync({ type: "blob" })
            .then(function (blob) {
              var url = URL.createObjectURL(blob);
              var link = document.createElement("a");
              link.href = url;
              link.download = "p5_works.zip";
              document.body.appendChild(link);
              link.click();
              document.body.removeChild(link);
              setTimeout(function () {

        var sidebarPagesEl, sidebarEl, overlayEl, hamburgerBtn;

        /* ============================================================
         * 首页运行器状态

         *   mode === "page"    -> 运行 localStorage 中指定的作品
         * ============================================================ */
        var runner = { mode: "random", pageId: null };
        var currentRandomFile = null;

        function pickRandomP5File() {
          if (!P5_FILES || !P5_FILES.length) return null;
          if (P5_FILES.length === 1) return P5_FILES[0];
          var pool = P5_FILES.filter(function (f) {
            return f !== currentRandomFile;
          });
          if (!pool.length) pool = P5_FILES.slice();
          return pool[Math.floor(Math.random() * pool.length)];
        }

        function encodePath(fileName) {

        function updateSidebarPages() {

            filtered = pages.filter(function (p) {

          sidebarPagesEl.replaceChildren(frag);

        function bindIframeProxy(iframe) {
          var iwin, idoc;
          try {
            iwin = iframe.contentWindow;
            idoc = iframe.contentDocument;
          } catch (e) {
            console.warn("无法访问 iframe 内部文档：", e);
            return;
          }
          if (!iwin || !idoc) return;

          var tries = 0;
          function tryFindCanvas() {
            var canvas = idoc.querySelector("canvas");
            if (canvas) {
              attachProxy(canvas, iwin, idoc);
              return;
            }
            if (++tries < 80) setTimeout(tryFindCanvas, 100);
          }
          tryFindCanvas();
        }

        function attachProxy(canvas, iwin, idoc) {
          if (canvas.__proxyAttached) return;
          canvas.__proxyAttached = true;

          var MOUSE_TYPES = [
            "mousemove",
            "mousedown",
            "mouseup",
            "click",
            "dblclick",
          ];
          var TOUCH_TYPES = [
            "touchstart",
            "touchmove",
            "touchend",
            "touchcancel",
          ];

          function relayMouse(e) {
            if (e.target === canvas) return;
            if (
              (e.type === "mousedown" ||
                e.type === "mouseup" ||
                e.type === "click" ||
                e.type === "dblclick") &&
              e.button !== 0
            )
              return;

            var ev;
            try {
              ev = new iwin.MouseEvent(e.type, {
                bubbles: true,
                cancelable: true,
                view: iwin,
                detail: e.detail || 1,
                screenX: e.screenX,
                screenY: e.screenY,
                clientX: e.clientX,
                clientY: e.clientY,
                ctrlKey: e.ctrlKey,
                shiftKey: e.shiftKey,
                altKey: e.altKey,
                metaKey: e.metaKey,
                button: e.button,
                buttons: e.buttons,
                relatedTarget: null,
              });
            } catch (err) {
              return;
            }
            canvas.dispatchEvent(ev);
          }

          function relayTouch(e) {
            if (e.target === canvas) return;
            if (!e.touches || !e.touches.length) return;
            var t = e.touches[0];
            var type =
              e.type === "touchstart"
                ? "mousedown"
                : e.type === "touchmove"
                  ? "mousemove"
                  : e.type === "touchend"
                    ? "mouseup"
                    : null;
            if (!type) return;
            var ev;
            try {
              ev = new iwin.MouseEvent(type, {
                bubbles: true,
                cancelable: true,
                view: iwin,
                clientX: t.clientX,
                clientY: t.clientY,
                screenX: t.screenX,
                screenY: t.screenY,
                button: 0,
                buttons: type === "mouseup" ? 0 : 1,
              });
            } catch (err) {
              return;
            }
            canvas.dispatchEvent(ev);
          }

          MOUSE_TYPES.forEach(function (type) {
            idoc.addEventListener(type, relayMouse, true);
          });
          TOUCH_TYPES.forEach(function (type) {
            idoc.addEventListener(type, relayTouch, {
              capture: true,
              passive: true,
            });
          });
        }

        function lockAppSize() {
          document.body.classList.add("preview-lock");
          var w = window.innerWidth;
          var h = window.innerHeight;
          appEl.style.position = "fixed";
          appEl.style.top = "0";
          appEl.style.left = "0";
          appEl.style.width = w + "px";
          appEl.style.height = h + "px";
          appEl.style.overflow = "hidden";
        }

        function unlockAppSize() {
          document.body.classList.remove("preview-lock");
          appEl.style.position = "";
          appEl.style.top = "";
          appEl.style.left = "";
          appEl.style.width = "";
          appEl.style.height = "";
          appEl.style.overflow = "";
        }

        /* ---------------- 首页运行器 ---------------- */

        function renderRunner() {
          destroyEditor();
          appEl.replaceChildren();
          appEl.classList.remove("preview-mode");
          setActiveNav("/");

          var html = null;

          if (runner.mode === "page") {
            var page = getPages().find(function (p) {
              return p.id === runner.pageId;
            });
            if (page) {
              html = page.html;
              appEl.dataset.currentPageId = String(page.id);
            } else {
              /* 作品已被删除，退回随机 */
              runner.mode = "random";
              runner.pageId = null;
            }
          }

          if (html === null) {
            var file = pickRandomP5File();
            if (!file) {
              unlockAppSize();
              delete appEl.dataset.currentPageId;
              var wrap = document.createElement("div");
              wrap.innerHTML =
                "<h1>还没有可运行的 p5 脚本</h1>" +
                "<p>请把 .js 脚本放进与本页面同级的 <code>" +
                P5_DIR +
                "</code> 文件夹，" +
                "并在页面代码顶部的 <code>P5_FILES</code> 数组里写上文件名。</p>";
              appEl.appendChild(wrap);
              return;
            }
            currentRandomFile = file;
            html = buildP5SrcDoc(file);
            delete appEl.dataset.currentPageId;
          }

          lockAppSize();
          appEl.classList.add("preview-mode");

          var iframe = document.createElement("iframe");
          iframe.setAttribute("title", "p5 运行");
          iframe.setAttribute("scrolling", "no");
          iframe.srcdoc = html;
          iframe.addEventListener("load", function () {
            bindIframeProxy(iframe);
          });
          appEl.appendChild(iframe);
        }

        /** 回到“随机运行 p5 文件夹脚本”状态 */
        function setRandom() {
          runner.mode = "random";
          runner.pageId = null;
          if (getRoute() === "/") render();
          else location.hash = "#/";
        }

        /**
         * 首页运行指定作品（侧边栏点脚本名 / 预览按钮 都走这里）
         * 再次点击同一个脚本名也会重新运行，不会回到随机状态
         */
        function runPage(id) {
          runner.mode = "page";
          runner.pageId = id;
          if (getRoute() === "/") render();
          else location.hash = "#/";
        }

        function deletePage(id) {
          var pages = getPages();
          var page = pages.find(function (p) {
            return p.id === id;
          });
          if (!page) return;
          showConfirm(
            "删除作品",
            "确定要删除「" + page.title + "」吗？此操作不可恢复。",
            function () {
              var list = getPages().filter(function (p) {
                return p.id !== id;
              });
              savePages(list);
              updateSidebarPages();
              if (runner.mode === "page" && runner.pageId === id) {
                runner.mode = "random";
                runner.pageId = null;
              }
              render();
            },
            true,
          );
        }

        function renamePage(id) {
          var pages = getPages();
          var page = pages.find(function (p) {
            return p.id === id;
          });
          if (!page) return;
          showPrompt("重命名作品", page.title, function (newTitle) {
            page.title = newTitle;
            savePages(pages);
            updateSidebarPages();
            render();
          });
        }

        function openSidebar() {
          sidebarEl.classList.add("open");
          overlayEl.classList.add("show");
          document.body.classList.add("sidebar-open");
          hamburgerBtn.setAttribute("aria-expanded", "true");
        }
        function closeSidebar() {
          sidebarEl.classList.remove("open");
          overlayEl.classList.remove("show");
          document.body.classList.remove("sidebar-open");
          hamburgerBtn.setAttribute("aria-expanded", "false");
        }

        var editor = null;
        var uploadedImageDataUrl = null;

        function applyTheme(theme) {
          var lightTheme = $("#cm-theme-light");
          var darkTheme = $("#cm-theme-dark");
          if (theme === "dark") {
            document.body.classList.add("dark-mode");
            if (lightTheme) lightTheme.disabled = true;
            if (darkTheme) darkTheme.disabled = false;
          } else {
            document.body.classList.remove("dark-mode");
            if (lightTheme) lightTheme.disabled = false;
            if (darkTheme) darkTheme.disabled = true;
          }
          if (editor)
            editor.setOption("theme", theme === "dark" ? "dracula" : "default");
        }
        function currentTheme() {
          return document.body.classList.contains("dark-mode")
            ? "dark"
            : "light";
        }
        function toggleTheme() {
          var next = currentTheme() === "dark" ? "light" : "dark";
          applyTheme(next);
          try {
            localStorage.setItem(THEME_KEY, next);
          } catch (e) {}
        }

        function getRoute() {
          var hash = location.hash;
          if (!hash || hash === "#" || hash === "#/") return "/";

          $$(".sidebar .nav-item[data-path]").forEach(function (el) {

            }

        /* ---------------- AI 助手 —— 网络请求 ---------------- */

        function parseJsonResponse(res) {
          return res.text().then(function (t) {
            var data = {};
            if (t) {
              try {
                data = JSON.parse(t);
              } catch (e) {
                data = {};
              }
            }
            if (!res.ok) {
              var msg =
                (data && data.error && data.error.message) ||
                (data && data.message) ||
                "HTTP " + res.status;
              throw new Error(msg);
            }
            return data;
          });
        }

        function callChatGPT(key, messages) {
          var conf = aiModelConf("chatgpt");
          return fetch(conf.endpoint, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: "Bearer " + key,
            },
            body: JSON.stringify({
              model: conf.apiModel,
              messages: messages.map(function (m) {
                return { role: m.role, content: m.content };
              }),
            }),
          })
            .then(parseJsonResponse)
            .then(function (data) {
              var c = data.choices && data.choices[0];
              if (!c) throw new Error("API 未返回内容");
              return (c.message && c.message.content) || "";
            });
        }

        function callDeepSeek(key, messages) {
          var conf = aiModelConf("deepseek");
          return fetch(conf.endpoint, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: "Bearer " + key,
            },
            body: JSON.stringify({
              model: conf.apiModel,
              messages: messages.map(function (m) {
                return { role: m.role, content: m.content };
              }),
            }),
          })
            .then(parseJsonResponse)
            .then(function (data) {
              var c = data.choices && data.choices[0];
              if (!c) throw new Error("API 未返回内容");
              return (c.message && c.message.content) || "";
            });
        }

        function callGemini(key, messages) {
          var conf = aiModelConf("gemini");
          var url =
            conf.endpoint + "?key=" + encodeURIComponent(key);
          var contents = messages.map(function (m) {
            return {
              role: m.role === "assistant" ? "model" : "user",
              parts: [{ text: m.content }],
            };
          });
          return fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ contents: contents }),
          })
            .then(parseJsonResponse)
            .then(function (data) {
              var cand = data.candidates && data.candidates[0];
              if (!cand) throw new Error("API 未返回内容");
              var parts = (cand.content && cand.content.parts) || [];
              return parts
                .map(function (p) {
                  return p.text || "";
                })
                .join("");
            });
        }

        function callAI(model, key, messages) {
          if (model === "gemini") return callGemini(key, messages);
          if (model === "deepseek") return callDeepSeek(key, messages);
          return callChatGPT(key, messages);
        }

        /* ---------------- AI 助手 —— 交互 ---------------- */

        function selectAIModel(model) {
          if (!aiModelConf(model)) return;
          showPrompt(
            "设置 " + aiModelName(model) + " API Key",
            aiState.keys[model] || "",
            function (v) {
              aiState.keys[model] = v;
              saveAIKeys();
              aiState.currentModel = model;
              refreshAIModelUI();
              renderAIMessages();
              updateAISendBtn();
            },
          );
        }

        function downloadAIChat(model) {
          var chat = aiState.chats[model] || [];
          if (!chat.length) {
            showAlert(
              "无法下载",
              "「" + aiModelName(model) + "」还没有对话内容。",
            );
            return;
          }
          var lines = ["# " + aiModelName(model) + " 对话记录", ""];
          chat.forEach(function (m) {
            lines.push(m.role === "user" ? "## 🧑 我" : "## 🤖 " + aiModelName(model));
            lines.push("");
            lines.push(m.content);
            lines.push("");
          });
          var md = lines.join("\n");
          var blob = new Blob([md], { type: "text/markdown;charset=utf-8" });
          var url = URL.createObjectURL(blob);
          var a = document.createElement("a");
          a.href = url;
          a.download =
            "ai_chat_" + model + "_" + Date.now() + ".md";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(function () {
            URL.revokeObjectURL(url);
          }, 1000);
        }

        function aiSend() {
          if (aiState.busy) return;
          var inputEl = $("#aiInput");
          if (!inputEl) return;
          var text = (inputEl.value || "").trim();
          if (!text) return;

          var model = aiState.currentModel;
          var key = aiState.keys[model];
          if (!key) {
            showAlert(
              "缺少 API Key",
              "请先点击模型选择按钮，为 " +
                aiModelName(model) +
                " 输入 API Key。",
              true,
            );
            return;
          }

          var chat = aiState.chats[model];
          if (!Array.isArray(chat)) {
            chat = aiState.chats[model] = [];
          }
          chat.push({ role: "user", content: text });
          saveAIChats();

          inputEl.value = "";
          inputEl.style.height = "auto";

          aiState.busy = true;
          updateAISendBtn();
          renderAIMessages();

          var payload = chat.slice();

          callAI(model, key, payload)
            .then(function (reply) {
              chat.push({
                role: "assistant",
                content: reply || "(空回复)",
              });
              saveAIChats();
              aiState.busy = false;
              updateAISendBtn();
              renderAIMessages();
            })
            .catch(function (err) {
              aiState.busy = false;
              updateAISendBtn();
              renderAIMessages();
              showAlert(
                "请求失败",
                String((err && err.message) || err) ||
                  "网络错误，请检查 API Key 或稍后重试。",
                true,
              );
            });
        }

        function clearAIChat() {
          var model = aiState.currentModel;
          var chat = aiState.chats[model] || [];
          if (!chat.length) return;
          showConfirm(
            "清除对话",
            "确定要清除与「" + aiModelName(model) + "」的全部对话内容吗？",
            function () {
              aiState.chats[model] = [];
              saveAIChats();
              renderAIMessages();
            },
            true,
          );
        }

        function bindAIAssistant() {
          buildAIModelMenu();
          refreshAIModelUI();
          renderAIMessages();
          updateAISendBtn();

          var modelBtn = $("#aiModelBtn");

            });
            inputEl.addEventListener("keydown", function (e) {
              if (
                e.key === "Enter" &&
                !e.shiftKey &&
                !e.isComposing &&
                e.keyCode !== 229
              ) {
                e.preventDefault();
                aiSend();
              }
            });
          }

          if (sendBtn) {
            sendBtn.addEventListener("click", function () {
              aiSend();
            });
          }

          if (clearBtn) {
            clearBtn.addEventListener("click", function () {
              clearAIChat();
            });
          }
        }

        /* ---------------- 路由渲染 ---------------- */

        function render() {
          var path = getRoute();

          /* 离开首页时，若当前是运行指定脚本状态，则重置为随机状态 */
          if (path !== "/" && path !== "" && path !== "/index.html") {
            if (runner.mode === "page") {
              runner.mode = "random";
              runner.pageId = null;
            }
          }

          /* 首页 = 全屏 p5 运行器（随机 / 指定脚本） */
          if (path === "/" || path === "" || path === "/index.html") {
            renderRunner();
            return;
          }

          /* 离开首页：解除全屏锁定 */
          if (appEl.classList.contains("preview-mode")) {
            appEl.classList.remove("preview-mode");
          }
          delete appEl.dataset.currentPageId;
          unlockAppSize();

          destroyEditor();
          appEl.replaceChildren();
          setActiveNav(path);

          if (path === "/about") {
            appEl.appendChild(renderAbout());
          } else if (path === "/ai") {
            appEl.appendChild(renderAIAssistant());
            bindAIAssistant();
          } else if (path === "/generator") {
            appEl.appendChild(renderGenerator());
            bindGenerator();
          } else {
            var wrap = document.createElement("div");
            var h = document.createElement("h1");
            h.textContent = "页面 " + path;
            var p = document.createElement("p");
            p.textContent = "内容未定义。";
            wrap.appendChild(h);
            wrap.appendChild(p);
            appEl.appendChild(wrap);
          }
        }

        /* 初始化 */
        function init() {
          modalBackdrop = $("#modalBackdrop");
          modalBox = $("#modalBox");
          sidebarPagesEl = $("#sidebar-pages");
          sidebarEl = $("#sidebar");
          overlayEl = $("#overlay");
          hamburgerBtn = $("#hamburgerBtn");
          appEl = $("#app");
          sidebarSearchEl = $("#sidebarSearch");

          initAIState();

          var savedTheme = "light";
          try {
            savedTheme = localStorage.getItem(THEME_KEY) || "light";
          } catch (e) {}
          applyTheme(savedTheme);

          /* 全局禁止缩放（iOS Safari 会忽略 user-scalable=no，这里再兜底） */
          ["gesturestart", "gesturechange", "gestureend"].forEach(
            function (type) {
              document.addEventListener(
                type,
                function (e) {
                  e.preventDefault();
                },
                {
                  passive: false,
                },
              );
            },
          );
          document.addEventListener(
            "touchmove",
            function (e) {
              if (e.touches && e.touches.length > 1) {
                e.preventDefault();
              }
            },
            { passive: false },
          );
          var lastTouchEnd = 0;
          document.addEventListener(
            "touchend",
            function (e) {
              var now = Date.now();
              if (now - lastTouchEnd <= 300) {
                var t = e.target;
                var tag = t && t.tagName ? t.tagName.toLowerCase() : "";
                if (
                  tag !== "input" &&
                  tag !== "textarea" &&
                  tag !== "button" &&
                  tag !== "select" &&
                  tag !== "a"
                ) {
                  e.preventDefault();
                }
              }
              lastTouchEnd = now;
            },
            { passive: false },
          );

          /* 点击页面空白处关闭 AI 模型菜单 */
          document.addEventListener("click", function (e) {
            var menu = $("#aiModelMenu");
            if (!menu || !menu.classList.contains("show")) return;
            var picker = menu.parentNode;
            if (picker && !picker.contains(e.target)) {
              menu.classList.remove("show");
            }
          });

          /* 搜索框*/
          if (sidebarSearchEl) {
            sidebarSearchEl.addEventListener("input", function () {
              sidebarSearchKeyword = this.value || "";
              updateSidebarPages();
            });
            sidebarSearchEl.addEventListener("keydown", function (e) {
              if (e.key === "Escape") {
                if (this.value) {
                  this.value = "";
                  sidebarSearchKeyword = "";
                  updateSidebarPages();
                }
                e.stopPropagation();
              } else {
                e.stopPropagation();
              }
            });
            sidebarSearchEl.addEventListener("click", function (e) {
              e.stopPropagation();
            });
          }

          hamburgerBtn.addEventListener("click", openSidebar);
          overlayEl.addEventListener("click", closeSidebar);
          modalBackdrop.addEventListener("click", function (e) {
            if (e.target === modalBackdrop) closeModal();
          });

          document.addEventListener("keydown", function (e) {
            if (e.key === "Escape") {
              if (modalBackdrop.classList.contains("show")) {
                closeModal();
              } else if (sidebarEl.classList.contains("open")) {
                closeSidebar();
              } else if (runner.mode === "page" && getRoute() === "/") {
                setRandom();
              }
            }
          });

          /* 侧边栏底部 */
          var exportZipBtn = $("#exportZipSidebar");
          if (exportZipBtn) {
            var runExport = function () {
              closeSidebar();
              exportZip();
            };
            exportZipBtn.addEventListener("click", runExport);
            exportZipBtn.addEventListener("keydown", function (e) {
              if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                runExport();
              }
            });
          }

          var themeBtn = $("#themeToggleSidebar");
          if (themeBtn) themeBtn.addEventListener("click", toggleTheme);

          /* 顶部导航：首页 -> 回到随机状态；其它导航 -> 跳转（render 中会重置 runner） */
          $$(".sidebar .nav-item[data-path]").forEach(function (el) {
            var go = function () {
              var path = el.getAttribute("data-path");
              closeSidebar();
              if (path === "#/") {
                setRandom();
                return;
              }
              if (location.hash === path) render();
              else location.hash = path;
            };
            el.addEventListener("click", go);
            el.addEventListener("keydown", function (e) {
              if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                go();
              }
            });
          });

          /* 侧边栏脚本名：点击 -> 首页直接运行；再次点击仍然运行 */
          sidebarPagesEl.addEventListener("click", function (e) {
            var btn = e.target.closest("[data-action]");
            if (!btn) return;
            var id = Number(btn.dataset.id);
            var action = btn.dataset.action;
            if (action === "open") {
              closeSidebar();
              runPage(id);
            } else if (action === "rename") {
              renamePage(id);
            } else if (action === "delete") {
              deletePage(id);
            }
          });

          window.addEventListener("hashchange", function () {
            render();
            closeSidebar();
          });

          window.addEventListener("orientationchange", function () {
            if (editor) editor.refresh();
          });

          window.addEventListener("resize", function () {
            if (appEl.classList.contains("preview-mode")) {
              appEl.style.width = window.innerWidth + "px";
              appEl.style.height = window.innerHeight + "px";
            }
            if (editor) editor.refresh();
          });

          updateSidebarPages();
          render();
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", init);
        } else {
          init();
        }
      })();
    </script>
  </body>
</html>
