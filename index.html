<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>randomArt 创意脚本编辑</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/default.min.css"
      id="cm-theme-light"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css"
      id="cm-theme-dark"
      disabled
    />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
      :root {
        --bg-light: #f5f5f5;
        --bg-dark: #1e1e1e;
        --surface-light: #ffffff;
        --surface-dark: #2d2d2d;
        --text-light: #222222;
        --text-dark: #dddddd;
        --hover-light: rgba(0, 0, 0, 0.055);
        --hover-dark: rgba(255, 255, 255, 0.07);
        --line-light: rgba(0, 0, 0, 0.08);
        --line-dark: rgba(255, 255, 255, 0.08);
        --sidebar-w: min(280px, 78vw);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        font-family: Arial, "Helvetica Neue", system-ui, sans-serif;
        background: var(--bg-light);
        color: var(--text-light);
        -webkit-text-size-adjust: 100%;
        transition: background 0.3s, color 0.3s;
      }
      body.dark-mode { background: var(--bg-dark); color: var(--text-dark); }

      /* 预览时锁定 body，防止任何滚动 / 位移影响 iframe 尺寸 */
      body.preview-lock {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
      }

      /* ===================== 汉堡按钮 ===================== */
      .hamburger-btn {
        position: fixed;
        top: clamp(8px, 2vw, 14px);
        left: clamp(10px, 3vw, 18px);
        z-index: 300;
        background: none;
        border: none;
        color: #333;
        font-size: clamp(30px, 6vw, 40px);
        font-weight: bold;
        cursor: pointer;
        padding: 4px 8px;
        line-height: 1;
        user-select: none;
        transition: color 0.3s, opacity 0.22s ease, transform 0.22s ease;
      }
      .hamburger-btn:hover { transform: scale(1.1); }
      body.dark-mode .hamburger-btn { color: #fff; }
      /* 预览时保持汉堡可见、颜色可读 */
      body.preview-lock .hamburger-btn {
        color: #fff;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
      }
      /* 侧边栏打开时隐藏汉堡 */
      body.sidebar-open .hamburger-btn {
        opacity: 0;
        transform: scale(0.6);
        pointer-events: none;
      }

      /* ===================== 侧边栏 ===================== */
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: var(--sidebar-w);
        height: 100vh;
        height: 100dvh;
        background: var(--bg-light);
        color: var(--text-light);
        transform: translateX(-100%);
        transition: transform 0.3s ease, background 0.3s, color 0.3s;
        z-index: 200;
        padding: clamp(14px, 3vw, 20px) 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        -webkit-overflow-scrolling: touch;
        box-shadow:
          inset -22px 0 28px -26px rgba(0, 0, 0, 0.55),
          inset 0 -22px 28px -26px rgba(0, 0, 0, 0.35);
        border-right: 1px solid var(--line-light);
      }
      .sidebar.open { transform: translateX(0); }
      body.dark-mode .sidebar {
        background: var(--bg-dark);
        color: var(--text-dark);
        box-shadow:
          inset -22px 0 28px -26px rgba(0, 0, 0, 1),
          inset 0 -22px 28px -26px rgba(0, 0, 0, 0.9);
        border-right-color: var(--line-dark);
      }

      .sidebar .nav-item {
        padding: 12px clamp(16px, 4vw, 20px);
        border-bottom: 1px solid var(--line-light);
        cursor: pointer;
        transition: background 0.15s;
      }
      body.dark-mode .sidebar .nav-item { border-bottom-color: var(--line-dark); }
      .sidebar .nav-item:hover { background: var(--hover-light); }
      body.dark-mode .sidebar .nav-item:hover { background: var(--hover-dark); }
      .sidebar .nav-item[aria-current="page"] { background: var(--hover-light); }
      body.dark-mode .sidebar .nav-item[aria-current="page"] { background: var(--hover-dark); }

      .sidebar .divider { border-top: 1px solid var(--line-light); margin: 10px 0; }
      body.dark-mode .sidebar .divider { border-top-color: var(--line-dark); }

      .sidebar .section-title {
        padding: 8px clamp(16px, 4vw, 20px);
        font-size: 0.85rem;
        color: #888;
        font-weight: bold;
      }
      body.dark-mode .sidebar .section-title { color: #999; }

      .sidebar .page-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px clamp(16px, 4vw, 20px) 8px clamp(22px, 6vw, 30px);
        border-bottom: 1px solid var(--line-light);
      }
      body.dark-mode .sidebar .page-item { border-bottom-color: var(--line-dark); }
      .sidebar .page-item:hover { background: var(--hover-light); }
      body.dark-mode .sidebar .page-item:hover { background: var(--hover-dark); }

      .sidebar .page-item .page-title {
        flex: 1;
        color: inherit;
        cursor: pointer;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .sidebar .page-item .actions button {
        background: none;
        border: none;
        color: #888;
        cursor: pointer;
        font-size: 0.85rem;
        padding: 2px 5px;
        transition: color 0.15s;
      }
      .sidebar .page-item .actions .rename:hover { color: #5bc0de; }
      .sidebar .page-item .actions .del:hover { color: #d9534f; }

      .sidebar .no-pages {
        padding: 12px clamp(16px, 4vw, 20px);
        color: #888;
        font-style: italic;
      }

      .sidebar-footer {
        margin-top: auto;
        border-top: 1px solid var(--line-light);
        padding: 8px 0;
      }
      body.dark-mode .sidebar-footer { border-top-color: var(--line-dark); }
      .sidebar-footer .nav-item { padding: 10px clamp(16px, 4vw, 20px); border-bottom: none; }

      .overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        z-index: 150;
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      .overlay.show { display: block; opacity: 1; }

      /* ===================== 主内容 ===================== */
      #app {
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        padding:
          clamp(56px, 10vw, 78px)
          clamp(14px, 5vw, 32px)
          clamp(28px, 7vw, 52px);
        background: var(--surface-light);
        color: var(--text-light);
        transition: background 0.3s, color 0.3s;
        overflow-x: hidden;
      }
      body.dark-mode #app { background: var(--surface-dark); color: var(--text-dark); }
      #app > div {
        width: 100%;
        max-width: 940px;
        margin: 0 auto;
      }

      /* ============ 预览模式 ============
       * 宽高由 JS 用内联像素锁定（见 lockAppSize），这里只处理排版
       */
      #app.preview-mode {
        padding: 0;
        max-width: none;
        min-height: 0;
        background: #000;
        overflow: hidden;
        z-index: 100;
      }
      #app.preview-mode iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
        background: #fff;
      }

      #app h1 {
        font-size: clamp(1.35rem, 4.5vw, 1.9rem);
        margin: 0 0 0.6em;
        line-height: 1.25;
        word-break: break-word;
      }
      #app p {
        font-size: clamp(0.9rem, 2.6vw, 1rem);
        line-height: 1.6;
        margin: 0.5em 0;
      }

      .form-group { margin-bottom: 15px; }
      .form-group label {
        display: block;
        font-weight: bold;
        margin-bottom: 5px;
        font-size: clamp(0.85rem, 2.5vw, 0.95rem);
      }
      .form-group input,
      .form-group textarea {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 0.9rem;
      }
      body.dark-mode .form-group input,
      body.dark-mode .form-group textarea {
        background: #3a3a3a;
        color: #ddd;
        border-color: #555;
      }
      .form-group .CodeMirror {
        border: 1px solid #ccc;
        border-radius: 4px;
        height: clamp(160px, 32vh, 240px) !important;
        font-size: 14px;
      }
      body.dark-mode .form-group .CodeMirror { border-color: #555; }

      button {
        background: #007bff;
        color: white;
        border: none;
        padding: 10px clamp(14px, 4vw, 20px);
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.95rem;
        transition: background 0.2s;
      }
      button:hover { background: #0056b3; }
      button:disabled { opacity: 0.6; cursor: not-allowed; }

      .result {
        margin-top: 20px;
        padding: 12px;
        background: #e9f7fe;
        border-radius: 4px;
        word-break: break-word;
      }
      body.dark-mode .result { background: #2a4a5a; }

      .preview-img {
        max-width: min(200px, 60vw);
        max-height: 200px;
        margin-top: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        display: block;
      }

      .action-buttons {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 10px;
      }
      .action-buttons button { background: #6c757d; }
      .action-buttons button.preview { background: #28a745; }
      .action-buttons button.zip { background: #17a2b8; }

      .modal-backdrop {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 400;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      .modal-backdrop.show { display: flex; }
      .modal {
        background: #fff;
        color: #222;
        border-radius: 8px;
        width: min(440px, 100%);
        max-height: 88vh;
        overflow-y: auto;
        padding: clamp(16px, 4vw, 22px);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      }
      body.dark-mode .modal { background: #2d2d2d; color: #ddd; }
      .modal h3 { margin: 0 0 12px; font-size: 1.1rem; }
      .modal p { margin: 0 0 16px; line-height: 1.55; word-break: break-word; }
      .modal input {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        margin-bottom: 16px;
        font-size: 1rem;
      }
      body.dark-mode .modal input {
        background: #3a3a3a;
        color: #ddd;
        border-color: #555;
      }
      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        flex-wrap: wrap;
      }
      .modal-actions .cancel { background: #6c757d; }
      .modal-actions .danger { background: #d9534f; }

      @media (max-width: 420px) {
        .hamburger-btn { font-size: 28px; }
        .action-buttons button { flex: 1 1 auto; }
      }
      @media (max-height: 480px) {
        #app { padding-top: 52px; padding-bottom: 20px; }
        .form-group .CodeMirror { height: 140px !important; }
      }
    </style>
  </head>
  <body>
    <button
      class="hamburger-btn"
      id="hamburgerBtn"
      aria-label="打开菜单"
      aria-expanded="false"
      aria-controls="sidebar"
    >☰</button>

    <nav class="sidebar" id="sidebar" aria-label="主导航">
      <div class="nav-item" data-path="#/" role="button" tabindex="0">🏠 首页</div>
      <div class="nav-item" data-path="#/about" role="button" tabindex="0">📖 关于</div>
      <div class="nav-item" data-path="#/generator" role="button" tabindex="0">✏️ 生成脚本</div>
      <div class="divider"></div>
      <div class="section-title">📄 我的脚本</div>
      <div id="sidebar-pages">
        <div class="no-pages">暂无生成的脚本</div>
      </div>
      <div class="sidebar-footer">
        <div class="nav-item" id="themeToggleSidebar" role="button" tabindex="0">
          🌓 切换主题
        </div>
      </div>
    </nav>
    <div class="overlay" id="overlay"></div>

    <main id="app">加载中…</main>

    <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true">
      <div class="modal" id="modalBox"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>

    <script>
      (function () {
        "use strict";

        var STORAGE_KEY = "p5_pages";
        var THEME_KEY = "p5_theme";
        var MAX_IMAGE_BYTES = 1.5 * 1024 * 1024;

        function $(sel, root) { return (root || document).querySelector(sel); }
        function $$(sel, root) {
          return Array.prototype.slice.call((root || document).querySelectorAll(sel));
        }
        function escapeHtml(text) {
          return String(text)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
        }
        function escapeScriptClose(str) {
          return String(str).replace(/<\/script/gi, "<\\/script");
        }

        /* ======================= 本地存储 ======================= */
        function getPages() {
          try {
            var raw = localStorage.getItem(STORAGE_KEY);
            var list = raw ? JSON.parse(raw) : [];
            return Array.isArray(list) ? list : [];
          } catch (e) { return []; }
        }
        function savePages(pages) {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(pages));
            return true;
          } catch (e) {
            if (e && (e.name === "QuotaExceededError" || e.code === 22)) {
              showAlert("本地存储已满", "请删除部分作品，或上传更小的图片后再试。", true);
            } else {
              showAlert("保存失败", String((e && e.message) || e), true);
            }
            return false;
          }
        }

        /* ======================= 模态框 ======================= */
        var modalBackdrop, modalBox, lastFocused;

        function openModal(builder) {
          lastFocused = document.activeElement;
          modalBox.innerHTML = "";
          builder(modalBox);
          modalBackdrop.classList.add("show");
          var f = $("input, button", modalBox);
          if (f && f.focus) f.focus();
        }
        function closeModal() {
          modalBackdrop.classList.remove("show");
          modalBox.innerHTML = "";
          if (lastFocused && lastFocused.focus) lastFocused.focus();
        }
        function showAlert(title, message, isError) {
          openModal(function (box) {
            var h = document.createElement("h3"); h.textContent = title;
            var p = document.createElement("p"); p.textContent = message;
            var a = document.createElement("div"); a.className = "modal-actions";
            var ok = document.createElement("button");
            ok.textContent = "知道了";
            if (isError) ok.className = "danger";
            ok.addEventListener("click", closeModal);
            a.appendChild(ok);
            box.appendChild(h); box.appendChild(p); box.appendChild(a);
          });
        }
        function showConfirm(title, message, onConfirm, danger) {
          openModal(function (box) {
            var h = document.createElement("h3"); h.textContent = title;
            var p = document.createElement("p"); p.textContent = message;
            var a = document.createElement("div"); a.className = "modal-actions";
            var cancel = document.createElement("button");
            cancel.className = "cancel"; cancel.textContent = "取消";
            cancel.addEventListener("click", closeModal);
            var ok = document.createElement("button");
            ok.textContent = "确定";
            if (danger) ok.className = "danger";
            ok.addEventListener("click", function () { closeModal(); onConfirm(); });
            a.appendChild(cancel); a.appendChild(ok);
            box.appendChild(h); box.appendChild(p); box.appendChild(a);
          });
        }
        function showPrompt(title, defaultValue, onOk) {
          openModal(function (box) {
            var h = document.createElement("h3"); h.textContent = title;
            var input = document.createElement("input");
            input.type = "text"; input.value = defaultValue || "";
            var a = document.createElement("div"); a.className = "modal-actions";
            var cancel = document.createElement("button");
            cancel.className = "cancel"; cancel.textContent = "取消";
            cancel.addEventListener("click", closeModal);
            var ok = document.createElement("button");
            ok.textContent = "保存";
            ok.addEventListener("click", function () {
              var v = input.value.trim();
              if (!v) { input.focus(); return; }
              closeModal(); onOk(v);
            });
            input.addEventListener("keydown", function (e) {
              if (e.key === "Enter") ok.click();
            });
            a.appendChild(cancel); a.appendChild(ok);
            box.appendChild(h); box.appendChild(input); box.appendChild(a);
          });
        }

        /* =====================================================================
         * 生成独立 HTML —— CSS 保持极简
         * ===================================================================== */
        function generatePageHtml(title, script, imageDataUrl) {
          var safeTitle = escapeHtml(title || "未命名页面");
          var imgVar = imageDataUrl
            ? 'var imageUrl = "' + imageDataUrl + '";'
            : "var imageUrl = null;";
          var safeImgVar = escapeScriptClose(imgVar);
          var safeScript = escapeScriptClose(script);

          return (
            "<!DOCTYPE html>\n" +
            '<html lang="zh-CN">\n' +
            "<head>\n" +
            '  <meta charset="UTF-8">\n' +
            '  <meta name="viewport" content="width=device-width, initial-scale=1.0">\n' +
            "  <title>" + safeTitle + "</title>\n" +
            "  <style>\n" +
            "    html, body { margin: 0; padding: 0; }\n" +
            "    canvas { display: block; }\n" +
            "  </style>\n" +
            '  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"><\/script>\n' +
            "</head>\n" +
            "<body>\n" +
            "  <script>\n" +
            "    " + safeImgVar + "\n" +
            "    " + safeScript + "\n" +
            "  <\/script>\n" +
            "</body>\n" +
            "</html>"
          );
        }

        /* ======================= 导出 ZIP ======================= */
        function exportZip() {
          var pages = getPages();
          if (!pages.length) {
            showAlert("无法导出", "当前没有可导出的作品。");
            return;
          }
          var zip = new JSZip();
          pages.forEach(function (page, idx) {
            var base = (page.title || "untitled").replace(/[\\/:*?"<>|]/g, "_");
            zip.file("p5_" + base + "_" + (idx + 1) + ".html", page.html);
          });
          zip.generateAsync({ type: "blob" })
            .then(function (blob) {
              var url = URL.createObjectURL(blob);
              var link = document.createElement("a");
              link.href = url;
              link.download = "p5_works.zip";
              document.body.appendChild(link);
              link.click();
              document.body.removeChild(link);
              setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
            })
            .catch(function (err) {
              showAlert("导出失败", String((err && err.message) || err), true);
            });
        }

        /* ======================= 侧边栏 ======================= */
        var sidebarPagesEl, sidebarEl, overlayEl, hamburgerBtn;

        function updateSidebarPages() {
          var pages = getPages();
          if (!pages.length) {
            var empty = document.createElement("div");
            empty.className = "no-pages";
            empty.textContent = "暂无生成的脚本";
            sidebarPagesEl.replaceChildren(empty);
            return;
          }
          var frag = document.createDocumentFragment();
          pages.forEach(function (page) {
            var item = document.createElement("div");
            item.className = "page-item";

            var titleSpan = document.createElement("span");
            titleSpan.className = "page-title";
            titleSpan.textContent = page.title;
            titleSpan.dataset.action = "open";
            titleSpan.dataset.id = String(page.id);

            var actions = document.createElement("div");
            actions.className = "actions";

            var renameBtn = document.createElement("button");
            renameBtn.className = "rename"; renameBtn.title = "重命名";
            renameBtn.textContent = "✏️";
            renameBtn.dataset.action = "rename";
            renameBtn.dataset.id = String(page.id);

            var delBtn = document.createElement("button");
            delBtn.className = "del"; delBtn.title = "删除";
            delBtn.textContent = "🗑️";
            delBtn.dataset.action = "delete";
            delBtn.dataset.id = String(page.id);

            actions.appendChild(renameBtn);
            actions.appendChild(delBtn);
            item.appendChild(titleSpan);
            item.appendChild(actions);
            frag.appendChild(item);
          });
          sidebarPagesEl.replaceChildren(frag);
        }

        /* =====================================================================
         * 事件代理：父页面 → iframe 内 canvas
         * ===================================================================== */
        function bindIframeProxy(iframe) {
          var iwin, idoc;
          try {
            iwin = iframe.contentWindow;
            idoc = iframe.contentDocument;
          } catch (e) {
            console.warn("无法访问 iframe 内部文档：", e);
            return;
          }
          if (!iwin || !idoc) return;

          var tries = 0;
          function tryFindCanvas() {
            var canvas = idoc.querySelector("canvas");
            if (canvas) {
              attachProxy(canvas, iwin, idoc);
              return;
            }
            if (++tries < 80) setTimeout(tryFindCanvas, 100);
          }
          tryFindCanvas();
        }

        function attachProxy(canvas, iwin, idoc) {
          if (canvas.__proxyAttached) return;
          canvas.__proxyAttached = true;

          var MOUSE_TYPES = ["mousemove", "mousedown", "mouseup", "click", "dblclick"];
          var TOUCH_TYPES = ["touchstart", "touchmove", "touchend", "touchcancel"];

          function relayMouse(e) {
            if (e.target === canvas) return;
            if (
              (e.type === "mousedown" ||
                e.type === "mouseup" ||
                e.type === "click" ||
                e.type === "dblclick") &&
              e.button !== 0
            ) return;

            var ev;
            try {
              ev = new iwin.MouseEvent(e.type, {
                bubbles: true,
                cancelable: true,
                view: iwin,
                detail: e.detail || 1,
                screenX: e.screenX,
                screenY: e.screenY,
                clientX: e.clientX,
                clientY: e.clientY,
                ctrlKey: e.ctrlKey,
                shiftKey: e.shiftKey,
                altKey: e.altKey,
                metaKey: e.metaKey,
                button: e.button,
                buttons: e.buttons,
                relatedTarget: null,
              });
            } catch (err) { return; }
            canvas.dispatchEvent(ev);
          }

          function relayTouch(e) {
            if (e.target === canvas) return;
            if (!e.touches || !e.touches.length) return;
            var t = e.touches[0];
            var type =
              e.type === "touchstart" ? "mousedown" :
              e.type === "touchmove" ? "mousemove" :
              e.type === "touchend" ? "mouseup" : null;
            if (!type) return;
            var ev;
            try {
              ev = new iwin.MouseEvent(type, {
                bubbles: true,
                cancelable: true,
                view: iwin,
                clientX: t.clientX,
                clientY: t.clientY,
                screenX: t.screenX,
                screenY: t.screenY,
                button: 0,
                buttons: type === "mouseup" ? 0 : 1,
              });
            } catch (err) { return; }
            canvas.dispatchEvent(ev);
          }

          MOUSE_TYPES.forEach(function (type) {
            idoc.addEventListener(type, relayMouse, true);
          });
          TOUCH_TYPES.forEach(function (type) {
            idoc.addEventListener(type, relayTouch, { capture: true, passive: true });
          });
        }

        /* =====================================================================
         * 预览：作为首页的一种模式
         * ---------------------------------------------------------------------
         * - enterPreview(id)：把路由切到 #/，render() 检测到 previewingPageId 就全屏运行
         * - 锁死 appEl 尺寸为「进入预览那一刻的像素值」，
         *   之后不随 resize / 地址栏 / 滚动条改变，保证 p5 canvas 稳定
         * - 退出：Esc，或从侧边栏点任意导航项
         * ===================================================================== */
        var previewingPageId = null;

        function lockAppSize() {
          // 先锁 body，再测量，避免滚动条影响 innerWidth
          document.body.classList.add("preview-lock");
          var w = window.innerWidth;
          var h = window.innerHeight;
          appEl.style.position = "fixed";
          appEl.style.top = "0";
          appEl.style.left = "0";
          appEl.style.width = w + "px";
          appEl.style.height = h + "px";
          appEl.style.overflow = "hidden";
        }

        function unlockAppSize() {
          document.body.classList.remove("preview-lock");
          appEl.style.position = "";
          appEl.style.top = "";
          appEl.style.left = "";
          appEl.style.width = "";
          appEl.style.height = "";
          appEl.style.overflow = "";
        }

        function enterPreview(id) {
          var page = getPages().find(function (p) { return p.id === id; });
          if (!page) return;
          previewingPageId = id;
          closeSidebar();
          var h = location.hash;
          if (h === "#/" || h === "" || h === "#") {
            render();
          } else {
            location.hash = "#/";
          }
        }

        function exitPreview() {
          previewingPageId = null;
          unlockAppSize();
          render();
        }

        function renderPreview(id) {
          var page = getPages().find(function (p) { return p.id === id; });
          if (!page) {
            previewingPageId = null;
            unlockAppSize();
            render();
            return;
          }

          destroyEditor();
          appEl.replaceChildren();
          setActiveNav("/");

          lockAppSize();

          var iframe = document.createElement("iframe");
          iframe.setAttribute("title", page.title);
          iframe.setAttribute("scrolling", "no");
          iframe.srcdoc = page.html;

          iframe.addEventListener("load", function () {
            bindIframeProxy(iframe);
          });

          appEl.appendChild(iframe);
          appEl.classList.add("preview-mode");
          appEl.dataset.currentPageId = String(id);
        }

        function deletePage(id) {
          var pages = getPages();
          var page = pages.find(function (p) { return p.id === id; });
          if (!page) return;
          showConfirm(
            "删除作品",
            '确定要删除「' + page.title + '」吗？此操作不可恢复。',
            function () {
              var list = getPages().filter(function (p) { return p.id !== id; });
              savePages(list);
              updateSidebarPages();
              if (previewingPageId === id) {
                previewingPageId = null;
                unlockAppSize();
              }
              render();
            },
            true
          );
        }

        function renamePage(id) {
          var pages = getPages();
          var page = pages.find(function (p) { return p.id === id; });
          if (!page) return;
          showPrompt("重命名作品", page.title, function (newTitle) {
            page.title = newTitle;
            savePages(pages);
            updateSidebarPages();
            render();
          });
        }

        function openSidebar() {
          sidebarEl.classList.add("open");
          overlayEl.classList.add("show");
          document.body.classList.add("sidebar-open");
          hamburgerBtn.setAttribute("aria-expanded", "true");
        }
        function closeSidebar() {
          sidebarEl.classList.remove("open");
          overlayEl.classList.remove("show");
          document.body.classList.remove("sidebar-open");
          hamburgerBtn.setAttribute("aria-expanded", "false");
        }

        /* ======================= 主题 ======================= */
        var editor = null;
        var uploadedImageDataUrl = null;

        function applyTheme(theme) {
          var lightTheme = $("#cm-theme-light");
          var darkTheme = $("#cm-theme-dark");
          if (theme === "dark") {
            document.body.classList.add("dark-mode");
            if (lightTheme) lightTheme.disabled = true;
            if (darkTheme) darkTheme.disabled = false;
          } else {
            document.body.classList.remove("dark-mode");
            if (lightTheme) lightTheme.disabled = false;
            if (darkTheme) darkTheme.disabled = true;
          }
          if (editor) editor.setOption("theme", theme === "dark" ? "dracula" : "default");
        }
        function currentTheme() {
          return document.body.classList.contains("dark-mode") ? "dark" : "light";
        }
        function toggleTheme() {
          var next = currentTheme() === "dark" ? "light" : "dark";
          applyTheme(next);
          try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
        }

        /* ======================= 路由 ======================= */
        function getRoute() {
          var hash = location.hash;
          if (!hash || hash === "#" || hash === "#/") return "/";
          return hash.replace(/^#/, "") || "/";
        }
        function setActiveNav(path) {
          $$(".sidebar .nav-item[data-path]").forEach(function (el) {
            if (el.getAttribute("data-path") === "#" + path) {
              el.setAttribute("aria-current", "page");
            } else {
              el.removeAttribute("aria-current");
            }
          });
        }
        function destroyEditor() {
          if (editor) {
            try { editor.toTextArea(); } catch (e) {}
            editor = null;
          }
        }

        /* ======================= 页面渲染 ======================= */
        var appEl;

        function renderHome() {
          var wrap = document.createElement("div");
          wrap.innerHTML =
            "<h1>🎨 p5.js 脚本生成器</h1>" +
            "<p>所有数据保存在本地浏览器中，无需服务器。</p>" +
            "<p>编写 p5.js 脚本，上传图片素材，生成独立的 HTML 页面。</p>" +
            "<p>支持预览、导出 ZIP、删除和重命名作品。</p>" +
            "<p>点击左上角 ☰ 菜单查看所有作品。</p>" +
            "<p style='color:#888;font-size:.9em;margin-top:1em'>" +
            "点击侧边栏中的作品名称即可全屏运行；" +
            "预览时按 Esc 或从菜单切换页面即可退出。" +
            "</p>";
          return wrap;
        }
        function renderAbout() {
          var wrap = document.createElement("div");
          wrap.innerHTML =
            "<h1>📖 关于</h1>" +
            "<p>纯前端工具，基于 localStorage 存储，无需后端。</p>" +
            "<p>使用 CodeMirror 实现代码高亮，支持亮色 / 暗色主题。</p>" +
            "<p>所有脚本均可导出为 ZIP 包。</p>";
          return wrap;
        }
        function renderGenerator() {
          var wrap = document.createElement("div");
          wrap.innerHTML =
            "<h1>✏️ 编写 p5.js 脚本</h1>" +
            "<p>输入标题和 p5.js 代码，上传图片（可选），点击提交。</p>" +
            '<div class="form-group">' +
            '  <label for="title">页面标题</label>' +
            '  <input type="text" id="title" placeholder="例如：我的创意绘图">' +
            "</div>" +
            '<div class="form-group">' +
            '  <label for="script">p5.js 脚本代码</label>' +
            '  <textarea id="script" placeholder="例如：&#10;function setup() {&#10;  createCanvas(windowWidth, windowHeight);&#10;  background(102);&#10;}&#10;function draw() {&#10;  variableEllipse(mouseX, mouseY, pmouseX, pmouseY);&#10;}&#10;function variableEllipse(x, y, px, py) {&#10;  let speed = abs(x - px) + abs(y - py);&#10;  stroke(speed);&#10;  ellipse(x, y, speed, speed);&#10;}"></textarea>' +
            "</div>" +
            '<div class="form-group">' +
            '  <label for="image">上传图片（可选，脚本可通过 <code>imageUrl</code> 加载）</label>' +
            '  <input type="file" id="image" accept="image/*">' +
            '  <div id="image-preview"></div>' +
            "</div>" +
            '<button id="buildBtn" type="button">提交页面</button>' +
            '<div id="result" class="result" style="display:none;"></div>';
          return wrap;
        }

        function bindGenerator() {
          var titleInput = $("#title");
          var textarea = $("#script");
          var fileInput = $("#image");
          var previewEl = $("#image-preview");
          var resultEl = $("#result");
          var buildBtn = $("#buildBtn");

          uploadedImageDataUrl = null;

          destroyEditor();
          if (window.CodeMirror) {
            var themeName = currentTheme() === "dark" ? "dracula" : "default";
            editor = window.CodeMirror.fromTextArea(textarea, {
              mode: "javascript",
              lineNumbers: true,
              theme: themeName,
              tabSize: 2,
              indentUnit: 2,
              autofocus: true,
            });
            editor.setSize(null, "100%");
          }

          fileInput.addEventListener("change", function () {
            var file = this.files && this.files[0];
            if (!file) return;
            if (!/^image\//.test(file.type)) {
              showAlert("文件类型不支持", "请选择图片文件。", true);
              this.value = "";
              return;
            }
            if (file.size > MAX_IMAGE_BYTES) {
              showAlert("图片太大", "单张图片请小于 1.5MB，以免本地存储空间耗尽。", true);
              this.value = "";
              return;
            }
            var reader = new FileReader();
            reader.onload = function (e) {
              uploadedImageDataUrl = e.target.result;
              var tip = document.createElement("p");
              tip.textContent = "✅ 图片上传成功";
              var img = document.createElement("img");
              img.src = e.target.result;
              img.className = "preview-img";
              img.alt = "上传预览";
              previewEl.replaceChildren(tip, img);
            };
            reader.onerror = function () {
              showAlert("读取失败", "无法读取该图片，请重试。", true);
            };
            reader.readAsDataURL(file);
          });

          buildBtn.addEventListener("click", function () {
            var title = titleInput.value.trim() || "未命名脚本";
            var script = (editor ? editor.getValue() : textarea.value).trim();
            if (!script) {
              showAlert("缺少脚本", "请填写 p5.js 脚本代码。", true);
              return;
            }
            var imageDataUrl = uploadedImageDataUrl || "";
            var htmlContent = generatePageHtml(title, script, imageDataUrl);

            var newId = Date.now() + Math.floor(Math.random() * 1000);
            var pages = getPages();
            pages.push({
              id: newId,
              title: title,
              html: htmlContent,
              timestamp: new Date().toISOString(),
            });
            if (!savePages(pages)) return;

            updateSidebarPages();

            resultEl.style.display = "block";
            var msg = document.createElement("p");
            msg.textContent = "✅ 页面生成成功！已保存到本地存储。";

            var btnContainer = document.createElement("div");
            btnContainer.className = "action-buttons";

            var previewBtn = document.createElement("button");
            previewBtn.className = "preview";
            previewBtn.textContent = "▶️ 预览";
            previewBtn.addEventListener("click", function () {
              enterPreview(newId);
            });

            var zipBtn = document.createElement("button");
            zipBtn.className = "zip";
            zipBtn.textContent = "📦 导出所有脚本 (ZIP)";
            zipBtn.addEventListener("click", exportZip);

            btnContainer.appendChild(previewBtn);
            btnContainer.appendChild(zipBtn);
            resultEl.replaceChildren(msg, btnContainer);

            titleInput.value = "";
            if (editor) editor.setValue("");
            uploadedImageDataUrl = "";
            previewEl.replaceChildren();
            fileInput.value = "";
          });
        }

        function render() {
          var path = getRoute();

          // 预览模式：路由回到首页时全屏运行
          if (previewingPageId !== null && (path === "/" || path === "")) {
            renderPreview(previewingPageId);
            return;
          }

          // 离开预览：清理样式与锁定的尺寸
          if (appEl.classList.contains("preview-mode")) {
            appEl.classList.remove("preview-mode");
            delete appEl.dataset.currentPageId;
            unlockAppSize();
          }

          destroyEditor();
          appEl.replaceChildren();
          setActiveNav(path);

          if (path === "/" || path === "/index.html" || path === "") {
            appEl.appendChild(renderHome());
          } else if (path === "/about") {
            appEl.appendChild(renderAbout());
          } else if (path === "/generator") {
            appEl.appendChild(renderGenerator());
            bindGenerator();
          } else {
            var wrap = document.createElement("div");
            var h = document.createElement("h1");
            h.textContent = "📄 页面 " + path;
            var p = document.createElement("p");
            p.textContent = "内容未定义。";
            wrap.appendChild(h);
            wrap.appendChild(p);
            appEl.appendChild(wrap);
          }
        }

        /* ======================= 初始化 ======================= */
        function init() {
          modalBackdrop = $("#modalBackdrop");
          modalBox = $("#modalBox");
          sidebarPagesEl = $("#sidebar-pages");
          sidebarEl = $("#sidebar");
          overlayEl = $("#overlay");
          hamburgerBtn = $("#hamburgerBtn");
          appEl = $("#app");

          var savedTheme = "light";
          try { savedTheme = localStorage.getItem(THEME_KEY) || "light"; } catch (e) {}
          applyTheme(savedTheme);

          hamburgerBtn.addEventListener("click", openSidebar);
          overlayEl.addEventListener("click", closeSidebar);
          modalBackdrop.addEventListener("click", function (e) {
            if (e.target === modalBackdrop) closeModal();
          });
          document.addEventListener("keydown", function (e) {
            if (e.key === "Escape") {
              if (modalBackdrop.classList.contains("show")) closeModal();
              else if (previewingPageId !== null) exitPreview();
              else closeSidebar();
            }
          });

          var themeBtn = $("#themeToggleSidebar");
          if (themeBtn) themeBtn.addEventListener("click", toggleTheme);

          // 侧边栏导航：点击任意导航项都退出预览
          $$(".sidebar .nav-item[data-path]").forEach(function (el) {
            var go = function () {
              if (previewingPageId !== null) {
                previewingPageId = null;
                unlockAppSize();
              }
              var path = el.getAttribute("data-path");
              if (location.hash === path) render();
              else location.hash = path;
              closeSidebar();
            };
            el.addEventListener("click", go);
            el.addEventListener("keydown", function (e) {
              if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); }
            });
          });

          sidebarPagesEl.addEventListener("click", function (e) {
            var btn = e.target.closest("[data-action]");
            if (!btn) return;
            var id = Number(btn.dataset.id);
            var action = btn.dataset.action;
            if (action === "open") enterPreview(id);
            else if (action === "rename") renamePage(id);
            else if (action === "delete") deletePage(id);
          });

          window.addEventListener("hashchange", function () {
            render();
            closeSidebar();
          });

          window.addEventListener("orientationchange", function () {
            if (editor) editor.refresh();
          });

          // 屏幕旋转 / 大幅改变时，如果正在预览，同步一次 iframe 尺寸
          // （不影响拖拽，只在主动旋转设备时触发）
          window.addEventListener("resize", function () {
            if (previewingPageId !== null && appEl.classList.contains("preview-mode")) {
              appEl.style.width = window.innerWidth + "px";
              appEl.style.height = window.innerHeight + "px";
            }
          });

          updateSidebarPages();
          render();
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", init);
        } else {
          init();
        }
      })();
    </script>
  </body>
</html>
