        /* 选择模型：无 Key 时先弹窗让用户设置 */
        function selectAIModel(model) {
          if (!aiModelConf(model)) return;

          /* 中止当前流式（如果有），并立即释放 busy */
          if (aiState.busy) {
            if (aiState.abortController) {
              try {
                aiState.abortController.abort();
              } catch (e) {}
            }
            aiState.streamToken += 1;
            aiState.busy = false;
            updateAISendBtn();
          }

          if (!aiState.keys[model]) {
            promptAPIKey(model, function () {
              aiState.currentModel = model;
              refreshAIModelUI();
              renderAIMessages();
              updateAISendBtn();
            });
            return;
          }
          aiState.currentModel = model;
          refreshAIModelUI();
          renderAIMessages();
          updateAISendBtn();
        }

        /* 
           AI：导出（Markdown / JSON）+ 导入
            */

        /* 通用 Blob 下载 */
        function triggerDownload(content, mime, filename) {
          var blob = new Blob([content], { type: mime });
          var url = URL.createObjectURL(blob);
          var a = document.createElement("a");
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(function () {
            URL.revokeObjectURL(url);
          }, 1000);
        }

        /* 导出 Markdown：只包含 content，人读友好 */
        function downloadAIChatMd(model) {
          var chat = aiState.chats[model] || [];
          if (!chat.length) {
            showAlert(
              "无法下载",
              "「" + aiModelName(model) + "」还没有对话内容。",
            );
            return;
          }

          var lines = ["# " + aiModelName(model) + " 对话记录", ""];
          var sys = aiState.prompts[model];
          if (sys && sys.trim()) {
            lines.push("## 系统提示词");
            lines.push("");
            lines.push(sys);
            lines.push("");
          }
          chat.forEach(function (m) {
            lines.push(
              m.role === "user" ? "## 我" : "## " + aiModelName(model),
            );
            lines.push("");
            lines.push(m.content || "");
            lines.push("");
          });

          var md = lines.join("\n");
          triggerDownload(
            md,
            "text/markdown;charset=utf-8",
            "ai_chat_" + model + "_" + Date.now() + ".md",
          );
        }

        /* 导出 JSON：含结构化响应元数据 */
        function downloadAIChatJson(model) {
          var chat = aiState.chats[model] || [];
          if (!chat.length) {
            showAlert(
              "无法下载",
              "「" + aiModelName(model) + "」还没有对话内容。",
            );
            return;
          }

          var sys = aiState.prompts[model];
          var data = {
            schemaVersion: 1,
            model: model,
            modelName: aiModelName(model),
            exportedAt: new Date().toISOString(),
            systemPrompt: sys && sys.trim() ? sys : null,
            messages: chat.map(function (m) {
              var out = { role: m.role, content: m.content };
              if (m.id) out.id = m.id;
              if (m.model) out.model = m.model;
              if (m.created) out.created = m.created;
              if (m.finish_reason) out.finish_reason = m.finish_reason;
              if (m.usage) out.usage = m.usage;
              if (m.tool_calls && m.tool_calls.length) {
                out.tool_calls = m.tool_calls;
              }
              return out;
            }),
          };

          triggerDownload(
            JSON.stringify(data, null, 2),
            "application/json;charset=utf-8",
            "ai_chat_" + model + "_" + Date.now() + ".json",
          );
        }

        /*
         * 导入 JSON 对话。
         * 支持的结构（由 downloadAIChatJson 导出）：
         *   {
         *     model: "deepseek",
         *     modelName: "DeepSeek",
         *     systemPrompt: "..." | null,
         *     messages: [{ role, content, id?, usage?, finish_reason?, tool_calls? }]
         *   }
         * 行为：
         *   - 校验结构，非法则提示
         *   - 从 data.model 定位目标模型；若未找到，提示用户
         *   - 若该模型已有对话，弹"覆盖 / 追加 / 取消"三选
         */
        function importAIChatFromFile(file) {
          if (!file) return;
          var reader = new FileReader();
          reader.onload = function (e) {
            var data;
            try {
              data = JSON.parse(e.target.result);
            } catch (err) {
              showAlert("导入失败", "文件不是合法的 JSON。", true);
              return;
            }
            if (!data || !Array.isArray(data.messages)) {
              showAlert(
                "导入失败",
                "文件结构不正确：缺少 messages 数组。",
                true,
              );
              return;
            }

            /* 定位目标模型 */
            var targetModel = data.model;
            if (!targetModel || !aiModelConf(targetModel)) {
              var name = String(data.modelName || "").toLowerCase();
              for (var i = 0; i < AI_MODELS.length; i++) {
                if (AI_MODELS[i].name.toLowerCase() === name) {
                  targetModel = AI_MODELS[i].id;
                  break;
                }
              }
            }
            if (!targetModel || !aiModelConf(targetModel)) {
              showAlert(
                "导入失败",
                "无法识别文件对应的模型（model 字段为：" +
                  String(data.model || "未提供") +
                  "）。",
                true,
              );
              return;
            }

            /* 清洗消息：只保留已知字段 */
            var cleaned = data.messages
              .filter(function (m) {
                return m && typeof m.role === "string";
              })
              .map(function (m) {
                var out = {
                  role: m.role,
                  content: typeof m.content === "string" ? m.content : "",
                };
                if (m.id) out.id = m.id;
                if (m.model) out.model = m.model;
                if (m.created) out.created = m.created;
                if (m.finish_reason) out.finish_reason = m.finish_reason;
                if (m.usage) out.usage = m.usage;
                if (m.tool_calls && m.tool_calls.length) {
                  out.tool_calls = m.tool_calls;
                }
                return out;
              });

            if (!cleaned.length) {
              showAlert("导入失败", "文件中没有有效的对话消息。", true);
              return;
            }

            /* 应用导入 */
            var applyImport = function (mode) {
              var existing = aiState.chats[targetModel] || [];
              if (mode === "replace") {
                aiState.chats[targetModel] = cleaned;
              } else {
                aiState.chats[targetModel] = existing.concat(cleaned);
              }

              /* 系统提示词：文件里有且当前为空时，自动填入 */
              if (
                data.systemPrompt &&
                String(data.systemPrompt).trim() &&
                !(aiState.prompts[targetModel] || "").trim()
              ) {
                aiState.prompts[targetModel] = String(data.systemPrompt).trim();
                saveAIPrompts();
              }

              saveAIChats(targetModel);

              /* 如果导入的模型就是当前选中模型，刷新列表 */
              if (aiState.currentModel === targetModel) {
                renderedMsgCount = 0;
                renderAIMessages();
                showAlert(
                  "导入成功",
                  "已导入 " +
                    cleaned.length +
                    " 条消息到「" +
                    aiModelName(targetModel) +
                    "」。",
                );
              } else {
                showConfirm(
                  "导入成功",
                  "已导入 " +
                    cleaned.length +
                    " 条消息到「" +
                    aiModelName(targetModel) +
                    "」。是否切换到该模型查看？",
                  function () {
                    selectAIModel(targetModel);
                  },
                );
              }
            };

            var existing = aiState.chats[targetModel] || [];
            if (!existing.length) {
              applyImport("replace");
              return;
            }

            /* 已有对话：弹三选 */
            openModal(function (box) {
              var h = document.createElement("h3");
              h.textContent = "导入对话";
              var p = document.createElement("p");
              p.textContent =
                "「" +
                aiModelName(targetModel) +
                "」已有 " +
                existing.length +
                " 条消息。要如何导入这 " +
                cleaned.length +
                " 条消息？";
              var a = document.createElement("div");
              a.className = "modal-actions";

              var leftWrap = document.createElement("div");
              var cancelBtn = document.createElement("button");
              cancelBtn.className = "link-btn";
              cancelBtn.textContent = "取消";
              cancelBtn.addEventListener("click", closeModal);
              leftWrap.appendChild(cancelBtn);

              var rightWrap = document.createElement("div");
              rightWrap.className = "right-group";

              var appendBtn = document.createElement("button");
              appendBtn.className = "cancel";
              appendBtn.textContent = "追加";
              appendBtn.addEventListener("click", function () {
                closeModal();
                applyImport("append");
              });

              var replaceBtn = document.createElement("button");
              replaceBtn.className = "danger";
              replaceBtn.textContent = "覆盖";
              replaceBtn.addEventListener("click", function () {
                closeModal();
                applyImport("replace");
              });

              rightWrap.appendChild(appendBtn);
              rightWrap.appendChild(replaceBtn);

              a.appendChild(leftWrap);
              a.appendChild(rightWrap);
              box.appendChild(h);
              box.appendChild(p);
              box.appendChild(a);
            });
          };
          reader.onerror = function () {
            showAlert("导入失败", "无法读取文件，请重试。", true);
          };
          reader.readAsText(file);
        }

        /* 
           AI：发送 / 清空
            */

        function aiSend() {
          if (aiState.busy) return;
          var model = aiState.currentModel;
          if (!model) {
            showAlert(
              "请先选择模型",
              "点击左下角 + 按钮选择模型并设置Key。",
              true,
            );
            return;
          }
          var key = aiState.keys[model];
          if (!key) {
            promptAPIKey(model, function () {
              aiSend();
            });
            return;
          }

          var inputEl = $("#aiInput");
          if (!inputEl) return;
          var text = (inputEl.value || "").trim();
          if (!text) return;

          var chat = aiState.chats[model];
          if (!Array.isArray(chat)) chat = aiState.chats[model] = [];

          chat.push({ role: "user", content: text });
          chat.push({ role: "assistant", content: "" });
          saveAIChats(model);

          inputEl.value = "";
          inputEl.style.height = "auto";

          /* 中止旧流式（如果有），生成新令牌 */
          if (aiState.abortController) {
            try {
              aiState.abortController.abort();
            } catch (e) {}
          }
          aiState.streamToken += 1;
          var myToken = aiState.streamToken;
          aiState.abortController = new AbortController();

          aiState.busy = true;
          updateAISendBtn();
          renderAIMessages();

          var bubble = getLastAssistantBubble();
          /* 清空“正在思考…”占位，准备增量追加 */
          if (bubble) {
            bubble.textContent = "";
            bubble.classList.remove("pending");
          }
          var accumulated = "";
          var isGemini = model === "gemini";
          var box = $("#aiMessages");
          var acc = createStructuredAccumulator();

          function pushDelta(text2) {
            if (aiState.streamToken !== myToken) return;
            if (!text2) return;
            accumulated += text2;
            if (bubble) {
              bubble.appendChild(document.createTextNode(text2));
            }
            /* 自动滚到最新：只在用户已经靠近底部时跟随 */
            if (box && isNearBottom(box)) {
              box.scrollTop = box.scrollHeight;
            }
          }

          var onDelta = function (obj) {
            if (isGemini) {
              var cand = obj.candidates && obj.candidates[0];
              if (cand && cand.content && cand.content.parts) {
                var t = "";
                for (var i = 0; i < cand.content.parts.length; i++) {
                  t += cand.content.parts[i].text || "";
                }
                pushDelta(t);
              }
            } else {
              var d = obj.choices && obj.choices[0] && obj.choices[0].delta;
              if (d && d.content) pushDelta(d.content);
            }
          };

          var payload = chat.slice(0, -1);
          if (payload.length > MAX_CONTEXT_MESSAGES) {
            payload = payload.slice(-MAX_CONTEXT_MESSAGES);
          }
          var systemPrompt = aiState.prompts[model] || "";

          streamAI(model, key, payload, systemPrompt, onDelta, function (raw) {
            acc.consume(raw);
          })
            .then(function () {
              if (aiState.streamToken !== myToken) return;
              var meta = acc.finalize();
              var msg = chat[chat.length - 1];
              msg.content = accumulated || "(空回复)";
              if (meta.id) msg.id = meta.id;
              if (meta.model) msg.model = meta.model;
              if (meta.created) msg.created = meta.created;
              if (meta.finish_reason) msg.finish_reason = meta.finish_reason;
              if (meta.usage) msg.usage = meta.usage;
              if (meta.tool_calls) msg.tool_calls = meta.tool_calls;
              saveAIChats(model);
              aiState.busy = false;
              updateAISendBtn();
              renderAIMessages();
            })
            .catch(function (err) {
              if (aiState.streamToken !== myToken) return;
              aiState.busy = false;
              updateAISendBtn();
              var meta = acc.finalize();
              /* 用户主动 abort（切模型/清空）不弹错误 */
              var isAbort =
                err && (err.name === "AbortError" || err.code === 20);
              if (accumulated) {
                var msg = chat[chat.length - 1];
                msg.content = accumulated;
                if (meta.id) msg.id = meta.id;
                if (meta.model) msg.model = meta.model;
                if (meta.created) msg.created = meta.created;
                if (meta.finish_reason) msg.finish_reason = meta.finish_reason;
                if (meta.usage) msg.usage = meta.usage;
                if (meta.tool_calls) msg.tool_calls = meta.tool_calls;
              } else {
                chat.pop();
              }
              saveAIChats(model);
              renderAIMessages();
              if (!isAbort) {
                showAlert(
                  "请求失败",
                  String((err && err.message) || err) ||
                    "网络错误，请检查API Key或稍后重试。",
                  true,
                );
              }
            });
        }

        function clearAIChat() {
          var model = aiState.currentModel;
          if (!model) {
            showAlert(
              "无需清除",
              "还没有选择模型，请点击左下角 + 选择模型。",
            );
            return;
          }
          var chat = aiState.chats[model] || [];
          if (!chat.length) {
            showAlert(
              "无需清除",
              "「" + aiModelName(model) + "」当前没有对话内容。",
            );
            return;
          }
          showConfirm(
            "清除对话",
            "确定要清除与" + aiModelName(model) + "的全部对话内容吗？",
            function () {
              /* 中止当前流式（如果有） */
              if (aiState.busy) {
                if (aiState.abortController) {
                  try {
                    aiState.abortController.abort();
                  } catch (e) {}
                }
                aiState.streamToken += 1;
                aiState.busy = false;
                updateAISendBtn();
              }
              aiState.chats[model] = [];
              saveAIChats(model);
              renderedMsgCount = 0;
              renderAIMessages();
            },
            true,
          );
        }

        function bindAIAssistant() {
          buildAIModelMenu();
          refreshAIModelUI();
          renderAIMessages();
          updateAISendBtn();

          var modelBtn = $("#aiModelBtn");
          var modelMenu = $("#aiModelMenu");
          var inputEl = $("#aiInput");
          var sendBtn = $("#aiSendBtn");
          var clearBtn = $("#aiClearBtn");

          if (modelBtn) {
            modelBtn.addEventListener("click", function (e) {
              e.stopPropagation();
              toggleAIModelMenu();
            });
          }

          if (modelMenu) {
            modelMenu.addEventListener("click", function (e) {
              var promptBtn = e.target.closest("[data-prompt]");
              if (promptBtn) {
                e.stopPropagation();
                closeAIModelMenu();
                promptSystemPrompt(promptBtn.dataset.prompt);
                return;
              }
              var keyBtn = e.target.closest("[data-key]");
              if (keyBtn) {
                e.stopPropagation();
                promptAPIKey(keyBtn.dataset.key);
                return;
              }
              var testBtn = e.target.closest("[data-test]");
              if (testBtn) {
                e.stopPropagation();
                closeAIModelMenu();
                testAIModelConnection(testBtn.dataset.test);
                return;
              }
              var mdBtn = e.target.closest("[data-md]");
              if (mdBtn) {
                e.stopPropagation();
                downloadAIChatMd(mdBtn.dataset.md);
                return;
              }
              var jsonBtn = e.target.closest("[data-json]");
              if (jsonBtn) {
                e.stopPropagation();
                downloadAIChatJson(jsonBtn.dataset.json);
                return;
              }
              var item = e.target.closest(".ai-model-item");
              if (item) {
                e.stopPropagation();
                closeAIModelMenu();
                selectAIModel(item.dataset.model);
              }
            });
          }

          if (inputEl) {
            inputEl.addEventListener("input", function () {
              this.style.height = "auto";
              this.style.height = Math.min(this.scrollHeight, 140) + "px";
            });
            inputEl.addEventListener("keydown", function (e) {
              if (
                e.key === "Enter" &&
                !e.shiftKey &&
                !e.isComposing &&
                e.keyCode !== 229
              ) {
                e.preventDefault();
                aiSend();
              }
            });
          }

          if (sendBtn) {
            sendBtn.addEventListener("click", function () {
              aiSend();
            });
          }

          var importBtn = $("#aiImportBtn");
          var importFile = $("#aiImportFile");

          if (importBtn && importFile) {
            importBtn.addEventListener("click", function () {
              importFile.value = "";
              importFile.click();
            });
            importFile.addEventListener("change", function () {
              var f = this.files && this.files[0];
              if (!f) return;
              importAIChatFromFile(f);
              this.value = "";
            });
          }

          if (clearBtn) {
            clearBtn.addEventListener("click", function () {
              clearAIChat();
            });
          }
        }

        /* 
           总渲染入口（根据路由切换页面）
            */
        function render() {
          var path = getRoute();

          if (path !== "/" && path !== "" && path !== "/index.html") {
            if (runner.mode === "page") {
              runner.mode = "random";
              runner.pageId = null;
            }
          }

          if (path === "/" || path === "" || path === "/index.html") {
            renderRunner();
            return;
          }

          if (appEl.classList.contains("preview-mode")) {
            appEl.classList.remove("preview-mode");
          }
          appEl.classList.remove("ai-mode");
          delete appEl.dataset.currentPageId;
          unlockAppSize();

          destroyEditor();
          appEl.replaceChildren();
          setActiveNav(path);

          if (path === "/ai") {
            appEl.classList.add("ai-mode");
            appEl.appendChild(renderAIAssistant());
            bindAIAssistant();
            return;
          }

          if (path === "/about") {
            appEl.appendChild(renderAbout());
          } else if (path === "/generator") {
            appEl.appendChild(renderGenerator());
            bindGenerator();
          } else {
            var wrap = document.createElement("div");
            var h = document.createElement("h1");
            h.textContent = "页面 " + path;
            var p = document.createElement("p");
            p.textContent = "内容未定义。";
            wrap.appendChild(h);
            wrap.appendChild(p);
            appEl.appendChild(wrap);
          }
        }

        /* 
           初始化
            */
        function init() {
          modalBackdrop = $("#modalBackdrop");
          modalBox = $("#modalBox");
          sidebarPagesEl = $("#sidebar-pages");
          sidebarEl = $("#sidebar");
          overlayEl = $("#overlay");
          hamburgerBtn = $("#hamburgerBtn");
          appEl = $("#app");
          sidebarSearchEl = $("#sidebarSearch");

          initAIState();

          var savedTheme = "light";
          try {
            savedTheme = localStorage.getItem(THEME_KEY) || "light";
          } catch (e) {}
          applyTheme(savedTheme);

          /* 禁用双指缩放 / 手势缩放 */
          ["gesturestart", "gesturechange", "gestureend"].forEach(
            function (type) {
              document.addEventListener(
                type,
                function (e) {
                  e.preventDefault();
                },
                { passive: false },
              );
            },
          );
          document.addEventListener(
            "touchstart",
            function (e) {
              if (e.touches && e.touches.length > 1) {
                e.preventDefault();
              }
            },
            { passive: false },
          );
          document.addEventListener(
            "touchmove",
            function (e) {
              if (e.touches && e.touches.length > 1) {
                e.preventDefault();
              }
            },
            { passive: false },
          );
          var lastTouchEnd = 0;
          document.addEventListener(
            "touchend",
            function (e) {
              var now = Date.now();
              if (now - lastTouchEnd <= 300) {
                var t = e.target;
                var tag = t && t.tagName ? t.tagName.toLowerCase() : "";
                if (
                  tag !== "input" &&
                  tag !== "textarea" &&
                  tag !== "button" &&
                  tag !== "select" &&
                  tag !== "a"
                ) {
                  e.preventDefault();
                }
              }
              lastTouchEnd = now;
            },
            { passive: false },
          );
          document.addEventListener("click", function (e) {
            var menu = $("#aiModelMenu");
            if (!menu || !menu.classList.contains("show")) return;
            var picker = menu.parentNode;
            if (picker && !picker.contains(e.target)) {
              menu.classList.remove("show");
            }
          });

          if (sidebarSearchEl) {
            sidebarSearchEl.addEventListener("input", function () {
              sidebarSearchKeyword = this.value || "";
              updateSidebarPages();
            });
            sidebarSearchEl.addEventListener("keydown", function (e) {
              if (e.key === "Escape") {
                if (this.value) {
                  this.value = "";
                  sidebarSearchKeyword = "";
                  updateSidebarPages();
                }
                e.stopPropagation();
              } else {
                e.stopPropagation();
              }
            });
            sidebarSearchEl.addEventListener("click", function (e) {
              e.stopPropagation();
            });
          }

          hamburgerBtn.addEventListener("click", openSidebar);
          overlayEl.addEventListener("click", closeSidebar);
          modalBackdrop.addEventListener("click", function (e) {
            if (e.target === modalBackdrop) closeModal();
          });

          document.addEventListener("keydown", function (e) {
            if (e.key === "Escape") {
              if (modalBackdrop.classList.contains("show")) {
                closeModal();
              } else if (sidebarEl.classList.contains("open")) {
                closeSidebar();
              } else if (runner.mode === "page" && getRoute() === "/") {
                setRandom();
              }
            }
          });

          var exportZipBtn = $("#exportZipSidebar");
          if (exportZipBtn) {
            var runExport = function () {
              closeSidebar();
              exportZip();
            };
            exportZipBtn.addEventListener("click", runExport);
            exportZipBtn.addEventListener("keydown", function (e) {
              if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                runExport();
              }
            });
          }

          var themeBtn = $("#themeToggleSidebar");
          if (themeBtn) themeBtn.addEventListener("click", toggleTheme);

          $$(".sidebar .nav-item[data-path]").forEach(function (el) {
            var go = function () {
              var path = el.getAttribute("data-path");
              closeSidebar();
              if (path === "#/") {
                setRandom();
                return;
              }
              if (location.hash === path) render();
              else location.hash = path;
            };
            el.addEventListener("click", go);
            el.addEventListener("keydown", function (e) {
              if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                go();
              }
            });
          });
          sidebarPagesEl.addEventListener("click", function (e) {
            var btn = e.target.closest("[data-action]");
            if (!btn) return;
            var id = Number(btn.dataset.id);
            var action = btn.dataset.action;
            if (action === "open") {
              closeSidebar();
              runPage(id);
            } else if (action === "rename") {
              renamePage(id);
            } else if (action === "delete") {
              deletePage(id);
            }
          });

          window.addEventListener("hashchange", function () {
            render();
            closeSidebar();
          });

          window.addEventListener("orientationchange", function () {
            if (editor) editor.refresh();
          });

          var resizeTimer = null;
          window.addEventListener("resize", function () {
            /* 预览模式尺寸必须实时跟随，不能 debounce */
            if (appEl.classList.contains("preview-mode")) {
              appEl.style.width = window.innerWidth + "px";
              appEl.style.height = window.innerHeight + "px";
            }
            /* 编辑器 refresh 用 debounce，避免频繁重排 */
            if (resizeTimer) clearTimeout(resizeTimer);
            resizeTimer = setTimeout(function () {
              if (editor) editor.refresh();
            }, 100);
          });

          updateSidebarPages();
          render();
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", init);
        } else {
          init();
        }
      })();
    </script>
  </body>
</html>
