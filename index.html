<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>randomArt可视化创意编程</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/default.min.css"
      id="cm-theme-light"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css"
      id="cm-theme-dark"
      disabled
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="manifest" href="manifest.json" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  </head>
  <body>
    <button
      class="hamburger-btn"
      id="hamburgerBtn"
      aria-label="打开菜单"
      aria-expanded="false"
      aria-controls="sidebar"
    >
      ☰
    </button>

    <nav class="sidebar" id="sidebar" aria-label="主导航">
      <div class="sidebar-search">
        <input
          type="search"
          id="sidebarSearch"
          placeholder="搜索脚本..."
          autocomplete="off"
          aria-label="搜索脚本"
          data-i18n-placeholder="nav.searchPlaceholder"
        />
      </div>

      <div
        class="nav-item"
        data-path="#/"
        role="button"
        tabindex="0"
        data-i18n="nav.home"
      >
        🏠 首页
      </div>
      <div
        class="nav-item"
        data-path="#/about"
        role="button"
        tabindex="0"
        data-i18n="nav.about"
      >
        📖 关于
      </div>
      <div
        class="nav-item"
        data-path="#/ai"
        role="button"
        tabindex="0"
        data-i18n="nav.ai"
      >
        🤖 AI助手
      </div>
      <div
        class="nav-item"
        data-path="#/generator"
        role="button"
        tabindex="0"
        data-i18n="nav.generator"
      >
        ✏️ 编写脚本
      </div>
      <div class="divider"></div>
      <div class="section-title" data-i18n="nav.myScripts">📄 我的脚本</div>
      <div id="sidebar-pages">
        <div class="no-pages" data-i18n="nav.noScripts">暂无编写的脚本</div>
      </div>

      <div class="sidebar-footer">
        <div class="footer-row">
          <div
            class="nav-item footer-item"
            id="exportZipSidebar"
            role="button"
            tabindex="0"
            data-i18n="nav.exportZip"
          >
            📦 导出ZIP
          </div>
          <div class="footer-vdivider"></div>
          <div
            class="nav-item footer-item"
            id="themeToggleSidebar"
            role="button"
            tabindex="0"
            data-i18n="nav.themeToggle"
          >
            🌓 切换主题
          </div>
        </div>
      </div>
    </nav>
    <div class="overlay" id="overlay"></div>

    <main id="app" data-i18n="site.loading">加载中…</main>

    <div
      class="modal-backdrop"
      id="modalBackdrop"
      role="dialog"
      aria-modal="true"
    >
      <div class="modal" id="modalBox"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>

    <script src="js/script.js"></script>
    
    <script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker
        .register("./sw.js")
        .catch(function (e) {
          console.warn("[SW] 注册失败：", e);
        });
    });
  }
</script>
  </body>
</html>
